<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Course Materials</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<!-- JSZip (2026-09-03, per Martin's "save the whole folder to their
     computer" request) — loaded from cdnjs so "Download Folder" can build
     a real .zip client-side; there's no backend to zip on. `defer` so it
     doesn't block the page while loading — the download handler only
     needs it once a user actually clicks Download Folder, well after
     load. Same "needs a real internet connection to work" caveat as the
     Typekit stylesheet above (this sandboxed preview can't reach either). -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* ---------- Shared design system — copied verbatim from course-home.html
     so this page reads as the same app. See architecture-decisions.md re:
     promoting this to a real shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --course-color: #a67a22;
    --course-color-dark: #8a6519;
    --course-color-tint: rgba(166, 122, 34, 0.14);
  }

  /* Finder-window palette (2026-08-28: unified with the rest of the app —
     see below) — every --finder-* token is now a direct reference to the
     same global tokens the rest of this page (and Home/Courses/the Course
     Hub) already use, rather than its own separate set of hardcoded
     values. `--finder-selected`/`--finder-icon-*` are the only tokens
     that don't map onto an existing global one-for-one, since selection
     highlighting and paper-icon rendering aren't really "chrome" — kept
     as their own small, self-contained values (still deriving from
     --accent/--border where that makes sense) rather than forcing a
     global token to do a job it isn't really for. Still scoped to
     `.finder-window` (not :root) purely so it's easy to find/read as one
     block, not because the values themselves differ from :root anymore. */
  .finder-window {
    --finder-bg: var(--panel-bg);
    --finder-titlebar-bg: var(--panel-inner);
    --finder-sidebar-bg: var(--panel-inner);
    --finder-border: var(--border);
    --finder-text: var(--text-dark);
    --finder-text-muted: var(--text-muted);
    --finder-hover: var(--panel-bg);
    --finder-selected: rgb(from var(--accent) r g b / 0.16);
    --finder-icon-page: #ffffff;
    --finder-icon-fold: var(--panel-inner);
    --finder-icon-border: var(--border);
    --finder-control-bg: var(--panel-inner);
    --finder-control-active-bg: var(--panel-bg);
    --finder-control-active-text: var(--text-dark);
    --finder-disabled: var(--text-faint);
    --finder-icon-ink: var(--text-faint);
  }
  /* A per-page dark/white mode toggle used to live here (2026-08-26) but
     was removed 2026-08-28: several of this page's popups (Get Info,
     Share, the delete confirmation) intentionally use the app's global
     panel tokens rather than these --finder-* ones, so they always
     rendered light even with the toggle set to dark — reading as a bug
     rather than the deliberate "system dialogs look the same in either
     Finder theme" choice it actually was. Per Martin's decision, this
     page no longer offers its own theme switch. **Then unified with the
     rest of the site's theme (2026-08-28, same-day follow-up)**: rather
     than leave the Finder chrome's colors as its own separate palette
     that merely happened to resemble the app's light theme, every
     --finder-* token above now points straight at the same --panel-bg/
     --text-dark/--border/etc. tokens the rest of the app (and this
     page's own popups) already use — so Materials isn't a visually
     distinct "file browser surface" anymore, it's the same surface as
     the rest of the site. This also means it's future-proofed for real
     app-wide dark mode: whenever a Settings page exists and actually
     swaps those global tokens (the same way onboarding.html's preview
     toggle already does for its own page), Materials will pick up the
     change automatically through this same variable chain, with no
     Materials-specific dark-mode work needed later — see
     architecture-decisions.md.  */

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 116px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 1120px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- .finder-window
      grows to its natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar — same .back-link convention as course-home.html's
     "‹ All Courses" breadcrumb. ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 14px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  /* ---------- Finder-style window ---------- */
  .finder-window {
    background: var(--finder-bg);
    border-radius: var(--window-radius-lg);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    /* Grows to its natural content height; display:flex/column so
       .finder-titlebar stays a fixed-height strip above .finder-body. */
    display: flex;
    flex-direction: column;
  }

  .finder-titlebar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--finder-titlebar-bg);
    border-bottom: 1px solid var(--finder-border);
  }
  .finder-nav-btns { display: flex; gap: 2px; }
  .finder-chevron {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--finder-text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .finder-chevron:hover:not(:disabled) { background: var(--finder-hover); color: var(--finder-text); }
  .finder-chevron:disabled { color: var(--finder-disabled); cursor: default; }
  .finder-chevron svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .finder-chevron:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-title { font-weight: 800; font-size: 0.92rem; color: var(--finder-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .finder-toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .view-toggle { display: flex; background: var(--finder-control-bg); border-radius: 8px; padding: 2px; }
  /* Same equal-specificity gotcha as .edit-fab[hidden] elsewhere in this
     mock: a plain `.view-toggle { display: flex }` class rule and the
     browser's own `[hidden] { display: none }` rule tie on specificity,
     so without this override the later-declared `display: flex` above
     would win and the group would stay visibly flexed even with its
     `hidden` attribute set (2026-08-28, caught while hiding this group
     for the Assignments quick-access view — see below). */
  .view-toggle[hidden] { display: none; }
  .view-btn {
    width: 28px; height: 24px;
    border: none; background: none;
    color: var(--finder-text-muted);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .view-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .view-btn:hover:not(:disabled) { color: var(--finder-text); }
  .view-btn.active { background: var(--finder-control-active-bg); color: var(--finder-control-active-text); }
  .view-btn:disabled { color: var(--finder-disabled); cursor: default; }
  .view-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-icon-btn {
    width: 26px; height: 26px;
    border: none; background: none;
    color: var(--finder-text-muted);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .finder-icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .finder-icon-btn:hover:not(:disabled) { background: var(--finder-hover); color: var(--finder-text); }
  .finder-icon-btn.active { background: var(--finder-control-active-bg); color: var(--finder-control-active-text); }
  .finder-icon-btn:disabled { color: var(--finder-disabled); cursor: default; }

  .finder-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-search-wrap {
    display: flex; align-items: center; gap: 6px;
    background: var(--finder-control-bg);
    border-radius: 8px;
    padding: 5px 10px;
    width: 150px;
  }
  .finder-search-wrap svg { width: 13px; height: 13px; stroke: var(--finder-text-muted); fill: none; stroke-width: 2; flex-shrink: 0; }
  .finder-search-wrap input {
    background: none; border: none; outline: none;
    color: var(--finder-text);
    font-family: inherit; font-size: 0.76rem;
    width: 100%;
  }
  .finder-search-wrap input::placeholder { color: var(--finder-text-muted); }
  /* The browser's own native "clear search" X (from type="search") comes
     out a faint, semi-transparent gray that doesn't match anything else
     in this UI — hidden here in favor of a custom button below so its
     color is deliberate and consistent instead of whatever the browser
     defaults to. */
  input[type="search"]::-webkit-search-cancel-button { display: none; -webkit-appearance: none; }
  .search-clear-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 14px; height: 14px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--finder-text-muted);
    flex-shrink: 0;
  }
  .search-clear-btn svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .search-clear-btn:hover { color: var(--finder-text); }
  .search-clear-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 3px; }
  /* Search-match highlighting (2026-08-26, per Martin's request) — every
     occurrence of the current search text inside a visible item's name
     gets wrapped in this, so it's obvious at a glance *why* an item
     matched, not just that it did. Blue is deliberately not var(--accent)
     (which is this app's warm orange/red) — it reads as a distinct
     "search hit" marker the same way find-in-page highlighting does in
     most browsers/editors, rather than looking like a selection state. */
  mark.search-highlight {
    background: #2f7dfa;
    color: #fff;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* Right-click item menu (2026-08-26) — modeled on Martin's own Finder
     screenshot; uses --finder-* tokens (see comment on the markup) so it
     matches whichever theme the window is currently in. */
  .context-menu {
    position: fixed;
    z-index: 250;
    min-width: 226px;
    background: var(--finder-bg);
    border: 1px solid var(--finder-border);
    border-radius: 10px;
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.55);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .context-menu[hidden] { display: none; }
  .context-menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--finder-text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .context-menu-item:hover, .context-menu-item:focus-visible { background: var(--accent); color: #fff; outline: none; }
  .context-menu-item .cm-chevron { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; flex-shrink: 0; }
  /* Move to Trash when the item isn't user-created (2026-08-27) — reads
     as unavailable rather than just missing, so it's still discoverable
     as "this exists but isn't allowed here" instead of silently absent. */
  .context-menu-item:disabled { color: var(--finder-text-muted); cursor: default; opacity: 0.55; }
  .context-menu-item:disabled:hover, .context-menu-item:disabled:focus-visible { background: none; color: var(--finder-text-muted); }
  .context-menu-divider { height: 1px; background: var(--finder-border); margin: 5px 4px; flex-shrink: 0; }
  .context-menu-tags-label { padding: 4px 10px 2px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--finder-text-muted); }
  .context-menu-tags { display: flex; justify-content: center; gap: 7px; padding: 6px 10px 8px; }
  .context-menu-tags .tag-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); padding: 0; cursor: pointer; }
  .context-menu-tags .tag-dot:hover, .context-menu-tags .tag-dot:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Marks whichever swatch is the folder's current color (2026-08-27) —
     a ring outside the dot rather than an inner checkmark, so it stays
     legible against every swatch color including the lightest (yellow). */
  .context-menu-tags .tag-dot.active { box-shadow: 0 0 0 2px var(--finder-bg), 0 0 0 4px var(--finder-text); }

  .finder-body { display: flex; align-items: stretch; }

  .finder-sidebar {
    width: 190px;
    flex-shrink: 0;
    background: var(--finder-sidebar-bg);
    border-right: 1px solid var(--finder-border);
    padding: 14px 10px;
  }
  .fs-heading {
    font-size: 0.64rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--finder-text-muted);
    margin: 14px 8px 6px;
  }
  .fs-heading:first-child { margin-top: 2px; }
  .fs-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    color: var(--finder-text-muted);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
    text-align: left;
  }
  .fs-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
  .fs-item:hover { background: var(--finder-hover); color: var(--finder-text); }
  .fs-item.active { background: var(--accent); color: #fff; }
  .fs-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-content { flex: 1; padding: 18px 20px; }
  .finder-empty { color: var(--finder-text-muted); font-size: 0.82rem; padding: 30px 4px; text-align: center; }

  /* Grid view */
  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    grid-auto-rows: min-content;
    align-content: start;
    gap: 4px;
    position: relative; /* anchors free-positioned tiles below */
    min-height: 40px;
  }
  /* Free-drop-anywhere (2026-08-26, per Martin's request) — dragging a
     tile and releasing it over empty space (not onto a folder) drops it
     exactly there, like real Finder icon view, instead of only snapping
     back to its old spot or being confined to a thin band near its
     original row. `.free-drop-active` is a live "you can drop here"
     outline shown on the whole content pane while dragging over open
     space, so the affordance doesn't just appear silently on drop — it's
     on `.finder-content` rather than `.item-grid` so it covers the full
     droppable area, not just however tall the grid's in-flow rows are. */
  .finder-content.free-drop-active { outline: 2px dashed var(--accent); outline-offset: -3px; border-radius: 8px; }
  .item-tile.free-pos { position: absolute; width: 84px; z-index: 4; }
  .item-tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 10px 4px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    font-family: inherit;
    color: var(--finder-text);
  }
  .item-tile:hover { background: var(--finder-hover); }
  .item-tile.selected { background: var(--finder-selected); border-color: rgb(from var(--accent) r g b / 0.5); }
  .item-tile:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Drag-over state — a folder tile currently under a dragged item, so
     dropping reads as "into this folder" rather than "reorder near it". */
  .item-tile.drop-target { background: var(--finder-selected); box-shadow: 0 0 0 2px var(--accent) inset; }
  .item-tile.dragging { opacity: 0.35; }
  /* Names don't get text-highlighted when you press and drag (2026-10-04), same as Finder. The rename box still selects. */
  .item-tile, .item-list tbody tr { -webkit-user-select: none; user-select: none; }
  .item-tile input, .item-list input { -webkit-user-select: text; user-select: text; }
  body.cm-dragging, body.cm-dragging * { -webkit-user-select: none !important; user-select: none !important; cursor: grabbing; }
  .item-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; }
  .item-icon svg { width: 100%; height: 100%; }
  .item-name { font-size: 0.7rem; font-weight: 600; text-align: center; line-height: 1.25; word-break: break-word; }
  .item-name-input {
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 600;
    text-align: center;
    width: 100%;
    background: var(--finder-bg);
    color: var(--finder-text);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 3px;
  }
  .file-badge {
    font-size: 0.5rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #fff;
    border-radius: 3px;
    padding: 1px 3px;
  }
  /* Starred badge (2026-08-27, per Martin's "add to starred" request) —
     top-right corner of a grid tile (the spot the rename pencil used to
     occupy, now free since that button was removed), inline after the
     name in list view. */
  .item-star-badge { position: absolute; top: 2px; right: 2px; width: 15px; height: 15px; color: #f2b400; pointer-events: none; }
  .item-star-badge svg { width: 100%; height: 100%; fill: currentColor; }
  .item-list .item-star-badge { position: static; display: inline-block; width: 12px; height: 12px; margin-left: 6px; vertical-align: middle; }
  /* List view */
  .item-list { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .item-list thead th {
    text-align: left;
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--finder-text-muted);
    padding: 4px 8px 8px;
    border-bottom: 1px solid var(--finder-border);
  }
  .item-list tbody tr {
    cursor: pointer;
    border-radius: 6px;
  }
  .item-list tbody tr:hover { background: var(--finder-hover); }
  .item-list tbody tr.selected { background: var(--finder-selected); }
  .item-list tbody tr.drop-target { background: var(--finder-selected); box-shadow: 0 0 0 2px var(--accent) inset; }
  .item-list tbody tr.dragging { opacity: 0.35; }
  .item-list td { padding: 6px 8px; color: var(--finder-text); vertical-align: middle; }
  .item-list .name-cell { display: flex; align-items: center; gap: 8px; }
  .item-list .name-cell .item-icon { width: 20px; height: 20px; }
  .item-list .kind-cell, .item-list .size-cell { color: var(--finder-text-muted); }

     per drag rather than using native HTML5 DnD, per the same
     reliability/touch-support reasoning documented for the Courses

  .drag-ghost {

     uses the app's own global panel tokens (same convention as the
     Course Hub's "Course info" modal) rather than --finder-* — a system

  .confirm-overlay {

    .fs-heading { display: none; }
    /* The titlebar's icon-button row plus a fixed-width search box never
       fit on one line on a phone-size screen — past a certain width the
       row just ran out of horizontal space and got clipped by
       .finder-window's own overflow:hidden, cutting the search box off
       instead of shrinking it. Wrapping the toolbar onto its own line and
       letting the search box fill it (rather than pinning it to a tiny
       fixed width) fixes both the clipping and the cramped input. */
    .finder-titlebar { flex-wrap: wrap; row-gap: 8px; }
    .finder-title { min-width: 0; }

  /* ---------- Bottom nav — permanently visible, copied verbatim from
     course-home.html so navigation stays consistent across pages. ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has
     to get ... we should add a more button on the far right side with a
     list of the other options"). Labels never truncate: when they would,
     the rightmost pages move into the More menu instead. ---------- */
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;
    margin-left: 4px;
    padding: 12px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-more .label { display: flex; align-items: center; height: 1.2em; font-size: 0.72rem; color: var(--text-faint); }
  .nav-more .label svg { display: block; fill: currentColor; }
  /* thin divider between the pages and the dots */
  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }
  .nav-more.has-active .dot { background: var(--accent); }
  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    pointer-events: auto;
  }
  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-faint);
    text-align: left;
    padding: 12px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  /* Labels sit centered in the bar; the active page is underlined in the
     accent color instead of marked with a dot (2026-10-01, per Martin). */
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {
    .nav-more { padding: 10px 12px 8px; }
    .nav-more::before { top: 10px; bottom: 10px; }
    .app-nav-inner .nav-link, .app-nav-inner .nav-more { padding-top: 8px; padding-bottom: 8px; }
    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
  /* Emoji icons (2026-10-01, per Martin): icons that show a thing are emoji;
     buttons and action icons stay line icons. */
  /* Each emoji is an inline SVG sized by font-size (1em box), so it is
     exactly as big as its box and sits dead center. The svg rule undoes
     the line-icon styles (stroke, fill:none, opacity) that the parent
     rows still set for their other icons. */
  .emo { display: inline-block; width: 1em; height: 1em; line-height: 0; flex-shrink: 0; vertical-align: middle; }
  .emo svg { display: block; width: 100%; height: 100%; fill: initial; stroke: none; opacity: 1; }
  .fs-item .emo { font-size: 16px; }
  .item-star-badge svg { display: block; width: 100%; height: 100%; fill: initial; stroke: none; }
  /* Sidebar Course Folders draw the same folder as the big icons in the main
     view, including the folder's own color (2026-10-01, per Martin). */
  .fs-item .fs-folder { display: block; width: 20px; height: 20px; flex-shrink: 0; margin: -2px 0; }
  .fs-item .fs-folder svg { width: 100%; height: 100%; stroke: none; }

  h1.title {

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);

  /* ---------- Course banner + tabs, shared with the course hub (2026-10-01) ---------- */
  .page { max-width: 1120px; }
  .back-link { display: none; }
  .sheet { background: var(--panel-bg); border-radius: var(--window-radius-lg); overflow: hidden; }
  .sheet-top { margin-bottom: 24px; }
  .sheet-head { background: var(--course-color); color: #fff; padding: 24px 32px 28px; display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; }

  .sheet-emoji svg { width: 40px; height: 40px; display: block; }

  .sheet-grade { display: flex; flex-direction: column; gap: 4px; }

  .sheet-letter { font-weight: 900; line-height: 1; font-size: 2.7rem; }

  .sheet-score .grade-hero-val > span:first-child, .sheet-score .grade-hero-trend { color: #fff !important; font-size: inherit; }
  .sheet-pct, .sheet-score .grade-hero-pct { font-size: 0.85rem; font-weight: 800; color: rgba(255,255,255,0.86); margin-left: 0; }
  .sheet-score .grade-hero-block { background: none; padding: 0; border-radius: var(--window-radius-sm); }

  .sheet-grade-proj:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff; }
  .sheet-grade-link { cursor: pointer; border-radius: var(--window-radius-sm); padding: 8px; margin: -8px; }
  .sheet-grade-link:hover { background: rgba(255,255,255,0.14); }
  .sheet-grade-link:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff; }
  .sheet-grade-proj.sheet-static { cursor: default; }
  .sheet-score .grade-hero-block.sheet-grade-proj { padding: 8px; margin: -8px; }

  /* ---------- Projected-grade popup (2026-10-04): same as gradebook.html's,
     without the italic footnote (no italics on course pages). ---------- */
  .grade-popup {
    position: fixed;
    z-index: 50;

  .sheet-tabs { display: flex; align-items: center; gap: 24px; padding: 0 32px; }

  .finder-icon-btn svg { width: 16px; height: 16px; stroke-width: 2; }

  .finder-icon-btn:hover:not(:disabled), .finder-chevron:hover:not(:disabled) { background: var(--border); color: var(--text-dark); }
  .finder-icon-btn:disabled, .finder-chevron:disabled { background: transparent; color: var(--border); }
  /* Grid / List: the same pills as All / Assigned */
  .view-toggle { background: none; padding: 0; gap: 4px; border-radius: 0; }
  .view-btn { width: auto; height: 32px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 0.76rem; font-weight: 800; color: var(--text-muted); background: var(--panel-inner); }
  .view-btn:hover:not(:disabled) { color: var(--text-dark); }
  .view-btn.active { background: var(--course-color); color: #fff; }
  .finder-search-wrap { height: 32px; padding: 0 12px; gap: 8px; width: 192px; border-radius: 999px; background: var(--panel-inner); }
  .finder-search-wrap svg { width: 14px; height: 14px; }
  .finder-search-wrap input { font-size: 0.8rem; font-weight: 700; }
  .search-clear-btn[hidden] { display: none; }   /* the X showed even with an empty search */
  /* body: no grey sidebar, a thin divider like the hub's Updates | Grade trend */
  .finder-body { display: grid; grid-template-columns: 216px minmax(0, 1fr); }
  .finder-sidebar { width: auto; background: none; border-right: 1px solid var(--border); padding: 0 16px 24px 24px; }
  .fs-heading { margin: 16px 8px 8px; font-size: 0.66rem; letter-spacing: 0.06em; color: var(--text-faint); }
  .fs-heading:first-child { margin-top: 0; }
  .fs-item { gap: 12px; padding: 8px; margin-bottom: 4px; border-radius: var(--window-radius-sm); font-size: 0.82rem; font-weight: 800; color: var(--text-muted); }
  .fs-item:hover { background: var(--panel-inner); color: var(--text-dark); }
  .fs-item.active { background: rgb(from var(--course-color) r g b / 0.14); color: var(--text-dark); }
  .fs-item.drop-target { background: var(--course-color); color: #fff; }
  .fs-item .emo { font-size: 18px; }
  .finder-content { padding: 0 32px 32px 24px; min-height: 240px; }
  .finder-content.free-drop-active { border-radius: var(--window-radius-sm); }
  .finder-empty { margin: 0; padding: 48px 0; font-size: 0.8rem; font-weight: 700; color: var(--text-faint); }
  /* tiles: bigger, bolder names, tint when selected (no colored border) */
  .item-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .item-tile { gap: 8px; padding: 12px 8px; border: none; border-radius: var(--window-radius-sm); color: var(--text-dark); }
  .item-tile:hover { background: var(--panel-inner); }
  .item-tile.selected { background: rgb(from var(--course-color) r g b / 0.14); }
  .item-tile.free-pos { width: 104px; }
  .item-icon { width: 52px; height: 52px; }
  .item-name { font-size: 0.76rem; font-weight: 800; line-height: 1.3; }
  .item-name-input { font-size: 0.76rem; font-weight: 800; border-radius: 6px; padding: 2px 4px; }
  .item-star-badge { top: 8px; right: 8px; width: 16px; height: 16px; }
  /* list: rows like the hub's grade list */
  .item-list { font-size: 0.82rem; }
  .item-list thead th { padding: 0 8px 8px; font-size: 0.66rem; letter-spacing: 0.06em; color: var(--text-faint); }
  .item-list tbody tr + tr td { border-top: 1px solid var(--border); }
  .item-list td { padding: 12px 8px; font-weight: 700; }
  .item-list td:first-child { border-radius: var(--window-radius-sm) 0 0 var(--window-radius-sm); }
  .item-list td:last-child { border-radius: 0 var(--window-radius-sm) var(--window-radius-sm) 0; }
  .item-list tbody tr:hover td, .item-list tbody tr.selected td { border-top-color: transparent; }
  /* Show in Materials (from Files): a short ring on the file it opened to.
     It's an animation, so Potato mode and reduced motion leave just the
     selected tint. */
  @keyframes cm-found { 0%, 60% { box-shadow: 0 0 0 3px rgb(from var(--course-color) r g b / 0.55); } 100% { box-shadow: 0 0 0 3px rgb(from var(--course-color) r g b / 0); } }
  .item-tile.cm-found { animation: cm-found 1.8s ease-out; }
  .item-list tbody tr.cm-found td { animation: cm-found 1.8s ease-out; }
  @media (prefers-reduced-motion: reduce) { .item-tile.cm-found, .item-list tbody tr.cm-found td { animation: none; } }
  .item-list tbody tr:hover + tr td, .item-list tbody tr.selected + tr td { border-top-color: transparent; }
  .item-list .name-cell { gap: 12px; font-weight: 800; }
  .item-list .name-cell .item-icon { width: 24px; height: 24px; }
  /* menus */
  .context-menu { border-radius: var(--window-radius-md); padding: 8px; }
  .context-menu-item { padding: 8px 12px; border-radius: var(--window-radius-sm); font-weight: 700; }
  @media (max-width: 900px) {
    .finder-titlebar { padding: 24px 24px 16px; }
    .finder-toolbar { width: 100%; justify-content: flex-start; }
    .finder-search-wrap { flex: 1 1 192px; }
    .finder-body { grid-template-columns: 184px minmax(0, 1fr); }
    .finder-sidebar { padding-left: 16px; }
    .finder-content { padding: 0 24px 24px 16px; }
  }
  @media (max-width: 640px) {
    /* Back/Forward sit next to the title; search, then the buttons, below */
    .finder-toolbar { display: contents; }
    .finder-heading { order: 0; }
    .finder-nav-btns { order: 1; }
    .finder-search-wrap { order: 2; flex: 1 1 100%; width: auto; }
    .view-toggle { order: 3; }
    .finder-actions { order: 4; margin-left: auto; }
    .finder-body { grid-template-columns: 1fr; }
    .finder-sidebar { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; border-right: none; border-bottom: 1px solid var(--border); padding: 0 24px 16px; }
    .fs-item { width: auto; flex-shrink: 0; margin: 0; white-space: nowrap; }
    #unitList { display: flex; gap: 8px; }
    .finder-content { padding: 16px 24px 24px; }
    .item-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  }
  /* search results from subfolders say where they are */
  .item-where { display: block; font-size: 0.68rem; font-weight: 700; color: var(--text-faint); text-align: center; line-height: 1.3; overflow-wrap: anywhere; }
  .item-list .item-where { display: inline; margin-left: 8px; }
  /* Clamp to Grid fix (2026-10-02): even rows so free-placed items line up */
  .item-grid { grid-auto-rows: 136px; }
  .item-grid.searching { grid-auto-rows: min-content; }
  .item-tile.free-pos { width: var(--cell-w, 104px); height: 136px; }
  .item-grid:not(.searching) .item-name { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* Save to cloud menu */
  .cloud-menu { min-width: 224px; }
  .cloud-menu .context-menu-tags-label { padding: 4px 12px 8px; text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
  .cloud-soon { font-size: 0.66rem; font-weight: 800; color: var(--text-faint); }
  /* Teacher contact card (2026-10-02): same card as the Contacts page */
  .teacher-link { background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.45); text-underline-offset: 3px; }
  .teacher-link:hover { text-decoration-color: currentColor; }
  .teacher-link:focus-visible { outline: none; box-shadow: 0 0 0 2px currentColor; border-radius: 4px; }
  .modal-row .teacher-link { text-decoration-color: var(--border); font-weight: 700; color: var(--text-dark); }
  .modal-row .teacher-link:hover { text-decoration-color: currentColor; }
  .tc-overlay { position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 70; opacity: 0; visibility: hidden; transition: opacity 0.15s ease; }
  .tc-overlay.show { opacity: 1; visibility: visible; }
  .tc-box { background: var(--panel-bg); border-radius: var(--window-radius-lg); max-width: 380px; width: 100%; padding: 22px 24px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6); transform: translateY(8px); transition: transform 0.15s ease; }
  .tc-overlay.show .tc-box { transform: translateY(0); }
  .tc-close { float: right; background: var(--panel-inner); border: none; width: 26px; height: 26px; border-radius: 50%; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; line-height: 1; }
  .tc-close:hover { color: var(--text-dark); }
  .tc-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .tc-head { display: flex; align-items: center; gap: 12px; clear: both; padding-top: 4px; }
  .tc-avatar { width: 52px; height: 52px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tc-box h3 { margin: 0; font-size: 1.1rem; font-weight: 900; color: var(--text-dark); }
  .tc-role { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin: 2px 0 0; }
  .tc-rows { margin-top: 14px; }
  .tc-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .tc-row:last-child { border-bottom: none; }
  .tc-row[hidden] { display: none; }
  .tc-row .k { color: var(--text-faint); font-weight: 700; }
  .tc-row .v { color: var(--text-dark); font-weight: 700; text-align: right; overflow-wrap: anywhere; }
  .tc-actions { display: flex; gap: 8px; margin-top: 16px; }
  .tc-btn { display: flex; align-items: center; justify-content: center; gap: 7px; flex: 1; background: var(--course-color); color: #fff; border: none; border-radius: 999px; padding: 10px; font: inherit; font-weight: 800; font-size: 0.82rem; cursor: pointer; text-decoration: none; }
  .tc-btn:hover { background: var(--course-color-dark); }
  .tc-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .tc-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .tc-btn.secondary { background: var(--panel-inner); color: var(--text-dark); }
  .tc-btn.secondary:hover { background: var(--border); }
  .tc-btn[hidden] { display: none; }
  /* Back link (2026-10-03): same as every other page, plain text with the arrow, no bubble */
  .topbar .back-link { gap: 5px; padding: 0; background: none; border-radius: 0; color: rgba(255,255,255,0.82); font-size: 0.76rem; font-weight: 800; }

  .topbar .back-link:focus-visible { box-shadow: none; text-decoration: underline; }
  .topbar .back-link svg { display: block; }
</style>

      <!-- Right-click menu (2026-08-26, per Martin's request — modeled on

  <script>
    // ---- Links by id (2026-10-07, Martin) ----
    // A real class (Schoology/Classroom ids are digits) links as
    // assignment?id=<id> and course-home?id=<section id>; the sample classes
    // (word ids like "apchem") keep ?course=&title=. Pages read both.
    function avgIsId(v) { return /^\d{1,24}$/.test(String(v == null ? '' : v)); }
    function avgCourseQ(course) { return (avgIsId(course) ? 'id=' : 'course=') + encodeURIComponent(course == null ? '' : course); }
    function avgAssignHref(course, title, id, extra) {
      extra = extra || '';
      if (avgIsId(id) && avgIsId(course)) return `assignment.html?id=${id}${extra}`;
      return `assignment.html?course=${encodeURIComponent(course == null ? '' : course)}&title=${encodeURIComponent(title || '')}${avgIsId(id) ? `&id=${id}` : ''}${extra}`;
    }

    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>


  <script>
    // ------------------------------------------------------------------
    // Shared appearance (accent + background) — 2026-09-08, per Martin:
    // "wallpapers + accent colors don't save across pages." Settings'
    // Appearance section (and onboarding's Theme step) are the only
    // writers of schoolagy_appearance; every other real app page,
    // including this one, applies whatever's saved there, read-only, on
    // its own load — same shared-localStorage-record pattern already
    // used for schoolagy_dark_mode/schoolagy_profile.
    // ------------------------------------------------------------------
    (function () {
      function darken(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }
      function applyAppearance() {
        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));
        }
        if (saved.background === 'white') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#0c0c0e';
        } else if (saved.background) {
          document.body.style.backgroundImage = `url("${saved.background}")`;
          document.body.style.backgroundColor = '';
        }
      }
      applyAppearance();
      window.addEventListener('storage', e => {
        if (e.key === 'schoolagy_appearance') applyAppearance();
      });
    })();

    // ------------------------------------------------------------------
    // Same six sample courses as course-home.html (id/name/color), just
    // the fields this page actually needs — duplicated locally same as
    // every other page in this mock (see architecture-decisions.md's
    // shared-stylesheet note).
    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    // Course customization persistence — added 2026-09-08. Renaming,
    // recoloring, or reordering a course (in home.html's Customize editor
    // or courses.html's Reorder tool — the only places that WRITE these)
    // used to be invisible everywhere else, since every page just
    // re-generated its own hardcoded COURSES array from scratch on load.
    // schoolagy_course_custom holds per-course name/color overrides
    // (object keyed by course id, only actually-customized courses
    // present); schoolagy_course_order holds a full custom ordering of
    // course ids (array), written only once the user has actually
    // reordered. This page only READS both — applyCourseCustomizationsInPlace()
    // is called right after the raw array literal below, mutating COURSES
    // in place, so it's already the customized/reordered version before
    // anything on this page ever renders it. Same defensive
    // try/catch-per-key style as AVERAGES_DARK_MODE_KEY in settings.html.
    // ------------------------------------------------------------------
    const AVERAGES_COURSE_CUSTOM_KEY = 'schoolagy_course_custom';
    const AVERAGES_COURSE_ORDER_KEY = 'schoolagy_course_order';
    function loadCourseCustom() {
      try {
        const raw = localStorage.getItem(AVERAGES_COURSE_CUSTOM_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return {};
    }
    function loadCourseOrder() {
      try {
        const raw = localStorage.getItem(AVERAGES_COURSE_ORDER_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return null;
    }
    // Subject table (2026-10-01, per Martin): each course gets a color that
    // fits its subject, picked from its name. First match wins, so specific
    // subjects come before broad ones ("Computer Science" before "Science",
    // "Physical Education" before "Physics"). A color the student picked in
    // the course's info pop-up still wins over this. No match keeps the
    // course's own color. All colors pass 4.5:1 with white text.
    const COURSE_SUBJECTS = [
      [/\bchem/, '🧪', '#1b7f67'],
      [/\bbio|anatom|physiolog/, '🧬', '#387f33'],
      [/\bphysical ed|(^|[^a-z])p\.?e\.?($|[^a-z])|fitness|\bweight/, '🏃', '#c2562b'],
      [/\bhealth/, '🩺', '#c0404a'],
      [/\bphysics/, '⚛️', '#4a56b8'],
      [/astronom/, '🔭', '#3b3f8f'],
      [/environment|\bearth|geolog/, '🌍', '#2f7f63'],
      [/robotic/, '🤖', '#55697d'],
      [/computer|programming|coding|\bcs[ap]?\b|software/, '💻', '#2d6f8f'],
      [/engineer/, '⚙️', '#6a6478'],
      [/government|civics|politic/, '🏛️', '#2f4f8a'],
      [/econ/, '📈', '#2e7d4f'],
      [/psych/, '🧠', '#9a4583'],
      [/geograph/, '🗺️', '#4c7a5a'],
      [/histor/, '📜', '#9a5a2a'],
      [/statistic|\bstats?\b/, '📊', '#2f72a8'],
      [/geometr|\btrig/, '📐', '#3e64b0'],
      [/calc|algebra|\bmath/, '🧮', '#2f5fb3'],
      [/english|literature|\blit\b|writing|composition|language arts|reading/, '📖', '#a63a4f'],
      [/spanish|french|german|chinese|mandarin|japanese|korean|latin|italian|\basl\b|sign language|language/, '🗣️', '#7a4fae'],
      [/theat|drama/, '🎭', '#a3364b'],
      [/music|band|choir|orchestra|chorus/, '🎵', '#6b48a8'],
      [/photo/, '📷', '#4f5d6e'],
      [/culinary|cooking|\bfoods?\b|nutrition/, '🍳', '#b05a26'],
      [/\barts?\b|drawing|painting|ceramic|sculpt|design/, '🎨', '#b03f7a'],
      [/business|marketing|accounting|financ/, '💼', '#3d5f6e'],
      [/journalism|yearbook|newspaper/, '📰', '#5c5c6e'],
      [/science/, '🔬', '#2b7b8c'],
    ];
    function courseSubject(name) {
      const n = String(name || '').toLowerCase();
      return COURSE_SUBJECTS.find(([re]) => re.test(n)) || null;
    }

    function applyCourseCustomizationsInPlace(courses) {
      const custom = loadCourseCustom();
      // Mutates each course object's own fields in place (never clones,
      // never reassigns `courses` itself) so the `const COURSES = [...]`
      // literal a few lines below stays exactly that — a literal array —
      // for scripts/port-pages.mjs's data-overrides transform to match
      // and rewrite for live Schoology data. This function only edits
      // the array's contents/order after that binding already exists.
      courses.forEach(c => {
        const subject = courseSubject(c.name);
        if (subject) c.color = subject[2];
        Object.assign(c, custom[c.id] || {});
      });
      const order = loadCourseOrder();
      if (order && order.length) {
        const byId = new Map(courses.map(c => [c.id, c]));
        const ordered = order.filter(id => byId.has(id)).map(id => byId.get(id));
        // A course not present in the saved order (e.g. added to the demo
        // data after the order was saved) still shows up, just appended.
        courses.forEach(c => { if (!order.includes(c.id)) ordered.push(c); });
        courses.splice(0, courses.length, ...ordered);
      }
    }
    // ------------------------------------------------------------------
    // Teacher contact card (2026-10-02, per Martin): the teacher's name on the
    // banner (and in Course info) opens the same card as the Contacts page.
    // CONTACTS is the school directory: live data replaces this sample at
    // build time, same as contacts.html. Only "my teachers" are needed here.
    // ------------------------------------------------------------------
    const CONTACTS = [
      { id: 'cho', name: 'Mr. Cho', role: 'Teacher', dept: 'English Department', school: 'Lincoln High School', email: 'j.cho@lincolnusd.org', phone: '(555) 201-4471', color: '#6b8f5e', category: 'myTeachers' },
      { id: 'alvarez', name: 'Mr. Alvarez', role: 'Teacher', dept: 'Science Department', school: 'Lincoln High School', email: 'r.alvarez@lincolnusd.org', phone: '(555) 201-4482', color: '#a67a22', category: 'myTeachers' },
      { id: 'whitfield', name: 'Ms. Whitfield', role: 'Teacher', dept: 'Math Department', school: 'Lincoln High School', email: 'k.whitfield@lincolnusd.org', phone: '(555) 201-4493', color: '#5b6ea3', category: 'myTeachers' },
      { id: 'bennett', name: 'Mrs. Bennett', role: 'Teacher', dept: 'Social Studies Department', school: 'Lincoln High School', email: 'l.bennett@lincolnusd.org', phone: '(555) 201-4504', color: '#a15c4f', category: 'myTeachers' },
      { id: 'ortiz', name: 'Sra. Ortiz', role: 'Teacher', dept: 'World Languages Department', school: 'Lincoln High School', email: 'm.ortiz@lincolnusd.org', phone: '(555) 201-4515', color: '#8a6ba1', category: 'myTeachers' },
      { id: 'reyes', name: 'Coach Reyes', role: 'Teacher', dept: 'Physical Education Department', school: 'Lincoln High School', email: 'd.reyes@lincolnusd.org', phone: '(555) 201-4526', color: '#4f8c8a', category: 'myTeachers' }
    ];
    // Signed in with real data (2026-10-06). A demo sign-in also has
    // __AVERAGES__ (with an empty bundle) and shows the samples, like the preview.
    const TC_LIVE = !!(window.__AVERAGES__ && window.__AVERAGES__.data) && window.__AVERAGES__.mode !== 'demo';
    const TC_DATA = TC_LIVE ? window.__AVERAGES__.data : {};
    const TC_CLASSROOM = TC_LIVE && (TC_DATA.platform === 'classroom' || TC_DATA.PEOPLE_PLATFORM === 'classroom');
    // The directory comes from the people extra; if that failed, nobody's
    // card is filled from the sample teachers above.
    if (TC_LIVE && !Array.isArray(TC_DATA.CONTACTS)) CONTACTS.length = 0;
    const TC_TITLE = /^(Mr\.|Mrs\.|Ms\.|Mx\.|Dr\.|Sra\.|Sr\.|Coach|Nurse)\s+/i;
    function tcEsc(v) { return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function tcLastName(n) { const p = String(n || '').replace(TC_TITLE, '').trim().split(/\s+/); return p[p.length - 1].toLowerCase(); }
    // Full name first, then last name (a teacher in the directory first).
    function findTeacherContact(name, courseId) {
      const list = Array.isArray(CONTACTS) ? CONTACTS : [];
      const exact = list.find(c => c && String(c.name).toLowerCase() === String(name).toLowerCase());
      if (exact) return exact;
      // Live contacts list the classes they teach (2026-10-06): this class's
      // one teacher, when the name on the class doesn't match exactly.
      const teaching = courseId ? list.filter(c => c && Array.isArray(c.courses) && c.courses.map(String).includes(String(courseId))) : [];

      if (f && typeof f === 'object' && f.url && !f.drive) return "<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"-2 -2 40 40\"><path fill=\"#3B88C3\" d=\"M18 0C8.059 0 0 8.059 0 18s8.059 18 18 18 18-8.059 18-18S27.941 0 18 0zM2.05 19h3.983c.092 2.506.522 4.871 1.229 7H4.158a15.885 15.885 0 0 1-2.108-7zM19 8V2.081c2.747.436 5.162 2.655 6.799 5.919H19zm7.651 2c.754 2.083 1.219 4.46 1.317 7H19v-7h7.651zM17 2.081V8h-6.799C11.837 4.736 14.253 2.517 17 2.081zM17 10v7H8.032c.098-2.54.563-4.917 1.317-7H17zM6.034 17H2.05a15.9 15.9 0 0 1 2.107-7h3.104c-.705 2.129-1.135 4.495-1.227 7zm1.998 2H17v7H9.349c-.754-2.083-1.219-4.459-1.317-7zM17 28v5.919c-2.747-.437-5.163-2.655-6.799-5.919H17zm2 5.919V28h6.8c-1.637 3.264-4.053 5.482-6.8 5.919zM19 26v-7h8.969c-.099 2.541-.563 4.917-1.317 7H19zm10.967-7h3.982a15.87 15.87 0 0 1-2.107 7h-3.104c.706-2.129 1.136-4.494 1.229-7zm0-2c-.093-2.505-.523-4.871-1.229-7h3.104a15.875 15.875 0 0 1 2.107 7h-3.982zm.512-9h-2.503c-.717-1.604-1.606-3.015-2.619-4.199A16.034 16.034 0 0 1 30.479 8zM10.643 3.801C9.629 4.985 8.74 6.396 8.023 8H5.521a16.047 16.047 0 0 1 5.122-4.199zM5.521 28h2.503c.716 1.604 1.605 3.015 2.619 4.198A16.031 16.031 0 0 1 5.521 28zm19.836 4.198c1.014-1.184 1.902-2.594 2.619-4.198h2.503a16.031 16.031 0 0 1-5.122 4.198z\"/></svg>";
