    })();

    // ------------------------------------------------------------------
    // Projected-grade popup (2026-10-04, per Martin): hovering or focusing
    // Projected shows the score trend behind it, same as the Updates and
    // Grades tabs. HISTORY is the same sample as gradebook.html's, and live
    // data replaces it (see OVERRIDABLE in scripts/port-pages.mjs). With no
    // history for this course, Projected just stays a plain number.
    // ------------------------------------------------------------------
    const HISTORY = {
      apchem: { points: [72, 79, 84, 88, 90], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'] },
      algebra2: { points: [94, 96, 93, 97, 95], dates: ['Aug 3', 'Aug 7', 'Aug 11', 'Aug 17', 'Aug 23'] },
      english10: { points: [88, 82, 79, 76, 73], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'] },
      ushistory: { points: [89, 93, 88, 92, 90], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'] },
      spanish3: { points: [76, 80, 83, 85, 87], dates: ['Aug 3', 'Aug 7', 'Aug 11', 'Aug 17', 'Aug 23'] },
      pe: { points: [96, 98, 95, 97, 96], dates: ['Aug 2', 'Aug 6', 'Aug 10', 'Aug 16', 'Aug 22'] },
    };
    (function () {
      const escapeHtml = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));   // takes numbers too
      const predBlock = document.getElementById('predBlock');
      const gradePopup = document.getElementById('gradePopup');
      const hist0 = HISTORY[course.id];
      if (!predBlock || !gradePopup || !course.grade || !hist0 || !hist0.points || !hist0.points.length) {
        if (predBlock) { predBlock.classList.add('sheet-static'); predBlock.removeAttribute('tabindex'); predBlock.removeAttribute('role'); predBlock.removeAttribute('aria-haspopup'); }
        return;
      }
      const TREND_WORD = { up: 'Trending up', down: 'Trending down', flat: 'Holding steady' };
      predBlock.setAttribute('aria-label', `Why is ${course.name} projected ${course.predicted}, ${course.predictedPct} percent? Show reasoning.`);
      function niceBounds(values) {
        const min = Math.min(...values), max = Math.max(...values);
        let lo = Math.max(0, Math.floor((min - 6) / 10) * 10);
        let hi = Math.min(100, Math.ceil((max + 6) / 10) * 10);
        if (hi - lo < 20) hi = Math.min(100, lo + 20);
        return [lo, hi];
      }
      // Grades from the same day become one point (their average), labeled "Aug 18 ×3".
      function groupSameDay(h) {
        const days = [];
        h.points.forEach((p, i) => {
          const d = h.dates[i], last = days[days.length - 1];
          if (last && last.date === d) { last.sum += p; last.n++; } else days.push({ date: d, sum: p, n: 1 });
        });
        return { points: days.map(x => Math.round(x.sum / x.n)), dates: days.map(x => x.n > 1 ? `${x.date} ×${x.n}` : x.date) };
      }
      function buildGradeChartSVG(c) {
        const hist = groupSameDay(HISTORY[c.id]);
        const allLabels = hist.dates.concat(['Predicted']);
        const [yLo, yHi] = niceBounds(hist.points.concat([c.predictedPct]));
        const W = 240, H = 108, padL = 26, padR = 6, padT = 10, padB = 16;
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const xFor = i => padL + (i / Math.max(1, allLabels.length - 1)) * plotW;
        const yFor = v => padT + plotH - ((v - yLo) / (yHi - yLo)) * plotH;
        const col = escapeHtml(c.color);
        const gridlines = [yLo, Math.round((yLo + yHi) / 2), yHi].map(t => `
          <line x1="${padL}" x2="${W - padR}" y1="${yFor(t)}" y2="${yFor(t)}" stroke="var(--border)" stroke-width="1"/>
          <text x="${padL - 6}" y="${yFor(t) + 3}" text-anchor="end" font-size="8" fill="var(--text-faint)">${t}%</text>`).join('');
        const pts = hist.points.map((v, i) => [xFor(i), yFor(v)]);
        const markers = pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="${col}" stroke="var(--panel-bg)" stroke-width="2"/>`).join('');
        const predX = xFor(allLabels.length - 1), predY = yFor(c.predictedPct), last = pts[pts.length - 1];
        const xLabels = allLabels.map((lab, i) => `<text x="${xFor(i)}" y="${H - 2}" text-anchor="middle" font-size="7.5" fill="var(--text-faint)">${escapeHtml(lab === 'Predicted' ? 'Pred.' : lab)}</text>`).join('');
        return `
          <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart of ${escapeHtml(c.name)} assignment scores trending toward a projected grade of ${escapeHtml(c.predictedPct)} percent">
            <defs><pattern id="predStripesMaterials" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
              <rect width="6" height="6" fill="${col}" fill-opacity="0.08"/><line x1="0" y1="0" x2="0" y2="6" stroke="${col}" stroke-width="2.2"/>
            </pattern></defs>
            ${gridlines}
            <rect x="${last[0]}" y="${padT}" width="${predX - last[0]}" height="${plotH}" fill="url(#predStripesMaterials)" stroke="none"/>
            <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="${last[0]}" y1="${last[1]}" x2="${predX}" y2="${predY}" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
            ${markers}
            <circle cx="${predX}" cy="${predY}" r="4.5" fill="var(--panel-bg)" stroke="${col}" stroke-width="2"/>
            <text x="${predX}" y="${predY - 10}" text-anchor="end" font-size="8.5" font-weight="800" fill="var(--text-dark)">${escapeHtml(c.predictedPct)}%</text>
            ${xLabels}
          </svg>`;
      }
      function renderGradePopup(c) {
        const hist = HISTORY[c.id];
        const first = hist.points[0], lastGraded = hist.points[hist.points.length - 1];
        return `
          <h3>${escapeHtml(c.name)}</h3>
          <p class="popup-sub">${TREND_WORD[c.trend] || 'Trend'}: <strong>${escapeHtml(first)}% → ${escapeHtml(lastGraded)}%</strong> over the last ${hist.points.length} graded assignments, predicting <strong>${escapeHtml(c.predictedPct)}%</strong> (${escapeHtml(c.predicted)}).</p>
          ${buildGradeChartSVG(c)}
          <p class="popup-foot">Projected grade follows this trend. It is not a copy of the current grade.</p>`;
      }
      let hideTimer = null;
      function showGradePopup() {
        clearTimeout(hideTimer);
        gradePopup.innerHTML = renderGradePopup(course);
        gradePopup.classList.add('show');
        predBlock.setAttribute('aria-expanded', 'true');
        const rect = predBlock.getBoundingClientRect(), pr = gradePopup.getBoundingClientRect();
        let left = Math.max(10, Math.min(rect.left + rect.width / 2 - pr.width / 2, window.innerWidth - pr.width - 10));
        let top = rect.top - pr.height - 10;
        if (top < 10) top = rect.bottom + 10;
        gradePopup.style.left = `${left}px`;
        gradePopup.style.top = `${top}px`;
      }
      function hideGradePopup() { gradePopup.classList.remove('show'); predBlock.setAttribute('aria-expanded', 'false'); }
      predBlock.addEventListener('mouseenter', showGradePopup);
      predBlock.addEventListener('focus', showGradePopup);
      predBlock.addEventListener('mouseleave', () => { hideTimer = setTimeout(hideGradePopup, 80); });
      predBlock.addEventListener('blur', hideGradePopup);
      predBlock.addEventListener('keydown', e => { if (e.key === 'Escape') { hideGradePopup(); predBlock.blur(); } });
      window.addEventListener('scroll', hideGradePopup, { passive: true });
    })();

    // Current grade opens this course's Grades tab (2026-10-04, per Martin).
    (function () {
      const b = document.getElementById('curBlock');
      if (!b) return;
      if (course.grade) b.setAttribute('aria-label', `Current grade ${course.grade}, ${course.pct} percent. See grades`);
      const go = () => { window.location.href = `gradebook.html?${avgCourseQ(course.id)}`; };
      b.addEventListener('click', go);
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    })();

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    // ------------------------------------------------------------------
    // Signed in: the class's real files (2026-10-05). GET /data/files lists
    // every file in the student's classes (teachers' Materials documents and
    // files attached to assignments), so an assignment with nothing attached
    // never appears. Same 5-minute cache as the Files page. Google Classroom
    // files are Google Drive links. Teacher files can't be renamed or deleted
    // (they aren't the student's); the student's own folders work as before,
    // on this page only. Since 2026-10-06 the teachers' own folders show too
    // (teacherFolders below).
    // ------------------------------------------------------------------
    function liveApiBase() { return window.location.hostname.endsWith('averages.io') ? 'https://api.averages.io' : 'http://localhost:8787'; }
    function liveFileUrl(f) {
      const l = f.live || {};
      return `${liveApiBase()}/data/attachment?section=${encodeURIComponent(l.course)}&${l.kind === 'document' ? 'document' : 'assignment'}=${encodeURIComponent(l.parent)}&file=${encodeURIComponent(l.id)}`;
    }
    if (MATERIALS_LIVE) (function liveMaterials() {
      const emptyEl = document.getElementById('emptyState');
      const ID = /^\d{1,24}$/;
      const DRIVE_ID = /^[A-Za-z0-9_-]{10,128}$/;
      const DRIVE_URL = /^https:\/\/(drive|docs)\.google\.com\//;
      const CACHE = 'averages_files_cache', CACHE_MS = 5 * 60 * 1000;
      const owner = () => { try { return localStorage.getItem('averages_cloud_owner') || ''; } catch { return ''; } };
      let rootNote = 'Loading this class\'s files…';
      // The empty message says what's going on at the top of the class; inside a folder it's the usual one.
      const renderBeforeLive = render;
      render = function () {
        renderBeforeLive();
        if (!emptyEl.hidden) emptyEl.textContent = (mode === 'browse' && currentNode() === root && !searchInput.value.trim()) ? rootNote : 'No items here.';
      };
      function cached() {
        try {
          const c = JSON.parse(sessionStorage.getItem(CACHE) || 'null');
          if (c && c.owner === owner() && Date.now() - c.at < CACHE_MS && c.data) return c.data;
        } catch {}
        return null;
      }
      const data = (window.__AVERAGES__ && window.__AVERAGES__.data) || {};
      const dueById = new Map();
      [].concat(Array.isArray(data.OVERDUE) ? data.OVERDUE : [], Array.isArray(data.UPCOMING) ? data.UPCOMING : []).forEach(x => { if (x && x.id) dueById.set(String(x.id), String(x.due || '')); });
      const label = ms => (ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '');
      // Teachers' folders (2026-10-06): FOLDERS (GET /data/folders, loaded by
      // LegacyPage for this page) lists this class's folders and which folder
      // each item is in, keyed "<kind>:<parent>" like the items themselves.
      // Folders nest by `parent`; a folder whose parent is missing (or that
      // loops back on itself) and any item that isn't placed sit at the top.
      // Without FOLDERS for this class the list stays flat, as before.
      // Google Classroom's topics come the same way.
      const FOLDER_ID = /^[A-Za-z0-9_-]{1,64}$/;
      // Schoology names its folder colours; anything else must be a hex colour.
      const NAMED_COLOR = { red: '#ff453a', orange: '#ff9f0a', yellow: '#ffd60a', green: '#32d74b', blue: '#0a84ff', purple: '#bf5af2', pink: '#ff375f', gray: '#98989d', grey: '#98989d', black: '#3a3a3c' };
      function folderColor(v) {
        const c = String(v || '').trim().toLowerCase();
        if (/^#[0-9a-f]{6}$/.test(c)) return c;
        if (/^#[0-9a-f]{3}$/.test(c)) return '#' + c.slice(1).split('').map(ch => ch + ch).join('');
        return NAMED_COLOR[c] || undefined;   // undefined: the class colour
      }
      function teacherFolders(items) {
        const F = data.FOLDERS;
        if (!F || typeof F !== 'object' || String(F.course) !== String(course.id) || !Array.isArray(F.folders) || !F.folders.length) return { folders: [], files: items };
        const byId = new Map();
        const parentOf = new Map();
        F.folders.slice(0, 300).forEach(x => {
          const id = x && String(x.id);
          if (!x || !FOLDER_ID.test(id) || byId.has(id)) return;
          byId.set(id, { name: String(x.title || '').trim().slice(0, 200) || 'Folder', folders: [], files: [], created: '', tagColor: folderColor(x.color), teacherFolder: id });
          parentOf.set(id, String(x.parent || ''));
        });
        const top = [];
        byId.forEach((node, id) => {
          const parent = parentOf.get(id);
          let up = parent, loops = false;
          for (let hops = 0; up && byId.has(up) && hops < 64; hops++) {
            if (up === id) { loops = true; break; }
            up = parentOf.get(up);
          }
          (parent && byId.has(parent) && !loops ? byId.get(parent).folders : top).push(node);
        });
        const placement = F.placement && typeof F.placement === 'object' ? F.placement : {};
        const loose = [];
        items.forEach(f => {
          const key = `${f.live.kind}:${f.live.parent}`;
          const where = Object.prototype.hasOwnProperty.call(placement, key) ? String(placement[key]) : '';
          (where && byId.has(where) ? byId.get(where).files : loose).push(f);
        });
        return { folders: top, files: loose };
      }
      async function load() {
        render();
        try {
          let j = cached();
          if (!j) {
            const res = await fetch(`${liveApiBase()}/data/files`, { credentials: 'include' });
            if (res.status === 401) { window.location.href = '/'; return; }
            if (!res.ok) throw new Error('status ' + res.status);
            j = await res.json();
            if (!j.partial) { try { sessionStorage.setItem(CACHE, JSON.stringify({ at: Date.now(), owner: owner(), data: j })); } catch {} }
          }
          const classroom = j.platform === 'classroom';
          const mine = (Array.isArray(j.files) ? j.files : []).filter(f => f && String(f.course) === String(course.id) && ID.test(String(f.parent))
            && (classroom ? DRIVE_ID.test(String(f.id)) && DRIVE_URL.test(String(f.url || '')) && (f.kind === 'material' || f.kind === 'assignment')
                          : ID.test(String(f.id)) && (f.kind === 'document' || f.kind === 'assignment')));
          const items = mine.map(f => {
            const at = Number(f.at) || 0;
            const rawExt = String(f.ext || '').toLowerCase();
            const item = {
              name: String(f.name || 'File'),
              // Google's own types have no extension; short labels that fit the badge.
              ext: (classroom ? ({ gdoc: 'doc', gsheet: 'xls', gslides: 'ppt', gdraw: 'img' })[rawExt] : '') || rawExt || 'file',
              created: label(at),
              live: { course: String(f.course), kind: String(f.kind), parent: String(f.parent), parentTitle: String(f.parentTitle || ''), id: String(f.id), size: Number(f.size) || 0, at },
            };
            if (f.kind === 'assignment') { item.assignment = true; item.due = dueById.get(String(f.parent)) || ''; }
            if (classroom) { item.url = String(f.url); item.drive = true; }
            return item;
          });
          const tree = teacherFolders(items);
          root.folders = tree.folders;
          root.files = tree.files;   // newest first, as the API sends them
          teacherLockIds = null;     // which items are the teacher's, worked out again for the real folders
          (function assignLiveIds(node) {
            node._id = node._id || 'n' + (idCounter++);
            node.folders.forEach(assignLiveIds);
            node.files.forEach(f => { f._id = 'n' + (idCounter++); });
          })(root);
          history = [root]; pointer = 0; selectedId = null;
          rootNote = items.length ? 'No items here.' : (j.partial ? 'This class didn\'t answer just now. Reload to try again.' : 'No files in this class yet. Files your teacher posts, and files attached to assignments, show up here.');
        } catch {
          rootNote = 'Couldn\'t load this class\'s files. Reload the page to try again.';
        }
        undoStack.length = 0;   // the empty "loading" tree isn't something to undo back to
        renderUnitList();
        render();
        showLiveFile();
      }
      // Show in Materials from Files (2026-10-06): ?show=<kind>:<parent>:<fileId>.
      // Read now and dropped right away; used once the files have loaded.
      const pendingShow = new URLSearchParams(location.search).get('show');
      if (pendingShow) dropParam('show');
      function showLiveFile() {
        const want = pendingShow;
        if (!want) return;
        const [kind, parent, ...rest] = want.split(':');
        const id = rest.join(':');
        if (!kind || !parent || !id) return;
        revealFile(f => !!f.live && f.live.kind === kind && f.live.parent === parent && f.live.id === id);
      }
      load();
    })();

    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile) return;
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || 'M';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'course-materials.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Course Materials';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
