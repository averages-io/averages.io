<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Calendar</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from the other
     top-level pages (home.html/courses.html/contacts.html) so this reads
     as the same app. See architecture-decisions.md re: promoting this to
     an actual shared stylesheet once there's a build step. ----------
     --cal-grid-bg / --cal-cell-alt are new here: per Martin (2026-09-04,
     "make the calendar white for non-dark mode and black and accsent
     color for dark mode"), the calendar grid itself needs to be a real
     theme-aware surface rather than the flat black the wireframe showed
     — white in light mode, near-black in dark mode, with the app's
     existing fixed --accent color (unchanged by dark mode, same as
     everywhere else in the app) doing the highlighting in both. */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    --cal-grid-bg: #ffffff;
    --cal-cell-alt: #f4f4f6;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area. */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh;
    overflow: hidden;
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 1100px;
    align-self: stretch;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.6rem, 3.4vw, 2.1rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    margin: 2px 0 0 2px;
  }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- One card, mostly same as every other page — EXCEPT
     height. Every other page's card force-stretches to fill the
     viewport (flex: 1) because their content is naturally tall/variable.
     Calendar's grid rows are now capped (see .cal-month-grid /
     .cal-week-grid below), so forcing the card to full height left a
     large empty panel below the grid on Month/Week view. Fix
     (2026-09-08): let the card size to its own content instead
     (flex: 0 1 auto) — it still can't overflow the viewport, because
     .page above it keeps its own fixed, scrollable height, so a
     genuinely tall view (Year) just scrolls the page rather than
     stretching the card into blank space. ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
    flex: 0 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .card-inner {
    padding: 20px 20px 18px;
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Calendar layout: sidebar (search/filters/selected event)
     + main (toolbar + grid). Stacks to a single column on narrow
     viewports — see the media query near the bottom.

     Fix (2026-09-07): the grid used to be a small fixed-height block
     sitting at the top of a card that's always stretched to fill the
     viewport (same "one card, same as every other page" convention as
     everywhere else) — on Week view, or any Month with a light events
     week, that left a large dead grey rectangle below the grid with
     nothing in it, which read as the page "stretching" oddly rather
     than the calendar just being short. Now cal-layout/cal-main/calBody
     all flex to fill the card's real height, so the grid itself grows
     to fill the available space (see #calBody, .cal-grid-wrap,
     .cal-month-grid, .cal-week-grid below) instead of floating above a
     blank area. The sidebar stays top-aligned on purpose (its content
     — search/selected-event — has no reason to stretch). ---------- */
  .cal-layout { display: flex; gap: 18px; align-items: stretch; flex: 1; min-height: 0; }
  .cal-sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; align-self: flex-start; }
  .cal-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  #calBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .cal-search-wrap { position: relative; }
  .cal-search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--text-faint); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #calendarSearch {
    width: 100%;
    border: none;
    border-radius: 999px;
    background: var(--panel-inner);
    padding: 9px 30px 9px 34px;
    font: inherit;
    font-size: 0.82rem;
    color: var(--text-dark);
  }
  #calendarSearch::placeholder { color: var(--text-faint); }
  #calendarSearch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .cal-search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: none;
    background: var(--border); color: var(--text-dark);
    font-size: 0.7rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-search-clear.is-hidden { display: none; }

  .cal-filter-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 0 0 8px; }
  .cal-filter-group { }
  .cal-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .cal-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
    background: var(--panel-inner);
    border-radius: 999px;
    padding: 5px 10px 5px 8px;
    font: inherit;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--text-dark);
    cursor: pointer;
    transition: opacity 0.12s ease;
  }
  .cal-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cal-chip.inactive { opacity: 0.4; }
  .cal-chip:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .cal-view-switch { display: flex; flex-shrink: 0; background: var(--panel-inner); border-radius: 999px; padding: 3px; gap: 2px; }
  .cal-view-btn {
    border: none; background: none; border-radius: 999px;
    font: inherit; font-size: 0.76rem; font-weight: 800; color: var(--text-muted);
    padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  .cal-view-btn.active { background: var(--accent); color: #fff; }
  .cal-view-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Selected Event panel ---------- */
  .cal-selected-event { background: var(--panel-inner); border-radius: var(--window-radius-md); padding: 14px; }
  .cal-selected-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-selected-close {
    width: 22px; height: 22px; border-radius: 50%; border: none;
    background: var(--panel-bg); color: var(--text-muted);
    font-size: 0.7rem; line-height: 1; cursor: pointer;
  }
  .cal-selected-close:hover { color: var(--text-dark); }
  .cal-selected-close.is-hidden { display: none; }
  .cal-selected-empty { font-size: 0.78rem; color: var(--text-faint); font-style: italic; margin: 0; }
  .cal-selected-title { font-size: 0.94rem; font-weight: 800; font-style: italic; color: var(--text-dark); margin: 0 0 6px; letter-spacing: -0.005em; }
  .cal-selected-course { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin: 0 0 8px; }
  .cal-selected-course .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cal-selected-badge {
    display: inline-block; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; margin-bottom: 10px;
  }
  /* Teacher-created events carry a "who created it" tooltip on the badge
     (2026-09-08, per Martin). position:relative on the badge anchors the
     absolutely-positioned .cal-tooltip; cursor:help + tabindex="0" on the
     badge signal it's interactive and keep it reachable by keyboard, and
     the tooltip shows on :hover/:focus-visible so it works for mouse and
     keyboard alike. It floats above the badge (bottom: 100%) since the
     badge sits near the top of a fairly cramped sidebar panel. */
  .cal-selected-badge.has-tooltip { position: relative; cursor: help; }
  .cal-tooltip {
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-dark);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: none;
    letter-spacing: normal;
    white-space: nowrap;
    border-radius: var(--window-radius-sm);
    padding: 6px 10px;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.12s ease;
    pointer-events: none;
    z-index: 20;
  }
  .cal-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--text-dark);
  }
  .cal-selected-badge.has-tooltip:hover .cal-tooltip,
  .cal-selected-badge.has-tooltip:focus-visible .cal-tooltip {
    opacity: 1;
    visibility: visible;
  }
  .cal-selected-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
  .cal-selected-row:last-of-type { border-bottom: none; }
  .cal-selected-row .k { color: var(--text-faint); font-weight: 700; }
  .cal-selected-row .v { color: var(--text-dark); font-weight: 700; text-align: right; }
  .cal-selected-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.45; margin: 10px 0 0; }
  .cal-selected-actions { margin-top: 12px; }
  .cal-selected-view-btn {
    display: block; width: 100%; text-align: center;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 9px; font: inherit; font-weight: 800; font-size: 0.8rem; cursor: pointer; text-decoration: none;
  }
  .cal-selected-view-btn:hover { background: var(--accent-dark); }

  /* ---------- Main toolbar ---------- */
  /* Fixed in place (2026-09-08, per Martin: "make it so the week month
     year is fixed in one place") — .card-inner is the actual scrolling
     container (see below), and this toolbar used to just be a normal
     child of it, so it scrolled away with the grid on any view whose
     content runs taller than the visible card (Year view especially, and
     a tall Month). Sticking it to the top of that scroll container means
     the Week/Month/Year switch — and Prev/Next/Today/Filters next to it —
     stay in one place no matter how far you scroll the grid underneath.
     Needs its own background since .card-inner has none of its own (it
     shows .card's background through) — otherwise scrolled-past content
     would show through behind it. */
  .cal-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5;
    background: var(--panel-bg);
    flex-shrink: 0;
  }
  .cal-toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cal-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--panel-inner); color: var(--text-dark);
    font-size: 1rem; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav-btn:hover { background: var(--border); }
  .cal-header-label { font-size: 1.05rem; font-weight: 800; font-style: italic; color: var(--text-dark); margin: 0; min-width: 130px; text-align: center; letter-spacing: -0.005em; }
  .cal-today-btn {
    background: var(--panel-inner); color: var(--text-dark); border: none; border-radius: 999px;
    padding: 7px 14px; font: inherit; font-weight: 800; font-size: 0.76rem; cursor: pointer;
  }
  .cal-today-btn:hover { background: var(--border); }

  /* ---------- Filter dropdown — Source + Created By chips, moved here
     from the sidebar (2026-09-04, per Martin) and consolidated into one
     popover next to the Today button, same absolute-positioned-panel
     pattern as the profile menu. ---------- */
  .cal-filter-dropdown-wrap { position: relative; flex-shrink: 0; }
  .cal-filter-btn {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel-inner); color: var(--text-dark); border: none; border-radius: 999px;
    padding: 7px 14px; font: inherit; font-weight: 800; font-size: 0.76rem; cursor: pointer;
  }
  .cal-filter-btn:hover { background: var(--border); }
  .cal-filter-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .cal-filter-active-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .cal-filter-active-dot.is-hidden { display: none; }
  .cal-filter-panel {
    position: absolute; top: calc(100% + 10px); right: 0;
    width: 230px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 14px;
    display: flex; flex-direction: column; gap: 14px;
    z-index: 25;
  }
  .cal-filter-panel.is-hidden { display: none; }

  /* ---------- The grid surface itself — this is what Martin asked to be
     theme-aware: white in light mode, near-black with the app's fixed
     accent color for structure/highlights in dark mode. ---------- */
  .cal-grid-wrap {
    background: var(--cal-grid-bg);
    border: 1px solid var(--border);
    border-radius: var(--window-radius-md);
    overflow: hidden;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .cal-dow-cell { text-align: center; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); padding: 8px 2px; }

  /* flex:1 + min-height:0 so the grid fills whatever's left of
     .cal-grid-wrap instead of leaving a big blank margin below the last
     row. Capped at 120px per row (2026-09-08, was an unbounded 1fr —
     on a tall viewport that stretched every day cell absurdly tall;
     120px is enough to comfortably hold 3-4 event chips without
     ballooning). align-content:start means any space left over once
     rows hit that cap just sits as blank surface below the grid,
     inside the card, instead of stretching cells further. */
  .cal-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(84px, 120px); flex: 1; min-height: 0; overflow-y: auto; align-content: start; }
  .cal-day-cell {
    min-height: 84px;
    min-width: 0; /* grid items default to min-width:auto, which lets a
      long unbroken event title (e.g. "Colonial Timeline Presentations")
      force its whole column wider than the 1fr track and push the last
      column off the edge of the card — this is what actually lets the
      chip's own white-space:nowrap + text-overflow:ellipsis take over
      instead. */
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 5px 5px 4px;
    display: flex; flex-direction: column; gap: 3px;
    background: var(--cal-grid-bg);
  }
  .cal-month-grid .cal-day-cell:nth-child(7n) { border-right: none; }
  .cal-day-cell.outside { background: var(--cal-cell-alt); }
  .cal-day-cell.outside .cal-day-num { color: var(--text-faint); }
  .cal-day-num {
    align-self: flex-start;
    font-size: 0.76rem; font-weight: 800; color: var(--text-dark);
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-day-cell.is-today .cal-day-num { background: var(--accent); color: #fff; }
  /* Selected-event location highlight (2026-09-04, per Martin: "make it
     more apparent where it is"). The whole day/week cell gets an accent
     ring — not just the chip — so the selection still reads clearly even
     when the matching chip itself is folded into a "+N more" popover. */
  .cal-day-cell.has-selected { box-shadow: inset 0 0 0 2px var(--accent); position: relative; z-index: 1; }
  .cal-day-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-event-chip {
    display: block; width: 100%; min-width: 0; text-align: left; border: none;
    background: color-mix(in srgb, var(--chip-color, var(--accent)) 18%, transparent);
    border-left: 3px solid var(--chip-color, var(--accent));
    color: var(--text-dark);
    border-radius: 4px;
    padding: 2px 5px;
    font: inherit; font-size: 0.65rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .cal-event-chip.school { border-left-style: dashed; font-style: italic; }
  .cal-event-chip.selected {
    background: var(--chip-color, var(--accent));
    color: #fff;
    box-shadow: 0 0 0 2px var(--cal-grid-bg), 0 0 0 3.5px var(--chip-color, var(--accent));
  }
  .cal-day-more {
    background: none; border: none; font: inherit; font-size: 0.62rem; font-weight: 800;
    color: var(--text-faint); text-align: left; padding: 0 5px; cursor: pointer;
  }
  .cal-day-more:hover { color: var(--text-dark); }

  /* ---------- Week view ---------- */
  /* flex:1 lets this single-row grid grow to fill .cal-grid-wrap instead
     of stopping at min-height and leaving the rest of the card empty
     below it — but capped at 320px (2026-09-08; was unbounded, which on
     a tall viewport stretched the single week-row to 500px+). Explicit
     grid-template-rows (not grid-auto-rows — there's only ever one row
     here) plus align-content:start means growth stops at the cap and any
     further leftover height is blank surface below the row, not more
     row-stretching. */
  .cal-week-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: minmax(220px, 260px); flex: 1; min-height: 0; align-content: start; }
  .cal-week-cell {
    min-height: 220px;
    min-width: 0;
    border-right: 1px solid var(--border);
    padding: 6px 6px 8px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--cal-grid-bg);
  }
  .cal-week-grid .cal-week-cell:last-child { border-right: none; }
  .cal-week-cell .cal-day-events { overflow-y: auto; }
  .cal-week-cell.has-selected { box-shadow: inset 0 0 0 2px var(--accent); position: relative; z-index: 1; }

  /* ---------- Year view ---------- */
  .cal-year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px; }
  .cal-mini-month {
    background: var(--cal-cell-alt);
    border: 1px solid var(--border);

  /* ---------- Search results (flat list, replaces the grid while a

  /* ---------- Bottom nav — verbatim from every other page ---------- */
  .app-nav {

    background: none;
    border: none;

  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has
     to get ... we should add a more button on the far right side with a
     list of the other options"). Labels never truncate: when they would,
     the rightmost pages move into the More menu instead. ---------- */
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),

  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;

  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }

  /* Labels sit centered in the bar; the active page is underlined in the

  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }

    .cal-year-grid { grid-template-columns: 1fr; }

</style>

  <script>
    // ---- Links by id (2026-10-07, Martin) ----
    // A real class (Schoology/Classroom ids are digits) links as
    // assignment?id=<id> and course-home?id=<section id>; the sample classes
    // (word ids like "apchem") keep ?course=&title=. Pages read both.
    function avgIsId(v) { return /^\d{1,24}$/.test(String(v == null ? '' : v)); }
    function avgCourseQ(course) { return (avgIsId(course) ? 'id=' : 'course=') + encodeURIComponent(course == null ? '' : course); }
    function avgAssignHref(course, title, id, extra) {
      extra = extra || '';
      if (avgIsId(id) && avgIsId(course)) return `assignment.html?id=${id}${extra}`;
      return `assignment.html?course=${encodeURIComponent(course == null ? '' : course)}&title=${encodeURIComponent(title || '')}${avgIsId(id) ? `&id=${id}` : ''}${extra}`;
    }

    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }

        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }

        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));

          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';

      // teacher-created) gets an Open Assignment button, per Martin
      // (2026-09-04) — not just the 10 events pre-linked to a real
      // assignment.html record via assignmentTitle. assignment.html's own
      // ?course=&title= routing already has a graceful fallback for a
      // title/course pair it doesn't recognize (shows the real title with
      // generic content instead of erroring), so this is safe to link
      // for every Assignment-category event, not just the flagged ones.
      let actionHTML = '';
      if (AV_LIVE && event.assignmentId) {
        // Signed in: the exact assignment (2026-10-06).
        const linkTitle = event.assignmentTitle || event.title;
        actionHTML = `<div class="cal-selected-actions"><a class="cal-selected-view-btn" href="${avgAssignHref(event.source, linkTitle, event.assignmentId)}">Open Assignment</a></div>`;
      } else if (AV_LIVE) {
        // Not something to turn in (or not one we can open): its class.
        if (event.source !== 'school') actionHTML = `<div class="cal-selected-actions"><a class="cal-selected-view-btn" href="course-home.html?${avgCourseQ(event.source)}">View Course</a></div>`;
      } else if (event.type !== 'teacher') {
        const linkTitle = event.assignmentTitle || event.title;
        actionHTML = `<div class="cal-selected-actions"><a class="cal-selected-view-btn" href="assignment.html?course=${encodeURIComponent(event.source)}&title=${encodeURIComponent(linkTitle)}">Open Assignment</a></div>`;
      } else if (event.source !== 'school') {
        actionHTML = `<div class="cal-selected-actions"><a class="cal-selected-view-btn" href="course-home.html?${avgCourseQ(event.source)}">View Course</a></div>`;
      }
      body.innerHTML = `
        <p class="cal-selected-title">${escapeHtml(event.title)}</p>
        <p class="cal-selected-course"><span class="dot" style="background:${escapeHtml(src.color)}"></span>${escapeHtml(src.name)}</p>
        ${event.type === 'teacher' && event.createdBy
          ? `<span class="cal-selected-badge has-tooltip" tabindex="0">${TYPE_LABEL[event.type]}<span class="cal-tooltip" role="tooltip">Created by ${escapeHtml(event.createdBy)}</span></span>`
          : `<span class="cal-selected-badge">${TYPE_LABEL[event.type]}</span>`}
        <div class="cal-selected-row"><span class="k">Date</span><span class="v">${escapeHtml(dateLabel)}</span></div>
        <div class="cal-selected-row"><span class="k">Time</span><span class="v">${event.allDay ? 'All day' : escapeHtml(event.time || 'Due 11:59 PM')}</span></div>
        ${event.points ? `<div class="cal-selected-row"><span class="k">Points</span><span class="v">${escapeHtml(event.points)} pts</span></div>` : ''}
        ${event.desc ? `<p class="cal-selected-desc">${escapeHtml(event.desc)}</p>` : ''}
        ${actionHTML}
      `;
    }
    // renderCalendar() re-runs on every selection change so the grid
    // itself can show *where* the selected event is (2026-09-04, per
    // Martin) — not just the sidebar panel. Cheap at this data scale, and
    // consistent with how renderFilterChips()/renderCalendar() already
    // do a full re-render on every other state change in this file.
    function selectEvent(id) { selectedEventId = id; renderSelectedEvent(); closeDayModal(); renderCalendar(); }
    selectedCloseBtn.addEventListener('click', () => { selectedEventId = null; renderSelectedEvent(); renderCalendar(); });

    // ------------------------------------------------------------------
    // Day popover modal — lists every (filtered) event on one date.
    // ------------------------------------------------------------------
    const dayModal = document.getElementById('dayModal');
    function openDayModal(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      document.getElementById('dayModalTitle').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      const items = visibleEventsOn(dateStr);
      document.getElementById('dayModalList').innerHTML = items.length
        ? items.map(e => {
            const src = sourceById(e.source);
            return `<button class="cal-search-row${e.id === selectedEventId ? ' selected' : ''}" type="button" data-id="${escapeHtml(e.id)}">
              <span class="dot" style="background:${escapeHtml(src.color)}"></span>
              <span class="cal-search-row-text">
                <p class="cal-search-row-title">${escapeHtml(e.title)}</p>
                <p class="cal-search-row-meta">${escapeHtml(src.name)} · ${TYPE_LABEL[e.type]}</p>
              </span>
            </button>`;
          }).join('')
        : `<p class="cal-empty-note">No events match your filters on this day.</p>`;
      document.getElementById('dayModalList').querySelectorAll('.cal-search-row').forEach(row => {
        row.addEventListener('click', () => selectEvent(row.dataset.id));
      });
      dayModal.classList.add('show');
      document.getElementById('dayModalCloseBtn').focus();
    }
    function closeDayModal() { dayModal.classList.remove('show'); }
    document.getElementById('dayModalCloseBtn').addEventListener('click', closeDayModal);
    dayModal.addEventListener('click', e => { if (e.target === dayModal) closeDayModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && dayModal.classList.contains('show')) closeDayModal(); });

    // ------------------------------------------------------------------
    // Month view.
    // ------------------------------------------------------------------
    function buildMonthCells(year, month) {
      const firstOfMonth = new Date(year, month, 1);
      const startDow = firstOfMonth.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      const cells = [];
      for (let i = startDow - 1; i >= 0; i--) cells.push({ date: new Date(year, month - 1, daysInPrevMonth - i), outside: true });
      for (let d = 1; d <= daysInMonth; d++) cells.push({ date: new Date(year, month, d), outside: false });
      while (cells.length % 7 !== 0) {
        const last = cells[cells.length - 1].date;
        cells.push({ date: new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1), outside: true });
      }
      return cells;
    }

    function eventChipHTML(e) {
      const src = sourceById(e.source);
      const cls = ['cal-event-chip', e.source === 'school' ? 'school' : '', e.id === selectedEventId ? 'selected' : ''].filter(Boolean).join(' ');
      return `<button class="${cls}" style="--chip-color:${escapeHtml(src.color)}" type="button" data-id="${escapeHtml(e.id)}" title="${escapeHtml(e.title)}">${escapeHtml(e.title)}</button>`;
    }

    function renderMonthView() {
      const cells = buildMonthCells(focusDate.getFullYear(), focusDate.getMonth());
      const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const dowRow = `<div class="cal-dow-row">${DOW.map(d => `<div class="cal-dow-cell">${d}</div>`).join('')}</div>`;
      const cellsHTML = cells.map(cell => {
        const dateStr = ymd(cell.date);
        const items = visibleEventsOn(dateStr);
        const shown = items.slice(0, 3);
        const more = items.length - shown.length;
        const hasSelected = items.some(e => e.id === selectedEventId);
        return `
          <div class="cal-day-cell${cell.outside ? ' outside' : ''}${isSameDay(cell.date, TODAY) ? ' is-today' : ''}${hasSelected ? ' has-selected' : ''}" data-date="${dateStr}">
            <span class="cal-day-num">${cell.date.getDate()}</span>
            <div class="cal-day-events">
              ${shown.map(eventChipHTML).join('')}
              ${more > 0 ? `<button class="cal-day-more" type="button" data-date="${dateStr}">+${more} more</button>` : ''}
            </div>
          </div>`;
      }).join('');
      document.getElementById('calBody').innerHTML = `<div class="cal-grid-wrap">${dowRow}<div class="cal-month-grid">${cellsHTML}</div></div>`;
      // Header just names the month (e.g. "September") — the year has its
      // own dedicated view (below) rather than being repeated here, per
      // Martin's spec for the toolbar header (2026-09-04).
      document.getElementById('calHeaderLabel').textContent = focusDate.toLocaleDateString('en-US', { month: 'long' });
      wireGridClicks();
    }

    // ------------------------------------------------------------------
    // Week view.
    // ------------------------------------------------------------------
    function startOfWeek(d) { const n = new Date(d); n.setDate(n.getDate() - n.getDay()); return startOfDay(n); }

    function renderWeekView() {
      const weekStart = startOfWeek(focusDate);
      const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const dowRow = `<div class="cal-dow-row">${DOW.map((d, i) => {
        const day = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
        return `<div class="cal-dow-cell">${d} ${day.getDate()}</div>`;
      }).join('')}</div>`;
      const cellsHTML = Array.from({ length: 7 }, (_, i) => {
        const day = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
        const dateStr = ymd(day);
        const items = visibleEventsOn(dateStr);
        const hasSelected = items.some(e => e.id === selectedEventId);
        return `
          <div class="cal-week-cell${isSameDay(day, TODAY) ? ' is-today' : ''}${hasSelected ? ' has-selected' : ''}" data-date="${dateStr}">
            <span class="cal-day-num">${day.getDate()}</span>
            <div class="cal-day-events">
              ${items.length ? items.map(eventChipHTML).join('') : '<p class="cal-week-empty">None</p>'}
            </div>
          </div>`;
      }).join('');
      document.getElementById('calBody').innerHTML = `<div class="cal-grid-wrap">${dowRow}<div class="cal-week-grid">${cellsHTML}</div></div>`;
      // Header reads "Week of {the Monday of this week}" per Martin's spec
      // (2026-09-04) — the grid itself still starts on Sunday (unchanged),
      // this just always names the Monday two days in, regardless of
      // which day of the week is actually the anchor.
      const monday = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 1);
      const mondayLabel = monday.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
      document.getElementById('calHeaderLabel').textContent = `Week of ${mondayLabel}`;
      wireGridClicks();
    }

    // ------------------------------------------------------------------
    // Year view — 12 mini months; click a mini day (or the month label)
    // to jump into Month view for that month.
    // ------------------------------------------------------------------
    function renderYearView() {
      const year = focusDate.getFullYear();
      const months = Array.from({ length: 12 }, (_, m) => {
        const label = new Date(year, m, 1).toLocaleDateString('en-US', { month: 'long' });
        const cells = buildMonthCells(year, m);
        const dow = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        return `
          <div class="cal-mini-month" data-year="${year}" data-month="${m}">
            <p class="cal-mini-month-label">${label}</p>
            <div class="cal-mini-dow-row">${dow.map(d => `<div class="cal-mini-dow">${d}</div>`).join('')}</div>
            ${chunk(cells, 7).map(week => `<div class="cal-mini-week-row">${week.map(cell => {
              const dayItems = cell.outside ? [] : visibleEventsOn(ymd(cell.date));
              const hasEvent = dayItems.length > 0;
              const hasSelected = dayItems.some(e => e.id === selectedEventId);
              return `<div class="cal-mini-day${cell.outside ? ' outside' : ''}${isSameDay(cell.date, TODAY) ? ' is-today' : ''}${hasEvent ? ' has-event' : ''}${hasSelected ? ' has-selected' : ''}">${cell.date.getDate()}</div>`;
            }).join('')}</div>`).join('')}
          </div>`;
      }).join('');
      document.getElementById('calBody').innerHTML = `<div class="cal-year-grid">${months}</div>`;
      document.getElementById('calHeaderLabel').textContent = String(year);
      document.querySelectorAll('.cal-mini-month').forEach(m => {
        m.addEventListener('click', () => {
          focusDate = new Date(Number(m.dataset.year), Number(m.dataset.month), 1);
          currentView = 'month';
          setActiveViewButton('month');
          renderCalendar();
        });
      });
    }
    function chunk(arr, size) { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; }

    // ------------------------------------------------------------------
    // Search results view — a flat, date-sorted list across ALL events
    // (not just the visible range), replacing the grid while a query is
    // active.
    // ------------------------------------------------------------------
    function renderSearchResults() {
      const items = EVENTS.filter(e => passesFilters(e) && matchesSearch(e)).sort((a, b) => a.date.localeCompare(b.date));
      document.getElementById('calHeaderLabel').textContent = `${items.length} result${items.length === 1 ? '' : 's'}`;
      if (!items.length) {
        document.getElementById('calBody').innerHTML = `<div class="cal-grid-wrap"><p class="cal-empty-note">No events match "${escapeHtml(searchQuery)}".</p></div>`;
        return;
      }
      const rows = items.map(e => {
        const src = sourceById(e.source);
        const d = new Date(e.date + 'T00:00:00');
        const dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        return `<button class="cal-search-row${e.id === selectedEventId ? ' selected' : ''}" type="button" data-id="${escapeHtml(e.id)}">
          <span class="dot" style="background:${escapeHtml(src.color)}"></span>
          <span class="cal-search-row-text">
            <p class="cal-search-row-title">${escapeHtml(e.title)}</p>
            <p class="cal-search-row-meta">${escapeHtml(dateLabel)} · ${escapeHtml(src.name)} · ${TYPE_LABEL[e.type]}</p>
          </span>
        </button>`;
      }).join('');
      document.getElementById('calBody').innerHTML = `<div class="cal-grid-wrap"><div class="cal-search-results">${rows}</div></div>`;
      document.querySelectorAll('.cal-search-row').forEach(row => {
        row.addEventListener('click', () => selectEvent(row.dataset.id));
      });
    }

    // ------------------------------------------------------------------
    // Dispatcher + shared click wiring for the month/week grids.
    // ------------------------------------------------------------------
    function wireGridClicks() {
      document.querySelectorAll('.cal-event-chip').forEach(chip => {
        chip.addEventListener('click', e => { e.stopPropagation(); selectEvent(chip.dataset.id); });
      });
      document.querySelectorAll('.cal-day-more').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); openDayModal(btn.dataset.date); });
      });
    }

    function renderCalendar() {
      if (searchQuery) { renderSearchResults(); return; }
      if (currentView === 'month') renderMonthView();
      else if (currentView === 'week') renderWeekView();
      else renderYearView();
    }

    // ------------------------------------------------------------------
    // Toolbar wiring: view switch, prev/next, today, search.
    // ------------------------------------------------------------------
    function setActiveViewButton(view) {
      document.querySelectorAll('.cal-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    }
    document.getElementById('viewSwitch').addEventListener('click', e => {
      const btn = e.target.closest('.cal-view-btn');
      if (!btn) return;
      currentView = btn.dataset.view;
      setActiveViewButton(currentView);
      renderCalendar();
    });

    document.getElementById('calPrevBtn').addEventListener('click', () => { step(-1); });
    document.getElementById('calNextBtn').addEventListener('click', () => { step(1); });
    function step(dir) {
      if (currentView === 'month') focusDate = new Date(focusDate.getFullYear(), focusDate.getMonth() + dir, 1);
      else if (currentView === 'week') focusDate = new Date(focusDate.getFullYear(), focusDate.getMonth(), focusDate.getDate() + dir * 7);
      else focusDate = new Date(focusDate.getFullYear() + dir, focusDate.getMonth(), 1);
      renderCalendar();
    }
    document.getElementById('calTodayBtn').addEventListener('click', () => { focusDate = new Date(TODAY); renderCalendar(); });

    // ------------------------------------------------------------------
    // Filter dropdown — Source + Created By chips, moved off the sidebar
    // and into one popover next to Today (2026-09-04, per Martin). Same
    // open/close-on-outside-click/Escape pattern as the profile menu.
    // ------------------------------------------------------------------
    const filterBtn = document.getElementById('filterBtn');
    const filterPanel = document.getElementById('filterPanel');
    function openFilterPanel() { filterPanel.classList.remove('is-hidden'); filterBtn.setAttribute('aria-expanded', 'true'); }
    function closeFilterPanel() { filterPanel.classList.add('is-hidden'); filterBtn.setAttribute('aria-expanded', 'false'); }
    filterBtn.addEventListener('click', () => { if (filterPanel.classList.contains('is-hidden')) openFilterPanel(); else closeFilterPanel(); });
    document.addEventListener('click', e => {
      if (filterPanel.classList.contains('is-hidden')) return;
      // Toggling a chip inside the panel re-renders the chip list
      // (renderFilterChips replaces sourceChips/typeChips' innerHTML),
      // which detaches the clicked button from the DOM before this
      // bubbled listener runs — e.target.closest(...) would then find
      // nothing and wrongly read the click as "outside." composedPath()
      // is captured at dispatch time, before that mutation, so it still
      // correctly reflects the click's real ancestry.
      const wrap = document.querySelector('.cal-filter-dropdown-wrap');
      if (!e.composedPath().includes(wrap)) closeFilterPanel();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !filterPanel.classList.contains('is-hidden')) { closeFilterPanel(); filterBtn.focus(); } });

    const searchInput = document.getElementById('calendarSearch');
    const searchClearBtn = document.getElementById('calendarSearchClear');
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.trim().toLowerCase();
      searchClearBtn.classList.toggle('is-hidden', !searchQuery);
      renderCalendar();
    });
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClearBtn.classList.add('is-hidden');
      renderCalendar();
      searchInput.focus();
    });

    // ------------------------------------------------------------------
    // Dark mode — same token-swap convention as settings.html/
    // onboarding.html, extended with --cal-grid-bg/--cal-cell-alt so the
    // calendar surface itself flips from white to near-black (per
    // Martin, 2026-09-04) while --accent stays fixed and does the
    // highlighting in both modes. No manual page-local toggle (removed
    // 2026-09-04, per Martin) — this page only ever follows a setting
    // decided elsewhere.
    //
    // Fixed 2026-09-07: "elsewhere" used to mean the OS's own
    // prefers-color-scheme, checked fresh on every load with no memory
    // of anything — so Calendar could be dark while every other page
    // stayed light (or the reverse), independent of whatever Settings'
    // real Dark Mode toggle was set to. Now it reads the same
    // schoolagy_dark_mode localStorage flag Settings writes, falling
    // back to the OS only when nothing's been explicitly chosen yet —
    // so this page agrees with the rest of the app instead of running
    // its own separate check.
    // ------------------------------------------------------------------
    const AVERAGES_DARK_MODE_KEY = 'schoolagy_dark_mode';
    function averagesSavedDarkPref() {
      try {
        const v = localStorage.getItem(AVERAGES_DARK_MODE_KEY);
        if (v === 'dark') return true;
        if (v === 'light') return false;
      } catch {}
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function applyDarkMode(isDark) {
      const root = document.documentElement.style;
      if (isDark) {
        root.setProperty('--panel-bg', '#1c1d26');
        root.setProperty('--panel-inner', '#15161e');
        root.setProperty('--text-dark', '#f0f0f5');
        root.setProperty('--text-muted', '#a3a5bd');
        root.setProperty('--text-faint', '#6f7086');
        root.setProperty('--border', '#33344a');
        root.setProperty('--toggle-track-bg', '#3a3c4d');
        root.setProperty('--cal-grid-bg', '#0b0b10');
        root.setProperty('--cal-cell-alt', '#131319');
      } else {
        root.setProperty('--panel-bg', '#eaeaec');
        root.setProperty('--panel-inner', '#dcdce0');
        root.setProperty('--text-dark', '#14151f');
        root.setProperty('--text-muted', '#4b4d63');
        root.setProperty('--text-faint', '#83849a');
        root.setProperty('--border', '#cfcfd6');
        root.setProperty('--toggle-track-bg', '#c7c7cd');
        root.setProperty('--cal-grid-bg', '#ffffff');
        root.setProperty('--cal-cell-alt', '#f4f4f6');
      }
      document.body.classList.toggle('dark-mode', isDark);
    }
    applyDarkMode(averagesSavedDarkPref());
    // A Settings-toggle change (or another tab) should reflect here live,
    // since this page has no toggle of its own to re-trigger a load.
    window.addEventListener('storage', e => {
      if (e.key === AVERAGES_DARK_MODE_KEY) applyDarkMode(averagesSavedDarkPref());
    });

    // ------------------------------------------------------------------
    // Nav — Home/Courses/Grades/Assignments/Messages/Contacts/Settings
    // are real links between real pages; Calendar is this page itself.
    // ------------------------------------------------------------------
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile) return;
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || 'M';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });

    // ------------------------------------------------------------------
    // Initial render.
    // ------------------------------------------------------------------
    renderFilterChips();
    renderSelectedEvent();
    renderCalendar();
    // Opened from a course hub (2026-10-04): ?date=YYYY-MM-DD jumps to that
    // date, and ?event=&course= selects the matching event. Its course and
    // type are switched back on in the filters so it can't be hidden.
    (function () {
      const q = new URLSearchParams(location.search);
      const date = q.get('date');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return;
      const [y, m, d] = date.split('-').map(Number);
      const when = new Date(y, m - 1, d);
      if (isNaN(when)) return;
      focusDate = when;
      const title = q.get('event'), src = q.get('course'), id = q.get('id');
      // The exact event when the hub sent its id (2026-10-06), else by title.
      const ev = (id && EVENTS.find(e => e.id === id && e.date === date)) || (title && EVENTS.find(e => e.date === date && e.title === title && (!src || e.source === src)));
      if (ev) {
        activeSources.add(ev.source);
        activeTypes.add(categoryOf(ev.type));
        renderFilterChips();
        selectedEventId = ev.id;
        renderSelectedEvent();
      }
      renderCalendar();
      if (ev && window.matchMedia('(max-width: 900px)').matches) {
        const panel = document.getElementById('selectedEventBody');
        if (panel) panel.scrollIntoView({ block: 'nearest' });
      }
    })();
  </script>
  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'calendar.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Calendar';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
</html>
