<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Files</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from the other
     top-level pages (home.html/courses.html/assignments.html) so this
     reads as the same app. See architecture-decisions.md re: promoting
     this to an actual shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- .card grows to
      its natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.6rem, 3.4vw, 2.1rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    margin: 2px 0 0 2px;
  }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- One card, same as every other page ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
  }
  .card-inner {
    padding: 22px 24px 20px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .section-head h2 {
    font-size: 1rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0;
  }
  .contacts-total {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-faint);
  }

  /* ---------- Search bar — same pill input treatment used across the
     app (messages.html's search, the color-swatch popups, etc.). ---------- */
  .contacts-search-wrap { position: relative; margin: 14px 0 4px; }
  .contacts-search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--text-faint); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #contactsSearch {
    width: 100%;
    border: none;
    border-radius: 999px;
    background: var(--panel-inner);
    padding: 9px 14px 9px 34px;
    font: inherit;
    font-size: 0.82rem;
    color: var(--text-dark);
  }
  #contactsSearch::placeholder { color: var(--text-faint); }
  #contactsSearch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Contact row — flat, alphabetical, no role/category
     filters (2026-09-02, per Martin: real faculty records don't
     consistently have a title/role filled in, so filtering or grouping
     by it isn't reliable — a plain searchable list, same idea as
     PowerSchool's own Faculty directory, works for everyone whether or
     not their role happens to be on file). ---------- */
  .contact-row { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: var(--window-radius-sm); }
  .contact-row:last-child { border-bottom: none; }
  .contact-row:hover { background: var(--panel-inner); }
  .contact-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }
  .contact-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    color: #fff;
    font-weight: 800;
    font-size: 0.82rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .contact-text { flex: 1; min-width: 0; }
  .contact-name { font-weight: 800; font-style: italic; font-size: 0.86rem; color: var(--text-dark); margin: 0; letter-spacing: -0.005em; }
  .contact-role { font-weight: 500; font-size: 0.78rem; color: var(--text-muted); margin: 1px 0 0; }
  .contact-meta { font-size: 0.68rem; color: var(--text-faint); margin: 2px 0 0; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Row-level Email quick-action (2026-09-02, per Martin) — a mailto:
     link, so it works without opening the contact card at all; clicking
     it stops the row's own click (which opens the card) from firing. */
  .contact-email-btn {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--panel-bg);
    color: var(--accent);
    border: none;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
  }
  .contact-email-btn:hover { background: var(--accent); color: #fff; }
  .contact-email-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .contact-email-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .contacts-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 10px 0; }

  /* ---------- Contact detail modal — same .modal-overlay/.modal-box
     component as course-home.html's course-info pop-out: dark full-page
     backdrop, click on the backdrop (not the box) closes it, Escape
     closes it. Standing popup convention for the whole app. ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 60;
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease;
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    max-width: 380px; width: 100%;
    padding: 22px 24px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    transform: translateY(8px);
    transition: transform 0.15s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-close {
    float: right;
    background: var(--panel-inner);
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text-dark); }
  .contact-modal-head { display: flex; align-items: center; gap: 12px; clear: both; padding-top: 4px; }
  .contact-modal-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    color: #fff;
    font-weight: 800;
    font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .modal-box h3 { margin: 0; font-size: 1.1rem; font-weight: 900; font-style: italic; color: var(--text-dark); }
  .modal-code { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin: 2px 0 0; }
  .modal-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .modal-row:last-of-type { border-bottom: none; }
  .modal-row .k { color: var(--text-faint); font-weight: 700; }
  .modal-row .v { color: var(--text-dark); font-weight: 700; text-align: right; }
  .modal-rows { margin-top: 14px; }
  /* Message + Email actions — always both present now (2026-09-02, per
     Martin: every contact's card should offer a working Send Message
     button alongside their email, not just current teachers). */
  .contact-modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .contact-modal-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px;
    font: inherit;
    font-weight: 800;
    font-size: 0.82rem;
    cursor: pointer;
    text-decoration: none;
  }
  .contact-modal-btn:hover { background: var(--accent-dark); }
  .contact-modal-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .contact-modal-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .contact-modal-btn.secondary { background: var(--panel-inner); color: var(--text-dark); }
  .contact-modal-btn.secondary:hover { background: var(--border); }

  /* ---------- Bottom nav — verbatim from every other page ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has
     to get ... we should add a more button on the far right side with a
     list of the other options"). Labels never truncate: when they would,
     the rightmost pages move into the More menu instead. ---------- */
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;
    margin-left: 4px;
    padding: 12px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-more .label { display: flex; align-items: center; height: 1.2em; font-size: 0.72rem; color: var(--text-faint); }
  .nav-more .label svg { display: block; fill: currentColor; }
  /* thin divider between the pages and the dots */
  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }
  .nav-more.has-active .dot { background: var(--accent); }
  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    pointer-events: auto;
  }
  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-faint);
    text-align: left;
    padding: 12px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  /* Labels sit centered in the bar; the active page is underlined in the
     accent color instead of marked with a dot (2026-10-01, per Martin). */
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {
    .nav-more { padding: 10px 12px 8px; }
    .nav-more::before { top: 10px; bottom: 10px; }
    .app-nav-inner .nav-link, .app-nav-inner .nav-more { padding-top: 8px; padding-bottom: 8px; }
    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
  /* ---------- Files (2026-10-04): every course's files, plus Google Drive and Canva ---------- */
  .fx-card-outer { padding: 4px; }
  .fx { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 0; }
  .fx-side { padding: 18px 14px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fx-search { display: flex; align-items: center; gap: 8px; background: var(--panel-inner); border-radius: 999px; padding: 0 14px; color: var(--text-faint); margin-bottom: 12px; }
  .fx-search svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; flex: none; }
  .fx-search input { flex: 1; min-width: 0; border: none; background: none; font: inherit; font-size: 0.84rem; font-weight: 600; color: var(--text-dark); padding: 10px 0; outline: none; }
  .fx-search:focus-within { box-shadow: 0 0 0 2px var(--accent-ring); }
  .fx-nav { display: flex; flex-direction: column; gap: 2px; }
  .fx-label { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin: 14px 10px 6px; }
  .fx-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: none; border-radius: 12px; background: none; font: inherit; font-size: 0.86rem; font-weight: 700; color: var(--text-dark); text-align: left; cursor: pointer; }
  .fx-item:hover { background: var(--panel-inner); }
  .fx-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .fx-item .n { margin-left: auto; font-size: 0.74rem; color: var(--text-faint); font-weight: 800; }
  .fx-item.on { background: var(--accent); color: #fff; }
  .fx-item.on .n { color: rgba(255,255,255,0.85); }
  .fx-item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .fx-main { padding: 22px 26px 26px; min-width: 0; }
  .fx-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fx-head h2 { margin: 0; font-size: 1.3rem; font-weight: 900; color: var(--text-dark); }
  .fx-meta { font-size: 0.78rem; font-weight: 700; color: var(--text-faint); }
  .fx-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .fx-seg { display: flex; background: var(--panel-inner); border-radius: 999px; padding: 3px; }
  .fx-seg button { border: none; background: none; font: inherit; padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; color: var(--text-muted); cursor: pointer; }
  .fx-seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .fx-seg button:focus-visible, .fx-add:focus-visible, .fx-chip:focus-visible, .fx-more:focus-visible, .fx-row:focus-visible, .fx-tile:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .fx-add { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--panel-bg); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 0.8rem; font-weight: 800; color: var(--text-dark); cursor: pointer; white-space: nowrap; }
  .fx-add:hover { background: var(--panel-inner); }
  .fx-add svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .fx-chips { display: none; }

  .fx-menu-note { padding: 4px 10px 10px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }

  .lf-flash-x:hover { background: var(--border); color: var(--text-dark); }

  .lf-crumbs button:hover { background: var(--panel-inner); color: var(--text-dark); }
  .lf-crumbs button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .lf-crumbs .sep { color: var(--text-faint); }

  .lf-folder-badge svg, .lf-folder-thumb svg { width: 18px; height: 18px; fill: currentColor; }
  .lf-folder-thumb { background: #ede8fa; color: #7d55dc; }
  .lf-folder-thumb svg { width: 46px; height: 46px; }
  .lf-reauth { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding: 12px 12px 12px 16px; border-radius: 14px; background: var(--panel-inner); font-size: 0.84rem; font-weight: 700; color: var(--text-muted); }

    .fx-nav { display: none; }
    .fx-search { margin-bottom: 0; }

    .fx-chip[aria-pressed="true"] { background: var(--accent); color: #fff; }

    .fx-row .fx-src, .fx-row .fx-date, .fx-row.head { display: none; }
    .fx-name small { display: block; }
  }

  <script>
    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>


  <script>
    // ------------------------------------------------------------------
    // Shared appearance (accent + background) — 2026-09-08, per Martin:
    // "wallpapers + accent colors don't save across pages." Settings'
    // Appearance section (and onboarding's Theme step) are the only
    // writers of schoolagy_appearance; every other real app page,
    // including this one, applies whatever's saved there, read-only, on
    // its own load — same shared-localStorage-record pattern already
    // used for schoolagy_dark_mode/schoolagy_profile.
    // ------------------------------------------------------------------
    (function () {
      function darken(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }
      function applyAppearance() {
        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));
        }
        if (saved.background === 'white') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#0c0c0e';
        } else if (saved.background) {
          document.body.style.backgroundImage = `url("${saved.background}")`;
          document.body.style.backgroundColor = '';
        }
      }
      applyAppearance();
      window.addEventListener('storage', e => {
        if (e.key === 'schoolagy_appearance') applyAppearance();
      });
    })();

    const BADGE = { pdf: ['PDF', '#c1443a'], docx: ['DOCX', '#3b6fd1'], pptx: ['PPTX', '#d1852f'], doc: ['DOC', '#3b6fd1'], sheet: ['SHEET', '#2f7d54'], slides: ['SLIDES', '#d1852f'], xlsx: ['XLSX', '#2f7d54'] };

    // Assignments a file can be attached to (sample: assignment.html's

    const ATTACH_TARGETS = [
      { title: 'Lab Report #4', course: 'apchem', when: 'Late' },

      { title: 'Vocab Worksheet', course: 'spanish3', when: 'Due Tue, Aug 25' },
      { title: 'Problem Set 7', course: 'algebra2', when: 'Due Wed, Aug 26' },
      { title: 'Periodic Trends Worksheet', course: 'apchem', when: 'Returned' },
    ];
    const CHEV_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    const MORE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const courseOf = id => FILE_COURSES.find(c => c.id === id);
    function ymdDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
    function daysAgo(f) { return Math.round((FILES_TODAY - ymdDate(f.date)) / 86400000); }
    function whenLabel(f) {
      const n = daysAgo(f);
      if (n <= 0) return 'Today';

      // ---------- Course files (2026-10-05) ----------

      const CF_BADGE = { pdf: ['PDF', '#c1443a'], doc: ['DOC', '#3b6fd1'], docx: ['DOCX', '#3b6fd1'], ppt: ['PPT', '#d1852f'], pptx: ['PPTX', '#d1852f'], xls: ['XLS', '#2f7d54'], xlsx: ['XLSX', '#2f7d54'], csv: ['CSV', '#2f7d54'], png: ['PNG', '#7a5ba6'], jpg: ['JPG', '#7a5ba6'], jpeg: ['JPG', '#7a5ba6'], gif: ['GIF', '#7a5ba6'], txt: ['TXT', '#83849a'], zip: ['ZIP', '#83849a'] };

      // ---------- Canva folders (2026-10-06) ----------
      // path: where the student is, from the top of their Canva Projects.
      const FD = { path: [{ id: 'root', name: 'Projects' }], items: [], next: null, state: 'idle', form: null, formBusy: false };
      const FOLDER_ERR = {
        canva_item_in_multiple_folders: 'That design is in more than one folder, so Canva only lets you move it in Canva itself.',
        canva_folder_full: 'That folder is full in Canva.',
        canva_folder_gone: 'That folder isn’t in your Canva anymore.',
        canva_folder_not_allowed: 'Canva doesn’t let you change that one.',
        canva_rate_limited: 'Canva is busy. Try again in a minute.',
        canva_reconnect_needed: 'Reconnect Canva in Settings to use your folders.',
      };
      const folderErr = code => FOLDER_ERR[code] || 'Something went wrong in Canva. Try again in a moment.';
      const hereId = () => FD.path[FD.path.length - 1].id;
      async function loadFolder(more) {
        if (!more) { FD.state = 'loading'; FD.items = []; FD.next = null; render(); }
        const id = hereId();
        try {
          const q = more && FD.next ? '?continuation=' + encodeURIComponent(FD.next) : '';
          const res = await fetch(`${api}/canva/folders/${encodeURIComponent(id)}/items${q}`, { credentials: 'include' });
          if (res.status === 401) { window.location.href = '/'; return; }
          const j = await res.json().catch(() => ({}));
          if (id !== hereId()) return;   // moved on while it loaded
          if (j.connected === false) { CV.state = 'connect'; FD.state = 'idle'; render(); return; }
          if (j.error === 'canva_reconnect_needed') { CV.folders = 'reconnect'; FD.state = 'idle'; render(); return; }
          if (j.error === 'canva_folder_gone' && FD.path.length > 1) { FD.path.pop(); flash(folderErr(j.error), true); loadFolder(false); return; }
          if (!res.ok) throw new Error(j.error || 'status');
          const got = (Array.isArray(j.items) ? j.items : []).filter(x => x && (x.type === 'folder' || x.type === 'design') && /^[A-Za-z0-9_-]{1,50}$/.test(String(x.id)));
          FD.items = more ? FD.items.concat(got) : got;
          FD.next = typeof j.continuation === 'string' ? j.continuation : null;

      function goFolder(index, folder) {

      async function folderPost(path, body) {

      }
      async function submitFolderForm(name) {

      }

            list.forEach(e => shownByKey.set(e.key, e));
          }
          if ((LV.filter === 'course' || LV.filter.startsWith('c:') || LV.filter === 'all') && CF.partial) body += '<p class="fx-note">Some classes didn’t answer, so a few course files may be missing. Use Refresh under Course Files to try again.</p>';
          if (!INCOGNITO && (LV.filter === 'all' || LV.filter === 'recent' || LV.filter === 'gdrive' || LV.filter === 'onedrive')) body += '<p class="fx-note">Google Drive and OneDrive show the files you save, edit or add with Averages.io, not your whole drive.</p>';
          if (INCOGNITO && (LV.filter === 'all' || LV.filter === 'recent')) body += '<p class="fx-note">Google Drive, OneDrive and Canva are off in Incognito mode: it stores nothing about you on our servers.</p>';
        }
        const focusId = document.activeElement && document.activeElement.id === 'lfFolderName' ? 'lfFolderName' : null;
        main.innerHTML = `
          <div class="fx-head">
            <h2>${esc(titleLive())}</h2>${count ? `<span class="fx-meta">${esc(count)}</span>` : ''}
            <div class="fx-tools">${toolsLive()}</div>
          </div>
          <div class="fx-chips" role="group" aria-label="Show files from">${chipsLive()}</div>
          ${body}`;
        const total = all.length;
        const bytes = all.reduce((n, e) => n + (Number(e.size) || 0), 0);
        document.getElementById('filesSub').textContent = `${total} file${total === 1 ? '' : 's'} · ${sizeLabel(bytes)}`;
        const input = document.getElementById('lfFolderName');
        if (input && (FD.form && FD.form.focus || focusId)) {
          input.focus();
          if (FD.form && FD.form.focus) { input.select(); FD.form.focus = false; }
        }
      }

      // ---------- Menus ----------
      function cfItems(f) {
        const items = [];
        if (f.kind === 'assignment') items.push({ label: 'Open assignment', sub: f.parentTitle, run: () => { window.location.href = `assignment.html?course=${encodeURIComponent(f.course)}&id=${encodeURIComponent(f.parent)}&title=${encodeURIComponent(f.parentTitle)}`; } });
        // Show in Materials (2026-10-06): the class's Materials, open at the teacher's folder holding it.
        const show = { label: 'Show in Materials', run: () => { window.location.href = `course-materials.html?course=${encodeURIComponent(f.course)}&show=${encodeURIComponent(`${f.kind}:${f.parent}:${f.id}`)}`; } };
        // Classroom files are already in Google Drive: they open there.
        if (f.url) {
          items.push({ label: 'Open in Google Drive', run: () => { if (DRIVE_URL_OK(f.url)) window.open(f.url, '_blank', 'noopener,noreferrer'); } });
          items.push(show);
          return items;
        }
        items.push(show);
        if (!isClassroom()) items.push({ label: 'Attach to an assignment', next: true, run: () => openAttach({ src: 'course', id: f.id, name: f.name, kind: f.kind, parent: f.parent, course: f.course }, f.course) });
        items.push({ label: 'Download', run: () => { window.location.href = cfDownloadUrl(f); } });
        if (cfg && cfg.google) items.push({ label: 'Save to Google Drive', run: () => cfSave('gdrive', f) });
        if (cfg && cfg.microsoft) items.push({ label: 'Save to OneDrive', run: () => cfSave('onedrive', f) });
        return items;
      }
      function itemsFor(e, anchor) {
        if (e.src === 'course') return cfItems(e.raw);
        if (e.src === 'gdrive' || e.src === 'onedrive') {
          const f = e.raw;
          const list = [{ label: `Open in ${CLOUD[e.src].name}`, run: () => { if (C() && C().linkOk(f.url)) window.open(f.url, '_blank', 'noopener,noreferrer'); } }];
          if (!isClassroom()) list.push({ label: 'Attach to an assignment', next: true, run: () => openAttach({ src: e.src, id: f.id, name: f.name }, null) });
          return list;
        }
        // Canva: a folder, or a design (from the list or from a folder).
        const id = String(e.raw.id);
        if (e.folder) return [
          { label: 'Open folder', run: () => goFolder(0, { id, name: e.name }) },
          { label: 'Rename', run: () => { FD.form = { mode: 'rename', id, value: e.name, focus: true }; render(); } },
        ];
        const list = [{ label: 'Open in Canva', run: () => openDesign(id, anchor && anchor.closest('[data-lv]')) }];
        if (!isClassroom()) list.push({ label: 'Attach to an assignment', next: true, run: () => openAttach({ src: 'canva', id, name: e.name }, null) });
        if (LV.filter === 'canva' && foldersOn()) list.push({ label: 'Move to folder', next: true, run: () => openMoveMenu({ id, name: e.name }) });
        return list;
      }
      function activate(e, el, at) {
        if (e.src === 'course') { openFxMenu(el, e.name, itemsFor(e, el), at); return; }
        if (e.src === 'gdrive' || e.src === 'onedrive') { if (C() && C().linkOk(e.raw.url)) window.open(e.raw.url, '_blank', 'noopener,noreferrer'); return; }
        if (e.folder) { goFolder(0, { id: String(e.raw.id), name: e.name }); return; }
        openDesign(String(e.raw.id), el);
      }
      function openAdd(anchor) {
        const list = [];
        ['gdrive', 'onedrive'].forEach(app => {
          const c = CLOUD[app];
          if (c.state === 'connect') list.push({ label: `Connect ${c.name}`, run: () => askCloud(app, 'connect') });
          else if ((c.state === 'ready' || c.state === 'click') && canPick(app)) list.push({ label: `From ${c.name}`, run: () => askCloud(app, 'pick') });
          else list.push({ label: `From ${c.name}`, soon: true });
        });
        if (CV.state === 'connect') list.push({ label: 'Connect Canva', run: () => { window.location.href = `${api}/canva/connect?return_to=${encodeURIComponent('/files')}`; } });
        list.push({ label: 'Connected apps settings', run: () => { window.location.href = 'settings.html?section=integrations'; } });
        openFxMenu(anchor, 'Add files', list);
      }

      // ---------- Events ----------
      document.getElementById('fxSearch').addEventListener('input', ev => { LV.query = ev.target.value.trim().toLowerCase(); LV.shown = 60; render(); });
      fxRoot.addEventListener('submit', ev => {
        const form = ev.target.closest('[data-folder-form]');
        if (!form) return;
        ev.preventDefault();
        submitFolderForm(form.querySelector('input').value);
      });
      fxRoot.addEventListener('input', ev => { if (ev.target.id === 'lfFolderName' && FD.form) FD.form.value = ev.target.value; });
      fxRoot.addEventListener('click', ev => {
        const t = ev.target;
        const filt = t.closest('[data-filter]');
        if (filt) {
          LV.filter = filt.dataset.filter; LV.shown = 60;
          if (LV.filter !== 'canva') FD.form = null;
          render();
          return;
        }
        const view = t.closest('[data-view]');
        if (view) { fxView = view.dataset.view; try { localStorage.setItem('schoolagy_files_view', fxView); } catch {} render(); return; }
        if (t.closest('[data-flash-close]')) { flashState = null; render(); return; }
        // Google Drive / OneDrive: each opens a window, so nothing is awaited before it.
        const conn = t.closest('[data-cloud-connect]');
        if (conn && !conn.disabled) { askCloud(conn.dataset.cloudConnect, 'connect'); return; }
        const show = t.closest('[data-cloud-show]');
        if (show && !show.disabled) { askCloud(show.dataset.cloudShow, 'show'); return; }
        const pick = t.closest('[data-pick-drive]');
        if (pick && !pick.disabled) { askCloud('gdrive', 'pick'); return; }
        const pickOne = t.closest('[data-pick-onedrive]');
        if (pickOne && !pickOne.disabled) { askCloud('onedrive', 'pick'); return; }
        const retry = t.closest('[data-cloud-retry]');
        if (retry) { if (cfg) startCloud(retry.dataset.cloudRetry); else loadCloud(); return; }
        const add = t.closest('[data-lv-add]');
        if (add) { openAdd(add); return; }
        if (t.closest('[data-cf-retry]') || t.closest('[data-cf-refresh]')) { loadCourse(true); return; }
        if (t.closest('[data-lv-showmore]')) { LV.shown += 60; render(); return; }
        if (t.closest('[data-connect-canva]')) { window.location.href = `${api}/canva/connect?return_to=${encodeURIComponent('/files')}`; return; }
        if (t.closest('[data-retry-designs]')) { loadCanva(false); return; }
        if (t.closest('[data-more-designs]')) { loadCanva(true); return; }
        // Canva folders
        const crumb = t.closest('[data-crumb]');
        if (crumb) { goFolder(+crumb.dataset.crumb, null); return; }
        if (t.closest('[data-folder-new]')) { if (!FD.formBusy) { FD.form = { mode: 'new', value: '', focus: true }; render(); } return; }
        if (t.closest('[data-folder-cancel]')) { FD.form = null; render(); return; }
        if (t.closest('[data-folder-retry]')) { loadFolder(false); return; }
        if (t.closest('[data-folder-more]')) { loadFolder(true); return; }
        // A file: its ... button, or the file itself.
        const more = t.closest('[data-lv-more]');
        if (more) {
          const e = shownByKey.get(more.dataset.lvMore);
          if (e) openFxMenu(more, e.name, itemsFor(e, more));
          return;
        }
        const el = t.closest('[data-lv]');
        if (el) {
          const e = shownByKey.get(el.dataset.lv);
          if (e) activate(e, el, el.classList.contains('fx-row') ? { x: ev.clientX, y: ev.clientY } : null);
        }
      });
      fxRoot.addEventListener('contextmenu', ev => {
        const el = ev.target.closest('[data-lv]');
        const e = el && shownByKey.get(el.dataset.lv);
        if (!e) return;
        ev.preventDefault();
        openFxMenu(el, e.name, itemsFor(e, el), ev.clientX === 0 && ev.clientY === 0 ? null : { x: ev.clientX, y: ev.clientY });
      });
      fxRoot.addEventListener('keydown', ev => {
        if (ev.key === 'Escape' && FD.form && ev.target.id === 'lfFolderName') { FD.form = null; render(); return; }
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        const row = ev.target.closest('.fx-row[data-lv]');
        if (!row || ev.target !== row) return;
        ev.preventDefault();
        const e = shownByKey.get(row.dataset.lv);
        if (e) activate(e, row, null);
      });
      // The file menu closes like everywhere else on this page.
      document.addEventListener('click', ev => { if (!fxMenu.hidden && ev.target.isConnected && !fxMenu.contains(ev.target) && !(fxMenuFor && fxMenuFor.contains(ev.target))) closeFxMenu(false); });
      document.addEventListener('contextmenu', ev => { if (!fxMenu.hidden && !fxMenu.contains(ev.target) && !(fxMenuFor && fxMenuFor.contains(ev.target))) closeFxMenu(false); });
      document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeFxMenu(true); });
      window.addEventListener('resize', () => closeFxMenu(false));
      window.addEventListener('scroll', () => closeFxMenu(false), true);
      // Back from Canva's Return button: tidy the address.
      try {
        const u = new URL(window.location.href);
        if (u.searchParams.has('canva')) { u.searchParams.delete('canva'); window.history.replaceState(window.history.state, '', u.pathname + u.search + u.hash); }
      } catch {}
      // Signed in or out of a drive in another tab, or a sign-in finished late: show it.
      window.addEventListener('averages-cloud-change', () => { if (cfg) { startCloud('gdrive'); startCloud('onedrive'); } });

      if (INCOGNITO) {
        Object.keys(CLOUD).forEach(app => { CLOUD[app].state = 'off'; });
        CV.state = 'off';
      }
      render();
      loadCourse();
      if (INCOGNITO) return;
      loadCloud();
      loadCanva(false);
      loadCanvaStatus();
    }
    function downloadPlaceholder(f) {
      const blob = new Blob([`${f.name}\n\nSample file from the Averages.io preview.`], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    // Materials opens the folder the file is in and highlights it (?file=).
    function materialsHref(f) {
      return `course-materials.html?course=${encodeURIComponent(f.course)}&file=${encodeURIComponent(f.name)}`;
    }
    // Attach to an assignment (2026-10-05): a second menu, in the same spot,
    // lists open assignments (the file's own course first). Picking one opens
    // that assignment with the file in Drafts, ready to Submit.
    const DRIVE_EXT = { doc: 'docx', sheet: 'xlsx', slides: 'pptx' };
    function fileExt(f) {
      if (f.src === 'canva') return 'pdf';
      if (f.src === 'gdrive') return DRIVE_EXT[f.type] || 'docx';
      const m = f.name.match(/\.([a-z0-9]+)$/i);
      return m ? m[1].toLowerCase() : f.type;
    }
    function attachHref(f, t) {
      return `assignment.html?course=${encodeURIComponent(t.course)}&title=${encodeURIComponent(t.title)}`
        + `&attach=${encodeURIComponent(f.name)}&src=${encodeURIComponent(f.src)}&ext=${encodeURIComponent(fileExt(f))}`;
    }
    function attachItems(f) {
      const list = ATTACH_TARGETS.slice().sort((a, b) => (b.course === f.course) - (a.course === f.course));
      return list.map(t => {
        const c = courseOf(t.course);
        return { label: t.title, sub: `${c ? c.name : 'Course'} · ${t.when}`, run: () => { window.location.href = attachHref(f, t); } };
      });
    }
    const attachItem = f => ({ label: 'Attach to an assignment', next: true, run: () => {
      if (fxLast) openFxMenu(fxLast.anchor, `Attach "${f.name}" to`, attachItems(f), { x: fxLast.x, y: fxLast.y });
    } });
    function fileItems(f) {
      if (f.src === 'course') return [
        { label: 'Show in Materials', run: () => { window.location.href = materialsHref(f); } },
        attachItem(f),
        { label: 'Download', run: () => downloadPlaceholder(f) },
      ];
      if (f.src === 'gdrive') return [{ label: 'Open in Google Drive', soon: true }, attachItem(f)];
      if (f.src === 'onedrive') return [{ label: 'Open in OneDrive', soon: true }, attachItem(f)];
      return [{ label: 'Open in Canva', soon: true }, attachItem(f)];
    }
    function openFile(f, anchor) {
      if (f.src === 'course') { window.location.href = materialsHref(f); return; }
      openFxMenu(anchor, f.name, fileItems(f));
    }

    if (FILES_SIGNED_IN && window.__AVERAGES_MODE__ === 'live') {
      liveFiles();
    } else if (FILES_SIGNED_IN) {
      document.getElementById('fxSide').hidden = true;
      document.getElementById('fx').style.gridTemplateColumns = 'minmax(0, 1fr)';
      document.getElementById('fxMain').innerHTML = '<div class="fx-empty"><strong>Files is on the way</strong>Your course files, Google Drive and OneDrive files, and Canva designs will all show up here.</div>';
      document.getElementById('filesSub').textContent = 'Coming soon';
    } else {
      render();
      document.getElementById('fxSearch').addEventListener('input', e => { fxQuery = e.target.value.trim().toLowerCase(); render(); });
      document.getElementById('fx').addEventListener('click', e => {
        const filt = e.target.closest('[data-filter]');
        if (filt) { fxFilter = filt.dataset.filter; render(); return; }
        const view = e.target.closest('[data-view]');
        if (view) { fxView = view.dataset.view; try { localStorage.setItem('schoolagy_files_view', fxView); } catch {} render(); return; }
        if (e.target.closest('#fxAddDrive')) {
          openFxMenu(e.target.closest('#fxAddDrive'), 'Add files', [
            { label: 'From Google Drive', soon: true },
            { label: 'From OneDrive', soon: true },
            { label: 'Connected apps settings', run: () => { window.location.href = 'settings.html'; } },
          ]);
          return;
        }
        const more = e.target.closest('[data-more]');
        if (more) { const f = FILES.find(x => x.id === more.dataset.more); if (f) openFxMenu(more, f.name, fileItems(f)); return; }
        const row = e.target.closest('[data-file]');
        if (row) { const f = FILES.find(x => x.id === row.dataset.file); if (f) openFile(f, row); }
      });
      // Right-click a file (row or tile) for the same menu as its ... button,
      // opened at the cursor. The keyboard menu key / Shift+F10 has no cursor
      // point, so it falls back to opening under the file.
      document.getElementById('fx').addEventListener('contextmenu', e => {
        const row = e.target.closest('[data-file]');
        if (!row) return;
        const f = FILES.find(x => x.id === row.dataset.file);
        if (!f) return;
        e.preventDefault();
        const fromKeyboard = e.clientX === 0 && e.clientY === 0;
        openFxMenu(row, f.name, fileItems(f), fromKeyboard ? null : { x: e.clientX, y: e.clientY });
      });
      document.addEventListener('contextmenu', e => { if (!fxMenu.hidden && !fxMenu.contains(e.target) && !(fxMenuFor && fxMenuFor.contains(e.target))) closeFxMenu(false); });
      document.getElementById('fx').addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const row = e.target.closest('.fx-row[data-file]');
        if (!row || e.target !== row) return;
        e.preventDefault();
        const f = FILES.find(x => x.id === row.dataset.file); if (f) openFile(f, row);
      });
      document.addEventListener('click', e => { if (!fxMenu.hidden && e.target.isConnected && !fxMenu.contains(e.target) && !(fxMenuFor && fxMenuFor.contains(e.target))) closeFxMenu(false); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFxMenu(true); });
      window.addEventListener('resize', () => closeFxMenu(false));
      window.addEventListener('scroll', () => closeFxMenu(false), true);
    }

    // Nav: each button goes to its page (same as every other page). The
    // current page (Files) has no data-href, so clicking it does nothing.
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) window.location.href = link.dataset.href;
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile) return;
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || 'M';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'files.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Files';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
