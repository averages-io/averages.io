<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Gradebook</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from grades.html /
     course-home.html so this page reads as the same app. See
     architecture-decisions.md re: promoting this to a real shared
     stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    /* A/B/C/D/F letter-grade color scale (2026-08-31, per Martin's
       request) — A and C reuse the existing good/mid tokens above (they
       already read as "green"/"amber"), F reuses bad ("red"); B and D
       are new in-between stops so all five letters read as a smooth
       green→red gradient rather than only three buckets. */
    --grade-b: #5c8a3f;
    --grade-d: #c1602f;
    /* Set per-course at load (see JS setCourseVars), same convention as
       course-home.html — everything specific to "whose gradebook this
       is" reads from these instead of a fixed color, so the one page
       genuinely serves any of the six sample courses via ?course=. */
    --course-color: #a67a22;
    --course-color-dark: #8a6519;
    --course-color-tint: rgba(166, 122, 34, 0.14);
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 116px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 900px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- both cards grow
      to their natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* Wraps the two cards below, stacked at their natural content height;
     .page (above) scrolls as a whole when the stack runs taller than
     the viewport. */
  .gb-scroll {
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 6px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }
  .title-wrap { min-width: 0; display: flex; align-items: center; gap: 10px; }
  .title-tick { width: 5px; height: 30px; border-radius: 999px; flex-shrink: 0; }
  h1.title {
    color: #ffffff;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.82rem;
    margin: 5px 0 0 2px;
  }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- Cards, same system as every other page ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
    margin-bottom: 14px;
  }
  .card-inner {
    padding: 20px 22px 20px;
  }

  .section-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .section-head-row h2 {
    font-size: 1rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0;
  }
  .section-head-row .course-total { font-size: 0.76rem; font-weight: 700; color: var(--text-faint); }

  /* ---------- Current + Predicted Grade hero — same idiom as
     course-home.html's grade-hero, plus a Grade Calculator button
     alongside per this page's own wireframe (Gradebook.pdf). ---------- */
  .grade-hero-row { display: flex; align-items: stretch; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .grade-hero-block { flex: 1; min-width: 140px; background: var(--panel-inner); border-radius: var(--window-radius-md); padding: 14px 16px; }
  .grade-hero-label { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 0 0 4px; }
  .grade-hero-val { font-size: 2.1rem; font-weight: 900; font-style: italic; line-height: 1; }
  /* Descendant selectors, not compound ones — curVal's own letter grade
     is a separate inner <span class="a|b|c|d|f"> nested inside the
     #curVal.grade-hero-val element (see the JS below), not an element
     that carries both classes itself. A pre-existing bug caught while
     reworking this for A-F coloring (2026-08-31): the old
     .grade-hero-val.good/.mid/.bad compound selectors had the same
     mismatch and never actually matched anything, so the current-grade
     letter has always silently rendered in the default text color. */
  .grade-hero-val .a { color: var(--grade-good); }
  .grade-hero-val .b { color: var(--grade-b); }
  .grade-hero-val .c { color: var(--grade-mid); }
  .grade-hero-val .d { color: var(--grade-d); }
  .grade-hero-val .f { color: var(--grade-bad); }
  .grade-hero-pct { font-size: 0.8rem; font-weight: 700; color: var(--text-faint); margin-left: 6px; font-style: normal; }
  .grade-hero-predicted { cursor: help; }
  .grade-hero-predicted:hover, .grade-hero-predicted:focus-visible { filter: brightness(0.96); }
  .grade-hero-predicted:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .grade-hero-trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; }
  .grade-hero-trend .arrow { width: 15px; display: inline-flex; justify-content: center; font-size: 1.1rem; }
  .grade-hero-trend.up .arrow { color: var(--grade-good); }
  .grade-hero-trend.down .arrow { color: var(--grade-bad); }
  .grade-hero-trend.flat .arrow { color: var(--text-faint); }
  .grade-hero-updated { font-size: 0.7rem; color: var(--text-faint); margin: 12px 2px 0; }

  .gb-open-calc-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 9px 16px 9px 13px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .gb-open-calc-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .gb-open-calc-btn:hover { background: var(--accent-dark); }
  .gb-open-calc-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Assignments / grade breakdown — copied verbatim from
     grades.html's Gradebook pop-out (.gb-category family), just laid
     out as a full page section instead of inside a modal. ---------- */
  .gb-category { margin-top: 16px; }
  .gb-category-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .gb-category-name { font-weight: 800; font-size: 0.86rem; color: var(--text-dark); }
  .gb-category-weight { font-size: 0.72rem; font-weight: 700; color: var(--text-faint); }
  .gb-bar {
    height: 6px;
    border-radius: 999px;
    background: var(--panel-inner);
    overflow: hidden;
    margin-bottom: 8px;
  }
  .gb-bar-fill { height: 100%; border-radius: 999px; }
  .gb-assign-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    font-size: 0.8rem;
  }
  .gb-assign-title { color: var(--text-dark); font-weight: 600; }
  /* Rows open the assignment (2026-10-04). Buttons, reset to look like the old rows. */
  button.gb-assign-row { width: calc(100% + 16px); margin: 0 -8px; padding: 5px 8px; background: none; border: none; border-radius: var(--window-radius-sm); font: inherit; font-size: 0.8rem; text-align: left; cursor: pointer; color: inherit; }
  button.gb-assign-row:hover { background: var(--panel-inner); }
  button.gb-assign-row:hover .gb-assign-title { text-decoration: underline; text-underline-offset: 2px; }
  button.gb-assign-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring, var(--course-color)); }
  .gb-assign-score { color: var(--text-muted); font-weight: 700; white-space: nowrap; }
  .gb-assign-row.ungraded .gb-assign-title,
  .gb-assign-row.ungraded .gb-assign-score {
    color: var(--text-faint);
    font-style: italic;
    font-weight: 600;
  }
  /* Demonstrated Skills rows (2026-08-31 rework, corrected 2026-09-01) —
     per Martin's correction, Skills is now just another GRADEBOOK
     category (like Tests or Homework), weighted differently, not a
     separate parallel track — its rows score and display exactly like
     any other graded assignment (a colored letter + raw fraction, e.g.
     "A 5/5"), not a qualitative Demonstrated/Developing/Not Yet pill
     (that pill design was replaced 2026-09-01 after Martin shared a real
     Schoology gradebook screenshot showing a skills category rendering
     its items as plain scored assignments). The teacher-note sub-line
     these rows used to also show was removed the same day, also per
     Martin — every row uses the plain single-line layout now. */
  .gb-assign-score .a { color: var(--grade-good); }
  .gb-assign-score .b { color: var(--grade-b); }
  .gb-assign-score .c { color: var(--grade-mid); }
  .gb-assign-score .d { color: var(--grade-d); }
  .gb-assign-score .f { color: var(--grade-bad); }

  /* ---------- Predicted-grade reasoning popup — copied verbatim from
     grades.html's .grade-popup. ---------- */
  .grade-popup {
    position: fixed;
    z-index: 50;
    width: 272px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 22px 48px -16px rgba(0,0,0,0.5);
    padding: 14px 16px 10px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
  }
  .grade-popup.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
  }
  .grade-popup h3 { margin: 0 0 2px; font-size: 0.82rem; font-weight: 800; color: var(--text-dark); }
  .grade-popup .popup-sub { font-size: 0.7rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
  .grade-popup .popup-sub strong { color: var(--text-dark); }
  .grade-popup svg { display: block; overflow: visible; }
  .grade-popup .popup-foot { font-size: 0.62rem; color: var(--text-faint); margin: 6px 0 0; text-align: right; font-style: italic; }
  @media (prefers-reduced-motion: reduce) { .grade-popup { transition: none; } }

  /* ---------- Bottom nav — copied verbatim from course-home.html. ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has
     to get ... we should add a more button on the far right side with a
     list of the other options"). Labels never truncate: when they would,
     the rightmost pages move into the More menu instead. ---------- */
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;
    margin-left: 4px;
    padding: 12px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-more .label { display: flex; align-items: center; height: 1.2em; font-size: 0.72rem; color: var(--text-faint); }
  .nav-more .label svg { display: block; fill: currentColor; }
  /* thin divider between the pages and the dots */
  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }
  .nav-more.has-active .dot { background: var(--accent); }
  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    pointer-events: auto;
  }
  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-faint);
    text-align: left;
    padding: 12px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  /* Labels sit centered in the bar; the active page is underlined in the
     accent color instead of marked with a dot (2026-10-01, per Martin). */
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {
    .nav-more { padding: 10px 12px 8px; }
    .nav-more::before { top: 10px; bottom: 10px; }
    .app-nav-inner .nav-link, .app-nav-inner .nav-more { padding-top: 8px; padding-bottom: 8px; }
    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }

  /* ---------- Modal shell + Grade Calculator — copied verbatim from
     grades.html's #calcModal, scoped to this page's single course (no
     course picker needed — the URL already says which one). ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 60;
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease;
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    max-width: 380px; width: 100%;
    padding: 22px 24px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    transform: translateY(8px);
    transition: transform 0.15s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  /* .wide (the Grade Calculator) scrolls internally — the scrolling has
     to happen on an inner wrapper (.modal-box-scroll), not this element
     itself, or the browser's native scrollbar renders at this box's flat
     edge and pokes out past its own rounded corners (reported 2026-09-01
     by Martin — a screenshot showed the scrollbar thumb sticking out
     above/below the modal). This element now just clips (overflow:
     hidden + the border-radius it already had) and un-pads itself so all
     padding — and the actual overflow-y: auto — moves to the inner div,
     whose content therefore never draws past the rounded corner. */
  .modal-box.wide { max-width: 520px; max-height: 85vh; overflow: hidden; padding: 0; }
  .modal-box-scroll { max-height: 85vh; overflow-y: auto; padding: 22px 24px; }
  .modal-close {
    float: right;
    background: var(--panel-inner);
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;

    font-size: 0.9rem;
    line-height: 1;

  .calc-hero {
    text-align: center;
    background: var(--panel-inner);
    border-radius: var(--window-radius-md);
    padding: 14px 10px 12px;
    margin: 14px 0 16px;
  }
  .calc-hero .calc-hero-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .calc-hero .calc-hero-val { font-size: 1.9rem; font-weight: 900; font-style: italic; margin-top: 2px; }
  .calc-hero .calc-hero-pct { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-left: 6px; font-style: normal; }
  .calc-category { margin-bottom: 14px; }
  .calc-category-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .calc-category-name { font-weight: 800; font-size: 0.82rem; color: var(--text-dark); }
  .calc-category-weight { font-size: 0.7rem; font-weight: 700; color: var(--text-faint); }
  .calc-assign-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    font-size: 0.78rem;
  }
  .calc-assign-title { color: var(--text-dark); font-weight: 600; }
  .calc-assign-score { color: var(--text-muted); font-weight: 700; white-space: nowrap; }
  .calc-input {
    width: 48px;
    padding: 4px 6px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text-dark);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    text-align: right;
    /* Extra breathing room before the "/ out-of-points" text next to it
       (2026-09-01, per Martin) — the input and its label used to sit
       flush against each other. */
    margin-right: 6px;
  }
  .calc-input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .calc-input.hyp { background: rgba(217, 74, 43, 0.08); border-color: var(--accent); }
  /* Fixed width (2026-09-01, per Martin: the score boxes didn't line up
     into a clean column) — without this, "/ 5" vs "/ 50" are different
     text widths, and since .calc-assign-score is pinned to the row's
     right edge, that difference pushed the input box itself left or
     right row to row. A fixed-width label keeps every input's left edge
     in the same column regardless of how many digits the point value has. */
  .calc-out-of { display: inline-block; width: 30px; text-align: left; color: var(--text-muted); font-weight: 700; }
  .calc-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  /* Final Exam mini-calculator (reworked 2026-09-01, per Martin, to match
     a reference "Final Grade Calculator" tool he shared) — used to be
     gated behind an "Include a hypothetical final assessment" checkbox
     with an explanatory paragraph; both are gone. The three fields are
     always visible and always live: Current grade / Grade you want /
     Final exam weight, solving for the score still needed rather than
     projecting a score forward like the category inputs above do. */
  .calc-final-heading { font-weight: 800; font-size: 0.82rem; color: var(--text-dark); margin: 0 0 8px; }
  .calc-final-inputs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .calc-final-field { flex: 1 1 100px; min-width: 90px; }
  .calc-final-field label { display: block; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); margin-bottom: 4px; }
  .calc-final-field input {
    width: 100%;
    padding: 7px 9px;
    border-radius: var(--window-radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text-dark);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    box-sizing: border-box;
  }
  .calc-final-field input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .calc-final-answer {
    background: var(--panel-inner);
    border-radius: var(--window-radius-sm);
    padding: 10px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.45;
    margin: 0 0 4px;
    min-height: 1.2em;
  }
  .calc-final-answer:empty { display: none; }
  .calc-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .calc-reset-btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 15px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.76rem;
    color: var(--text-dark);
    cursor: pointer;
  }
  .calc-reset-btn:hover { background: var(--border); }
  .calc-reset-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  @media (max-width: 560px) {

    .gb-open-calc-btn { width: 100%; justify-content: center; }
    .grade-hero-row { flex-direction: column; }
  }
  /* ---------- Course banner + tabs, shared with the course hub (2026-10-01) ---------- */
  .page { max-width: 1120px; }
  .back-link { display: none; }
  .sheet { background: var(--panel-bg); border-radius: var(--window-radius-lg); overflow: hidden; }
  .sheet-top { margin-bottom: 24px; }
  .sheet-head { background: var(--course-color); color: #fff; padding: 24px 32px 28px; display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
  .sheet-id { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1 1 320px; }
  .sheet-emoji { width: 64px; height: 64px; flex-shrink: 0; border-radius: 16px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }
  .sheet-emoji svg { width: 40px; height: 40px; display: block; }
  .sheet-id-text { min-width: 0; }
  .sheet-name { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 900; font-style: italic; line-height: 1.05; color: #fff; overflow-wrap: anywhere; }
  .sheet-meta { margin: 8px 0 0; font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.86); }
  .sheet-score { display: flex; align-items: flex-start; gap: 32px; background: var(--course-color-dark); border-radius: var(--window-radius-md); padding: 16px 24px; }
  .sheet-grade { display: flex; flex-direction: column; gap: 4px; }
  .sheet-label, .sheet-score .grade-hero-label { margin: 0; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.86); }
  .sheet-grade-val, .sheet-score .grade-hero-val { display: flex; align-items: baseline; gap: 8px; color: #fff; font-size: 2.7rem; font-weight: 900; line-height: 1; font-style: normal; }
  .sheet-letter { font-weight: 900; line-height: 1; font-size: 2.7rem; }
  .sheet-letter .arrow, .sheet-score .grade-hero-trend .arrow { font-size: 0.6em; margin-right: 4px; color: #fff !important; width: auto; }
  .sheet-score .grade-hero-val > span:first-child, .sheet-score .grade-hero-trend { color: #fff !important; font-size: inherit; }
  .sheet-pct, .sheet-score .grade-hero-pct { font-size: 0.85rem; font-weight: 800; color: rgba(255,255,255,0.86); margin-left: 0; }
  .sheet-score .grade-hero-block { background: none; padding: 0; border-radius: var(--window-radius-sm); }
  .sheet-grade-proj { cursor: help; border-radius: var(--window-radius-sm); padding: 8px; margin: -8px; }
  .sheet-grade-proj:hover { background: rgba(255,255,255,0.14); filter: none; }
  .sheet-grade-proj:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff; }
  .sheet-grade-proj.sheet-static { cursor: default; }
  .sheet-score .grade-hero-block.sheet-grade-proj { padding: 8px; margin: -8px; }
  .sheet-grade-proj.sheet-static:hover { background: none; }
  .sheet-tabs { display: flex; align-items: center; gap: 24px; padding: 0 32px; }
  .sheet-tab { background: none; border: none; font: inherit; font-weight: 800; font-size: 0.85rem; color: var(--text-faint); padding: 16px 0 12px; border-bottom: 3px solid transparent; cursor: pointer; }
  .sheet-tab:hover { color: var(--text-dark); }
  .sheet-tab.active { color: var(--text-dark); border-bottom-color: var(--course-color); cursor: default; }
  .sheet-tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 4px; }
  .topbar.sheet-topbar { justify-content: flex-end; margin: 0 0 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (max-width: 900px) { .sheet-head { padding: 24px; } .sheet-tabs { padding: 0 24px; } }
  @media (max-width: 560px) { .sheet-score { padding: 16px; gap: 24px; } .sheet-letter, .sheet-grade-val, .sheet-score .grade-hero-val { font-size: 2.4rem; } }
  .section-head-row .gb-open-calc-btn { margin-left: auto; }
  #gradingPeriodNote { margin: 0 0 12px; }
  /* ---------- Course pages round 4 (2026-10-01) ---------- */
  /* no italics on the course pages (Martin's rule) */
  html body * { font-style: normal !important; }
  /* "Back to ..." sits in the profile button's row, left side, no arrow */
  .topbar.hub-topbar, .topbar.sheet-topbar { justify-content: space-between; align-items: center; margin: 0 0 12px; }

  .tc-overlay { position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 70; opacity: 0; visibility: hidden; transition: opacity 0.15s ease; }
  .tc-overlay.show { opacity: 1; visibility: visible; }

  .tc-overlay.show .tc-box { transform: translateY(0); }
  .tc-close { float: right; background: var(--panel-inner); border: none; width: 26px; height: 26px; border-radius: 50%; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; line-height: 1; }
  .tc-close:hover { color: var(--text-dark); }
  .tc-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .tc-head { display: flex; align-items: center; gap: 12px; clear: both; padding-top: 4px; }
  .tc-avatar { width: 52px; height: 52px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tc-box h3 { margin: 0; font-size: 1.1rem; font-weight: 900; color: var(--text-dark); }

  .tc-rows { margin-top: 14px; }
  .tc-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .tc-row:last-child { border-bottom: none; }

  .tc-btn { display: flex; align-items: center; justify-content: center; gap: 7px; flex: 1; background: var(--course-color); color: #fff; border: none; border-radius: 999px; padding: 10px; font: inherit; font-weight: 800; font-size: 0.82rem; cursor: pointer; text-decoration: none; }

  .topbar .back-link:focus-visible { box-shadow: none; text-decoration: underline; }
  .topbar .back-link svg { display: block; }
</style>

  <script>
    // ---- Links by id (2026-10-07, Martin) ----
    // A real class (Schoology/Classroom ids are digits) links as
    // assignment?id=<id> and course-home?id=<section id>; the sample classes
    // (word ids like "apchem") keep ?course=&title=. Pages read both.
    function avgIsId(v) { return /^\d{1,24}$/.test(String(v == null ? '' : v)); }
    function avgCourseQ(course) { return (avgIsId(course) ? 'id=' : 'course=') + encodeURIComponent(course == null ? '' : course); }
    function avgAssignHref(course, title, id, extra) {
      extra = extra || '';
      if (avgIsId(id) && avgIsId(course)) return `assignment.html?id=${id}${extra}`;
      return `assignment.html?course=${encodeURIComponent(course == null ? '' : course)}&title=${encodeURIComponent(title || '')}${avgIsId(id) ? `&id=${id}` : ''}${extra}`;
    }

    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>

    // bars, distinct from the discrete 5-tier GRADE_COLOR/gradeBand
    // system used for letter-grade text elsewhere on this page. Fully
    // green at 90%+ (matches the letter-grade "A" cutoff), interpolating
    // through amber around the mid-70s, reaching fully dark red by 60%
    // (the top of the F range) and staying there for anything lower.
    const BAR_GREEN = [47, 125, 84];    // matches --grade-good

    const BAR_DARKRED = [122, 36, 26];  // darker than --grade-bad on purpose — this is the "F or lower" color Martin asked for
    function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }

      if (pct >= 75) return lerpRGB(BAR_GREEN, BAR_AMBER, (90 - pct) / (90 - 75));

    // ------------------------------------------------------------------
    function niceBounds(values) {
      const min = Math.min(...values), max = Math.max(...values);
      let lo = Math.floor((min - 6) / 10) * 10;
      let hi = Math.ceil((max + 6) / 10) * 10;
      lo = Math.max(0, lo);
      hi = Math.min(100, hi);
      if (hi - lo < 20) { hi = Math.min(100, lo + 20); }
      return [lo, hi];
    }
    // Grades given on the same day become one point: their average, with
    // the date labeled "Aug 18 ×3" (2026-10-01). Otherwise three grades on
    // one day drew as a zigzag across three fake "days".
    function groupSameDay(h) {
      const days = [];
      h.points.forEach((p, i) => {
        const d = h.dates[i];
        const last = days[days.length - 1];
        if (last && last.date === d) { last.sum += p; last.n++; }
        else days.push({ date: d, sum: p, n: 1 });
      });
      return Object.assign({}, h, {
        points: days.map(x => Math.round(x.sum / x.n)),
        dates: days.map(x => x.n > 1 ? `${x.date} ×${x.n}` : x.date),
      });
    }
    function buildGradeChartSVG(c) {
      if (!HISTORY[c.id] || !Array.isArray(HISTORY[c.id].points) || !HISTORY[c.id].points.length) return '<p class="popup-foot">No graded work yet. The trend shows up after the first grades.</p>';
      const hist = groupSameDay(HISTORY[c.id]);
      const allLabels = hist.dates.concat(['Predicted']);
      const allValues = hist.points.concat([c.predictedPct]);
      const [yLo, yHi] = niceBounds(allValues);
      const W = 240, H = 108;
      const padL = 26, padR = 6, padT = 10, padB = 16;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const xFor = i => padL + (i / (allLabels.length - 1)) * plotW;
      const yFor = v => padT + plotH - ((v - yLo) / (yHi - yLo)) * plotH;
      const yTicks = [yLo, Math.round((yLo + yHi) / 2), yHi];
      const gridlines = yTicks.map(t => `
        <line x1="${padL}" x2="${W - padR}" y1="${yFor(t)}" y2="${yFor(t)}" stroke="var(--border)" stroke-width="1"/>
        <text x="${padL - 6}" y="${yFor(t) + 3}" text-anchor="end" font-size="8" fill="var(--text-faint)">${t}%</text>
      `).join('');
      const actualPts = hist.points.map((v, i) => [xFor(i), yFor(v)]);
      const actualLine = actualPts.map(p => p.join(',')).join(' ');
      const actualMarkers = actualPts.map(([x, y]) => `
        <circle cx="${x}" cy="${y}" r="4" fill="${escapeHtml(c.color)}" stroke="var(--panel-bg)" stroke-width="2"/>
      `).join('');
      const predX = xFor(allLabels.length - 1), predY = yFor(c.predictedPct);
      const lastActual = actualPts[actualPts.length - 1];
      const predictedBand = `x="${lastActual[0]}" y="${padT}" width="${predX - lastActual[0]}" height="${plotH}"`;
      const stripeDefs = `
        <pattern id="predStripesGradebook" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="${escapeHtml(c.color)}" fill-opacity="0.08"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="${escapeHtml(c.color)}" stroke-width="2.2"/>
        </pattern>
      `;
      const xLabels = allLabels.map((lab, i) => `
        <text x="${xFor(i)}" y="${H - 2}" text-anchor="middle" font-size="7.5" fill="var(--text-faint)">${escapeHtml(lab === 'Predicted' ? 'Pred.' : lab)}</text>
      `).join('');
      return `
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart of ${escapeHtml(c.name)} assignment scores trending toward a predicted grade of ${escapeHtml(c.predictedPct)} percent">
          <defs>${stripeDefs}</defs>
          ${gridlines}
          <rect ${predictedBand} fill="url(#predStripesGradebook)" stroke="none"/>
          <polyline points="${actualLine}" fill="none" stroke="${escapeHtml(c.color)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="${lastActual[0]}" y1="${lastActual[1]}" x2="${predX}" y2="${predY}" stroke="${escapeHtml(c.color)}" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
          ${actualMarkers}
          <circle cx="${predX}" cy="${predY}" r="4.5" fill="var(--panel-bg)" stroke="${escapeHtml(c.color)}" stroke-width="2"/>
          <text x="${predX}" y="${predY - 10}" text-anchor="end" font-size="8.5" font-weight="800" fill="var(--text-dark)">${escapeHtml(c.predictedPct)}%</text>
          ${xLabels}
        </svg>
      `;
    }
    function renderGradePopup(c) {
      const hist = HISTORY[c.id];
      if (!hist || !Array.isArray(hist.points) || !hist.points.length) return `<h3>${escapeHtml(c.name)}</h3><p class="popup-sub">No graded work yet. The trend and predicted grade show up after the first grades.</p>`;
      const first = hist.points[0], lastGraded = hist.points[hist.points.length - 1];
      return `
        <h3>${escapeHtml(c.name)}</h3>
        <p class="popup-sub">${TREND_WORD[c.trend]}: <strong>${escapeHtml(first)}% → ${escapeHtml(lastGraded)}%</strong> over the last ${hist.points.length} graded assignments, predicting <strong>${escapeHtml(c.predictedPct)}%</strong> (${escapeHtml(c.predicted)}).</p>
        ${buildGradeChartSVG(c)}
        <p class="popup-foot">Predicted grade extrapolates this trend — not a copy of the current grade.</p>
      `;
    }
    const gradePopup = document.getElementById('gradePopup');
    const predBlock = document.getElementById('predBlock');
    let popupHideTimer = null;
    function showGradePopup() {
      clearTimeout(popupHideTimer);
      gradePopup.innerHTML = renderGradePopup(course);
      gradePopup.classList.add('show');
      predBlock.setAttribute('aria-expanded', 'true');
      const rect = predBlock.getBoundingClientRect();
      const popupRect = gradePopup.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - popupRect.width / 2;
      left = Math.max(10, Math.min(left, window.innerWidth - popupRect.width - 10));
      let top = rect.top - popupRect.height - 10;
      if (top < 10) top = rect.bottom + 10;
      gradePopup.style.left = `${left}px`;
      gradePopup.style.top = `${top}px`;
    }
    function hideGradePopup() { gradePopup.classList.remove('show'); predBlock.setAttribute('aria-expanded', 'false'); }
    predBlock.addEventListener('mouseenter', showGradePopup);
    predBlock.addEventListener('focus', showGradePopup);
    predBlock.addEventListener('mouseleave', () => { popupHideTimer = setTimeout(hideGradePopup, 80); });
    predBlock.addEventListener('blur', hideGradePopup);
    predBlock.addEventListener('keydown', e => { if (e.key === 'Escape') { hideGradePopup(); predBlock.blur(); } });

    // ------------------------------------------------------------------
    // Modal open/close plumbing + Grade Calculator — copied verbatim
    // from grades.html's #calcModal, minus the course-picker bits (this
    // page only ever calculates for its own single `course`).
    // ------------------------------------------------------------------
    const calcModal = document.getElementById('calcModal');
    function openModal(overlay) { overlay.classList.add('show'); document.addEventListener('keydown', escCloseHandler); }
    function closeModal(overlay) { overlay.classList.remove('show'); document.removeEventListener('keydown', escCloseHandler); }
    function escCloseHandler(e) { if (e.key === 'Escape' && calcModal.classList.contains('show')) closeModal(calcModal); }
    calcModal.addEventListener('click', e => { if (e.target === calcModal) closeModal(calcModal); });

    const calcCategories = document.getElementById('calcCategories');
    const calcFinalCurrent = document.getElementById('calcFinalCurrent');
    const calcFinalWant = document.getElementById('calcFinalWant');
    const calcFinalWeight = document.getElementById('calcFinalWeight');
    const calcFinalAnswer = document.getElementById('calcFinalAnswer');
    const calcResetBtn = document.getElementById('calcResetBtn');
    const calcHeroLabel = document.getElementById('calcHeroLabel');
    const calcHeroLetter = document.getElementById('calcHeroLetter');
    const calcHeroPct = document.getElementById('calcHeroPct');
    let calcEdits = {};
    // True once the user has typed into "Current grade" themselves — until
    // then it stays synced to the live category-based projected grade
    // above, same idea as an untouched per-assignment input tracking the
    // real score.
    let calcFinalCurrentTouched = false;

    function assignKey(catName, title) { return catName + '::' + title; }

    // A short muted qualifier shown after an assignment's title: "(not
    // yet graded)" for a real ungraded item, context for what the
    // pre-filled/blank number means. (The Demonstrated Skills rubric-
    // label qualifier this used to also show, e.g. "(Demonstrated)", was
    // removed 2026-09-01 along with the `status` field it read — per
    // Martin, that wording isn't something real Schoology surfaces.)
    function calcAssignQualifier(a) {
      if (!a.graded) return ` <span style="color:var(--text-faint); font-weight:600;">(not yet graded)</span>`;
      return '';
    }

    // Every assignment gets an editable input now (2026-08-31, per
    // Martin's request to be able to change any grade — not just fill in
    // an ungraded one — to see the hypothetical effect on the overall
    // grade). A graded assignment's input is pre-filled with its real
    // score; an ungraded one starts blank, same as before. Either way,
    // `calcEdits` only holds what the user has actually typed — an
    // untouched graded input still uses the real score in
    // recomputeCalc() below, so simply opening the Calculator and not
    // touching anything reproduces the real grade exactly.
    function renderCalcCategories() {
      const gb = GRADEBOOK[course.id];
      if (!gb || !Array.isArray(gb.categories) || !gb.categories.length) { calcCategories.innerHTML = '<p class="calc-empty">Nothing graded in this class yet.</p>'; return; }
      const weighted = gbWeighted(gb);
      calcCategories.innerHTML = gb.categories.map(cat => {
        const rows = cat.assignments.map(a => {
          const key = assignKey(cat.name, a.title);
          const defaultVal = a.graded ? a.score : '';
          const val = calcEdits[key] !== undefined ? calcEdits[key] : defaultVal;
          return `
            <div class="calc-assign-row">
              <span class="calc-assign-title">${escapeHtml(a.title)}${calcAssignQualifier(a)}</span>
              <span class="calc-assign-score">
                <input class="calc-input hyp" type="number" min="0" placeholder="?" value="${escapeHtml(val)}" data-key="${escapeHtml(key)}" data-points="${escapeHtml(a.points)}" aria-label="Score for ${escapeHtml(a.title)}, out of ${escapeHtml(a.points)}, extra credit above ${escapeHtml(a.points)} allowed"><span class="calc-out-of">/ ${escapeHtml(a.points)}</span>
              </span>
            </div>
          `;
        }).join('');
        return `
          <div class="calc-category">
            <div class="calc-category-head">
              <span class="calc-category-name">${escapeHtml(cat.name)}</span>
              <span class="calc-category-weight" data-base-weight="${escapeHtml(cat.weight)}">${escapeHtml(gbWeightLabel(cat, weighted))}</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');
    }

    // The category breakdown always reflects its own real weights now —
    // the old "scale categories down to make room for a hypothetical
    // final" behavior went away with the checkbox it was tied to
    // (2026-09-01). The Final Exam section below is a separate, simpler
    // calculation: given a current grade, a target grade, and how much
    // the final is worth, solve for the score still needed — it doesn't
    // feed back into the category list above.
    function recomputeCalc() {
      const gb = GRADEBOOK[course.id];
      const cats = gb && Array.isArray(gb.categories) ? gb.categories : [];
      const weighted = gbWeighted(gb);
      let overall = 0, weightUsed = 0, allEarned = 0, allPossible = 0;
      cats.forEach(cat => {
        let earned = 0, possible = 0;
        cat.assignments.forEach(a => {
          const key = assignKey(cat.name, a.title);
          const raw = calcEdits[key];
          let scoreToUse = null;
          if (raw !== undefined && raw !== '' && !isNaN(Number(raw))) {
            scoreToUse = Number(raw);
          } else if (a.graded) {
            scoreToUse = a.score;
          }
          // else: still ungraded and no hypothetical entered — excluded,
          // same as before (doesn't count as a zero).
          if (scoreToUse !== null) { earned += scoreToUse; possible += a.points; }
        });
        // A category with nothing counted yet is left out and the other
        // weights scale up (2026-10-05), as in Google Classroom.
        if (possible > 0) {
          const w = Number(cat.weight) > 0 ? Number(cat.weight) : 0;
          overall += (earned / possible) * 100 * w; weightUsed += w;
          allEarned += earned; allPossible += possible;
        }
      });
      // Weighted: the categories with work, scaled. No weights at all (a
      // total-points class): every point counts. Nothing counted yet: "—",
      // not an F (2026-10-06).
      const raw = weighted ? (weightUsed > 0 ? overall / weightUsed : null) : (allPossible > 0 ? (allEarned / allPossible) * 100 : null);
      if (raw === null || !isFinite(raw)) {
        calcHeroLetter.textContent = '—';
        calcHeroLetter.style.color = '';
        calcHeroPct.textContent = '';
        calcHeroLabel.textContent = Object.keys(calcEdits).length > 0 ? 'Projected grade' : 'Current grade';
        calcCategories.querySelectorAll('.calc-category').forEach((box, i) => {
          const cat = cats[i];
          if (cat) box.querySelector('.calc-category-weight').textContent = gbWeightLabel(cat, weighted);
        });
        if (!calcFinalCurrentTouched) calcFinalCurrent.value = '';
        updateFinalAnswer();
        return;
      }

      const pct = Math.max(0, Math.min(100, raw));
      const letter = letterFromPct(pct);
      calcHeroLetter.textContent = letter;
      calcHeroLetter.style.color = GRADE_COLOR[gradeBand(letter)];
      calcHeroPct.textContent = `${pct.toFixed(1)}%`;
      // "Current grade" until an assignment's real score is actually
      // edited (calcEdits empty means every input is still showing its
      // real value) — flips to "Projected grade" the moment there's a
      // hypothetical in play, per Martin.
      calcHeroLabel.textContent = Object.keys(calcEdits).length > 0 ? 'Projected grade' : 'Current grade';

      calcCategories.querySelectorAll('.calc-category').forEach((box, i) => {
        const cat = cats[i];
        if (cat) box.querySelector('.calc-category-weight').textContent = gbWeightLabel(cat, weighted);
      });

      // Keep "Current grade" synced to the live projected grade above
      // unless the user has typed their own number in — same touched-flag
      // idiom used for the per-assignment inputs.
      if (!calcFinalCurrentTouched) calcFinalCurrent.value = pct.toFixed(1);
      updateFinalAnswer();
    }

    // Final Exam mini-calculator (2026-09-01, per Martin's reference
    // screenshot of a standalone "Final Grade Calculator" tool) — solves
    // for the score needed on the final, the reverse of the category
    // calculator above (which projects a grade forward from scores).
    // overall = current*(1 - w) + needed*w  →  needed = (want - current*(1-w)) / w
    function updateFinalAnswer() {
      const current = Number(calcFinalCurrent.value);
      const wantRaw = calcFinalWant.value;
      const weight = Math.max(1, Math.min(100, Number(calcFinalWeight.value) || 0));
      if (wantRaw === '' || isNaN(current) || isNaN(weight)) {
        calcFinalAnswer.textContent = '';
        return;
      }
      const want = Number(wantRaw);
      if (isNaN(want)) { calcFinalAnswer.textContent = ''; return; }
      const w = weight / 100;
      const needed = (want - current * (1 - w)) / w;
      if (needed > 100) {
        const bestCase = (current * (1 - w) + 100 * w).toFixed(1);
        calcFinalAnswer.innerHTML = `Even a perfect <strong>100%</strong> on the final won't get you to <strong>${want}%</strong> — the highest you could reach is <strong>${bestCase}%</strong>.`;
      } else if (needed <= 0) {
        calcFinalAnswer.innerHTML = `You're already there — even a <strong>0%</strong> on the final keeps you at or above <strong>${want}%</strong>.`;
      } else {
        calcFinalAnswer.innerHTML = `You need <strong>${needed.toFixed(1)}%</strong> on the final exam to get <strong>${want}%</strong> in the class.`;
      }
    }

    function openCalcModal() {
      calcEdits = {};
      calcFinalCurrentTouched = false;
      calcFinalWant.value = '';
      calcFinalWeight.value = 20;
      document.getElementById('calcCourseName').textContent = course.name;
      renderCalcCategories();
      recomputeCalc();
      openModal(calcModal);
    }
    document.getElementById('openCalcBtn').addEventListener('click', openCalcModal);
    document.getElementById('calcCloseBtn').addEventListener('click', () => closeModal(calcModal));

    calcCategories.addEventListener('input', e => {
      const input = e.target.closest('.calc-input');
      if (!input) return;
      const key = input.dataset.key;
      // No upper clamp (2026-09-01, per Martin: some teachers give extra
      // credit, so a hypothetical score can legitimately exceed the
      // assignment's own point value) — only floor at 0, since a
      // negative score isn't meaningful here.
      let val = input.value;
      if (val !== '' && Number(val) < 0) { val = '0'; input.value = val; }
      calcEdits[key] = val;
      recomputeCalc();
    });
    calcFinalCurrent.addEventListener('input', () => { calcFinalCurrentTouched = true; updateFinalAnswer(); });
    calcFinalWant.addEventListener('input', updateFinalAnswer);
    calcFinalWeight.addEventListener('input', updateFinalAnswer);
    calcResetBtn.addEventListener('click', () => {
      calcEdits = {};
      calcFinalCurrentTouched = false;
      calcFinalWant.value = '';
      calcFinalWeight.value = 20;

      recomputeCalc();
    });

    document.querySelectorAll('.nav-link').forEach(link => {

    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit

    (function () {
      var profile = null;
      try {

      const el = id => document.getElementById(id);
      const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      // course color + a darker shade for the scoreboard
      function shade(hex, f) {
        const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
        if (!m) return hex;
        const n = parseInt(m[1], 16);
        const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * (1 - f)));
        return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
      }
        function darkenBy(hex, amt) {   // same shade as the hub's banner box
          const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
          if (!m) return hex;
          const n = parseInt(m[1], 16);
          return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, v - amt)).toString(16).padStart(2, '0')).join('');
        }
      if (course.color) {
        document.documentElement.style.setProperty('--course-color', course.color);
        document.documentElement.style.setProperty('--course-color-dark', darkenBy(course.color, 28));
      }
      const subject = (typeof courseSubject === 'function') ? courseSubject(course.name) : null;
      const emoji = course.emoji || (subject ? subject[1] : '📚');
      el('sheetEmoji').innerHTML = SHEET_EMOJI_SVG[emoji] || SHEET_EMOJI_SVG['📚'];
      el('sheetTitle').textContent = course.name;
      const meta = [];
      if (course.period) meta.push(`Pd ${course.period}`);
      if (course.teacher) meta.push(course.teacher);
      if (course.section) meta.push(`Section ${course.section}`);
      if (course.code) meta.push(course.code);
      el('sheetMeta').textContent = meta.join(' · ');
      linkTeacherIn(el('sheetMeta'), course.teacher, course.name);
      document.querySelectorAll('.sheet-tab[data-href]').forEach(tab => {
        tab.addEventListener('click', () => { window.location.href = `${tab.dataset.href}?course=${encodeURIComponent(course.id)}`; });
      });
    })();

  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'gradebook.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Gradebook';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
