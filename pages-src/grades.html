<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Grades</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from courses.html
     so this page reads as the same app, not a reskin. See
     architecture-decisions.md for the note about promoting this to an
     actual shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    /* A/B/C/D/F letter-grade color scale (2026-08-31, per Martin's
       request) — see gradeBand()/GRADE_COLOR below. A and C reuse the
       existing good/mid tokens (already "green"/"amber"), F reuses bad
       ("red"); B and D are new in-between stops. */
    --grade-b: #5c8a3f;
    --grade-d: #c1602f;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- .card grows to
      its natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.6rem, 3.4vw, 2.1rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    margin: 2px 0 0 2px;
  }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- One card, same as every other page ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
  }
  .card-inner {
    padding: 22px 24px 8px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .section-head h2 {
    font-size: 1rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0;
  }
  .section-head .course-total {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-faint);
  }

  /* ---------- Estimated GPA strip (2026-09-01, per Martin) — a quick
     unweighted 4.0-scale summary above the per-course table, using each
     course's current letter grade (not predicted). Colored via the same
     red-through-green idiom as everything else on this page rather than
     a flat accent color, so a glance at the number alone hints at how
     it's trending overall. The "what does this number mean" explanation
     used to sit inline as permanent small text next to the value; per
     Martin it's now a hover/focus tooltip on the "Estimated GPA" label
     instead (.gpa-tooltip below), same lightweight idiom as a native
     title attribute but styled to match the rest of the app. ---------- */
  .gpa-strip {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 16px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .gpa-label-wrap { position: relative; display: inline-block; cursor: help; }
  .gpa-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .gpa-value { font-size: 1.7rem; font-weight: 900; font-style: italic; line-height: 1; }
  .gpa-tooltip {
    position: absolute;
    left: 0;
    bottom: calc(100% + 9px);
    width: 200px;
    background: var(--panel-bg);
    color: var(--text-dark);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
    line-height: 1.4;
    padding: 9px 11px;
    border-radius: var(--window-radius-sm);
    box-shadow: 0 16px 34px -14px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
    z-index: 30;
  }
  .gpa-label-wrap:hover .gpa-tooltip,
  .gpa-label-wrap:focus-visible .gpa-tooltip { opacity: 1; visibility: visible; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .gpa-tooltip { transition: none; } }
  @media (max-width: 560px) {
    .gpa-strip { flex-direction: column; gap: 2px; }
  }

  /* ---------- Grades table ---------- */
  table.grades-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
  }
  table.grades-table thead th {
    text-align: left;
    font-size: 0.66rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    padding: 0 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  table.grades-table thead th:not(:first-child) { text-align: center; }
  table.grades-table tbody td {
    padding: 13px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--text-dark);
    vertical-align: middle;
  }
  table.grades-table tbody tr:last-child td { border-bottom: none; }
  table.grades-table tbody td:not(:first-child) { text-align: center; }
  table.grades-table tbody tr { cursor: pointer; }
  table.grades-table tbody tr:hover td { background: var(--panel-inner); }
  table.grades-table tbody tr:hover td:first-child { border-top-left-radius: var(--window-radius-sm); border-bottom-left-radius: var(--window-radius-sm); }
  table.grades-table tbody tr:hover td:last-child { border-top-right-radius: var(--window-radius-sm); border-bottom-right-radius: var(--window-radius-sm); }

  /* Class column — same tick + name/code/meta idiom as courses.html so
     this reads as sourced from the same PowerSchool/Schoology data. */
  .course-row { display: flex; align-items: flex-start; gap: 10px; }
  .course-tick { width: 4px; align-self: stretch; min-height: 34px; border-radius: 999px; flex-shrink: 0; margin-top: 1px; }
  .course-row-text { min-width: 0; }
  .course-row-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .course-row-name { font-weight: 700; font-size: 0.86rem; color: var(--text-dark); }
  .course-row-code { font-weight: 700; font-size: 0.7rem; color: var(--text-faint); letter-spacing: 0.01em; }
  .course-row-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .course-row-meta svg { width: 11px; height: 11px; flex-shrink: 0; color: var(--text-faint); }

  .grade-val { font-weight: 800; font-size: 0.9rem; }
  .grade-val.a { color: var(--grade-good); }
  .grade-val.b { color: var(--grade-b); }
  .grade-val.c { color: var(--grade-mid); }
  .grade-val.d { color: var(--grade-d); }
  .grade-val.f { color: var(--grade-bad); }
  .grade-pct { display: block; font-weight: 600; font-size: 0.68rem; color: var(--text-faint); margin-top: 1px; }

  .trend { display: inline-flex; align-items: center; justify-content: center; gap: 3px; font-weight: 700; font-size: 0.82rem; color: var(--text-muted); border-radius: 6px; padding: 3px 7px; }
  .trend .arrow { display: inline-flex; align-items: center; justify-content: center; width: 13px; font-weight: 800; font-size: 0.95rem; transform: translateY(1px); }
  .trend.up { background: rgba(47, 125, 84, 0.14); }
  .trend.down { background: rgba(182, 67, 47, 0.14); }
  .trend.flat { background: rgba(131, 132, 154, 0.14); }
  .trend.up .arrow { color: var(--grade-good); }
  .trend.down .arrow { color: var(--grade-bad); }
  .trend.flat .arrow { color: var(--text-faint); transform: translateY(-3px); }
  .trend .grade-pct { display: inline; margin-top: 0; margin-left: 2px; }

  /* Predicted-grade cell doubles as a hover/focus target for the same
     reasoning popup home.html/courses.html's Grades table has — ported
     over verbatim per the established convention. */
  .trend.has-popup { cursor: help; }
  .trend.has-popup:hover,
  .trend.has-popup:focus-visible { filter: brightness(0.94); }
  .trend.has-popup:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent-ring);
  }

  /* ---------- Predicted-grade reasoning popup — copied verbatim from
     courses.html's .grade-popup. ---------- */
  .grade-popup {
    position: fixed;
    z-index: 50;
    width: 272px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 22px 48px -16px rgba(0,0,0,0.5);
    padding: 14px 16px 10px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
  }
  .grade-popup.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
  }
  .grade-popup h3 {
    margin: 0 0 2px;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text-dark);
  }
  .grade-popup .popup-sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin: 0 0 8px;
    line-height: 1.4;
  }
  .grade-popup .popup-sub strong { color: var(--text-dark); }
  .grade-popup svg { display: block; overflow: visible; }
  .grade-popup .popup-foot {
    font-size: 0.62rem;
    color: var(--text-faint);
    margin: 6px 0 0;
    text-align: right;
    font-style: italic;
  }

  @media (prefers-reduced-motion: reduce) {
    .grade-popup { transition: none; }
  }

  /* Grade Calculator column — a quiet ghost pill (not accent-filled like
     a primary CTA) since it's a secondary action alongside the row's own
     "open the gradebook" click; a calculator glyph makes its purpose
     legible without needing the word to compete with the Predicted
     column's own text at this width. */
  /* The whole cell is a click target now (2026-09-03), not just the pill
     itself — see the JS click-handler comment for why. */
  .calc-cell { cursor: pointer; }

  .calc-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 13px 6px 10px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.72rem;
    color: var(--text-dark);
    cursor: pointer;
  }
  .calc-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .calc-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .calc-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  @media (max-width: 560px) {
    table.grades-table thead { display: none; }
    table.grades-table, table.grades-table tbody, table.grades-table tbody tr, table.grades-table tbody td { display: block; width: 100%; }
    table.grades-table tbody tr { padding: 10px 4px; border-bottom: 1px solid var(--border); }
    table.grades-table tbody td { border-bottom: none; padding: 6px 4px; text-align: left !important; }
    table.grades-table tbody tr:last-child { border-bottom: none; }
    .grade-val, .trend { display: inline-flex; }
    .grade-val .grade-pct { display: inline; margin: 0 0 0 4px; }
    table.grades-table tbody td:nth-child(2)::before { content: 'Grade: '; font-size: 0.7rem; font-weight: 700; color: var(--text-faint); display: block; margin-bottom: 2px; }
    table.grades-table tbody td:nth-child(3)::before { content: 'Predicted: '; font-size: 0.7rem; font-weight: 700; color: var(--text-faint); display: block; margin-bottom: 2px; }
    .calc-btn { width: 100%; justify-content: center; }
    /* The desktop hover treatment above (a shaded background rounded only
       on the row's outer corners, so a single horizontal row reads as one
       rounded pill) leaves stray rounded-corner artifacts once the row's
       cells stack into separate full-width blocks here: each cell now
       renders its own hover background, but only ever rounds two of its
       own four corners (the ones meant for the far-left/far-right edge of
       a desktop row) — so a small rounded nub shows up mid-card, at the
       bottom of the Class cell and the top of the Grade Calculator cell,
       with nothing to visually connect it to. Touch browsers make this
       worse by keeping :hover "stuck" after a tap until something else is
       tapped, so the artifact can sit there persistently rather than only
       flashing by under a mouse. Simplest correct fix: the per-row hover
       shading doesn't read as one coherent shape once stacked, so it's
       turned off at this breakpoint rather than patched corner-by-corner. */
    table.grades-table tbody tr:hover td { background: none; }
    table.grades-table tbody tr:hover td:first-child,
    table.grades-table tbody tr:hover td:last-child { border-radius: 0; }
  }

  /* ---------- Bottom nav — copied verbatim from courses.html. ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has
     to get ... we should add a more button on the far right side with a
     list of the other options"). Labels never truncate: when they would,
     the rightmost pages move into the More menu instead. ---------- */
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;
    margin-left: 4px;
    padding: 12px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-more .label { display: flex; align-items: center; height: 1.2em; font-size: 0.72rem; color: var(--text-faint); }
  .nav-more .label svg { display: block; fill: currentColor; }
  /* thin divider between the pages and the dots */
  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }
  .nav-more.has-active .dot { background: var(--accent); }
  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    pointer-events: auto;
  }
  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-faint);
    text-align: left;
    padding: 12px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  /* Labels sit centered in the bar; the active page is underlined in the
     accent color instead of marked with a dot (2026-10-01, per Martin). */
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }

  /* ---------- Modal shell — copied from course-home.html's course-info
     pop-out (fade + slide-up show/hide, X close button), widened for the

     Grade Calculator note further down: clicking a course row now
     navigates straight to the real gradebook.html instead.) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 60;
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease;
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    max-width: 380px; width: 100%;
    padding: 22px 24px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    transform: translateY(8px);
    transition: transform 0.15s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  /* .wide (the Grade Calculator) scrolls internally — the scrolling has
     to happen on an inner wrapper (.modal-box-scroll), not this element
     itself, or the browser's native scrollbar renders at this box's flat
     edge and pokes out past its own rounded corners (reported 2026-09-01
     by Martin — a screenshot showed the scrollbar thumb sticking out
     above/below the modal). This element now just clips (overflow:
     hidden + the border-radius it already had) and un-pads itself so all
     padding — and the actual overflow-y: auto — moves to the inner div,
     whose content therefore never draws past the rounded corner. */
  .modal-box.wide { max-width: 520px; max-height: 85vh; overflow: hidden; padding: 0; }
  .modal-box-scroll { max-height: 85vh; overflow-y: auto; padding: 22px 24px; }
  .modal-close {

  <script>
    // ---- Links by id (2026-10-07, Martin) ----
    // A real class (Schoology/Classroom ids are digits) links as
    // assignment?id=<id> and course-home?id=<section id>; the sample classes
    // (word ids like "apchem") keep ?course=&title=. Pages read both.
    function avgIsId(v) { return /^\d{1,24}$/.test(String(v == null ? '' : v)); }
    function avgCourseQ(course) { return (avgIsId(course) ? 'id=' : 'course=') + encodeURIComponent(course == null ? '' : course); }
    function avgAssignHref(course, title, id, extra) {
      extra = extra || '';
      if (avgIsId(id) && avgIsId(course)) return `assignment.html?id=${id}${extra}`;
      return `assignment.html?course=${encodeURIComponent(course == null ? '' : course)}&title=${encodeURIComponent(title || '')}${avgIsId(id) ? `&id=${id}` : ''}${extra}`;
    }

    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>

  <script>
    // ------------------------------------------------------------------
    // Shared appearance (accent + background) — 2026-09-08, per Martin:
    // "wallpapers + accent colors don't save across pages." Settings'
    // Appearance section (and onboarding's Theme step) are the only
    // writers of schoolagy_appearance; every other real app page,
    // including this one, applies whatever's saved there, read-only, on
    // its own load — same shared-localStorage-record pattern already
    // used for schoolagy_dark_mode/schoolagy_profile.
    // ------------------------------------------------------------------
    (function () {
      function darken(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }
      function applyAppearance() {
        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));
        }
        if (saved.background === 'white') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#0c0c0e';
        } else if (saved.background) {
          document.body.style.backgroundImage = `url("${saved.background}")`;
          document.body.style.backgroundColor = '';
        }
      }
      applyAppearance();
      window.addEventListener('storage', e => {
        if (e.key === 'schoolagy_appearance') applyAppearance();
      });
    })();

    // ------------------------------------------------------------------
    // Sample data — same six courses as courses.html's COURSES array
    // (same id/name/color/grade/predicted/updated values), trimmed to
    // what this page's wireframe called for: Class, Grade, Predicted
    // Grade, Grade Calculator. No Assignments/Updated columns here —
    // those belong to the All Courses list, not the Grades overview.
    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    // Course customization persistence — added 2026-09-08. Renaming,
    // recoloring, or reordering a course (in home.html's Customize editor
    // or courses.html's Reorder tool — the only places that WRITE these)
    // used to be invisible everywhere else, since every page just
    // re-generated its own hardcoded COURSES array from scratch on load.
    // schoolagy_course_custom holds per-course name/color overrides

    function computeGPA() {

    function niceBounds(values) {
      const min = Math.min(...values), max = Math.max(...values);
      let lo = Math.floor((min - 6) / 10) * 10;
      let hi = Math.ceil((max + 6) / 10) * 10;
      lo = Math.max(0, lo);
      hi = Math.min(100, hi);
      if (hi - lo < 20) { hi = Math.min(100, lo + 20); }
      return [lo, hi];

    // Grades given on the same day become one point: their average, with
    // the date labeled "Aug 18 ×3" (2026-10-01). Otherwise three grades on
    // one day drew as a zigzag across three fake "days".
    function groupSameDay(h) {
      const days = [];
      h.points.forEach((p, i) => {
        const d = h.dates[i];
        const last = days[days.length - 1];
        if (last && last.date === d) { last.sum += p; last.n++; }
        else days.push({ date: d, sum: p, n: 1 });
      });
      return Object.assign({}, h, {
        points: days.map(x => Math.round(x.sum / x.n)),
        dates: days.map(x => x.n > 1 ? `${x.date} ×${x.n}` : x.date),
      });
    }
    function buildGradeChartSVG(course) {
      if (!HISTORY[course.id] || !Array.isArray(HISTORY[course.id].points) || !HISTORY[course.id].points.length) return '<p class="trend-note">No graded work yet. The trend shows up after the first grades.</p>';
      const hist = groupSameDay(HISTORY[course.id]);
      const allLabels = hist.dates.concat(['Predicted']);
      const allValues = hist.points.concat([course.predictedPct]);
      const [yLo, yHi] = niceBounds(allValues);

      const W = 240, H = 108;
      const padL = 26, padR = 6, padT = 10, padB = 16;
      const plotW = W - padL - padR, plotH = H - padT - padB;

      const xFor = i => padL + (i / (allLabels.length - 1)) * plotW;
      const yFor = v => padT + plotH - ((v - yLo) / (yHi - yLo)) * plotH;

      const yTicks = [yLo, Math.round((yLo + yHi) / 2), yHi];
      const gridlines = yTicks.map(t => `
        <line x1="${padL}" x2="${W - padR}" y1="${yFor(t)}" y2="${yFor(t)}" stroke="var(--border)" stroke-width="1"/>
        <text x="${padL - 6}" y="${yFor(t) + 3}" text-anchor="end" font-size="8" fill="var(--text-faint)">${t}%</text>
      `).join('');

      const actualPts = hist.points.map((v, i) => [xFor(i), yFor(v)]);
      const actualLine = actualPts.map(p => p.join(',')).join(' ');
      const actualMarkers = actualPts.map(([x, y]) => `
        <circle cx="${x}" cy="${y}" r="4" fill="${escapeHtml(course.color)}" stroke="var(--panel-bg)" stroke-width="2"/>
      `).join('');

      const predX = xFor(allLabels.length - 1), predY = yFor(course.predictedPct);
      const lastActual = actualPts[actualPts.length - 1];

      const predictedBand = `x="${lastActual[0]}" y="${padT}" width="${predX - lastActual[0]}" height="${plotH}"`;
      const stripeDefs = `
        <pattern id="predStripesGrades" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="${escapeHtml(course.color)}" fill-opacity="0.08"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="${escapeHtml(course.color)}" stroke-width="2.2"/>
        </pattern>
      `;

      const xLabels = allLabels.map((lab, i) => `
        <text x="${xFor(i)}" y="${H - 2}" text-anchor="middle" font-size="7.5" fill="var(--text-faint)">${escapeHtml(lab === 'Predicted' ? 'Pred.' : lab)}</text>
      `).join('');

      return `
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart of ${escapeHtml(course.name)} assignment scores trending toward a predicted grade of ${escapeHtml(course.predictedPct)} percent">
          <defs>${stripeDefs}</defs>
          ${gridlines}
          <rect ${predictedBand} fill="url(#predStripesGrades)" stroke="none"/>
          <polyline points="${actualLine}" fill="none" stroke="${escapeHtml(course.color)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="${lastActual[0]}" y1="${lastActual[1]}" x2="${predX}" y2="${predY}" stroke="${escapeHtml(course.color)}" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
          ${actualMarkers}
          <circle cx="${predX}" cy="${predY}" r="4.5" fill="var(--panel-bg)" stroke="${escapeHtml(course.color)}" stroke-width="2"/>
          <text x="${predX}" y="${predY - 10}" text-anchor="end" font-size="8.5" font-weight="800" fill="var(--text-dark)">${escapeHtml(course.predictedPct)}%</text>
          ${xLabels}
        </svg>
      `;
    }

    const TREND_WORD = { up: 'Trending up', down: 'Trending down', flat: 'Holding steady' };

    function renderGradePopup(course) {
      const hist = HISTORY[course.id];
      if (!hist || !Array.isArray(hist.points) || !hist.points.length) return `<h3>${escapeHtml(course.name)}</h3><p class="popup-sub">No graded work yet. The trend and predicted grade show up after the first grades.</p>`;
      const first = hist.points[0], lastGraded = hist.points[hist.points.length - 1];
      return `
        <h3>${escapeHtml(course.name)}</h3>
        <p class="popup-sub">${TREND_WORD[course.trend]}: <strong>${escapeHtml(first)}% → ${escapeHtml(lastGraded)}%</strong> over the last ${hist.points.length} graded assignments, predicting <strong>${escapeHtml(course.predictedPct)}%</strong> (${escapeHtml(course.predicted)}).</p>
        ${buildGradeChartSVG(course)}
        <p class="popup-foot">Predicted grade extrapolates this trend — not a copy of the current grade.</p>
      `;
    }

    const gradePopup = document.getElementById('gradePopup');
    let popupHideTimer = null;

    function showGradePopup(trigger) {
      clearTimeout(popupHideTimer);
      const course = findCourse(trigger.dataset.course);
      if (!course || !HISTORY[course.id]) return;
      gradePopup.innerHTML = renderGradePopup(course);
      gradePopup.classList.add('show');
      trigger.setAttribute('aria-expanded', 'true');

      const rect = trigger.getBoundingClientRect();
      const popupRect = gradePopup.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - popupRect.width / 2;
      left = Math.max(10, Math.min(left, window.innerWidth - popupRect.width - 10));
      let top = rect.top - popupRect.height - 10;
      if (top < 10) top = rect.bottom + 10;
      gradePopup.style.left = `${left}px`;
      gradePopup.style.top = `${top}px`;
    }

    function hideGradePopup() {
      gradePopup.classList.remove('show');
      document.querySelectorAll('.trend.has-popup[aria-expanded="true"]').forEach(t => t.setAttribute('aria-expanded', 'false'));
    }

    function bindGradePopupTriggers() {
      document.querySelectorAll('.trend.has-popup').forEach(trigger => {
        trigger.addEventListener('mouseenter', () => showGradePopup(trigger));
        trigger.addEventListener('focus', () => showGradePopup(trigger));
        trigger.addEventListener('mouseleave', () => { popupHideTimer = setTimeout(hideGradePopup, 80); });
        trigger.addEventListener('blur', hideGradePopup);
        trigger.addEventListener('keydown', e => { if (e.key === 'Escape') { hideGradePopup(); trigger.blur(); } });
      });
    }

    const CALC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8.01" y2="11"/><line x1="12" y1="11" x2="12.01" y2="11"/><line x1="16" y1="11" x2="16.01" y2="11"/><line x1="8" y1="15" x2="8.01" y2="15"/><line x1="12" y1="15" x2="12.01" y2="15"/><line x1="16" y1="15" x2="16.01" y2="15"/></svg>';

    const gradesBody = document.getElementById('gradesBody');

    function renderGradesTable() {
      gradesBody.innerHTML = '';
      COURSES.forEach(c => {
        const tr = document.createElement('tr');
        tr.dataset.id = c.id;
        tr.tabIndex = 0;
        tr.setAttribute('role', 'link');
        tr.setAttribute('aria-label', `Open ${c.name}'s gradebook`);
        tr.innerHTML = `
          <td>
            <div class="course-row">
              <span class="course-tick" style="background:${escapeHtml(c.color)}"></span>
              <div class="course-row-text">
                <div class="course-row-top">
                  <span class="course-row-name">${escapeHtml(c.name)}</span>
                  <span class="course-row-code">${escapeHtml(c.code)}</span>
                </div>
                <div class="course-row-meta">${escapeHtml(courseMetaLine(c))}</div>
              </div>
            </div>
          </td>
          <td><span class="grade-val ${gradeBand(c.grade)}">${escapeHtml(c.grade)}${c.grade === '—' ? '' : `<span class="grade-pct">${escapeHtml(c.pct)}%</span>`}</span></td>
          <td><span class="trend has-popup ${escapeHtml(c.trend)}" tabindex="0" role="button" aria-haspopup="true" aria-label="${c.predicted === '—' ? `${escapeHtml(c.name)} has no grades yet. Show more.` : `Why is ${escapeHtml(c.name)} predicted ${escapeHtml(c.predicted)}, ${escapeHtml(c.predictedPct)} percent? Show reasoning.`}" data-course="${escapeHtml(c.id)}"><span class="arrow">${TREND_ARROW[c.trend]}</span>${escapeHtml(c.predicted)}${c.predicted === '—' ? '' : `<span class="grade-pct">(${escapeHtml(c.predictedPct)}%)</span>`}</span></td>
          <td class="calc-cell" data-course="${escapeHtml(c.id)}"><button class="calc-btn" type="button" data-course="${escapeHtml(c.id)}" aria-label="Open the grade calculator for ${escapeHtml(c.name)}">${CALC_ICON}Calculate</button></td>
        `;
        gradesBody.appendChild(tr);
      });
      document.getElementById('courseTotal').textContent = `${COURSES.length} total`;
      document.getElementById('courseCountSub').textContent = `${COURSES.length} classes`;
      bindGradePopupTriggers();
    }
    renderGradesTable();
    renderGPA();

    // Row click/Enter → navigate straight to that course's real Gradebook
    // page (2026-08-31, per Martin's request: this used to pop out a
    // read-only preview modal here; now that gradebook.html is a real
    // page, clicking a course goes there directly instead), unless the
    // click actually landed on the Predicted popup trigger or the Grade
    // Calculator button, which keep their own behavior instead.
    function gradesRowNavTarget(el) {
      if (el.closest('.trend') || el.closest('.calc-cell')) return null;
      const row = el.closest('tr[data-id]');
      return row ? row.dataset.id : null;
    }
    function goToGradebook(id) { window.location.href = `gradebook.html?${avgCourseQ(id)}`; }
    gradesBody.addEventListener('click', e => {
      // The whole Grade Calculator cell opens the calculator, not just its
      // small pill button — the button alone left a lot of dead space in
      // that column that fell through to the row's own "open the
      // gradebook" click, which read as the calculator randomly
      // redirecting instead of opening its popup (2026-09-03 fix, per
      // Martin: "it should bring up the pop up on that page, not
      // redirect").
      const calcCell = e.target.closest('.calc-cell');
      if (calcCell) { openCalcModal(calcCell.dataset.course); return; }
      const id = gradesRowNavTarget(e.target);
      if (id) goToGradebook(id);
    });
    gradesBody.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const id = gradesRowNavTarget(e.target);
      if (!id) return;
      e.preventDefault();
      goToGradebook(id);
    });

    // ------------------------------------------------------------------
    // Modal open/close plumbing — same fade+slide pattern as
    // course-home.html's course-info pop-out. (Used to also manage a
    // read-only Gradebook pop-out modal alongside the Calculator — that
    // modal is gone as of 2026-08-31, see the row-click handler above;
    // the Calculator is the only modal left on this page.)
    // ------------------------------------------------------------------
    const calcModal = document.getElementById('calcModal');
    function openModal(overlay) {
      overlay.classList.add('show');
      document.addEventListener('keydown', escCloseHandler);
    }
    function closeModal(overlay) {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', escCloseHandler);
    }
    function escCloseHandler(e) {
      if (e.key === 'Escape' && calcModal.classList.contains('show')) closeModal(calcModal);
    }
    calcModal.addEventListener('click', e => { if (e.target === calcModal) closeModal(calcModal); });

    // ------------------------------------------------------------------
    // Final Grade Calculator — site-map.md's Final Grade Calculator,
    // scoped into a per-course modal rather than its own route for now.
    // State resets fresh every time it's opened for a course: `calcEdits`
    // holds what-if scores keyed by assignment title (every assignment
    // gets an editable input as of 2026-08-31 — see renderCalcCategories
    // below — pre-filled with the real score for a graded one, no upper
    // clamp so extra credit above the assignment's point value is
    // allowed). The standalone Final Exam fields below (see
    // calcFinalCurrent/calcFinalWant/calcFinalWeight) are their own
    // separate calculation and aren't part of `calcEdits`.
    // ------------------------------------------------------------------
    const calcCloseBtn = document.getElementById('calcCloseBtn');
    const calcCategories = document.getElementById('calcCategories');
    const calcFinalCurrent = document.getElementById('calcFinalCurrent');
    const calcFinalWant = document.getElementById('calcFinalWant');
    const calcFinalWeight = document.getElementById('calcFinalWeight');
    const calcFinalAnswer = document.getElementById('calcFinalAnswer');
    const calcResetBtn = document.getElementById('calcResetBtn');
    const calcHeroLabel = document.getElementById('calcHeroLabel');
    const calcHeroLetter = document.getElementById('calcHeroLetter');
    const calcHeroPct = document.getElementById('calcHeroPct');

    let calcCourse = null;
    let calcEdits = {};
    // True once the user has typed into "Current grade" themselves — until
    // then it stays synced to the live category-based projected grade
    // above, same idea as an untouched per-assignment input tracking the
    // real score.
    let calcFinalCurrentTouched = false;

    function assignKey(catName, title) { return catName + '::' + title; }

    // A short muted qualifier after an assignment's title: "(not yet
    // graded)" for a real ungraded item. (The Demonstrated Skills rubric-
    // label qualifier this used to also show was removed 2026-09-01 along
    // with the `status` field it read — see the GRADEBOOK.pe comment.)
    function calcAssignQualifier(a) {
      if (!a.graded) return ` <span style="color:var(--text-faint); font-weight:600;">(not yet graded)</span>`;
      return '';
    }

    // Every assignment gets an editable input now (2026-08-31, per
    // Martin's request to be able to change any grade — not just fill in
    // an ungraded one — to see the hypothetical effect on the overall
    // grade). A graded assignment's input is pre-filled with its real
    // score; an ungraded one starts blank, same as before. An untouched
    // graded input still uses the real score in recomputeCalc() below,
    // so opening the Calculator and not touching anything reproduces the
    // real grade exactly.
    function renderCalcCategories() {
      const gb = GRADEBOOK[calcCourse.id];
      if (!gb || !Array.isArray(gb.categories) || !gb.categories.length) { calcCategories.innerHTML = '<p class="calc-empty">Nothing graded in this class yet.</p>'; return; }
      const weighted = gbWeighted(gb);
      calcCategories.innerHTML = gb.categories.map(cat => {
        const rows = cat.assignments.map(a => {
          const key = assignKey(cat.name, a.title);
          const defaultVal = a.graded ? a.score : '';
          const val = calcEdits[key] !== undefined ? calcEdits[key] : defaultVal;
          return `
            <div class="calc-assign-row">
              <span class="calc-assign-title">${escapeHtml(a.title)}${calcAssignQualifier(a)}</span>
              <span class="calc-assign-score">
                <input class="calc-input hyp" type="number" min="0" placeholder="?" value="${escapeHtml(val)}" data-key="${escapeHtml(key)}" data-points="${escapeHtml(a.points)}" aria-label="Score for ${escapeHtml(a.title)}, out of ${escapeHtml(a.points)}, extra credit above ${escapeHtml(a.points)} allowed"><span class="calc-out-of">/ ${escapeHtml(a.points)}</span>
              </span>
            </div>
          `;
        }).join('');
        return `
          <div class="calc-category">
            <div class="calc-category-head">
              <span class="calc-category-name">${escapeHtml(cat.name)}</span>
              <span class="calc-category-weight" data-base-weight="${escapeHtml(cat.weight)}">${escapeHtml(gbWeightLabel(cat, weighted))}</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');
    }

    // The category breakdown always reflects its own real weights now —
    // the old "scale categories down to make room for a hypothetical
    // final" behavior went away with the checkbox it was tied to
    // (2026-09-01). The Final Exam section below is a separate, simpler
    // calculation: given a current grade, a target grade, and how much
    // the final is worth, solve for the score still needed — it doesn't
    // feed back into the category list above.
    function recomputeCalc() {
      const gb = GRADEBOOK[calcCourse.id];
      const cats = gb && Array.isArray(gb.categories) ? gb.categories : [];
      const weighted = gbWeighted(gb);
      let overall = 0, weightUsed = 0, allEarned = 0, allPossible = 0;
      cats.forEach(cat => {
        let earned = 0, possible = 0;
        cat.assignments.forEach(a => {
          const key = assignKey(cat.name, a.title);
          const raw = calcEdits[key];
          let scoreToUse = null;
          if (raw !== undefined && raw !== '' && !isNaN(Number(raw))) {
            scoreToUse = Number(raw);
          } else if (a.graded) {
            scoreToUse = a.score;
          }
          // else: still ungraded and no hypothetical entered — excluded,
          // same as before (doesn't count as a zero).
          if (scoreToUse !== null) { earned += scoreToUse; possible += a.points; }
        });
        // A category with nothing counted yet is left out and the other
        // weights scale up (2026-10-05), as in Google Classroom.
        if (possible > 0) {
          const w = Number(cat.weight) > 0 ? Number(cat.weight) : 0;
          overall += (earned / possible) * 100 * w; weightUsed += w;
          allEarned += earned; allPossible += possible;
        }
      });
      // Weighted: the categories with work, scaled. No weights at all (a
      // total-points class): every point counts. Nothing counted yet: "—",
      // not an F (2026-10-06).
      const raw = weighted ? (weightUsed > 0 ? overall / weightUsed : null) : (allPossible > 0 ? (allEarned / allPossible) * 100 : null);
      if (raw === null || !isFinite(raw)) {
        calcHeroLetter.textContent = '—';
        calcHeroLetter.style.color = '';
        calcHeroPct.textContent = '';
        calcHeroLabel.textContent = Object.keys(calcEdits).length > 0 ? 'Projected grade' : 'Current grade';
        calcCategories.querySelectorAll('.calc-category').forEach((box, i) => {
          const cat = cats[i];
          if (cat) box.querySelector('.calc-category-weight').textContent = gbWeightLabel(cat, weighted);
        });
        if (!calcFinalCurrentTouched) calcFinalCurrent.value = '';
        updateFinalAnswer();
        return;
      }

      const pct = Math.max(0, Math.min(100, raw));
      const letter = letterFromPct(pct);
      calcHeroLetter.textContent = letter;
      calcHeroLetter.style.color = GRADE_COLOR[gradeBand(letter)];
      calcHeroPct.textContent = `${pct.toFixed(1)}%`;
      // "Current grade" until an assignment's real score is actually
      // edited (calcEdits empty means every input is still showing its
      // real value) — flips to "Projected grade" the moment there's a
      // hypothetical in play, per Martin.
      calcHeroLabel.textContent = Object.keys(calcEdits).length > 0 ? 'Projected grade' : 'Current grade';

      calcCategories.querySelectorAll('.calc-category').forEach((box, i) => {
        const cat = cats[i];
        if (cat) box.querySelector('.calc-category-weight').textContent = gbWeightLabel(cat, weighted);
      });

      // Keep "Current grade" synced to the live projected grade above
      // unless the user has typed their own number in — same touched-flag
      // idiom used for the per-assignment inputs.
      if (!calcFinalCurrentTouched) calcFinalCurrent.value = pct.toFixed(1);
      updateFinalAnswer();
    }

    // Final Exam mini-calculator (2026-09-01, per Martin's reference
    // screenshot of a standalone "Final Grade Calculator" tool) — solves
    // for the score needed on the final, the reverse of the category
    // calculator above (which projects a grade forward from scores).
    // overall = current*(1 - w) + needed*w  →  needed = (want - current*(1-w)) / w
    function updateFinalAnswer() {
      const current = Number(calcFinalCurrent.value);
      const wantRaw = calcFinalWant.value;
      const weight = Math.max(1, Math.min(100, Number(calcFinalWeight.value) || 0));
      if (wantRaw === '' || isNaN(current) || isNaN(weight)) {
        calcFinalAnswer.textContent = '';
        return;
      }
      const want = Number(wantRaw);
      if (isNaN(want)) { calcFinalAnswer.textContent = ''; return; }
      const w = weight / 100;
      const needed = (want - current * (1 - w)) / w;
      if (needed > 100) {
        const bestCase = (current * (1 - w) + 100 * w).toFixed(1);
        calcFinalAnswer.innerHTML = `Even a perfect <strong>100%</strong> on the final won't get you to <strong>${want}%</strong> — the highest you could reach is <strong>${bestCase}%</strong>.`;
      } else if (needed <= 0) {
        calcFinalAnswer.innerHTML = `You're already there — even a <strong>0%</strong> on the final keeps you at or above <strong>${want}%</strong>.`;
      } else {
        calcFinalAnswer.innerHTML = `You need <strong>${needed.toFixed(1)}%</strong> on the final exam to get <strong>${want}%</strong> in the class.`;
      }
    }

    function openCalcModal(courseId) {
      const course = findCourse(courseId);
      if (!course) return;
      calcCourse = course;
      calcEdits = {};
      calcFinalCurrentTouched = false;
      calcFinalWant.value = '';
      calcFinalWeight.value = 20;
      document.getElementById('calcCourseName').textContent = course.name;
      renderCalcCategories();
      recomputeCalc();
      openModal(calcModal);
    }
    calcCloseBtn.addEventListener('click', () => closeModal(calcModal));

    calcCategories.addEventListener('input', e => {
      const input = e.target.closest('.calc-input');
      if (!input) return;
      const key = input.dataset.key;
      // No upper clamp (2026-09-01, per Martin: some teachers give extra
      // credit, so a hypothetical score can legitimately exceed the
      // assignment's own point value) — only floor at 0.
      let val = input.value;
      if (val !== '' && Number(val) < 0) { val = '0'; input.value = val; }
      calcEdits[key] = val;
      recomputeCalc();
    });

    calcFinalCurrent.addEventListener('input', () => { calcFinalCurrentTouched = true; updateFinalAnswer(); });
    calcFinalWant.addEventListener('input', updateFinalAnswer);
    calcFinalWeight.addEventListener('input', updateFinalAnswer);

    calcResetBtn.addEventListener('click', () => {
      calcEdits = {};
      calcFinalCurrentTouched = false;
      calcFinalWant.value = '';
      calcFinalWeight.value = 20;
      renderCalcCategories();
      recomputeCalc();
    });

    // Nav — Home/Courses/Assignments are real pages now; Calendar/
    // Messages/Settings stay visual-only placeholders, same convention
    // used everywhere else in the app.
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile) return;
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || 'M';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'grades.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Grades';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
</html>
