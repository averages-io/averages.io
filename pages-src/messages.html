  <script>
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>

  <script>
    (function () {
      function darken(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }
      function applyAppearance() {
        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));
        }
        if (saved.background === 'white') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#0c0c0e';
        } else if (saved.background) {
          document.body.style.backgroundImage = `url("${saved.background}")`;
          document.body.style.backgroundColor = '';
        }
      }
      applyAppearance();
      window.addEventListener('storage', e => {
        if (e.key === 'schoolagy_appearance') applyAppearance();
      });
    })();

    const MSG_AV = window.__AVERAGES__;
    const MSG_LIVE = !!(MSG_AV && MSG_AV.data && MSG_AV.mode === 'live');
    const MSG_DATA = MSG_LIVE ? MSG_AV.data : {};
    const MSG_CLASSROOM = MSG_LIVE && (MSG_DATA.platform === 'classroom' || MSG_DATA.PEOPLE_PLATFORM === 'classroom');
    const MSG_API = window.location.hostname.endsWith('averages.io') ? 'https://api.averages.io' : 'http://localhost:8787';
    // Anyone who isn't one of the student's teachers gets this grey.
    const MSG_NEUTRAL = '#83849a';
    // The student's teachers, as the people extra sent them. The To search
    // lists them first; everyone else comes from GET /messages/recipients.
    const MSG_TEACHER_IDS = new Set(MSG_DATA.TEACHERS && typeof MSG_DATA.TEACHERS === 'object' ? Object.keys(MSG_DATA.TEACHERS) : []);
    let MSG_PEOPLE = MSG_DATA.MESSAGE_PEOPLE && typeof MSG_DATA.MESSAGE_PEOPLE === 'object' ? MSG_DATA.MESSAGE_PEOPLE : {};
    let liveInboxState = Array.isArray(MSG_DATA.CONVERSATIONS) ? 'ready' : 'error'; // 'ready' | 'loading' | 'error'
    let liveRecipientIds = [];
    let liveRecipientsState = 'idle'; // 'idle' | 'loading' | 'ready' | 'error'
    let liveRecipientsPromise = Promise.resolve();
    let liveLocalSeq = 0;
    let liveNoteTimer = null;
    let MSG_ME = MSG_DATA.MESSAGES_ME != null ? String(MSG_DATA.MESSAGES_ME) : '';

    function liveText(value, max) {
      return (value == null ? '' : String(value)).trim().slice(0, max);
    }
    // Colors land in style attributes: only a plain hex color gets through.
    function liveColor(value) {
      const v = String(value || '').trim();
      return /^#[0-9a-f]{6}$/i.test(v) ? v : MSG_NEUTRAL;
    }

    // The people extra's TEACHERS[id].course is a course id, so the line
    // under a teacher's name is their classes from CONTACTS (or that
    // course's name from the bundle).
    function liveSetupPeople() {
      if (!MSG_DATA.TEACHERS || typeof MSG_DATA.TEACHERS !== 'object') Object.keys(TEACHERS).forEach(k => { delete TEACHERS[k]; });
      if (!Array.isArray(MSG_DATA.CONTACTS)) CONTACTS.length = 0;
      const courses = Array.isArray(MSG_DATA.COURSES) ? MSG_DATA.COURSES : [];
      const contacts = CONTACTS.filter(c => c && c.id != null && String(c.id) !== '').map(c => ({
        id: String(c.id),
        name: liveText(c.name, 120) || 'Schoology user',
        role: liveText(c.role, 80),
        dept: liveText(c.dept, 200),
        color: liveColor(c.color),
      }));
      CONTACTS.length = 0;
      contacts.forEach(c => CONTACTS.push(c));
      Object.keys(TEACHERS).forEach(id => {
        const t = TEACHERS[id] || {};
        const contact = contacts.find(c => c.id === id);
        const course = courses.find(c => c && String(c.id) === String(t.course));
        TEACHERS[id] = {
          name: liveText(t.name, 120) || (contact && contact.name) || 'Schoology user',
          course: (contact && contact.dept) || (course ? liveText(course.name, 200) : ''),
          color: liveColor(t.color),
        };
      });
    }

    // Every thread's person has an entry in TEACHERS, this page's one lookup
    // for names and colors: the teacher's own, else the name the messages
    // extra sent, else "Schoology user". Returns the id as a string.
    function livePerson(id) {
      const key = id == null ? '' : String(id);
      if (!TEACHERS[key]) {
        const known = MSG_PEOPLE[key];
        const name = known ? liveText(known.name, 120) : '';
        TEACHERS[key] = { name: name || 'Schoology user', course: '', color: MSG_NEUTRAL, unnamed: !name };
      }
      return key;
    }
    function personName(id) {
      return (TEACHERS[id] && TEACHERS[id].name) || 'Schoology user';
    }

    function liveSetConversations(list) {
      const next = (Array.isArray(list) ? list : []).filter(c => c && c.id != null && String(c.id) !== '').map(c => {
        const participants = Array.isArray(c.participants) ? c.participants.map(String) : [];
        const convo = {
          id: String(c.id),
          personId: livePerson(c.personId != null && c.personId !== '' ? c.personId : participants[0]),
          subject: liveText(c.subject, 200) || 'No subject',
          unread: !!c.unread,
          preview: liveText(c.preview, 280),
          time: liveText(c.time, 40),
          at: Number(c.at) || 0,
          participants,
          messages: [],
        };
        Object.assign(convo, deriveMedia(convo));
        return convo;
      });
      CONVERSATIONS.length = 0;
      next.forEach(c => CONVERSATIONS.push(c));
    }

    // The newest message, or for a thread that hasn't been opened yet a
    // stand-in built from its preview.
    function lastMessageOf(c) {
      return c.messages[c.messages.length - 1] || { from: 'them', text: c.preview || '', time: c.time || '' };
    }
    function rowTimeLabel(c, last) {
      if (last.sentAt) return relativeTime(last.sentAt);
      if (MSG_LIVE && c.time) return c.time;
      return String(last.time || '').split(' · ')[0];
    }
    // What search can see of a thread: its loaded messages, else its preview.
    function searchableMessages(c) {
      if (c.messages.length) return c.messages.map((m, i) => ({ c, i, m }));
      return c.preview ? [{ c, i: -1, m: lastMessageOf(c) }] : [];
    }
    function threadHasSeveralAuthors(c) {
      return new Set(c.messages.filter(m => m.from === 'them' && m.authorId).map(m => m.authorId)).size > 1;
    }

    function msgZone() {
      let tz = '';
      try { tz = (window.averagesTimeZone ? window.averagesTimeZone() : Intl.DateTimeFormat().resolvedOptions().timeZone) || ''; } catch (e) {}
      return tz ? '&tz=' + encodeURIComponent(tz) : '';
    }
    function liveFetch(path, body) {
      const init = { method: body ? 'POST' : 'GET', credentials: 'include' };
      if (body) {
        init.headers = { 'Content-Type': 'application/json' };
        init.body = JSON.stringify(body);
      }
      return fetch(MSG_API + path, init).then(r => {
        if (r.ok) return r.json();
        // The API's reason (e.g. "recipient_not_allowed") decides what a
        // failed send tells the student.
        return r.json().catch(() => ({})).then(j => {
          throw Object.assign(new Error('http ' + r.status), { status: r.status, code: j && typeof j.error === 'string' ? j.error : '' });
        });
      });
    }

    // What a failed send says. Retry only where trying again can help: no
    // connection, Schoology busy or down, or too many messages at once.
    const LIVE_SEND_ERRORS = {
      bad_recipients: "Schoology didn't accept who this is to.",
      empty_subject: 'Add a subject first.',
      subject_too_long: 'The subject is too long (200 characters at most).',
      empty_message: 'Type a message first.',
      message_too_long: 'The message is too long (10,000 characters at most).',
      recipient_not_allowed: "Your school doesn't let you message this person.",
      school_blocks_new_messages: "Your school's Schoology settings don't let students start a new message to them. You can still reply when they message you.",
      no_recipients: 'No one is left in this conversation to reply to.',
      too_many_recipients: 'Too many people are in this conversation to reply here.',
      rate_limited: 'Too many messages at once. Wait a minute, then retry.',
    };
    function liveSendError(err) {
      const status = err && err.status;
      if (status === 404) return { text: 'This conversation is gone from Schoology.', retry: false };
      return {
        text: LIVE_SEND_ERRORS[err && err.code] || "Couldn't send.",
        retry: !status || status >= 500 || status === 429,
      };
    }
    // Replies go to everyone in the thread (like Schoology's own reply), so
    // a group thread's composer says so.
    function liveComposerPlaceholder(c) {
      const others = c ? (c.participants || []).filter(id => id && id !== MSG_ME).length : 0;
      composerInput.placeholder = others > 1 ? 'Reply to everyone…' : 'Type a message…';
    }
    // Schoology refuses a new message without a subject (400 empty_subject).
    function liveNeedSubject() {
      subjectInput.setAttribute('aria-invalid', 'true');
      subjectInput.focus();
      showComposerNote('Add a subject first.');
    }

    function liveInboxStateHtml() {
      if (liveInboxState === 'loading') return '<p class="msgs-empty-hint" role="status">Loading your messages…</p>';
      return `<div class="msgs-list-state" role="alert">
          <p class="msgs-list-state-title">We couldn't load your messages.</p>
          <p>Schoology didn't answer. Check your connection and try again.</p>
          <button type="button" class="msgs-state-btn" data-action="retry-inbox">Try again</button>
        </div>`;
    }
    function emptyListHtml() {
      if (pendingThread) return '';
      if (MSG_LIVE && !CONVERSATIONS.length) {
        return `<div class="msgs-list-state">
            <p class="msgs-list-state-title">No messages yet</p>
            <p>Teacher messages show up here. Use + to write one.</p>
          </div>`;
      }
      return `<p class="msgs-empty-hint">No conversations match.</p>`;
    }
    function liveRetryInbox() {
      liveInboxState = 'loading';
      renderThreadList();
      liveFetch('/messages').then(data => {
        if (!data || !Array.isArray(data.CONVERSATIONS)) throw new Error('no conversations');
        if (data.PEOPLE && typeof data.PEOPLE === 'object') MSG_PEOPLE = data.PEOPLE;
        if (data.me != null) MSG_ME = String(data.me);
        // A thread started here that Schoology hasn't confirmed yet stays.
        const unconfirmed = CONVERSATIONS.filter(c => c.localThread);
        liveSetConversations(data.CONVERSATIONS);
        unconfirmed.reverse().forEach(c => CONVERSATIONS.unshift(c));
        liveInboxState = 'ready';
      }).catch(() => { liveInboxState = 'error'; }).then(renderThreadList);
    }

    function liveThreadStateHtml(c, compact) {
      if (c.load === 'error') {
        return `<div class="msgs-thread-state${compact ? ' compact' : ''}" role="alert"><p class="msgs-empty-hint">We couldn't load this conversation.</p><button type="button" class="msgs-state-btn" data-action="retry-thread" data-id="${escapeHtml(c.id)}">Try again</button></div>`;
      }
      return '<p class="msgs-empty-hint" role="status">Loading messages…</p>';
    }
    // Loads a thread's messages once; opening it again uses this copy.
    // Opening it also marks it read on Schoology (the API does that).
    function liveLoadThread(c) {
      if (c.load === 'ready' || c.localThread) return Promise.resolve();
      if (c.load === 'loading' && c.loading) return c.loading;
      c.load = 'loading';
      c.loading = liveFetch('/messages/thread?id=' + encodeURIComponent(c.id) + msgZone()).then(data => {
        const list = Array.isArray(data && data.messages) ? data.messages : [];
        const loaded = list.filter(m => m && typeof m === 'object').map(m => {
          const mine = m.from === 'me';
          return {
            from: mine ? 'me' : 'them',
            authorId: !mine && m.authorId != null && m.authorId !== '' ? livePerson(m.authorId) : '',
            text: liveText(m.text, 10000),
            time: liveText(m.time, 60),
            at: Number(m.at) || 0,
            attachments: [].concat(
              (Array.isArray(m.files) ? m.files : []).filter(f => f && /^\d{1,24}$/.test(String(f.id))).slice(0, 10).map(f => {
                const q = '/messages/file?thread=' + encodeURIComponent(c.id) + '&file=' + encodeURIComponent(String(f.id));
                return { kind: 'doc', name: liveText(f.name, 200) || 'File', url: MSG_API + q + '&view=1', dl: MSG_API + q, real: true };
              }),
              (Array.isArray(m.links) ? m.links : []).filter(l => l && /^https?:\/\//i.test(String(l.url))).slice(0, 10).map(l => ({ kind: 'link', title: liveText(l.title, 200) || String(l.url).replace(/^https?:\/\//i, '').replace(/\/$/, ''), url: String(l.url) }))
            ),
          };
        });
        c.messages = loaded.concat(c.messages.filter(m => m.local));
        if (Array.isArray(data.participants)) c.participants = data.participants.map(String);
        c.load = 'ready';
      }, () => { c.load = 'error'; }).then(() => {
        c.loading = null;
        Object.assign(c, deriveMedia(c));
        liveRefreshThreadView(c);
        renderThreadList();
      });
      return c.loading;
    }
    // "All subjects" with one person: load their threads one after another.
    function liveLoadThreads(threads) {
      threads.reduce((chain, t) => chain.then(() => liveLoadThread(t)), Promise.resolve());
    }
    function liveRetryThread(id) {
      const c = CONVERSATIONS.find(x => x.id === id);
      if (!c || c.load !== 'error') return;
      c.load = undefined;
      liveLoadThread(c);
      liveRefreshThreadView(c);
    }
    // Redraws a thread if it's the one on screen (alone or in All subjects).
    function liveRefreshThreadView(c) {
      if (pendingThread) return;
      if (activeConvoId === c.id) {
        renderSubjectDropdown(c.personId, c.id);
        setComposerEnabled(c.load === 'ready', false);
        liveComposerPlaceholder(c);
        renderBubbles(c);
      } else if (viewingAllSubjectsFor && viewingAllSubjectsFor === c.personId) {
        renderMergedBubbles(threadsForPerson(c.personId));
      }
    }

    // Who the student may message (Schoology's own list, already filtered
    // by the district's rules). Loaded the first time New Message opens;
    // after a failure the next New Message tries again. Never rejects.
    function liveLoadRecipients() {
      if (liveRecipientsState === 'ready' || liveRecipientsState === 'loading') return liveRecipientsPromise;
      liveRecipientsState = 'loading';
      liveRecipientsPromise = liveFetch('/messages/recipients').then(data => {
        const list = Array.isArray(data && data.recipients) ? data.recipients : [];
        let renamed = false;
        liveRecipientIds = [];
        list.forEach(r => {
          const id = r && r.id != null ? String(r.id) : '';
          const name = r ? liveText(r.name, 120) : '';
          if (!/^\d+$/.test(id) || !name) return;
          liveRecipientIds.push(id);
          const t = TEACHERS[id];
          if (!t) TEACHERS[id] = { name, course: '', color: MSG_NEUTRAL };
          else if (t.unnamed) { t.name = name; t.unnamed = false; renamed = true; }
        });
        liveRecipientsState = 'ready';
        if (renamed) renderThreadList();
      }, () => { liveRecipientsState = 'error'; }).then(() => {
        // The To results were open while this loaded: show the new matches.
        if (!toResults.hidden && pendingThread && !pendingThread.personId) renderToResults(toInput.value);
      });
      return liveRecipientsPromise;
    }
    function liveDirectoryMatches(q) {
      const ids = new Set([...MSG_TEACHER_IDS, ...liveRecipientIds]);
      return [...ids]
        .filter(id => TEACHERS[id] && TEACHERS[id].name.toLowerCase().includes(q))
        .sort((a, b) => ((MSG_TEACHER_IDS.has(b) ? 1 : 0) - (MSG_TEACHER_IDS.has(a) ? 1 : 0)) || TEACHERS[a].name.localeCompare(TEACHERS[b].name))
        .slice(0, MAX_TO_RESULTS)
        .map(id => [id, TEACHERS[id]]);
    }
    function liveNoMatchText(query) {
      if (liveRecipientsState === 'loading') return 'Looking for people you can message…';
      return `No one you can message matches "${escapeHtml(query)}".`;
    }
    function livePersonIdByName(name) {
      const want = name.trim().toLowerCase();
      return [...MSG_TEACHER_IDS, ...liveRecipientIds].find(id => TEACHERS[id] && TEACHERS[id].name.toLowerCase() === want) || '';
    }
    // ?compose=<id>&name=&dept=&color= from a course page or Contacts. A
    // real Schoology id is digits; a course page that couldn't match the
    // teacher sends a made-up id with their name, so they're found by name.
    function liveComposeDeepLink(composeId, params) {
      if (MSG_CLASSROOM) return;
      const name = liveText(params.get('name'), 120);
      const realId = /^\d+$/.test(composeId) ? composeId : '';
      const known = () => (realId && TEACHERS[realId] ? realId : (name ? livePersonIdByName(name) : ''));
      const id = known();
      if (id) { startNewThreadWith(id); return; }
      liveLoadRecipients().then(() => {
        if (pendingThread || activeConvoId) return; // they've moved on
        const found = known();
        if (found) { startNewThreadWith(found); return; }
        startComposeMode();
        if (name) { toInput.value = name; renderToResults(name); }
      });
    }

    function showComposerNote(text) {
      const note = document.getElementById('composerNote');
      if (!note) return;
      note.textContent = text;
      note.hidden = false;
      clearTimeout(liveNoteTimer);
      liveNoteTimer = setTimeout(() => { note.hidden = true; }, 4000);
    }

    // Sending, signed in. The message shows right away as "Sending…", then
    // "Just now", or "Not sent" with Retry. A pasted link still shows as a
    // link here but goes to Schoology as plain text, exactly as typed.
    function liveSendComposerMessage() {
      const raw = composerInput.value.trim().slice(0, 10000);
      if (!raw) return;
      if (pendingThread && !pendingThread.personId) { toInput.focus(); return; }
      const { text, linkAttachment } = extractLinkAttachment(raw);
      const msg = { from: 'me', text, time: 'Sending…', body: raw, local: true, localId: `m${++liveLocalSeq}` };
      if (linkAttachment) msg.attachments = [linkAttachment];
      let c;
      if (pendingThread) {
        const personId = pendingThread.personId;
        const subject = (pendingThread.subject || '').trim().slice(0, 200);
        if (!subject) { liveNeedSubject(); return; }
        c = { id: `local-${Date.now()}`, personId, subject, unread: false, preview: '', time: '', at: Date.now(), participants: [personId], messages: [msg], load: 'ready', localThread: true };
        msg.create = { recipientIds: [personId], subject };
        CONVERSATIONS.unshift(c);
        pendingThread = null;
        activeConvoId = c.id;
      } else {
        c = CONVERSATIONS.find(x => x.id === activeConvoId);
        if (!c || c.load !== 'ready') return;
        c.messages.push(msg);
        // Newest first, like the inbox.
        CONVERSATIONS.splice(CONVERSATIONS.indexOf(c), 1);
        CONVERSATIONS.unshift(c);
      }
      Object.assign(c, deriveMedia(c));
      composerInput.value = '';
      composerInput.classList.remove('msgs-composer-link-active');
      showThread(c);
      renderThreadList();
      liveDeliver(c, msg);
    }
    function liveDeliver(c, msg) {
      msg.status = 'sending';
      msg.time = 'Sending…';
      msg.sentAt = undefined;
      msg.error = '';
      liveRefreshThreadView(c);
      let request;
      if (msg.create) {
        request = c.creating = liveFetch('/messages', { recipientIds: msg.create.recipientIds, subject: msg.create.subject, message: msg.body }).then(res => {
          if (!res || res.ok === false) throw new Error('not sent');
          delete msg.create;
          // With Schoology's id, replies in this thread go to that thread.
          const id = res.id != null ? String(res.id) : '';
          if (/^\d+$/.test(id)) {
            if (activeConvoId === c.id) activeConvoId = id;
            c.id = id;
            c.localThread = false;
          }
        });
      } else {
        // A reply in a thread started here waits for the thread to exist.
        request = (c.creating || Promise.resolve()).catch(() => {}).then(() => {
          if (c.localThread) throw new Error('thread not created');
          return liveFetch('/messages/reply', { id: c.id, message: msg.body });
        }).then(res => { if (!res || res.ok === false) throw new Error('not sent'); });
      }
      request.then(() => {
        if (msg.create) { try { localStorage.removeItem('averages_msg_new_blocked'); } catch {} }
        msg.status = 'sent';
        msg.sentAt = Date.now();
        msg.time = 'Just now';
      }, err => {
        const why = liveSendError(err);
        msg.status = 'failed';
        msg.time = 'Not sent';
        msg.error = why.text;
        msg.canRetry = why.retry;
        if (err && err.code === 'school_blocks_new_messages') {
          msg.sgy = true; msg.error = 'Your school only lets students start new conversations on Schoology.';
          try { localStorage.setItem('averages_msg_new_blocked', String(Date.now())); } catch {}
          sgyOpen(true, ((c.subject ? c.subject + '\n\n' : '') + (msg.body || '')).trim());
        }
      }).then(() => {
        liveRefreshThreadView(c);
        renderThreadList();
      });
    }
    function schoologyHome() {
      let host = '';
      try { const s = JSON.parse(localStorage.getItem('averages_login_school') || 'null'); host = String((s && s.schoology && s.schoology.domain) || '').toLowerCase(); } catch {}
      return 'https://' + (/^(?=.{4,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(host) ? host : 'app.schoology.com');
    }
    function sgyOpen(turnedDown, draft) {
      if (document.getElementById('msgsSgy')) return;
      const from = document.activeElement;
      const wrap = document.createElement('div');
      wrap.className = 'msgs-sgy-scrim'; wrap.id = 'msgsSgy';
      wrap.innerHTML = `<div class="msgs-sgy-box" role="dialog" aria-modal="true" aria-labelledby="msgsSgyT">
          <h2 id="msgsSgyT">Start it in Schoology</h2>
          <p>${turnedDown ? 'Your school only lets students start new conversations on Schoology itself.' : 'Start a conversation on Schoology’s site when your school doesn’t let Averages.io start it.'}</p>
          <ol><li>Open Schoology${draft ? '. We copy your message for you' : ''}.</li><li>Click <b>New Message</b>, pick your teacher${draft ? ' and paste' : ''}.</li><li>When they answer, it shows up here and you can reply from Averages.io.</li></ol>
          <div class="msgs-sgy-acts"><button type="button" data-sgy="x">Not now</button><button type="button" class="go" data-sgy="go">Open Schoology</button></div>
        </div>`;
      document.body.appendChild(wrap);
      const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey, true); if (from && from.isConnected) from.focus(); };
      const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); close(); } };
      document.addEventListener('keydown', onKey, true);
      wrap.addEventListener('click', e => {
        const b = e.target.closest('[data-sgy]');
        if (e.target === wrap || (b && b.dataset.sgy === 'x')) { close(); return; }
        if (b && b.dataset.sgy === 'go') {
          if (draft) { try { navigator.clipboard.writeText(draft).then(() => showComposerNote('Copied your message. Paste it in Schoology.'), () => {}); } catch {} }
          window.open(schoologyHome() + '/messages', '_blank', 'noopener');
          close();
        }
      });
      wrap.querySelector('[data-sgy="go"]').focus();
    }
    function liveRetryMessage(localId) {
      for (const c of CONVERSATIONS) {
        const msg = c.messages.find(m => m.localId === localId);
        if (msg && msg.status === 'failed') { liveDeliver(c, msg); return; }
      }
    }

    function liveInit() {
      msgsShell.classList.add('live');
      composerInput.maxLength = 10000;
      subjectInput.maxLength = 200;
      subjectInput.required = true;
      subjectInput.placeholder = 'Subject (required)';
      subjectInput.addEventListener('input', () => subjectInput.removeAttribute('aria-invalid'));
      threadList.addEventListener('click', e => {
        if (e.target.closest('[data-action="retry-inbox"]')) liveRetryInbox();
      });
      if (MSG_CLASSROOM) {
        msgsShell.classList.add('no-messaging');
        const emo = threadEmpty.querySelector('.emo');
        threadEmpty.textContent = '';
        if (emo) threadEmpty.appendChild(emo);
        threadEmpty.insertAdjacentHTML('beforeend', `
          <p class="msgs-no-messaging-title">Google Classroom doesn't have messages.</p>
          <p class="hint">Your teachers' announcements are on Home and each class page.</p>
          <a class="msgs-state-btn" href="home.html">Go to Home</a>`);
        updateSubtitle();
      }
    }

    const TEACHERS = {
      cho: { name: 'Mr. Cho', course: 'English 10', color: '#6b8f5e' },
      alvarez: { name: 'Mr. Alvarez', course: 'AP Chemistry', color: '#a67a22' },
      whitfield: { name: 'Ms. Whitfield', course: 'Algebra II', color: '#5b6ea3' },

      if (diffHr < 24) return `${diffHr} hour${diffHr === 1 ? '' : 's'} ago`;

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function openBubbleAttachment(el) {
      const kind = el.dataset.kind;
      if (kind === 'link') {
        let url = el.dataset.url || '';
        if (url && !/^https?:\/\//i.test(url)) url = `https://${url}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      } else if (kind === 'doc' && el.dataset.url && /^https?:\/\//i.test(el.dataset.url)) {
        window.open(el.dataset.url, '_blank', 'noopener');   // a real file someone sent
      } else if (kind === 'doc' || kind === 'video' || kind === 'audio') {
        downloadPlaceholderAttachment(el.dataset.name);
      }
    }
    // Delegated on #threadBubbles so it covers every attachment in both the
    // normal single-thread view and the merged "All subjects" timeline
    // (both render into this same container) without needing to rewire
    // anything on every re-render.
    threadBubbles.addEventListener('click', e => {
      const retry = e.target.closest('.msgs-retry-btn');
      if (retry) { liveRetryMessage(retry.dataset.localId); return; }
      const sg = e.target.closest('[data-action="start-in-schoology"]');
      if (sg) { const c = CONVERSATIONS.find(x => x.messages.some(m => m.localId === sg.dataset.localId)); const m = c && c.messages.find(x => x.localId === sg.dataset.localId); sgyOpen(true, c && m ? ((c.subject ? c.subject + '\n\n' : '') + (m.body || '')).trim() : ''); return; }
      const again = e.target.closest('[data-action="retry-thread"]');
      if (again) { liveRetryThread(again.dataset.id); return; }
      const el = e.target.closest('.msgs-bubble-attachment');
      if (el) openBubbleAttachment(el);
    });
    threadBubbles.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const el = e.target.closest('.msgs-bubble-attachment');
      if (!el) return;
      e.preventDefault();
      openBubbleAttachment(el);
    });

    // One message's markup -- shared by the normal single-thread view
    // (renderBubbles) and the merged "All subjects" timeline
    // (renderMergedBubbles below), so both stay in sync automatically.
    function renderBubbleRowHtml(m, i, showAuthor) {
      const atts = attachmentsOf(m);
      const timeLabel = m.sentAt ? relativeTime(m.sentAt) : m.time;
      const bubbleHtml = m.text ? `<div class="msgs-bubble">${linkedText(m.text)}${timeSpanHtml(timeLabel, m.sentAt, 'msgs-bubble-time')}</div>` : '';
      const attsHtml = atts.map((a, ai) => {
        const isLast = ai === atts.length - 1;
        return renderBubbleAttachment(a, (!m.text && isLast) ? timeLabel : '', (!m.text && isLast) ? m.sentAt : undefined);
      }).join('');
      const authorHtml = showAuthor && m.from === 'them' && m.authorId ? `<span class="msgs-bubble-author">${escapeHtml(personName(m.authorId))}</span>` : '';
      const failedHtml = m.status === 'failed' ? `<div class="msgs-bubble-failed" role="alert"><span>${escapeHtml(m.error || "Couldn't send.")}</span>${m.sgy ? `<button type="button" class="msgs-sgy-btn" data-action="start-in-schoology" data-local-id="${escapeHtml(m.localId)}">Start in Schoology</button>` : m.canRetry === false ? '' : `<button type="button" class="msgs-retry-btn" data-local-id="${escapeHtml(m.localId)}">Retry</button>`}</div>` : '';
      return `
        <div class="msgs-bubble-row ${escapeHtml(m.from)}" data-msg-index="${i}">
          ${authorHtml}
          ${bubbleHtml}
          ${attsHtml}
          ${failedHtml}
        </div>
      `;
    }

    function renderBubbles(c) {
      if (MSG_LIVE && c.load !== 'ready') { threadBubbles.innerHTML = liveThreadStateHtml(c); return; }
      const showAuthors = MSG_LIVE && threadHasSeveralAuthors(c);
      threadBubbles.innerHTML = c.messages.map((m, i) => renderBubbleRowHtml(m, i, showAuthors)).join('');
      threadBubbles.scrollTop = threadBubbles.scrollHeight;
    }

    function renderMergedBubbles(threads) {
      threadBubbles.innerHTML = threads.map(c => `
        <div class="msgs-subject-divider"><span>${escapeHtml(c.subject)}</span></div>
        ${MSG_LIVE && c.load !== 'ready' ? liveThreadStateHtml(c, true) : c.messages.map((m, i) => renderBubbleRowHtml(m, i, MSG_LIVE && threadHasSeveralAuthors(c))).join('')}
      `).join('');
      threadBubbles.scrollTop = threadBubbles.scrollHeight;
    }

    // Shows a REAL (already-existing-or-just-created) conversation --
    // restores the normal avatar/name header, in case a compose draft's
    // To bar/Subject bar were showing instead (see startComposeMode/
    // startNewThreadWith/resumeComposeMode below).
    function showThread(c) {
      const p = person(c);
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      toBar.hidden = true;
      subjectBar.hidden = true;
      threadIdentity.hidden = false;
      threadAvatar.textContent = avatarInitial(p.name);
      threadAvatar.style.background = avatarBg(p);
      threadName.textContent = p.name;
      threadCourse.textContent = p.course;
      viewingAllSubjectsFor = null;
      renderSubjectDropdown(c.personId, c.id);
      setComposerEnabled(!MSG_LIVE || c.load === 'ready', false);
      if (MSG_LIVE) liveComposerPlaceholder(c);
      renderBubbles(c);
    }

    function threadsForPerson(personId) {
      return CONVERSATIONS.filter(c => c.personId === personId);
    }

    // activeThreadId: the currently-open thread's id, or null when the
    // merged "All subjects" view is what's open.
    function renderSubjectDropdown(personId, activeThreadId) {
      const threads = threadsForPerson(personId);
      threadSubjectTriggerLabel.textContent = activeThreadId === null
        ? 'All subjects'
        : (threads.find(t => t.id === activeThreadId) || {}).subject || '';
      threadSubjectMenu.innerHTML = `
        <button type="button" class="msgs-thread-subject-menu-item all-subjects ${activeThreadId === null ? 'active' : ''}" role="menuitem" data-thread-id="__all__">All subjects</button>
        ${threads.map(t => `<button type="button" class="msgs-thread-subject-menu-item ${t.id === activeThreadId ? 'active' : ''}" role="menuitem" data-thread-id="${escapeHtml(t.id)}">${escapeHtml(t.subject)}</button>`).join('')}
      `;
      threadSubjectMenu.dataset.personId = personId;
      threadSubjectRow.hidden = false;
    }

    function closeSubjectMenu() {
      threadSubjectMenu.hidden = true;
      threadSubjectTrigger.setAttribute('aria-expanded', 'false');
    }

    function setComposerEnabled(enabled, showHint) {
      composerInput.disabled = !enabled;
      attachBtn.disabled = !enabled;
      sendBtn.disabled = !enabled;
      composerHint.hidden = showHint === undefined ? enabled : !showHint;
    }

    function showAllSubjectsFor(personId) {
      const p = TEACHERS[personId];
      const threads = threadsForPerson(personId);
      if (!p || !threads.length) return;
      pendingThread = null;
      activeConvoId = null;
      viewingAllSubjectsFor = personId;
      threads.forEach(t => { if (t.unread) t.unread = false; });
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      toBar.hidden = true;
      subjectBar.hidden = true;
      threadIdentity.hidden = false;
      threadAvatar.textContent = avatarInitial(p.name);
      threadAvatar.style.background = avatarBg(p);
      threadName.textContent = p.name;
      threadCourse.textContent = p.course;
      renderSubjectDropdown(personId, null);
      if (MSG_LIVE) liveLoadThreads(threads);
      renderMergedBubbles(threads);
      setComposerEnabled(false);
      renderThreadList();
      msgsShell.classList.add('thread-open');
    }

    threadSubjectTrigger.addEventListener('click', () => {
      const opening = threadSubjectMenu.hidden;
      if (opening) {
        threadSubjectMenu.hidden = false;
        threadSubjectTrigger.setAttribute('aria-expanded', 'true');
      } else {
        closeSubjectMenu();
      }
    });
    threadSubjectMenu.addEventListener('click', e => {
      const item = e.target.closest('.msgs-thread-subject-menu-item');
      if (!item) return;
      closeSubjectMenu();
      const threadId = item.dataset.threadId;
      if (threadId === '__all__') showAllSubjectsFor(threadSubjectMenu.dataset.personId);
      else openConversation(threadId);
    });
    document.addEventListener('click', e => {
      if (!threadSubjectMenu.hidden && !e.target.closest('.msgs-thread-subject-row')) closeSubjectMenu();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !threadSubjectMenu.hidden) { closeSubjectMenu(); threadSubjectTrigger.focus(); }
    });

    function openConversation(id) {
      const c = CONVERSATIONS.find(x => x.id === id);
      if (!c) return;
      pendingThread = null;
      activeConvoId = id;
      if (c.unread) c.unread = false;
      if (window.AveragesSeen) window.AveragesSeen.mark('m', id);
      if (MSG_LIVE) liveLoadThread(c);
      showThread(c);
      renderThreadList();
      msgsShell.classList.add('thread-open');
      composerInput.value = '';
    }

    const MAX_TO_RESULTS = 6;

    function directoryMatches(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      // Signed in: teachers, then whoever else Schoology lets them message.
      if (MSG_LIVE) return liveDirectoryMatches(q);
      return Object.entries(TEACHERS)
        .filter(([, p]) => p.name.toLowerCase().includes(q))
        .sort((a, b) => a[1].name.localeCompare(b[1].name))
        .slice(0, MAX_TO_RESULTS);
    }

    let toHighlightIndex = -1;

    function closeToResults() {
      toResults.hidden = true;
      toResults.innerHTML = '';
      toHighlightIndex = -1;
      toInput.setAttribute('aria-expanded', 'false');
    }

    function renderToResults(query) {
      if (!query.trim()) { closeToResults(); return; }
      const matches = directoryMatches(query);
      toHighlightIndex = matches.length ? 0 : -1;
      toResults.innerHTML = matches.length
        ? matches.map(([id, p], i) => `
            <button type="button" class="msgs-to-result-item${i === 0 ? ' highlighted' : ''}" role="option" data-id="${escapeHtml(id)}">
              <span class="msgs-to-result-name">${escapeHtml(p.name)}</span>
              ${p.course ? `<span class="msgs-to-result-course">${escapeHtml(p.course)}</span>` : ''}
            </button>
          `).join('')
        : `<p class="msgs-to-no-results">${MSG_LIVE ? liveNoMatchText(query.trim()) : `No one in the district matches "${escapeHtml(query.trim())}".`}</p>`;
      toResults.hidden = false;
      toInput.setAttribute('aria-expanded', 'true');
    }

    function selectToPerson(id) {
      const p = TEACHERS[id];
      if (!p || !pendingThread) return;
      pendingThread.personId = id;
      toInput.value = p.name;
      toInput.classList.add('msgs-to-selected');
      closeToResults();
      threadBubbles.innerHTML = draftBubblesPlaceholder();
    }

    const toContactModal = document.getElementById('toContactModal');
    function openToContactModal(id) {
      const c = CONTACTS.find(x => x.id === id);
      const t = TEACHERS[id];
      if (!c && !t) return;
      document.getElementById('toContactModalAvatar').textContent = avatarInitial((c || t).name);
      document.getElementById('toContactModalAvatar').style.background = (c || t).color;
      document.getElementById('toContactModalName').textContent = (c || t).name;
      document.getElementById('toContactModalRole').textContent = c ? (c.role || c.dept) : t.course;
      document.getElementById('toContactModalDept').textContent = c ? c.dept : t.course;
      if (MSG_LIVE) document.getElementById('toContactModalDept').parentElement.hidden = !(c ? c.dept : t.course);
      // Only someone in the full district directory has a real record on
      // contacts.html to deep-link to — a one-off recipient that arrived
      // via a compose deep-link with no matching CONTACTS entry doesn't.
      const viewBtn = document.getElementById('toContactModalViewBtn');
      if (c) {
        viewBtn.href = `contacts.html?open=${encodeURIComponent(c.id)}`;
        viewBtn.hidden = false;
      } else {
        viewBtn.hidden = true;
      }
      toContactModal.classList.add('show');
      document.getElementById('toContactModalCloseBtn').focus();
    }
    function closeToContactModal() { toContactModal.classList.remove('show'); }
    document.getElementById('toContactModalCloseBtn').addEventListener('click', closeToContactModal);
    toContactModal.addEventListener('click', e => { if (e.target === toContactModal) closeToContactModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && toContactModal.classList.contains('show')) closeToContactModal();
    });
    toInput.addEventListener('click', () => {
      if (pendingThread?.personId) openToContactModal(pendingThread.personId);
    });

    function draftBubblesPlaceholder() {
      const p = pendingThread && pendingThread.personId ? TEACHERS[pendingThread.personId] : null;
      return p
        ? `<p class="msgs-empty-hint">Start a new conversation with ${escapeHtml(p.name)}.</p>`
        : `<p class="msgs-empty-hint">Choose who to message, then start typing below.</p>`;
    }

    function startComposeMode() {
      if (MSG_LIVE) { liveLoadRecipients(); liveComposerPlaceholder(null); }
      activeConvoId = null;
      viewingAllSubjectsFor = null;
      pendingThread = { personId: null, subject: '' };
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      threadIdentity.hidden = true;
      threadSubjectRow.hidden = true; // no existing subject to pick from yet -- see #subjectBar below instead
      closeSubjectMenu();
      setComposerEnabled(true);
      toBar.hidden = false;
      subjectBar.hidden = false;
      toInput.value = '';
      toInput.classList.remove('msgs-to-selected');
      closeToResults();
      subjectInput.value = '';
      threadBubbles.innerHTML = draftBubblesPlaceholder();
      renderThreadList();
      msgsShell.classList.add('thread-open');
      composerInput.value = '';
      toInput.focus();
    }

    function startNewThreadWith(personId) {
      const p = TEACHERS[personId];
      if (!p) return;
      if (MSG_LIVE) liveComposerPlaceholder(null);
      activeConvoId = null;
      viewingAllSubjectsFor = null;
      pendingThread = { personId, subject: '' };
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      toBar.hidden = true;
      subjectBar.hidden = false;
      subjectInput.value = '';
      threadIdentity.hidden = false;
      threadSubjectRow.hidden = true; // no existing subject to pick from yet -- see #subjectBar below instead
      closeSubjectMenu();
      setComposerEnabled(true);
      threadAvatar.textContent = avatarInitial(p.name);
      threadAvatar.style.background = avatarBg(p);
      threadName.textContent = p.name;
      threadCourse.textContent = p.course ? `${p.course} · New message` : 'New message';
      threadBubbles.innerHTML = draftBubblesPlaceholder();
      renderThreadList();
      msgsShell.classList.add('thread-open');
      composerInput.value = '';
      composerInput.focus();
    }

    function resumeComposeMode() {
      if (!pendingThread) return;
      if (MSG_LIVE) { liveLoadRecipients(); liveComposerPlaceholder(null); }
      activeConvoId = null;
      viewingAllSubjectsFor = null;
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      threadIdentity.hidden = true;
      threadSubjectRow.hidden = true;
      closeSubjectMenu();
      setComposerEnabled(true);
      toBar.hidden = false;
      subjectBar.hidden = false;
      toInput.value = pendingThread.personId ? TEACHERS[pendingThread.personId].name : '';
      toInput.classList.toggle('msgs-to-selected', !!pendingThread.personId);
      closeToResults();
      subjectInput.value = pendingThread.subject || '';
      threadBubbles.innerHTML = draftBubblesPlaceholder();
      renderThreadList();
      msgsShell.classList.add('thread-open');
    }
    toInput.addEventListener('input', () => {
      if (!pendingThread) return;
      // Typing invalidates whatever was previously selected -- you can't
      // stay "sending to" someone whose name you've since edited away.
      pendingThread.personId = null;
      toInput.classList.remove('msgs-to-selected');
      renderToResults(toInput.value);
    });
    toInput.addEventListener('focus', () => {
      if (toInput.value.trim() && !pendingThread?.personId) renderToResults(toInput.value);
    });
    toInput.addEventListener('keydown', e => {
      if (toResults.hidden) return;
      const items = Array.from(toResults.querySelectorAll('.msgs-to-result-item'));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!items.length) return;
        toHighlightIndex = (toHighlightIndex + 1) % items.length;
        items.forEach((el, i) => el.classList.toggle('highlighted', i === toHighlightIndex));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!items.length) return;
        toHighlightIndex = (toHighlightIndex - 1 + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle('highlighted', i === toHighlightIndex));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const target = items[toHighlightIndex] || items[0];
        if (target) selectToPerson(target.dataset.id);
      } else if (e.key === 'Escape') {
        closeToResults();
      }
    });
    toResults.addEventListener('click', e => {
      const item = e.target.closest('.msgs-to-result-item');
      if (!item) return;
      selectToPerson(item.dataset.id);
    });
    document.addEventListener('click', e => {
      if (!toResults.hidden && !e.target.closest('#toSearchWrap')) closeToResults();
    });
    subjectInput.addEventListener('input', () => {
      if (pendingThread) pendingThread.subject = subjectInput.value;
    });

    // Scrolls to and briefly highlights a specific message within a
    // conversation — used by the search panel so picking a message match
    // jumps straight to it instead of just opening the thread at the
    // bottom.
    function jumpToMessage(id, msgIndex) {
      openConversation(id);
      requestAnimationFrame(() => {
        const row = threadBubbles.querySelector(`[data-msg-index="${msgIndex}"]`);
        if (!row) return;
        row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        row.classList.add('flash');
        setTimeout(() => row.classList.remove('flash'), 1500);
      });
    }

    // A "Combined" row (data-combined="1") represents more than one
    // subject thread with the same person -- opening it means the merged
    // "All subjects" timeline (showAllSubjectsFor), same as picking "All
    // subjects" from that person's own subject dropdown. A combined row
    // for someone with only one thread (data-combined="0", i.e. Combined
    // mode simply hasn't changed anything for them) still just opens
    // normally, same as clicking any other row -- routing that case
    // through showAllSubjectsFor would needlessly disable the composer
    // for a person who only has one conversation anyway.
    function openThreadRow(row) {
      if (row.dataset.id === '__new__') { resumeComposeMode(); return; } // the pinned New Message draft row
      if (row.dataset.combined === '1') { showAllSubjectsFor(row.dataset.personId); return; }
      openConversation(row.dataset.id);
    }
    threadList.addEventListener('click', e => {
      const row = e.target.closest('.msgs-thread-row');
      if (!row) return;
      openThreadRow(row);
    });
    threadList.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('.msgs-thread-row');
      if (!row) return;
      e.preventDefault();
      openThreadRow(row);
    });

    document.getElementById('threadBackBtn').addEventListener('click', () => {
      msgsShell.classList.remove('thread-open');
    });

    const rowContextMenu = document.getElementById('rowContextMenu');
    const rowContextPinBtn = document.getElementById('rowContextPinBtn');
    const rowContextPinLabel = document.getElementById('rowContextPinLabel');
    const rowContextDeleteBtn = document.getElementById('rowContextDeleteBtn');
    let contextMenuConvoId = null;
    if (MSG_LIVE) rowContextDeleteBtn.hidden = true;

    function closeRowContextMenu() {
      rowContextMenu.hidden = true;
      contextMenuConvoId = null;
    }

    function openRowContextMenu(convoId, x, y) {
      const c = CONVERSATIONS.find(v => v.id === convoId);
      if (!c) return;
      contextMenuConvoId = convoId;
      rowContextPinLabel.textContent = c.pinned ? 'Unpin' : 'Pin';
      rowContextMenu.hidden = false;
      // Clamp inside the viewport -- measure only after un-hiding so
      // offsetWidth/Height reflect the real rendered size.
      const menuW = rowContextMenu.offsetWidth;
      const menuH = rowContextMenu.offsetHeight;
      const maxX = window.innerWidth - menuW - 8;
      const maxY = window.innerHeight - menuH - 8;
      rowContextMenu.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
      rowContextMenu.style.top = `${Math.max(8, Math.min(y, maxY))}px`;
    }

    threadList.addEventListener('contextmenu', e => {
      const row = e.target.closest('.msgs-thread-row');
      if (!row || row.dataset.id === '__new__') return; // never on the draft row
      // Skip a genuinely-merged Combined row (more than one subject with
      // this person) -- Pin/Delete would be ambiguous about which of
      // their several threads it applies to. A Combined row for someone
      // with only one thread is unaffected (data-combined="0") and still
      // gets the normal menu.
      if (row.dataset.combined === '1') return;
      e.preventDefault();
      openRowContextMenu(row.dataset.id, e.clientX, e.clientY);
    });

    rowContextPinBtn.addEventListener('click', () => {
      const c = CONVERSATIONS.find(v => v.id === contextMenuConvoId);
      if (c) c.pinned = !c.pinned;
      closeRowContextMenu();
      renderThreadList();
    });

    rowContextDeleteBtn.addEventListener('click', () => {
      const id = contextMenuConvoId;
      closeRowContextMenu();
      if (!id) return;
      const idx = CONVERSATIONS.findIndex(v => v.id === id);
      if (idx === -1) return;
      CONVERSATIONS.splice(idx, 1);
      if (activeConvoId === id) {
        // The deleted conversation was open -- fall back to the empty
        // state rather than leaving a dangling thread panel open.
        activeConvoId = null;
        threadActive.hidden = true;
        threadEmpty.hidden = false;
        msgsShell.classList.remove('thread-open');
      }
      renderThreadList();
    });

    document.addEventListener('click', e => {
      if (!rowContextMenu.hidden && !e.target.closest('#rowContextMenu')) closeRowContextMenu();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !rowContextMenu.hidden) closeRowContextMenu();
    });
    // Closes the menu on scroll rather than letting it float disconnected
    // from the row it was opened on.
    threadList.addEventListener('scroll', () => { if (!rowContextMenu.hidden) closeRowContextMenu(); });

    const URL_RE = /\b((?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?)\b/i;
    function extractLinkAttachment(text) {
      const m = text.match(URL_RE);
      if (!m) return { text, linkAttachment: null };
      const url = m[0];
      const remaining = (text.slice(0, m.index) + text.slice(m.index + url.length)).replace(/\s+/g, ' ').trim();
      return { text: remaining, linkAttachment: { kind: 'link', title: url, url } };
    }
    composerInput.addEventListener('input', () => {
      composerInput.classList.toggle('msgs-composer-link-active', URL_RE.test(composerInput.value));
    });

    function sendComposerMessage() {
      if (MSG_LIVE) { liveSendComposerMessage(); return; }
      const raw = composerInput.value.trim();
      const { text, linkAttachment } = extractLinkAttachment(raw);
      if (!text && pendingAttachments.length === 0 && !linkAttachment) return; // attachment(s)/link alone are a valid send, same as most messaging apps
      const msg = { from: 'me', text, time: 'Just now', sentAt: Date.now() };
      const attachments = pendingAttachments.slice();
      if (linkAttachment) attachments.push(linkAttachment);
      if (attachments.length) msg.attachments = attachments;
      if (pendingThread) {
        if (!pendingThread.personId) { toInput.focus(); return; }
        const subject = (pendingThread.subject || '').trim() || 'New conversation';
        const c = {
          id: `${pendingThread.personId}-${Date.now()}`,
          personId: pendingThread.personId,
          subject,
          unread: false,
          messages: [msg],
        };
        Object.assign(c, deriveMedia(c));
        CONVERSATIONS.unshift(c);
        pendingThread = null;
        activeConvoId = c.id;
        composerInput.value = '';
        composerInput.classList.remove('msgs-composer-link-active');
        pendingAttachments = [];
        renderPendingAttachments();
        showThread(c); // restores the normal avatar/name header now that it's a real thread
        renderThreadList();
        return;
      }
      if (!activeConvoId) return;
      const c = CONVERSATIONS.find(x => x.id === activeConvoId);
      c.messages.push(msg);
      Object.assign(c, deriveMedia(c)); // refresh docs/links/etc. so new attachment(s) show up in search right away
      composerInput.value = '';
      composerInput.classList.remove('msgs-composer-link-active');
      pendingAttachments = [];
      renderPendingAttachments();
      renderBubbles(c);
      renderThreadList();
    }
    sendBtn.addEventListener('click', sendComposerMessage);
    composerInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); sendComposerMessage(); }
    });

    const msgsSearchInput = document.getElementById('msgsSearch');
    const searchResults = document.getElementById('searchResults');

    function highlightMatch(text, q) {
      const idx = text.toLowerCase().indexOf(q.toLowerCase());
      if (idx === -1) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>' + escapeHtml(text.slice(idx + q.length));
    }

    function messageMatches(q) {
      const results = [];
      CONVERSATIONS.forEach(c => {
        searchableMessages(c).forEach(item => {
          if (item.m.text.toLowerCase().includes(q)) results.push(item);
        });
      });
      return results;
    }

    function allDocs() { return CONVERSATIONS.flatMap(c => c.docs.map(d => ({ ...d, c }))); }
    function allLinks() { return CONVERSATIONS.flatMap(c => c.links.map(l => ({ ...l, c }))); }
    function allVideo() { return CONVERSATIONS.flatMap(c => c.video.map(v => ({ ...v, c }))); }
    function allAudio() { return CONVERSATIONS.flatMap(c => c.audio.map(a => ({ ...a, c }))); }

    function matchedPersonId(q) {
      if (!q) return null;
      const hit = Object.entries(TEACHERS).find(([id, t]) => t.name.toLowerCase().includes(q) && (!MSG_LIVE || CONVERSATIONS.some(c => c.personId === id)));
      return hit ? hit[0] : null;
    }

    function searchCategories(qRaw) {
      const q = qRaw.trim().toLowerCase();
      const personId = matchedPersonId(q);
      if (personId) {
        const scope = CONVERSATIONS.filter(c => c.personId === personId);
        return {
          personId, q,
          messages: scope.flatMap(c => searchableMessages(c)).slice(-6).reverse(),
          docs: scope.flatMap(c => c.docs.map(d => ({ ...d, c }))),
          links: scope.flatMap(c => c.links.map(l => ({ ...l, c }))),
          video: scope.flatMap(c => c.video.map(v => ({ ...v, c }))),
          audio: scope.flatMap(c => c.audio.map(a => ({ ...a, c }))),
        };
      }
      if (!q) {
        return {
          personId: null, q,
          messages: CONVERSATIONS.map(c => searchableMessages(c).slice(-1)[0]).filter(Boolean).slice(0, 6),
          docs: allDocs().slice(0, 4),
          links: allLinks().slice(0, 4),
          video: allVideo().slice(0, 4),
          audio: allAudio().slice(0, 4),
        };
      }
      return {
        personId: null, q,
        messages: messageMatches(q),
        docs: allDocs().filter(d => d.name.toLowerCase().includes(q)),
        links: allLinks().filter(l => l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)),
        video: allVideo().filter(v => v.name.toLowerCase().includes(q)),
        audio: allAudio().filter(a => a.name.toLowerCase().includes(q)),
      };
    }

    function fileExt(name) { return name.split('.').pop().toUpperCase(); }
    function fileExtColor(ext) {
      if (ext === 'PDF') return '#b23b2e';
      if (ext === 'DOCX') return '#2f5fa8';
      if (ext === 'PPTX') return '#c07a1f';
      return 'var(--accent)';
    }
    const ICON_LINK = '<span class="emo"><svg aria-hidden="true" focusable="false" viewBox="0 0 36 36"><path fill="#8899A6" d="m15 9 6-6s6-6 12 0 0 12 0 12l-8 8s-6 6-12 0c-1.125-1.125-1.822-2.62-1.822-2.62l3.353-3.348S14.396 18.396 16 20c0 0 3 3 6 0l8-8s3-3 0-6-6 0-6 0l-3.729 3.729s-1.854-1.521-5.646-.354L15 9z"/><path fill="#8899A6" d="m20.845 27-6 6s-6 6-12 0 0-12 0-12l8-8s6-6 12 0c1.125 1.125 1.822 2.62 1.822 2.62l-3.354 3.349s.135-1.365-1.469-2.969c0 0-3-3-6 0l-8 8s-3 3 0 6 6 0 6 0l3.729-3.729s1.854 1.521 5.646.354l-.374.375z"/></svg></span>';
    const ICON_VIDEO = '<span class="emo"><svg aria-hidden="true" focusable="false" viewBox="0 0 36 36"><path fill="#3F7123" d="M35.845 32c0 2.2-1.8 4-4 4h-26c-2.2 0-4-1.8-4-4V19c0-2.2 1.8-4 4-4h26c2.2 0 4 1.8 4 4v13z"/><path fill="#3F7123" d="M1.845 15h34v6h-34z"/><path fill="#CCD6DD" d="M1.845 15h34v7h-34z"/><path fill="#292F33" d="M1.845 15h4l-4 7v-7zm11 0-4 7h7l4-7h-7zm14 0-4 7h7l4-7h-7z"/><path fill="#CCD6DD" d="M.155 8.207 33.148 0l1.69 6.792L1.845 15z"/><path fill="#292F33" d="m.155 8.207 5.572 5.827L1.845 15 .155 8.207zm19.158 2.448-5.572-5.828-6.793 1.69 5.572 5.828 6.793-1.69zm13.586-3.38-5.572-5.828-6.793 1.69 5.572 5.827 6.793-1.689z"/></svg></span>';
    const ICON_AUDIO = '<span class="emo"><svg aria-hidden="true" focusable="false" viewBox="0 0 36 36"><path fill="#66757F" d="M18 0C9.716 0 3 6.716 3 15v9h3v-9C6 8 11.269 2.812 18 2.812 24.73 2.812 30 8 30 15v10l3-1v-9c0-8.284-6.716-15-15-15z"/><path fill="#31373D" d="M6 27a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v9zm30 0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v9z"/><path fill="#55ACEE" d="m19.182 10.016-6.364 1.313c-.45.093-.818.544-.818 1.004v16.185a6.218 6.218 0 0 0-2.087-.36c-2.785 0-5.042 1.755-5.042 3.922 0 2.165 2.258 3.827 5.042 3.827C12.649 35.905 14.922 34 15 32V16.39l4.204-.872c.449-.093.796-.545.796-1.004v-3.832c0-.458-.368-.759-.818-.666zm8 3.151-4.297.865c-.45.093-.885.544-.885 1.003V26.44c0-.152-.878-.24-1.4-.24-2.024 0-3.633 1.276-3.633 2.852 0 1.574 1.658 2.851 3.683 2.851s3.677-1.277 3.677-2.851l-.014-11.286 2.869-.598c.45-.093.818-.544.818-1.003v-2.33c0-.459-.368-.76-.818-.668z"/></svg></span>';
    // Same glyph as #rowContextPinBtn's icon in the markup above -- kept
    // in sync by hand since this one gets stamped into thread-row HTML
    // by renderThreadList() while that one is static.
    const ICON_PIN = '<span class="emo"><svg aria-hidden="true" focusable="false" viewBox="0 0 36 36"><path fill="#BE1931" d="M23.651 23.297 12.702 12.348l9.386-7.821 9.385 9.385z"/><path fill="#DD2E44" d="M34.6 13.912a4.42 4.42 0 0 1-6.255 0l-6.257-6.256a4.426 4.426 0 0 1 6.257-6.258L34.6 7.656a4.423 4.423 0 0 1 0 6.256z"/><path fill="#99AAB5" d="M14 17.823S-.593 35.029.188 35.813C.97 36.596 18.177 22 18.177 22L14 17.823z"/><path fill="#DD2E44" d="M25.215 27.991a4.423 4.423 0 0 1-6.258 0L8.009 17.041a4.425 4.425 0 0 1 6.258-6.256l10.948 10.949a4.424 4.424 0 0 1 0 6.257z"/></svg></span>';

    function renderMsgItem({ c, i, m }, q) {
      const p = person(c);
      return `
        <button class="msgs-search-result-row" type="button" data-kind="message" data-id="${escapeHtml(c.id)}" data-index="${i}">
          <span class="msgs-avatar" style="width:32px;height:32px;font-size:0.78rem;background:${escapeHtml(avatarBg(p))}">${escapeHtml(avatarInitial(p.name))}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${escapeHtml(p.name)}</span>
            <span class="msgs-search-result-snippet">${m.from === 'me' ? 'You: ' : ''}${q ? highlightMatch(m.text, q) : escapeHtml(m.text)}</span>
          </span>
        </button>`;
    }
    function renderDocItem(d, q) {
      const p = person(d.c);
      const ext = fileExt(d.name);
      return `
        <button class="msgs-search-result-row" type="button" data-kind="thread" data-id="${escapeHtml(d.c.id)}">
          <span class="msgs-file-chip" style="background:${fileExtColor(ext)}" aria-hidden="true">${escapeHtml(ext)}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${q ? highlightMatch(d.name, q) : escapeHtml(d.name)}</span>
            <span class="msgs-search-result-snippet">${escapeHtml(p.name)} · ${escapeHtml(d.time)}</span>
          </span>
        </button>`;
    }
    function renderLinkItem(l, q) {
      const p = person(l.c);
      const host = l.url.split('/')[0];
      return `
        <button class="msgs-search-result-row" type="button" data-kind="thread" data-id="${escapeHtml(l.c.id)}">
          <span class="msgs-media-chip" aria-hidden="true">${ICON_LINK}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${q ? highlightMatch(l.title, q) : escapeHtml(l.title)}</span>
            <span class="msgs-search-result-snippet">${escapeHtml(p.name)} · ${escapeHtml(host)}</span>
          </span>
        </button>`;
    }
    function renderMediaItem(item, q, kind) {
      const p = person(item.c);
      return `
        <button class="msgs-search-result-row" type="button" data-kind="thread" data-id="${escapeHtml(item.c.id)}">
          <span class="msgs-media-chip" aria-hidden="true">${kind === 'video' ? ICON_VIDEO : ICON_AUDIO}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${q ? highlightMatch(item.name, q) : escapeHtml(item.name)}</span>
            <span class="msgs-search-result-snippet">${escapeHtml(p.name)} · ${escapeHtml(item.duration)}</span>
          </span>
        </button>`;
    }
    function renderCategorySection(title, items, renderItem, q) {
      const body = items.length
        ? items.map(renderItem).join('')
        : `<p class="msgs-search-cat-empty">${q ? 'No matches' : 'Nothing yet'}</p>`;
      return `<div class="msgs-search-cat"><h4 class="msgs-search-cat-title">${title}</h4>${body}</div>`;
    }

    function renderSearchResults() {
      const { personId, q, messages, docs, links, video, audio } = searchCategories(searchQuery);
      const header = personId
        ? `<div class="msgs-search-scope">Showing results for <strong>${escapeHtml(TEACHERS[personId].name)}</strong></div>`
        : '';
      searchResults.innerHTML = header
        + renderCategorySection('Messages', messages, item => renderMsgItem(item, q), q)
        + renderCategorySection('Docs', docs, item => renderDocItem(item, q), q)
        + renderCategorySection('Links', links, item => renderLinkItem(item, q), q)
        + renderCategorySection('Video', video, item => renderMediaItem(item, q, 'video'), q)
        + renderCategorySection('Audio', audio, item => renderMediaItem(item, q, 'audio'), q);
      searchResults.hidden = false;
    }

    const searchWrap = document.getElementById('searchWrap');
    const searchClearBtn = document.getElementById('searchClearBtn');
    let searchActive = false;

    function enterSearchMode() {
      if (searchActive) return;
      searchActive = true;
      searchClearBtn.classList.add('show');
      threadList.hidden = true;
      renderSearchResults();
    }
    function exitSearchMode() {
      searchActive = false;
      searchClearBtn.classList.remove('show');
      searchResults.hidden = true;
      threadList.hidden = false;
      searchQuery = '';
      msgsSearchInput.value = '';
    }

    msgsSearchInput.addEventListener('focus', enterSearchMode);
    msgsSearchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      if (!searchActive) enterSearchMode();
      else renderSearchResults();
    });
    searchClearBtn.addEventListener('click', () => {
      exitSearchMode();
      msgsSearchInput.blur();
    });
    document.addEventListener('click', e => {
      if (searchActive && !e.target.closest('#searchWrap') && !e.target.closest('#searchResults')) {
        exitSearchMode();
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && searchActive) { exitSearchMode(); msgsSearchInput.blur(); }
    });
    searchResults.addEventListener('click', e => {
      const row = e.target.closest('.msgs-search-result-row');
      if (!row) return;
      if (row.dataset.kind === 'message') {
        jumpToMessage(row.dataset.id, Number(row.dataset.index));
      } else {
        openConversation(row.dataset.id);
      }
      exitSearchMode();
    });

    const filterBtn = document.getElementById('filterBtn');
    const filterMenu = document.getElementById('filterMenu');
    function openFilterMenu() { filterMenu.hidden = false; filterBtn.setAttribute('aria-expanded', 'true'); }
    function closeFilterMenu() { filterMenu.hidden = true; filterBtn.setAttribute('aria-expanded', 'false'); }
    filterBtn.addEventListener('click', () => { if (filterMenu.hidden) openFilterMenu(); else closeFilterMenu(); });
    document.addEventListener('click', e => { if (!filterMenu.hidden && !e.target.closest('.msgs-filter-wrap')) closeFilterMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !filterMenu.hidden) { closeFilterMenu(); filterBtn.focus(); } });
    document.querySelectorAll('.msgs-filter-item').forEach(item => {
      item.addEventListener('click', () => {
        currentFilter = item.dataset.filter;
        document.querySelectorAll('.msgs-filter-item').forEach(i => i.classList.toggle('active', i === item));
        renderThreadList();
        closeFilterMenu();
      });
    });

    renderThreadList();

    document.getElementById('composeBtn').addEventListener('click', startComposeMode);

    if (MSG_LIVE) liveInit();

    (function handleThreadDeepLink() {
      const id = new URLSearchParams(window.location.search).get('thread');
      if (id && CONVERSATIONS.some(c => c.id === id)) openConversation(id);
    })();

    (function handleComposeDeepLink() {
      const params = new URLSearchParams(window.location.search);
      const composeId = params.get('compose');
      if (!composeId) return;
      // used once: off the address, so closing the new message (or a reload) doesn't open it again
      setTimeout(() => { try { const u = new URL(window.location.href); ['compose', 'name', 'dept', 'color', 'subject'].forEach(k => u.searchParams.delete(k)); history.replaceState(history.state, '', u.pathname + u.search + u.hash); } catch {} }, 0);
      if (MSG_LIVE) { liveComposeDeepLink(composeId, params); return; }
      if (!TEACHERS[composeId]) {
        const name = params.get('name');
        if (!name) return; // not a known teacher and no fallback info to build one from
        TEACHERS[composeId] = {
          name,
          course: params.get('dept') || '',
          color: /^#[0-9a-f]{6}$/i.test(params.get('color') || '') ? params.get('color') : '#83849a',
        };
      }
      startNewThreadWith(composeId);
    })();

    // ------------------------------------------------------------------
    // Nav — Home/Courses/Grades/Assignments are real pages now; Calendar/
    // Settings stay visual-only placeholders, same convention used
    // everywhere else in the app.
    // ------------------------------------------------------------------
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile || !profile.name || !String(profile.name).trim()) profile = Object.assign({}, profile, { name: window.__AVERAGES_NAME__ || '' });
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
        profileBtn.classList.add('has-photo');
      } else if (profile.name) {
        if (window.AveragesAvatar) window.AveragesAvatar.paint(profileBtn, profile.name);
        else profileBtn.textContent = (function (n) { var p = String(n).trim().split(/\s+/).filter(Boolean); var f = function (w) { return w ? Array.from(w)[0] : ''; }; return (f(p[0]) + (p.length > 1 ? f(p[p.length - 1]) : '')).toUpperCase(); })(profile.name);
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    (function () {
      const SELF = 'messages.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Messages';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
