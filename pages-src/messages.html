<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Messages</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from grades.html so
     this page reads as the same app, not a reskin. Grade-color tokens
     (--grade-good etc.) aren't needed here and are left out. See
     architecture-decisions.md for the note about promoting this to an
     actual shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar — copied verbatim ---------- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }
  h1.title {
    color: #ffffff;
    font-size: clamp(1.6rem, 3.4vw, 2.1rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    margin: 2px 0 0 2px;
  }
  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(180deg, #A5ABB8, #858994);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.02em;
    cursor: pointer;
    flex-shrink: 0;
  }

  .profile-btn.has-photo { border-color: transparent; background-origin: border-box; background-repeat: no-repeat; }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: #b6432f; }

  /* Height-capped to whatever .page has left (flex: 1; min-height: 0)
     instead of growing to match content -- keeps both panels' frames
     (and their rounded corners) fixed on screen, matching login-style
     app chrome. Also fixes a real bug this caused before being capped:
     with the panel stretched taller than a short conversation's natural
     content and nothing set to grow into the leftover space, that space
     collected below .msgs-composer instead of the composer sitting
     flush with the panel's bottom edge. Capping the shell and letting
     .msgs-bubbles flex-grow (below) fixes both at once. max-height kept
     so this doesn't balloon on a very tall monitor. */
  .msgs-shell {
    display: flex;
    gap: 14px;
    align-items: stretch;
    flex: 1;
    min-height: 0;
    max-height: 660px;
  }
  .msgs-list-panel {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .msgs-list-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 14px 10px;
    flex-shrink: 0;
  }
  .msgs-list-head[hidden] { display: none; }
  .msgs-compose-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .msgs-compose-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-compose-btn:hover { background: var(--accent-dark); }
  .msgs-compose-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Search bar "morph": .msgs-search-wrap's own width is fixed by the
     flex header row around it (flex:1) and never changes. What animates
     is the split INSIDE it — the input is flex:1 so it fills whatever
     space the clear button isn't using, and the clear button animates
     its own width from 0 up to full size. The two transitions together
     read as "the search bar shrinks to make room for an X", but the
     bar's overall footprint in the header is constant throughout. */
  .msgs-search-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  #msgsSearch {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    border: none;
    border-radius: 999px;
    background: var(--panel-inner);
    padding: 8px 14px;
    font: inherit;
    font-size: 0.82rem;
    color: var(--text-dark);
  }
  #msgsSearch::placeholder { color: var(--text-faint); }
  #msgsSearch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-search-clear {
    flex: 0 0 auto;
    width: 0;
    height: 32px;
    padding: 0;
    border: none;
    background: none;
    color: var(--text-faint);
    cursor: pointer;
    opacity: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.22s ease, opacity 0.16s ease;
  }
  .msgs-search-clear.show { width: 30px; opacity: 1; }
  .msgs-search-clear svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-search-clear:hover { color: var(--text-dark); }
  .msgs-search-clear:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 50%; }

  .msgs-search-results { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
  .msgs-search-results[hidden] { display: none; }
  .msgs-search-scope { margin: 2px 4px 8px; padding: 7px 10px; background: var(--panel-inner); border-radius: var(--window-radius-sm); font-size: 0.78rem; font-weight: 600; color: var(--text-dark); }
  .msgs-search-cat { padding: 2px 0 6px; }
  .msgs-search-cat + .msgs-search-cat { border-top: 1px solid var(--border); }
  .msgs-search-cat-title { margin: 8px 8px 2px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); }
  .msgs-search-cat-empty { margin: 0 8px 4px; font-size: 0.76rem; color: var(--text-faint); font-weight: 600; }
  .msgs-file-chip {
    width: 34px; height: 34px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .msgs-media-chip {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-inner);
    color: var(--text-muted);
  }
  .msgs-media-chip svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-search-result-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    padding: 8px;
    cursor: pointer;
    text-align: left;
    font: inherit;
  }
  .msgs-search-result-row:hover { background: var(--panel-inner); }
  .msgs-search-result-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }
  .msgs-search-result-text { min-width: 0; flex: 1; }
  /* display:block on both — as plain (inline-by-default) spans, the
     white-space:nowrap/overflow:hidden/text-overflow:ellipsis below
     didn't actually truncate anything: ellipsis truncation needs a
     block (or inline-block) box, since a bare inline span has no width
     of its own to clip against. Same fix already applied via <div> for
     the thread-list row's name/subject/preview (see .msgs-thread-row-*
     above) — this brings the search results panel in line with that so
     a long message truncates with "…" here too instead of overflowing
     or wrapping. */
  .msgs-search-result-name { display: block; font-weight: 700; font-size: 0.8rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msgs-search-result-snippet { display: block; font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msgs-search-result-snippet mark { background: rgba(217,74,43,0.22); color: inherit; border-radius: 3px; padding: 0 1px; }
  .msgs-filter-wrap { position: relative; flex-shrink: 0; }
  .msgs-filter-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }
  .msgs-filter-btn:hover { background: var(--panel-inner); }
  .msgs-filter-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-filter-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-filter-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 120px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .msgs-filter-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--text-dark);
    padding: 8px 10px;
    cursor: pointer;
  }
  .msgs-filter-item:hover { background: var(--panel-inner); }
  .msgs-filter-item.active { color: var(--accent); }

  .msgs-row-context-menu {
    position: fixed;
    min-width: 150px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 30;
  }
  .msgs-row-context-menu-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 10px;
    cursor: pointer;
  }
  .msgs-row-context-menu-item:hover { background: var(--panel-inner); }
  .msgs-row-context-menu-item.delete { color: #b6432f; }
  /* stroke: currentColor (not a hardcoded color) so the icon always
     matches its button's text color, including the .delete variant above
     -- avoids the kind of specificity/contrast bug the composer's link
     styling hit earlier this project (see architecture-decisions.md). */
  .msgs-row-context-menu-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: miter; flex-shrink: 0; }

  /* Scrolls on its own within the fixed-height panel -- .msgs-list-head
     (the + / search / filter row above it) stays put. */
  .msgs-thread-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
  .msgs-thread-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: var(--window-radius-md);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .msgs-thread-row:hover { background: var(--panel-inner); }
  .msgs-thread-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }
  .msgs-thread-row.active { background: var(--accent); }
  .msgs-thread-row.active .msgs-thread-row-name,
  .msgs-thread-row.active .msgs-thread-row-subject,
  .msgs-thread-row.active .msgs-thread-row-preview,
  .msgs-thread-row.active .msgs-thread-row-time { color: #fff; }
  .msgs-thread-row.unread .msgs-thread-row-name { font-weight: 900; }
  .msgs-thread-row.unread .msgs-thread-row-preview { color: var(--text-dark); font-weight: 600; }
  .msgs-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 0.02em;
    font-size: 1rem;
    position: relative;
    overflow: hidden;
  }
  .msgs-thread-row-text { min-width: 0; flex: 1; }
  .msgs-thread-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .msgs-thread-row-name { font-weight: 700; font-size: 0.86rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msgs-pin-icon { display: inline-flex; vertical-align: -2px; margin-right: 3px; }
  .msgs-pin-icon svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 3.25; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-thread-row-time { font-size: 0.66rem; font-weight: 700; color: var(--text-faint); flex-shrink: 0; }
  .msgs-thread-row-subject { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msgs-thread-row-preview { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msgs-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .msgs-thread-row.active .msgs-unread-dot { background: #fff; }
  .msgs-empty-hint { font-size: 0.8rem; color: var(--text-faint); text-align: center; padding: 24px 12px; font-weight: 600; }

  .msgs-thread-panel {
    flex: 1;
    min-width: 0;
    background: #fdfdfe;
    border-radius: var(--window-radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .msgs-thread-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-weight: 700;
    font-size: 0.9rem;
    gap: 10px;
    text-align: center;
    padding: 20px;
  }
  .msgs-thread-empty svg { width: 42px; height: 42px; stroke: var(--text-faint); fill: none; stroke-width: 1.15; opacity: 0.55; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-thread-empty p { margin: 0; max-width: 220px; line-height: 1.4; }
  .msgs-thread-empty .hint { font-size: 0.76rem; font-weight: 600; opacity: 0.8; }

  .msgs-thread-active { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .msgs-thread-empty[hidden], .msgs-thread-active[hidden] { display: none; }
  .msgs-thread-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .msgs-back-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    margin-right: 2px;
    flex-shrink: 0;
  }
  .msgs-back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 50%; }
  .msgs-thread-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 0.88rem; position: relative; overflow: hidden; }
  .msgs-thread-identity { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .msgs-thread-identity[hidden] { display: none; }
  .msgs-thread-head-text { min-width: 0; }
  /* the conversation pane is always light (#fdfdfe), so its name is always dark: in dark mode --text-dark is near white (2026-11-09) */
  .msgs-thread-name { display: block; font-weight: 800; font-size: 0.94rem; color: #14151f; }
  .msgs-thread-course { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-faint); }

  .msgs-thread-subject-row { position: relative; }
  .msgs-thread-subject-row[hidden] { display: none; }
  .msgs-thread-subject-trigger {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-faint);
    cursor: pointer;
    max-width: 100%;
  }
  .msgs-thread-subject-trigger:hover,
  .msgs-thread-subject-trigger[aria-expanded="true"] { color: var(--accent); }
  .msgs-thread-subject-trigger:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 4px; }
  #threadSubjectTriggerLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs-thread-subject-chevron { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 3.25; stroke-linecap: butt; stroke-linejoin: miter; flex-shrink: 0; transition: transform 0.15s ease; }
  .msgs-thread-subject-trigger[aria-expanded="true"] .msgs-thread-subject-chevron { transform: rotate(180deg); }
  .msgs-thread-subject-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 200px;
    max-width: 280px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 20;
  }
  .msgs-thread-subject-menu[hidden] { display: none; }
  .msgs-thread-subject-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--text-dark);
    padding: 8px 10px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msgs-thread-subject-menu-item:hover { background: var(--panel-inner); }
  .msgs-thread-subject-menu-item.active { color: var(--accent); }
  .msgs-thread-subject-menu-item.all-subjects { border-bottom: 1px solid var(--border); border-radius: var(--window-radius-sm) var(--window-radius-sm) 0 0; margin-bottom: 4px; padding-bottom: 10px; }

  /* Divider pill between each person's threads in the merged "All
     subjects" timeline (see renderMergedBubbles) -- named by subject so
     it still reads clearly which conversation each group of messages
     came from, even though they're no longer separated by thread. */
  .msgs-subject-divider { display: flex; justify-content: center; margin: 14px 0 10px; }
  .msgs-subject-divider:first-child { margin-top: 2px; }
  .msgs-subject-divider span { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-faint); background: var(--panel-inner); border-radius: 999px; padding: 4px 12px; }

  /* Composer hint shown in place of a working composer while the merged
     All Subjects view is open (see setComposerEnabled). */
  .msgs-composer-hint { padding: 8px 18px 0; margin: 0; font-size: 0.74rem; font-weight: 700; color: var(--text-faint); text-align: center; }
  .msgs-composer-hint[hidden] { display: none; }

  .msgs-to-bar { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .msgs-to-bar[hidden] { display: none; }
  .msgs-to-label { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); flex-shrink: 0; }
  .msgs-to-search { position: relative; flex: 1; min-width: 0; }
  .msgs-to-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    font: inherit;
    font-size: 0.84rem;
    color: var(--text-dark);
    background: var(--panel-bg);
  }
  .msgs-to-input::placeholder { color: var(--text-faint); }
  .msgs-to-input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-color: var(--accent); }
  .msgs-to-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 20;
    max-height: 280px;
    overflow-y: auto;
  }
  .msgs-to-results[hidden] { display: none; }
  .msgs-to-result-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    padding: 8px 10px;
    cursor: pointer;
  }
  .msgs-to-result-item:hover,
  .msgs-to-result-item.highlighted { background: var(--panel-inner); }
  .msgs-to-result-name { font-weight: 700; font-size: 0.84rem; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs-to-result-course { font-size: 0.72rem; font-weight: 600; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs-to-no-results { padding: 8px 10px; font-size: 0.82rem; font-weight: 600; color: var(--text-faint); }
  .msgs-subject-bar { padding: 10px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .msgs-sgy-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--panel-inner); color: var(--text-dark); font: inherit; font-size: 0.78rem; font-weight: 800; white-space: nowrap; cursor: pointer; }
  .msgs-sgy-btn:hover { background: var(--border); }
  .msgs-sgy-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-sgy-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .msgs-bubble-failed .msgs-sgy-btn { height: 26px; padding: 0 10px; font-size: 0.7rem; border-radius: 999px; }
  .msgs-sgy-scrim { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, 0.45); }
  .msgs-sgy-box { width: min(420px, 100%); background: var(--panel-bg); color: var(--text-dark); border-radius: var(--window-radius-md, 14px); box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5); padding: 20px; text-align: left; }
  .msgs-sgy-box h2 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 800; }
  .msgs-sgy-box p { margin: 0 0 10px; font-size: 0.86rem; font-weight: 600; color: var(--text-muted); line-height: 1.45; }
  .msgs-sgy-box ol { margin: 0 0 16px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; font-weight: 600; color: var(--text-muted); line-height: 1.4; }
  .msgs-sgy-box ol b { color: var(--text-dark); }
  .msgs-sgy-acts { display: flex; justify-content: flex-end; gap: 8px; }
  .msgs-sgy-acts button { height: 36px; padding: 0 14px; border: 0; border-radius: 10px; font: inherit; font-size: 0.84rem; font-weight: 800; cursor: pointer; background: var(--panel-inner); color: var(--text-dark); }
  .msgs-sgy-acts button.go { background: var(--accent); color: #fff; }
  .msgs-sgy-acts button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-subject-bar[hidden] { display: none; }
  .msgs-subject-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.84rem;
    color: var(--text-dark);
    background: var(--panel-bg);
  }
  .msgs-subject-input::placeholder { color: var(--text-faint); }
  .msgs-subject-input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-color: var(--accent); }
  /* The pinned "New Message" row's icon avatar -- a plain "+" instead of
     a person's initial, since no recipient may be chosen yet. */
  .msgs-avatar-new { background: var(--accent); }
  .msgs-avatar-new svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: butt; stroke-linejoin: miter; }

  /* Scrolls on its own within the fixed-height panel -- .msgs-thread-header
     (who you're texting) above and .msgs-composer (send box) below both
     stay put. flex:1/min-height:0 is also what makes it consume any
     leftover vertical space instead of that space collecting below the
     composer -- see the .msgs-shell comment above. */
  .msgs-bubbles { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  /* flex-direction:column so a message that also carries an attachment
     (see .msgs-bubble-attachment) stacks the attachment chip right below
     its bubble instead of side-by-side; a row with just a bubble looks
     identical to before. */
  .msgs-bubble-row { display: flex; flex-direction: column; gap: 6px; }
  .msgs-bubble-row.me { align-items: flex-end; }
  .msgs-bubble-row.them { align-items: flex-start; }
  .msgs-bubble { max-width: 74%; padding: 9px 13px; border-radius: 16px; font-size: 0.84rem; line-height: 1.42; }
  .msgs-bubble-row.them .msgs-bubble { background: var(--panel-inner); color: var(--text-dark); border-bottom-left-radius: 4px; }
  .msgs-bubble-row.me .msgs-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msgs-bubble-time { display: block; font-size: 0.62rem; font-weight: 700; margin-top: 4px; }
  .msgs-bubble-row.them .msgs-bubble-time { color: var(--text-faint); }
  .msgs-bubble-row.me .msgs-bubble-time { color: rgba(255,255,255,0.82); }
  /* A file/link/video/audio genuinely shared IN this message — renders
     right under it as its own small chip row, in the same panel style
     regardless of who sent it (unlike the text bubble, which flips
     color for "me"), matching how a real messaging app shows an
     attachment distinctly from the text around it. */
  .msgs-bubble-attachment { display: flex; align-items: center; gap: 9px; max-width: 74%; padding: 6px 12px 6px 6px; border-radius: 14px; background: var(--panel-inner); cursor: pointer; }
  .msgs-bubble-attachment:hover { background: var(--border); }
  .msgs-bubble-link { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
  .msgs-bubble-attachment .msgs-file-chip, .msgs-bubble-attachment .msgs-media-chip { width: 28px; height: 28px; font-size: 0.52rem; }
  .msgs-bubble-attachment .msgs-media-chip svg { width: 13px; height: 13px; }
  .msgs-bubble-attachment-text { min-width: 0; }
  .msgs-bubble-attachment-name { display: block; max-width: 170px; font-size: 0.76rem; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msgs-bubble-attachment-name-link { color: var(--accent); text-decoration: underline; }
  .msgs-bubble-attachment-meta { font-size: 0.66rem; font-weight: 600; color: var(--text-faint); }
  .msgs-bubble-attachment-time { display: block; font-size: 0.62rem; font-weight: 700; color: var(--text-faint); margin-top: -2px; }
  @keyframes msgsBubbleFlash {
    0% { box-shadow: 0 0 0 0 rgba(217,74,43,0); }
    25% { box-shadow: 0 0 0 4px rgba(217,74,43,0.6); }
    100% { box-shadow: 0 0 0 0 rgba(217,74,43,0); }
  }
  .msgs-bubble-row.flash .msgs-bubble { animation: msgsBubbleFlash 1.4s ease; }

  .msgs-composer { display: flex; align-items: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
  /* The actual "message box" -- was just the bare <input> before; now a
     bordered/rounded container so a pending attachment (see
     .msgs-pending-attachment) can sit inside it, above the text line,
     as one visually unified box that extends upward to fit both rather
     than a separate chip floating above the whole composer row. With no
     attachment it's a single row and the 20px radius on a ~40px-tall
     box still reads as the original pill. */
  .msgs-composer-box {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel-bg);
    overflow: hidden;
  }
  .msgs-composer-box:focus-within { box-shadow: 0 0 0 2px var(--accent-ring); border-color: var(--accent); }
  /* Disabled while viewing the merged "All subjects" timeline (see
     setComposerEnabled) -- there's no single thread to reply into. */
  .msgs-composer-box:has(#composerInput:disabled) { background: var(--panel-inner); }
  #composerInput {
    border: none;
    border-radius: 0;
    padding: 10px 16px;
    font: inherit;
    font-size: 0.84rem;
    color: var(--text-dark);
    background: none;
  }
  #composerInput::placeholder { color: var(--text-faint); }
  #composerInput:focus-visible { outline: none; }
  #composerInput:disabled { color: var(--text-faint); cursor: not-allowed; }
  .msgs-send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .msgs-send-btn:hover { background: var(--accent-dark); }
  .msgs-send-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-send-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: butt; stroke-linejoin: miter; 
    transform: translate(-0.75px, 0.75px); }
  .msgs-send-btn:disabled { background: var(--text-faint); cursor: not-allowed; }
  .msgs-attach-btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .msgs-attach-btn:disabled:hover { background: none; color: var(--text-muted); }
  .msgs-attach-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .msgs-attach-btn:hover { background: var(--panel-inner); color: var(--text-dark); }
  .msgs-attach-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-attach-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: butt; stroke-linejoin: miter; }
  .msgs-pending-attachment {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 10px 0;
    flex-shrink: 0;
  }
  .msgs-pending-attachment[hidden] { display: none; }
  .msgs-pending-attachment-tile {
    position: relative;
    width: 76px;
    height: 76px;
    border-radius: 14px;
    background: var(--panel-inner);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 6px;
    flex-shrink: 0;
  }
  .msgs-pending-attachment-tile-name {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-dark);
    text-align: center;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .msgs-pending-attachment-tile-ext {
    font-size: 0.56rem;
    font-weight: 900;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: var(--panel-bg);
    padding: 2px 7px;
    border-radius: 999px;
  }
  /* Sits on the tile's top-right corner (half overlapping, half clear
     of it), matching the reference screenshot's remove-button style. */
  .msgs-pending-attachment-tile-remove {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--panel-bg);
    background: var(--text-dark);
    color: #fff;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .msgs-pending-attachment-tile-remove:hover { background: var(--accent-dark); }
  .msgs-pending-attachment-tile-remove:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-pending-attachment-tile-remove svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 3.25; stroke-linecap: butt; stroke-linejoin: miter; }

  /* #composerInput (ID selector, higher specificity) also sets its own
     color -- this needs the ID repeated here too, or that rule wins and
     the text never visibly turns blue despite the class being applied. */
  #composerInput.msgs-composer-link-active { color: var(--accent); text-decoration: underline; }

  /* ---------- Bottom nav — copied verbatim ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;
    margin-left: 4px;
    padding: 12px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-more .label { display: flex; align-items: center; height: 1.2em; font-size: 0.72rem; color: var(--text-faint); }
  .nav-more .label svg { display: block; fill: currentColor; }
  /* thin divider between the pages and the dots */
  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }
  .nav-more.has-active .dot { background: var(--accent); }
  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    pointer-events: auto;
  }
  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-faint);
    text-align: left;
    padding: 12px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {
    .nav-more { padding: 10px 12px 8px; }
    .nav-more::before { top: 10px; bottom: 10px; }
    .app-nav-inner .nav-link, .app-nav-inner .nav-more { padding-top: 8px; padding-bottom: 8px; }
    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }

  @media (max-width: 720px) {
    .msgs-list-panel { width: 100%; }
    .msgs-shell:not(.thread-open) .msgs-thread-panel { display: none; }
    .msgs-shell.thread-open .msgs-list-panel { display: none; }
    .msgs-shell.thread-open .msgs-thread-panel { display: flex; }
    .msgs-back-btn { display: inline-flex; align-items: center; }
  }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 21, 31, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.16s ease;
    z-index: 60;
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--panel-bg, #eaeaec);
    border-radius: var(--window-radius-lg, 22px);
    padding: 20px 22px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    position: relative;
    transform: translateY(8px);
    transition: transform 0.16s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    font-size: 1rem;
    color: var(--text-faint);
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text-dark); }
  .contact-modal-head { display: flex; align-items: center; gap: 12px; clear: both; padding-top: 4px; }
  .contact-modal-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 1.05rem;
    flex-shrink: 0;
  }
  .modal-box h3 { margin: 0; font-size: 1.1rem; font-weight: 900; font-style: italic; color: var(--text-dark); }
  .modal-code { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin: 2px 0 0; }
  .modal-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .modal-row:last-of-type { border-bottom: none; }
  .modal-row .k { color: var(--text-faint); font-weight: 700; }
  .modal-row .v { color: var(--text-dark); font-weight: 700; text-align: right; }
  .modal-rows { margin-top: 14px; }
  .contact-modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .contact-modal-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: none;
  }
  .contact-modal-btn:hover { background: var(--accent-dark); }
  .contact-modal-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .contact-modal-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: miter; }
  .contact-modal-btn.secondary { background: var(--panel-inner); color: var(--text-dark); }
  .contact-modal-btn.secondary:hover { background: var(--border); }
  /* The To box's selected-recipient state (see selectToPerson) — visually
     signals it's now clickable-for-info rather than free-typed text. */
  .msgs-to-input.msgs-to-selected { cursor: pointer; }
  /* Each emoji is an inline SVG sized by font-size (1em box), so it is
     exactly as big as its box and sits dead center. The svg rule undoes
     the line-icon styles (stroke, fill:none, opacity) that the parent
     rows still set for their other icons. */
  .emo { display: inline-block; width: 1em; height: 1em; line-height: 0; flex-shrink: 0; vertical-align: middle; }
  .emo svg { display: block; width: 100%; height: 100%; fill: initial; stroke: none; opacity: 1; }
  .msgs-media-chip .emo { font-size: 16px; }
  .msgs-bubble-attachment .msgs-media-chip .emo { font-size: 14px; }
  .msgs-pin-icon .emo { font-size: 11px; }
  .msgs-thread-empty .emo { font-size: 40px; margin-bottom: 4px; }

  /* Inbox states in the list: loading, couldn't load (Try again), empty. */
  .msgs-list-state { padding: 32px 16px; text-align: center; color: var(--text-faint); font-size: 0.8rem; font-weight: 600; line-height: 1.45; }
  .msgs-list-state p { margin: 0 0 8px; }
  .msgs-list-state .msgs-list-state-title { color: var(--text-dark); font-weight: 800; font-size: 0.88rem; }
  .msgs-list-state .msgs-state-btn { margin-top: 4px; }
  /* A thread that couldn't load, in the bubbles area. */
  .msgs-thread-state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 12px; }
  .msgs-thread-state .msgs-empty-hint { padding: 0; }
  .msgs-thread-state.compact { padding: 8px 12px; }
  .msgs-state-btn { display: inline-block; border: none; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 800; font-size: 0.8rem; padding: 8px 16px; cursor: pointer; text-decoration: none; }
  .msgs-state-btn:hover { background: var(--accent-dark); }
  .msgs-state-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* A message that didn't go through: says so under the bubble, with Retry. */
  .msgs-bubble-failed { display: flex; align-items: center; justify-content: flex-end; gap: 8px; max-width: 80%; text-align: right; font-size: 0.7rem; font-weight: 700; color: #b6432f; }
  .msgs-subject-input[aria-invalid="true"] { border-color: #b6432f; }
  .msgs-retry-btn { border: none; border-radius: 999px; background: var(--panel-inner); color: var(--text-dark); font: inherit; font-weight: 800; font-size: 0.7rem; padding: 4px 12px; cursor: pointer; }
  .msgs-retry-btn:hover { background: var(--border); }
  .msgs-retry-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Group threads: who wrote each incoming message. */
  .msgs-bubble-author { font-size: 0.66rem; font-weight: 800; color: var(--text-faint); margin: 0 0 -2px 4px; }
  /* Real messages keep their line breaks, and a long link wraps instead of
     stretching the bubble past the panel. */
  .msgs-shell.live .msgs-bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msgs-row-context-menu-item[hidden], .modal-row[hidden] { display: none; }
  /* Google Classroom has no messages: one panel with a note, no list and
     no composer. After the 720px rule above on purpose, so this wins on
     phones too. */
  .msgs-shell.no-messaging .msgs-list-panel { display: none; }
  .msgs-shell.no-messaging .msgs-thread-panel { display: flex; }
  .msgs-shell.no-messaging .msgs-thread-empty p { max-width: 340px; }
  .msgs-shell.no-messaging .msgs-thread-empty .msgs-no-messaging-title { color: var(--text-dark); }
  .msgs-shell.no-messaging .msgs-thread-empty .msgs-state-btn { margin-top: 4px; }
  /* Messages are read, not glanced at: the device's own text font, a little bigger */
  .msgs-bubble, .msgs-thread-row-preview, .msgs-shell textarea, .msgs-shell [contenteditable="true"] {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500; letter-spacing: 0;
  }
  .msgs-bubble { font-size: 0.92rem; line-height: 1.45; }
  .msgs-thread-row-preview { font-size: 0.8rem; }
</style>
