<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Contacts</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from the other
     top-level pages (home.html/courses.html/assignments.html) so this
     reads as the same app. See architecture-decisions.md re: promoting
     this to an actual shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- .card grows to
      its natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.6rem, 3.4vw, 2.1rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    margin: 2px 0 0 2px;
  }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(180deg, #A5ABB8, #858994);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.02em;
    cursor: pointer;
    flex-shrink: 0;
  }

  .profile-btn.has-photo { border-color: transparent; background-origin: border-box; background-repeat: no-repeat; }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- One card, same as every other page ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
  }
  .card-inner {
    padding: 22px 24px 20px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .section-head h2 {
    font-size: 1rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0;
  }
  .contacts-total {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-faint);
  }

  /* ---------- Search bar — same pill input treatment used across the
     app (messages.html's search, the color-swatch popups, etc.). ---------- */
  .contacts-search-wrap { position: relative; margin: 14px 0 4px; }
  .contacts-search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--text-faint); fill: none; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: miter; pointer-events: none; }
  /* the Add contacts box uses the same pill (2026-11-09: it was the browser's plain box, with the icon over the text) */
  #contactsSearch, #addContactsFind {
    width: 100%;
    border: none;
    border-radius: 999px;
    background: var(--panel-inner);
    padding: 9px 14px 9px 34px;
    font: inherit;
    font-size: 0.82rem;
    color: var(--text-dark);
  }
  #contactsSearch::placeholder, #addContactsFind::placeholder { color: var(--text-faint); }
  #contactsSearch:focus-visible, #addContactsFind:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .contact-row { display: flex; align-items: center; gap: 10px; padding: 9px 6px; cursor: pointer; border-radius: var(--window-radius-sm); }
  .contact-row:hover { background: var(--panel-inner); }
  .contact-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }
  .contact-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    color: #fff;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 0.02em;
    font-size: 0.82rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .contact-text { flex: 1; min-width: 0; }
  .contact-name { font-weight: 800; font-style: italic; font-size: 0.86rem; color: var(--text-dark); margin: 0; letter-spacing: -0.005em; }
  .contact-role { font-weight: 500; font-size: 0.78rem; color: var(--text-muted); margin: 1px 0 0; }
  .contact-meta { font-size: 0.68rem; color: var(--text-faint); margin: 2px 0 0; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-email-btn {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--panel-bg);
    color: var(--accent);
    border: none;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
  }
  .contact-email-btn:hover { background: var(--accent); color: #fff; }
  .contact-email-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .contact-email-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.55; stroke-linecap: butt; stroke-linejoin: miter; }
  .contacts-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 10px 0; }

  /* ---------- Contact detail modal — same .modal-overlay/.modal-box
     component as course-home.html's course-info pop-out: dark full-page
     backdrop, click on the backdrop (not the box) closes it, Escape
     closes it. Standing popup convention for the whole app. ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 60;
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease;
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    max-width: 380px; width: 100%;
    padding: 22px 24px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    transform: translateY(8px);
    transition: transform 0.15s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-close {
    float: right;
    background: var(--panel-inner);
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text-dark); }
  .contact-modal-head { display: flex; align-items: center; gap: 12px; clear: both; padding-top: 4px; }
  .contact-modal-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    color: #fff;
    font-weight: 800;
    font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .modal-box h3 { margin: 0; font-size: 1.1rem; font-weight: 900; font-style: italic; color: var(--text-dark); }
  .modal-code { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin: 2px 0 0; }
  .modal-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .modal-row:last-of-type { border-bottom: none; }
  .modal-row .k { color: var(--text-faint); font-weight: 700; }
  .modal-row .v { color: var(--text-dark); font-weight: 700; text-align: right; }
  .modal-rows { margin-top: 14px; }
  .contact-modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .contact-modal-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px;
    font: inherit;
    font-weight: 800;
    font-size: 0.82rem;
    cursor: pointer;
    text-decoration: none;
  }
  .contact-modal-btn:hover { background: var(--accent-dark); }
  .contact-modal-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .contact-modal-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: butt; stroke-linejoin: miter; }
  .contact-modal-btn.secondary { background: var(--panel-inner); color: var(--text-dark); }
  .contact-modal-btn.secondary:hover { background: var(--border); }

  /* ---------- Bottom nav — verbatim from every other page ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;
    margin-left: 4px;
    padding: 12px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-more .label { display: flex; align-items: center; height: 1.2em; font-size: 0.72rem; color: var(--text-faint); }
  .nav-more .label svg { display: block; fill: currentColor; }
  /* thin divider between the pages and the dots */
  .nav-more::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--border, #cfcfd6); }
  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }
  .nav-more .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-more.has-active .label { color: var(--text-dark); }
  .nav-more.has-active .dot { background: var(--accent); }
  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    pointer-events: auto;
  }
  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-faint);
    text-align: left;
    padding: 12px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {
    .nav-more { padding: 10px 12px 8px; }
    .nav-more::before { top: 10px; bottom: 10px; }
    .app-nav-inner .nav-link, .app-nav-inner .nav-more { padding-top: 8px; padding-bottom: 8px; }
    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }

  .modal-row[hidden], .modal-rows[hidden], .contact-modal-btn[hidden], .contact-modal-actions[hidden], .contacts-search-wrap[hidden] { display: none; }
  .modal-row.is-last { border-bottom: none; }
  .contacts-state { padding: 24px 8px 12px; text-align: center; font-size: 0.82rem; font-weight: 600; color: var(--text-faint); line-height: 1.45; }
  .contacts-state p { margin: 0 0 8px; }
  .contacts-state .contacts-state-title { color: var(--text-dark); font-weight: 800; font-size: 0.9rem; }
  .contacts-state-btn { border: none; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 800; font-size: 0.8rem; padding: 8px 16px; cursor: pointer; }
  .contacts-state-btn:hover { background: var(--accent-dark); }
  .contacts-state-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .contacts-head-end { display: inline-flex; align-items: center; gap: 12px; }
  .contacts-add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: none; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
  .contacts-add-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
  .contacts-add-btn[hidden] { display: none; }
  .contacts-add-btn:hover { filter: brightness(1.08); }
  .contact-remove-btn { display: block; margin: 14px auto 0; border: none; background: none; font: inherit; font-size: 0.82rem; font-weight: 700; color: var(--grade-bad); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .contact-remove-btn[hidden] { display: none; }
  .add-box { max-width: 440px; }
  .add-box h3 { margin: 0; font-size: 1.1rem; font-weight: 800; font-style: italic; color: var(--text-dark); }
  .add-sub { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-muted); }
  .add-list { max-height: 320px; overflow-y: auto; margin-top: 8px; }
  .add-item { display: flex; align-items: center; gap: 12px; padding: 8px 4px; }
  .add-item + .add-item { border-top: 1px solid var(--border); }
  .add-item .contact-avatar { width: 34px; height: 34px; font-size: 0.8rem; }
  .add-item b { flex: 1; min-width: 0; font-size: 0.88rem; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-item button { flex: none; padding: 6px 14px; border: none; border-radius: 999px; background: var(--panel-inner); color: var(--text-dark); font: inherit; font-size: 0.78rem; font-weight: 800; cursor: pointer; }
  .add-item button:hover { background: var(--control-hover); }
  .add-item button[disabled] { opacity: 0.6; cursor: default; }
  .add-note { padding: 18px 4px; text-align: center; font-size: 0.82rem; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 class="title">Contacts</h1>
        <p class="subtitle" id="contactsSub"></p>
      </div>
      <div class="profile-menu-wrap">
        <button class="profile-btn" id="profileBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Profile and settings"></button>
        <div class="profile-menu" id="profileMenu" role="menu" hidden>
          <button class="profile-menu-item" type="button" role="menuitem" data-action="settings">Settings</button>
          <button class="profile-menu-item signout" type="button" role="menuitem" data-action="signout">Sign out</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="section-head">
          <h2 id="contactsHeading">District Directory</h2>
          <span class="contacts-head-end"><span class="contacts-total" id="contactsTotal"></span><button class="contacts-add-btn" id="contactsAddBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add contacts</button></span>
        </div>
        <div class="contacts-search-wrap" id="contactsSearchWrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="contactsSearch" placeholder="Search by name, role, subject, or school" autocomplete="off" aria-label="Search contacts">
        </div>
        <div id="contactsListBody"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="contactModal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalContactName">
      <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Close contact info">✕</button>
      <div class="contact-modal-head">

  <script>
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>

  <script>
    (function () {
      function darken(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }
      function applyAppearance() {
        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));
        }
        if (saved.background === 'white') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#0c0c0e';
        } else if (saved.background) {
          document.body.style.backgroundImage = `url("${saved.background}")`;
          document.body.style.backgroundColor = '';
        }
      }
      applyAppearance();
      window.addEventListener('storage', e => {
        if (e.key === 'schoolagy_appearance') applyAppearance();
      });
    })();

    const CT_AV = window.__AVERAGES__;
    const CT_LIVE = !!(CT_AV && CT_AV.data && CT_AV.mode === 'live');
    const CT_DATA = CT_LIVE ? CT_AV.data : {};
    const CT_API = window.location.hostname.endsWith('averages.io') ? 'https://api.averages.io' : 'http://localhost:8787';
    let ctState = CT_LIVE && !Array.isArray(CT_DATA.CONTACTS) ? 'error' : 'ready'; // 'ready' | 'loading' | 'error'
    let ctClassroom = CT_LIVE && (CT_DATA.platform === 'classroom' || CT_DATA.PEOPLE_PLATFORM === 'classroom');
    let ctNeedsPermission = CT_LIVE && CT_DATA.PEOPLE_NEEDS_PERMISSION === true;

    function ctText(value, max) {
      return (value == null ? '' : String(value)).trim().slice(0, max);
    }
    function ctSetContacts(list) {
      const next = (Array.isArray(list) ? list : []).filter(c => c && c.id != null && String(c.id) !== '').map(c => {
        const color = ctText(c.color, 16);
        return {
          id: String(c.id),
          name: ctText(c.name, 120) || 'Your teacher',

          school: ctText(c.school, 120),

      const store = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
      const dir = store('fsct_dir') || {}, added = Array.isArray(store('fsct_added')) ? store('fsct_added') : [];
      added.map(String).filter(id => dir[id] && !next.some(c => c.id === id)).forEach(id => next.push({
        id, name: ctText(dir[id], 120), role: 'Added by you', dept: '', school: '', email: '', phone: '', color: '#83849a', category: 'added',

    function ctSchoolOnly() { try { return (JSON.parse(localStorage.getItem('schoolagy_settings_options') || '{}') || {}).contactsSearch !== 'everyone'; } catch { return true; } }
    function ctCanOf(id) {
      try { const v = (JSON.parse(localStorage.getItem('fsct_can') || '{}') || {})[id]; return v && Date.now() - (v.at || 0) < (v.s === true ? 864e5 : 9e5) ? v.s : undefined; } catch { return undefined; }

    function ctCanCheck(ids, done) {
      const need = [...new Set(ids.map(String))].filter(id => /^\d{1,20}$/.test(id) && ctCanOf(id) === undefined).slice(0, 25);

          const at = Date.now(), mails = (j && j.email) || {}; need.forEach(id => { all[id] = { s: null, at }; }); Object.entries((j && j.can) || {}).forEach(([id, v]) => { all[id] = { s: v === true ? true : v === false ? false : null, at, e: typeof mails[id] === 'string' ? mails[id].slice(0, 254) : '' }; });
          try { localStorage.setItem('fsct_can', JSON.stringify(all)); } catch {}

     * bundle on the way in.
     *
     * NOTE: do not wrap values that are themselves HTML — escaping markup
     * would print visible tags.
     */
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
      ));
    }

    function initials(name) {
      if (window.AveragesAvatar) return name === 'Your teacher' ? '?' : window.AveragesAvatar.initials(name);
      const parts = name.replace(/^(Mr\.|Mrs\.|Ms\.|Mx\.|Dr\.|Sra\.|Sr\.|Coach|Nurse)\s+/i, '').split(' ');
      return parts.map(p => p[0]).join('').slice(0, 2).toUpperCase();
    }

    // Sorted by last name (title stripped first), matching the reference
    // Faculty page's own ordering (Abassy, Alex, Alexander, Alexander,
    // Alvarado, ...).
    function lastNameKey(name) {
      const stripped = name.replace(/^(Mr\.|Mrs\.|Ms\.|Mx\.|Dr\.|Sra\.|Sr\.|Coach|Nurse)\s+/i, '').trim();
      const parts = stripped.split(/\s+/);
      return parts[parts.length - 1].toLowerCase();
    }
    const CONTACTS_SORTED = [...CONTACTS].sort((a, b) => lastNameKey(a.name).localeCompare(lastNameKey(b.name)));
    function ctResort() {
      const sorted = [...CONTACTS].sort((a, b) => lastNameKey(a.name).localeCompare(lastNameKey(b.name)));
      CONTACTS_SORTED.length = 0;
      sorted.forEach(c => CONTACTS_SORTED.push(c));
    }

    function contactRowHTML(c) {
      return `
        <div class="contact-row" role="button" tabindex="0" data-id="${escapeHtml(c.id)}" aria-label="${escapeHtml(c.name)}${c.role ? ', ' + escapeHtml(c.role) : ''}">
          <span class="contact-avatar" style="background:${escapeHtml(window.AveragesAvatar ? window.AveragesAvatar.background(c.name === 'Your teacher' ? '' : c.name) : c.color)}">${escapeHtml(initials(c.name))}</span>
          <div class="contact-text">
            <p class="contact-name">${escapeHtml(c.name)}</p>
            ${c.role ? `<p class="contact-role">${escapeHtml(c.role)}</p>` : ''}
            ${c.dept || c.school ? `<p class="contact-meta">${[c.dept, c.school].filter(Boolean).map(v => escapeHtml(v)).join(' · ')}</p>` : ''}
          </div>
          ${c.email ? `<a class="contact-email-btn" href="mailto:${escapeHtml(c.email)}" aria-label="Email ${escapeHtml(c.name)}" onclick="event.stopPropagation()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </a>` : ''}
        </div>`;
    }

    function matchesQuery(c, q) {
      if (!q) return true;
      const hay = `${c.name} ${c.role} ${c.dept} ${c.school}`.toLowerCase();
      return hay.includes(q);
    }

    function renderContactList() {
      const q = contactsSearchInput.value.trim().toLowerCase();
      const body = document.getElementById('contactsListBody');
      if (CT_LIVE) {
        const state = ctStateHtml();
        document.getElementById('contactsSearchWrap').hidden = !!state;
        if (state) { body.innerHTML = state; return; }
      }
      const items = CONTACTS_SORTED.filter(c => matchesQuery(c, q));
      body.innerHTML = items.length
        ? items.map(contactRowHTML).join('')
        : `<p class="contacts-empty">No contacts match "${escapeHtml(contactsSearchInput.value.trim())}".</p>`;
    }

    const contactsSearchInput = document.getElementById('contactsSearch');
    contactsSearchInput.addEventListener('input', renderContactList);

    renderContactList();
    ctRenderHeader();

    // ------------------------------------------------------------------
    // Contact detail modal — same .modal-overlay/.modal-box open/close
    // convention as course-home.html's course-info pop-out (darkens the
    // rest of the page, backdrop click or Escape closes it).
    // ------------------------------------------------------------------
    const contactModal = document.getElementById('contactModal');
    const modalMessageBtn = document.getElementById('modalMessageBtn');
    const modalEmailBtn = document.getElementById('modalEmailBtn');

    function openContactModal(c) {
      // someone you added: their school email, when Schoology showed it in the can-message check
      if (c.category === 'added' && !c.email) { try { const v = (JSON.parse(localStorage.getItem('fsct_can') || '{}') || {})[c.id]; if (v && typeof v.e === 'string' && /@/.test(v.e)) c.email = ctText(v.e, 254); } catch {} }
      document.getElementById('modalAvatar').textContent = initials(c.name);
      document.getElementById('modalAvatar').style.background = window.AveragesAvatar ? window.AveragesAvatar.background(c.name === 'Your teacher' ? '' : c.name) : c.color;
      document.getElementById('modalContactName').textContent = c.name;
      document.getElementById('modalContactRole').textContent = c.category === 'added'
        ? (ctCanOf(c.id) === false ? "Added by you · Schoology doesn't let you message them" : ctCanOf(c.id) === true ? 'Added by you · You can message them on Schoology' : 'Added by you')
        : (c.role || c.dept);
      if (c.category === 'added' && ctCanOf(c.id) === undefined) ctCanCheck([c.id], () => { if (document.getElementById('modalContactName').textContent === c.name) openContactModal(c); });
      document.getElementById('modalDept').textContent = c.dept;
      document.getElementById('modalSchool').textContent = c.school;
      document.getElementById('modalEmail').textContent = c.email;
      document.getElementById('modalPhone').textContent = c.phone;
      modalMessageBtn.onclick = () => {
        const url = `messages.html?compose=${encodeURIComponent(c.id)}`
          + `&name=${encodeURIComponent(c.name)}`
          + `&dept=${encodeURIComponent(c.dept)}`
          + `&color=${encodeURIComponent(c.color)}`;
        window.location.href = url;
      };
      modalEmailBtn.href = `mailto:${c.email}`;
      modalEmailBtn.hidden = !c.email;
      const rm = document.getElementById('modalRemoveBtn');
      rm.hidden = c.category !== 'added';
      rm.onclick = () => { ctAddedSet(c.id, null); closeContactModal(); };
      if (CT_LIVE) ctTidyModal(c);
      contactModal.classList.add('show');
      document.getElementById('modalCloseBtn').focus();
    }
    function closeContactModal() { contactModal.classList.remove('show'); }

    // ---------- Add contacts: anyone Schoology lets them message (GET /messages/recipients) ----------
    function ctAddedSet(id, name) {
      const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
      const dir = read('fsct_dir') || {}, added = (Array.isArray(read('fsct_added')) ? read('fsct_added') : []).map(String).filter(x => x !== id);
      if (name) { added.push(id); dir[id] = name; }
      try { localStorage.setItem('fsct_added', JSON.stringify(added)); localStorage.setItem('fsct_dir', JSON.stringify(dir)); } catch {}
      const teachers = CONTACTS.filter(c => c.category !== 'added');
      ctSetContacts(teachers.map(c => Object.assign({}, c)));
      ctResort(); ctRenderHeader(); renderContactList();
    }
    let ctDirectory = null;
    const addModal = document.getElementById('addContactsModal');
    function addDraw() {
      const list = document.getElementById('addContactsList'), q = document.getElementById('addContactsFind').value.trim().toLowerCase();
      if (ctDirectory === null) { list.innerHTML = '<p class="add-note" role="status">Loading people…</p>'; return; }
      if (ctDirectory === 'error') { list.innerHTML = '<p class="add-note" role="alert">Couldn\'t load people from Schoology. Try again in a moment.</p>'; return; }
      const have = new Set(CONTACTS.map(c => c.id));
      const hits = ctDirectory.filter(p => !q || p.name.toLowerCase().includes(q)).slice(0, 60);
      if (!hits.length) { list.innerHTML = `<p class="add-note"${addBusy ? ' role="status"' : ''}>${addBusy ? 'Searching Schoology…' : q.length < 2 ? 'Type a name to find people in Schoology.' : 'Nobody in Schoology matches that.'}</p>`; return; }
      list.innerHTML = hits.length ? hits.map(p => `<div class="add-item" role="listitem"><span class="contact-avatar" style="background:${escapeHtml(window.AveragesAvatar ? window.AveragesAvatar.background(p.name) : '#83849a')}">${escapeHtml(initials(p.name))}</span><b>${escapeHtml(p.name)}</b><button type="button" data-add="${escapeHtml(p.id)}"${have.has(p.id) ? ' disabled' : ''}>${have.has(p.id) ? 'Added' : 'Add'}</button></div>`).join('')
        : '';
    }
    function addOpen() {
      addModal.classList.add('show');
      document.getElementById('addContactsFind').value = '';
      addDraw(); document.getElementById('addContactsFind').focus();
      if (ctDirectory === null || ctDirectory === 'error') {
        ctDirectory = null; addDraw();
        fetch(CT_API + '/messages/recipients', { credentials: 'include', cache: 'no-store' }).then(r => (r.ok ? r.json() : Promise.reject(r.status)))
          .then(j => { ctDirectory = (Array.isArray(j.recipients) ? j.recipients : []).filter(p => p && p.id != null && p.name).map(p => ({ id: String(p.id), name: String(p.name).slice(0, 120) })); addDraw(); })
          .catch(() => { ctDirectory = 'error'; addDraw(); });
      }
    }
    const addClose = () => { addModal.classList.remove('show'); document.getElementById('contactsAddBtn').focus(); };
    document.getElementById('contactsAddBtn').hidden = !CT_LIVE || ctClassroom;
    document.getElementById('contactsAddBtn').addEventListener('click', addOpen);
    document.getElementById('addContactsClose').addEventListener('click', addClose);
    // Schoology's own search by name, as you type (GET /messages/people)
    let addBusy = false, addT = 0, addSeq = 0;
    const addAsked = new Set();
    document.getElementById('addContactsFind').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      clearTimeout(addT);
      if (q.length >= 2 && !addAsked.has(q) && Array.isArray(ctDirectory)) {
        addBusy = true;
        addT = setTimeout(() => {
          const my = ++addSeq; addAsked.add(q);
          fetch(CT_API + '/messages/people?q=' + encodeURIComponent(q) + (ctSchoolOnly() ? '&scope=school' : ''), { credentials: 'include', cache: 'no-store' }).then(r => (r.ok ? r.json() : { people: [] }))
            .then(j => { (Array.isArray(j.people) ? j.people : []).forEach(p => { const id = String(p.id); if (id && p.name && Array.isArray(ctDirectory) && !ctDirectory.some(x => x.id === id)) ctDirectory.push({ id, name: String(p.name).slice(0, 120) }); }); })
            .catch(() => {}).then(() => { if (my === addSeq) addBusy = false; addDraw(); });
        }, 250);
      } else addBusy = false;
      addDraw();
    });
    addModal.addEventListener('click', e => {
      if (e.target === addModal) { addClose(); return; }
      const b = e.target.closest('[data-add]'); if (!b || b.disabled) return;
      const p = (ctDirectory || []).find(x => x.id === b.dataset.add); if (!p) return;
      ctAddedSet(p.id, p.name); addDraw();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && addModal.classList.contains('show')) addClose(); });

    document.getElementById('contactsListBody').addEventListener('click', e => {
      const row = e.target.closest('.contact-row');
      if (!row) return;
      const c = CONTACTS.find(x => x.id === row.dataset.id);
      if (c) openContactModal(c);
    });
    document.getElementById('contactsListBody').addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('.contact-row');
      if (!row) return;
      e.preventDefault();
      const c = CONTACTS.find(x => x.id === row.dataset.id);
      if (c) openContactModal(c);
    });
    document.getElementById('modalCloseBtn').addEventListener('click', closeContactModal);
    if (CT_LIVE) {
      document.getElementById('contactsListBody').addEventListener('click', e => {
        if (e.target.closest('[data-action="retry-people"]')) ctRetry();
      });
    }
    contactModal.addEventListener('click', e => { if (e.target === contactModal) closeContactModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && contactModal.classList.contains('show')) closeContactModal(); });

    (function openFromQueryParam() {
      const id = new URLSearchParams(location.search).get('open');
      if (!id) return;
      const c = CONTACTS.find(x => x.id === id);
      if (c) openContactModal(c);
    })();

    // Nav — Home/Courses/Grades/Assignments/Messages are real links
    // between real pages (same full-mesh convention every other page
    // uses); Calendar/Settings stay visual-only placeholders until those
    // pages exist.
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile || !profile.name || !String(profile.name).trim()) profile = Object.assign({}, profile, { name: window.__AVERAGES_NAME__ || '' });
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
        profileBtn.classList.add('has-photo');
      } else if (profile.name) {
        if (window.AveragesAvatar) window.AveragesAvatar.paint(profileBtn, profile.name);
        else profileBtn.textContent = (function (n) { var p = String(n).trim().split(/\s+/).filter(Boolean); var f = function (w) { return w ? Array.from(w)[0] : ''; }; return (f(p[0]) + (p.length > 1 ? f(p[p.length - 1]) : '')).toUpperCase(); })(profile.name);
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    (function () {
      const SELF = 'contacts.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Contacts';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
</html>
