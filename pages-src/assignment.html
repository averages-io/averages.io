        const files = Array.isArray(d.files) ? d.files : [];
        const links = Array.isArray(d.links) ? d.links : [];
        const rows = files.map(f => materialRowHTML({ name: f.name, ext: String(f.ext || '').toLowerCase(), fileId: String(f.id) }, 'full')).join('')
          + links.map(linkRowHTML).join('');
        materialsEl.innerHTML = rows || '<p class="assign-empty">No materials attached to this assignment.</p>';
      } catch {
        desc.textContent = 'Couldn’t load this assignment’s details right now.';
        materialsEl.innerHTML = '<p class="assign-empty">Couldn’t load the attached materials.<button class="assign-retry" type="button" data-live-retry>Try again</button></p>';
      }
    }
    if (LIVE) {
      if (LIVE_DETAIL) loadLiveDetail();
      else materialsEl.innerHTML = '<p class="assign-empty">No materials attached to this assignment.</p>';
    }

    // A small popup for anything that stops Edit in Canva. Connect sends the
    // student through Canva and back to this same page.
    function showCanvaProblem(code) {
      const connect = code === 'canva_not_connected' || code === 'canva_reconnect_needed';
      const MSG = {
        canva_not_connected: ['Connect Canva first', 'Edit in Canva opens assignment files in your own Canva account. Connect it once and this button works from then on.'],
        canva_reconnect_needed: ['Reconnect Canva', 'Your Canva connection ran out. Connect it again to keep editing.'],
        canva_not_configured: ['Canva is coming soon', 'Editing in Canva isn’t switched on yet.'],
        canva_missing_permission: ['Canva needs permission', 'Disconnect and connect Canva again in Settings, and allow access when Canva asks.'],
        canva_duplicate_import: ['Already in your Canva', 'This file was opened in Canva before. Find it in your Canva account or on the Files tab.'],
        canva_rate_limited: ['Canva is busy', 'Too many files were opened at once. Try again in a minute.'],
        canva_invalid_file: ['Canva can’t open this file', 'Download it instead and open it another way.'],
        file_too_large: ['This file is too big for Canva', 'Files over 25 MB can’t be opened in Canva from Averages.io. Download it instead.'],
        file_not_found: ['File not found', 'This file isn’t on the assignment anymore. Reload the page to see what’s attached now.'],
        canva_design_gone: ['Design not found', 'This draft was deleted in Canva, so it’s been removed from Drafts.'],
      };
      const [title, text] = MSG[code] || ['Couldn’t open this in Canva', 'Something went wrong. Try again in a moment.'];
      openModal(`
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(text)}</p>
        <div class="modal-actions">
          ${connect
            ? '<button class="modal-btn secondary" type="button" id="canvaProbCancel">Not now</button><button class="modal-btn primary" type="button" id="canvaProbConnect">Connect Canva</button>'
            : '<button class="modal-btn primary" type="button" id="canvaProbCancel">OK</button>'}
        </div>`);
      modalBox.setAttribute('role', 'alertdialog'); modalBox.setAttribute('aria-modal', 'true');
      document.getElementById('canvaProbCancel').addEventListener('click', closeModal);
      const go = document.getElementById('canvaProbConnect');
      if (go) go.addEventListener('click', () => { window.location.href = `${averagesApiBase()}/canva/connect?return_to=${encodeURIComponent(currentAppPath())}`; });
      (go || document.getElementById('canvaProbCancel')).focus();
    }
    const CANVA_EDIT_URL = /^https:\/\/(www\.)?canva\.com\//i;
    async function liveEditInCanva(btn) {
      if (btn.getAttribute('aria-busy') === 'true') return;
      const label = btn.querySelector('span:last-child');
      const was = label ? label.textContent : '';
      btn.setAttribute('aria-busy', 'true');
      if (label) label.textContent = 'Opening Canva…';
      const done = () => { btn.removeAttribute('aria-busy'); if (label) label.textContent = was; };
      try {
        const res = await fetch(averagesApiBase() + '/canva/edit', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ section: String(item.courseId), assignment: String(item.id), fileId: btn.dataset.fileId, returnTo: currentAppPath() }),
        });
        const j = await res.json().catch(() => ({}));
        if (res.ok && typeof j.editUrl === 'string' && CANVA_EDIT_URL.test(j.editUrl)) {
          if (j.draft) { upsertLiveDraft(j.draft); renderDrafts(); }
          window.location.assign(j.editUrl);   // stays "Opening Canva…" while the page leaves
          return;
        }
        done();
        showCanvaProblem(j.error);
      } catch {
        done();
        showCanvaProblem('network');
      }
    }

    // ------------------------------------------------------------------
    // Shared small modal — Add Submission and the View/Download file
    // info both open into this one overlay.
    // ------------------------------------------------------------------
    const modalOverlay = document.getElementById('modalOverlay');
    const modalBox = document.getElementById('modalBox');
    function openModal(html) { modalBox.innerHTML = html; modalOverlay.hidden = false; }
    // Also strips the wider modal-box-lg modifier (see openAddSubmissionModal)
    // so the NEXT modal opened -- e.g. a small file-info popup -- isn't left
    // oversized from a previous Add Submission session.
    function closeModal() { modalOverlay.hidden = true; modalBox.innerHTML = ''; modalBox.classList.remove('modal-box-lg'); modalBox.removeAttribute('role'); modalBox.removeAttribute('aria-modal'); }
    // Static popup (2026-08-29, per Martin's request) — clicking the dark
    // backdrop no longer dismisses the modal, so an accidental click outside
    // the box (easy to do on the Add Submission modal while picking a tab or
    // a file) can't lose in-progress input. Escape and the explicit
    // Cancel/Close buttons still close it.
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

    // Edit in Canva / Save to cloud menus (2026-10-04). Not connected yet, so
    // every choice says Coming soon, same as the Materials page.
    const fileMenu = document.createElement('div');
    fileMenu.className = 'file-menu';
    fileMenu.setAttribute('role', 'menu');
    fileMenu.hidden = true;
    document.body.appendChild(fileMenu);
    let fileMenuFor = null;
    function closeFileMenu() {
      if (fileMenu.hidden) return;
      fileMenu.hidden = true;
      if (fileMenuFor) { fileMenuFor.setAttribute('aria-expanded', 'false'); fileMenuFor = null; }
    }
    function openFileMenu(btn, kind) {
      if (fileMenuFor === btn) { closeFileMenu(); return; }
      closeFileMenu();
      const name = btn.dataset.fileName || 'this file';
      const items = kind === 'canva' ? ['Open in Canva'] : kind === 'gdrive' ? ['Open in Google Drive'] : ['Google Drive', 'OneDrive'];   // OneDrive back 2026-10-05
      const editIn = kind === 'canva' ? 'Canva' : kind === 'gdrive' ? 'Google Drive' : '';
      fileMenu.setAttribute('aria-label', editIn ? `Edit in ${editIn}` : 'Save to cloud');
      fileMenu.innerHTML = `<div class="file-menu-label">${editIn ? 'Edit' : 'Save'} "${escapeHtml(name)}" ${editIn ? 'in ' + editIn : 'to'}</div>` +
        items.map(n => `<button class="file-menu-item" type="button" role="menuitem" disabled><span>${n}</span><span class="soon">Coming soon</span></button>`).join('');
      fileMenu.hidden = false;
      const r = btn.getBoundingClientRect(), w = fileMenu.offsetWidth, h = fileMenu.offsetHeight;
      fileMenu.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
      fileMenu.style.top = (r.bottom + 6 + h > window.innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
      btn.setAttribute('aria-expanded', 'true');
      fileMenuFor = btn;
    }
    document.addEventListener('click', e => { if (!fileMenu.hidden && !fileMenu.contains(e.target) && !(fileMenuFor && fileMenuFor.contains(e.target))) closeFileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !fileMenu.hidden) { const b = fileMenuFor; closeFileMenu(); if (b) b.focus(); } });
    window.addEventListener('scroll', closeFileMenu, true);
    window.addEventListener('resize', closeFileMenu);

    materialsEl.addEventListener('click', e => {
      if (e.target.closest('[data-live-retry]')) { loadLiveDetail(); return; }
      const btn = e.target.closest('[data-file-action]');
      if (!btn) return;
      const liveFile = LIVE_DETAIL && ID_OK(btn.dataset.fileId);
      if (btn.dataset.fileAction === 'download' && liveFile) {
        // The real file, streamed through the API (it answers as a download, so the page stays put).
        window.location.href = `${averagesApiBase()}/data/attachment?section=${encodeURIComponent(item.courseId)}&assignment=${encodeURIComponent(item.id)}&file=${encodeURIComponent(btn.dataset.fileId)}`;
      }
      else if (btn.dataset.fileAction === 'download') downloadPlaceholderFile(btn.dataset.fileName, btn.dataset.fileExt);
      else if ((btn.dataset.fileAction === 'canva' || btn.dataset.fileAction === 'gdrive') && CANVA_PREVIEW) { closeFileMenu(); editInCanvaPreview(btn); }
      else if (btn.dataset.fileAction === 'canva' && liveFile) { closeFileMenu(); liveEditInCanva(btn); }
      else openFileMenu(btn, btn.dataset.fileAction);
    });
    // Same download delegation as the Attached Materials list above, but
    // scoped to the modal itself -- covers the Submission Preview
    // popup's per-file Download buttons (see openSubmissionPreview),
    // which can now list more than one file per turn-in.
    modalBox.addEventListener('click', e => {
      const btn = e.target.closest('[data-file-action="download"]');
      if (!btn) return;
      downloadPlaceholderFile(btn.dataset.fileName, btn.dataset.fileExt);
    });

    // ------------------------------------------------------------------
    // Submissions panel — banner + status-specific body. An assignment
    // can be submitted more than once (2026-08-29, per Martin's request),
    // so this is now re-rendered from mutable state every time a new
    // attempt is added, rather than drawn once from static data.
    // ------------------------------------------------------------------
    let submissionHistory = (detail.submissions || []).slice();
    let currentStatus = item.status;
    const previousScore = (item.status === 'graded' && typeof item.score === 'number') ? item.score : null;

    const BANNER_COPY = {
      overdue: () => ({ label: 'Missing — nothing submitted', meta: item.due ? `Was due ${item.due}` : '' }),
      upcoming: () => ({ label: 'Not submitted yet', meta: item.due ? `Due ${item.due}` : '' }),
      submitted: () => {
        const latest = submissionHistory[submissionHistory.length - 1];
        let meta = latest ? `Submitted ${latest.timestamp}` : '';
        if (previousScore !== null) meta += meta ? ` · previously graded ${previousScore}%` : `Previously graded ${previousScore}%`;
        return { label: 'Submitted — awaiting grade', meta };
      },
      graded: () => ({ label: 'Graded', meta: typeof item.score === 'number' ? `${item.score}%` : '' }),
      returned: () => ({ label: 'Returned — revision requested', meta: item.returnedOn ? `Returned ${item.returnedOn}` : '' }),
    };

    // Rows are clickable (2026-08-31, per Martin's request) — each one
    // is a specific turn-in, so clicking it pops up a preview plus that
    // turn-in's own teacher comments (see openSubmissionPreview below)
    // instead of the teacher feedback sitting as one static block under
    // the whole list. `data-sub-index` is the row's real index into
    // `submissionHistory` (oldest-first), not its on-screen position —
    // the array itself is only reordered for display, via the trailing
    // `.reverse()` on the rendered HTML strings, so the index each row
    // carries stays stable regardless of display order.
    function submissionHistoryHTML() {
      if (!submissionHistory.length) return '<p class="assign-empty">No submission on record.</p>';
      return submissionHistory.map((s, idx) => {
        const files = filesOf(s);
        const first = files[0] || { name: 'Untitled', ext: '' };
        const color = EXT_COLOR[first.ext] || '#83849a';
        const isLatest = idx === submissionHistory.length - 1;
        // Multiple files in one turn-in (2026-09-04, per Martin) show as
        // a count badge + "N files" rather than trying to cram every
        // filename onto one row -- the full list is one click away in
        // openSubmissionPreview.
        const badgeLabel = files.length > 1 ? String(files.length) : first.ext.toUpperCase();
        const nameLabel = files.length > 1 ? `${files.length} files` : first.name;
        return `
          <div class="material-row submission-row" tabindex="0" role="button" data-sub-index="${idx}" aria-label="Preview ${escapeHtml(nameLabel)}, submitted ${escapeHtml(s.timestamp)}">
            <span class="material-badge" style="background:${escapeHtml(color)}">${escapeHtml(badgeLabel)}</span>
            <span class="material-name">${escapeHtml(nameLabel)} <span style="color:var(--text-faint); font-weight:600;">— ${escapeHtml(s.timestamp)}</span></span>
            ${isLatest && submissionHistory.length > 1 ? '<span class="submission-latest-tag">Latest</span>' : ''}
            ${s.comment ? COMMENT_ICON : ''}
          </div>`;
      }).reverse().join('');
    }

    // Preview + teacher comments popup for one submission-history row
    // (2026-08-31, per Martin's request — submissions weren't clickable
    // at all before). Reuses the same shared openModal()/closeModal()
    // component the Attached Materials View/Download buttons and Add
    // Submission already use, so it looks and behaves like every other
    // popup in this app. Only the LATEST submission can carry the
    // assignment's current teacher feedback/comment — an older,
    // superseded attempt shows a plain "no feedback on this one" note,
    // since real feedback is given on the most recent turn-in, not every
    // one in the history.
    function openSubmissionPreview(idx) {
      const s = submissionHistory[idx];
      if (!s) return;
      const files = filesOf(s);
      const isLatest = idx === submissionHistory.length - 1;
      let feedbackHtml = '';
      if (isLatest && currentStatus === 'graded' && detail.feedback) {
        feedbackHtml = `
          <div class="feedback-box">
            <span class="feedback-box-label" style="color:var(--grade-good);">Teacher Feedback</span>
            <p>"${escapeHtml(detail.feedback)}"</p>
            <span class="attrib">— ${escapeHtml(course.teacher)}</span>
          </div>`;
      } else if (isLatest && currentStatus === 'returned' && detail.comment) {
        feedbackHtml = `
          <div class="feedback-box returned">
            <span class="feedback-box-label">Teacher Comment · Revision requested</span>
            <p>"${escapeHtml(detail.comment)}"</p>
            <span class="attrib">— ${escapeHtml(course.teacher)}</span>
          </div>`;
      } else {
        feedbackHtml = `<p class="assign-empty" style="margin-top:14px;">No teacher feedback on this submission yet.</p>`;
      }
      const ownCommentHtml = s.comment ? `
        <div class="own-comment-box">
          <span class="label">Your comment</span>
          "${escapeHtml(s.comment)}"
        </div>` : '';
      // Title/subhead read naturally whether this turn-in was one file or
      // several (2026-09-04, per Martin's multi-file request). Each file
      // gets its own row + Download button (materialRowHTML(f, true),
      // same component Attached Materials uses) instead of the single
      // "Download" action this modal used to have — the delegated
      // [data-file-action="download"] listener on modalBox (see where
      // modalBox is declared) handles all of them, one file or many.
      const titleLabel = files.length > 1 ? `${files.length} files` : (files[0] ? files[0].name : 'Submission');
      openModal(`
        <h3>${escapeHtml(titleLabel)}</h3>
        <p>Submitted ${escapeHtml(s.timestamp)}<br>No live preview is available in this mock.</p>
        <div class="modal-file-list">${files.map(f => materialRowHTML(f, true)).join('')}</div>
        ${ownCommentHtml}
        ${feedbackHtml}
        <div class="modal-actions">
          <button class="modal-btn primary" type="button" id="modalCloseBtn">Close</button>
        </div>`);
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    }

    const submissionBodyEl = document.getElementById('submissionBody');
    submissionBodyEl.addEventListener('click', e => {
      const row = e.target.closest('[data-sub-index]');
      if (!row) return;
      openSubmissionPreview(Number(row.dataset.subIndex));
    });
    submissionBodyEl.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('[data-sub-index]');
      if (!row) return;
      e.preventDefault();
      openSubmissionPreview(Number(row.dataset.subIndex));
    });

    function renderSubmissionsPanel() {
      const banner = BANNER_COPY[currentStatus]();
      document.getElementById('submissionBanner').innerHTML = `
        <div class="submission-banner ${escapeHtml(currentStatus)}">
          <span class="dot"></span>
          <div class="submission-banner-text">
            <p class="submission-banner-label">${banner.label}</p>
            ${banner.meta ? `<p class="submission-banner-meta">${escapeHtml(banner.meta)}</p>` : ''}
          </div>
        </div>`;

      const bodyEl = document.getElementById('submissionBody');
      let html = '';
      // Quizzes/tests are actually taken in Schoology itself, not in
      // Averages.io — there's no real "upload a file" or "type an answer"
      // step for them here, unlike a normal assignment or discussion post
      // (2026-09-03, per Martin: "for quizes i don't think they can take
      // it in our app, they have to use schoology"). So instead of the
      // upload dropzone / submission history / Add Submission button
      // below, a quiz-type item gets one static redirect notice no matter
      // its status — the status banner above still reflects the real
      // Missing/Submitted/Graded/Returned state, since Averages.io does
      // still mirror that from Schoology once it happens.
      if (item.type === 'assessment') {
        html += `
          <div class="submit-dropzone quiz-redirect-notice">
            ${EXTERNAL_LINK_ICON}
            <div>Quizzes and tests are taken in Schoology, not in Averages. Head to Schoology to complete this one — your grade will show up here once it's in.</div>
            <a class="quiz-redirect-btn" href="https://www.schoology.com/" target="_blank" rel="noopener noreferrer">
              Open in Schoology
              ${EXTERNAL_LINK_ICON}
            </a>
          </div>`;
        // Feedback/a comment is still real Schoology grading data, not a
        // "submission" — Averages.io already mirrors the score in the banner
        // above, so it shows this the same way rather than hiding it just
        // because the file-submission UI above it went away.
        if (currentStatus === 'graded' && detail.feedback) {
          html += `
            <div class="feedback-box">
              <span class="feedback-box-label" style="color:var(--grade-good);">Teacher Feedback</span>
              <p>"${escapeHtml(detail.feedback)}"</p>
              <span class="attrib">— ${escapeHtml(course.teacher)}</span>
            </div>`;
        } else if (currentStatus === 'returned' && detail.comment) {
          html += `
            <div class="feedback-box returned">
              <span class="feedback-box-label">Teacher Comment · Revision requested</span>
              <p>"${escapeHtml(detail.comment)}"</p>
              <span class="attrib">— ${escapeHtml(course.teacher)}</span>
            </div>`;
        }
        bodyEl.innerHTML = html;
        return;
      }
      if (currentStatus === 'overdue' || currentStatus === 'upcoming') {
        html += `
          <div class="submit-dropzone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M12 4l-5 5M12 4l5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            <div>Submitting assignments isn't available in this preview yet.</div>
          </div>`;
      } else {
        // Teacher Feedback / Teacher Comment used to render here as one
        // static block for the whole assignment — moved into each
        // submission row's own click-to-preview popup instead
        // (2026-08-31, per Martin's request to make submissions
        // clickable), since feedback is really about one specific
        // turn-in, not the assignment in the abstract. See
        // openSubmissionPreview() above.
        html += `<h2 style="margin-top:0;">Submission History</h2>${submissionHistoryHTML()}`;
      }
      // You can submit an assignment more than once — this button stays
      // available regardless of status (2026-08-29, per Martin's
      // request), including after it's already been graded, since a
      // resubmission is exactly how a real regrade request would start.
      html += `
        <button class="add-submission-btn" type="button" id="addSubmissionBtn">
          ${PLUS_ICON}
          Add Submission
        </button>`;
      bodyEl.innerHTML = html;
      document.getElementById('addSubmissionBtn').addEventListener('click', openAddSubmissionModal);
    }

    // Add Submission — Upload / Create, mirroring the real Schoology upload
    // dialog (screenshot Martin shared 2026-08-29): Upload loads a file from
    // this device, Create answers directly in the app with no file. Both are
    // real, switchable tabs sharing one optional comment box underneath.
    // (A third Resources tab, picking a file from Google Drive, was removed
    // 2026-09-02 per Martin's request — Google Drive integrations are coming
    // back in a later update, not this release.)
    const UPLOAD_TAB_PANEL = {
      // Custom-styled "Choose Files" button + a list of what's been picked
      // so far, in place of the bare native file input (2026-08-29, per
      // Martin's request — the browser-default control looked out of
      // place next to everything else in this modal). The real
      // <input type="file"> is still there, just visually hidden and
      // triggered by the button. `multiple` + the picked-files list below
      // (2026-09-04, per Martin: "let people upload multiple files") — see
      // bindUploadTab's pickedFiles handling for why the list is tracked
      // in JS rather than read straight off the input at submit time.
      upload: () => `
        <p class="upload-tab-desc">Upload one or more files from this device.</p>
        <div class="upload-picker" id="uploadPicker">
          <button class="upload-picker-btn" type="button" id="chooseFileBtn">Choose Files</button>
          <span class="upload-picker-filename empty" id="chooseFileName">No files chosen</span>
        </div>
        <div class="upload-picked-list" id="uploadPickedList"></div>
        <!-- Hidden until a Submit attempt with no file chosen (2026-09-04,
             per Martin -- at least one file is now required on this tab;
             see modalSubmitBtn's click handler). -->
        <p class="upload-required-note" id="uploadRequiredNote" hidden>Choose at least one file before submitting.</p>
        <div class="upload-sources" role="group" aria-label="Add from another app (coming soon)">
          <span class="upload-sources-label">Or add from</span>
          <button class="upload-source" type="button" disabled><span class="canva-mark" aria-hidden="true"></span>Canva</button>
          <button class="upload-source" type="button" disabled>Google Drive</button>
          <button class="upload-source" type="button" disabled>OneDrive</button>
          <span class="soon">Coming soon</span>
        </div>
        <input type="file" id="submissionFileInput" multiple style="display:none;">`,
      // Rich-text answer area (2026-08-30, per Martin's request — a plain
      // textbox with Google-Docs-style formatting options) in place of the
      // old bare <textarea>. See bindCreateTab() below for the toolbar
      // wiring (document.execCommand-based, front-end only).
      create: () => `
        <p class="upload-tab-desc">Answer directly — no file needed.</p>
        <div class="rte-toolbar" role="toolbar" aria-label="Text formatting">
          <select class="rte-select" id="rteBlockSelect" aria-label="Text style">
            <option value="p">Normal text</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
          </select>
          <span class="rte-divider" aria-hidden="true"></span>
          <button class="rte-btn" type="button" data-cmd="bold" aria-label="Bold" title="Bold"><b>B</b></button>
          <button class="rte-btn" type="button" data-cmd="italic" aria-label="Italic" title="Italic"><i>I</i></button>
          <button class="rte-btn" type="button" data-cmd="underline" aria-label="Underline" title="Underline"><u>U</u></button>
          <span class="rte-divider" aria-hidden="true"></span>
          <button class="rte-btn" type="button" data-cmd="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>
          </button>
          <button class="rte-btn" type="button" data-cmd="insertOrderedList" aria-label="Numbered list" title="Numbered list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><text x="1" y="8" font-size="7">1</text><text x="1" y="14" font-size="7">2</text><text x="1" y="20" font-size="7">3</text></svg>
          </button>
          <span class="rte-divider" aria-hidden="true"></span>
          <button class="rte-btn" type="button" data-cmd="createLink" aria-label="Insert link" title="Insert link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6"/><path d="M10 6l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M14 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>
          </button>
        </div>
        <div class="modal-textarea answer-textarea rte-editor" id="submissionAnswerText" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Answer" data-placeholder="Type your answer here…"></div>`,
    };

    function openAddSubmissionModal() {
      let activeTab = 'upload';
      // Every file picked on the Upload tab so far this modal session
      // (2026-09-04, per Martin's multi-file request) -- lives here, not
      // just on the <input>, because re-opening the OS file dialog
      // REPLACES input.files with just that dialog's selection rather
      // than adding to it; this array is what actually accumulates
      // across multiple picks (see bindUploadTab's `change` handler).
      // Also survives switching to the Create tab and back, since it's
      // closed over here rather than living in the (regenerated) DOM.
      let pickedFiles = [];

      openModal(`
        <h3>Add Submission</h3>
        <div class="upload-tabs" role="tablist">
          <button class="upload-tab active" type="button" role="tab" aria-selected="true" data-tab="upload">Upload</button>
          <button class="upload-tab" type="button" role="tab" aria-selected="false" data-tab="create">Create</button>
        </div>
        <div class="upload-tab-panel" id="uploadTabPanel">${UPLOAD_TAB_PANEL.upload()}</div>
        <label class="modal-field-label" for="submissionComment">Add a comment (optional)</label>
        <textarea class="modal-textarea" id="submissionComment" placeholder="Add a comment (optional)"></textarea>
        <div class="modal-actions">
          <button class="modal-btn secondary" type="button" id="modalCancelBtn">Cancel</button>
          <button class="modal-btn primary" type="button" id="modalSubmitBtn">Submit</button>
        </div>`);
      // Wider than the default .modal-box (2026-09-04, per Martin: "make
      // the assignment submission popup bigger") -- see the modal-box-lg
      // rule and closeModal(), which strips this back off so a later,
      // smaller popup (file info, submission preview) isn't left oversized.
      modalBox.classList.add('modal-box-lg');

      const panelEl = document.getElementById('uploadTabPanel');
      const commentEl = document.getElementById('submissionComment');

      function bindUploadTab() {
        if (activeTab !== 'upload') return;
        const chooseBtn = document.getElementById('chooseFileBtn');
        const fileInput = document.getElementById('submissionFileInput');
        const nameEl = document.getElementById('chooseFileName');
        const pickerEl = document.getElementById('uploadPicker');
        const noteEl = document.getElementById('uploadRequiredNote');
        const listEl = document.getElementById('uploadPickedList');

        function renderPickedList() {
          if (!pickedFiles.length) {
            listEl.innerHTML = '';
            nameEl.textContent = 'No files chosen';
            nameEl.classList.add('empty');
            return;
          }
          nameEl.textContent = pickedFiles.length === 1 ? pickedFiles[0].name : `${pickedFiles.length} files chosen`;
          nameEl.classList.remove('empty');
          listEl.innerHTML = pickedFiles.map((f, i) => {
            const ext = (f.name.split('.').pop() || '').toLowerCase();
            const color = EXT_COLOR[ext] || '#83849a';
            return `
              <div class="upload-picked-row">
                <span class="material-badge" style="background:${escapeHtml(color)}">${escapeHtml((ext || '?').toUpperCase())}</span>
                <span class="upload-picked-name">${escapeHtml(f.name)}</span>
                <button class="material-icon-btn" type="button" data-index="${i}" aria-label="Remove ${escapeHtml(f.name)}">${REMOVE_ICON}</button>
              </div>`;
          }).join('');
        }
        renderPickedList(); // re-bound after a Create->Upload tab switch, with files already picked this session

        chooseBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
          const newFiles = Array.from(fileInput.files);
          fileInput.value = ''; // so picking the same file(s) again still fires "change"
          if (!newFiles.length) return;
          pickedFiles.push(...newFiles);
          renderPickedList();
          // Picking file(s) clears a validation error from a previous
          // failed Submit attempt (see modalSubmitBtn's click handler).
          pickerEl.classList.remove('error');
          noteEl.hidden = true;
        });
        // Delegated (not per-row) since the list is rebuilt on every add/remove.
        listEl.addEventListener('click', e => {
          const btn = e.target.closest('.material-icon-btn[data-index]');
          if (!btn) return;
          pickedFiles.splice(Number(btn.dataset.index), 1);
          renderPickedList();
        });
      }

      // Wires up the Create tab's rich-text toolbar (2026-08-30). Kept
      // deliberately simple — document.execCommand is deprecated but still
      // broadly supported, and this is a front-end mockup with no real
      // save-as-HTML step, so a heavier editor library isn't warranted.
      function bindCreateTab() {
        if (activeTab !== 'create') return;
        const editor = document.getElementById('submissionAnswerText');
        const blockSelect = document.getElementById('rteBlockSelect');
        const toolbar = editor.previousElementSibling;
        const cmdBtns = toolbar.querySelectorAll('.rte-btn[data-cmd]');
        function updateToolbarState() {
          cmdBtns.forEach(btn => {
            let active = false;
            try { active = document.queryCommandState(btn.dataset.cmd); } catch (e) {}
            btn.classList.toggle('active', active);
          });
          try {
            const block = (document.queryCommandValue('formatBlock') || '').toLowerCase();
            blockSelect.value = ['h1', 'h2', 'h3'].includes(block) ? block : 'p';
          } catch (e) {}
        }
        cmdBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            editor.focus();
            const cmd = btn.dataset.cmd;
            if (cmd === 'createLink') {
              const url = window.prompt('Link URL:', 'https://');
              if (url) document.execCommand('createLink', false, url);
            } else {
              document.execCommand(cmd, false, null);
            }
            updateToolbarState();
          });
        });
        blockSelect.addEventListener('change', () => {
          editor.focus();
          document.execCommand('formatBlock', false, blockSelect.value);
          updateToolbarState();
        });
        editor.addEventListener('keyup', updateToolbarState);
        editor.addEventListener('mouseup', updateToolbarState);
        editor.addEventListener('focus', updateToolbarState);
      }

      function bindActiveTab() {
        bindUploadTab();
        bindCreateTab();
      }
      bindActiveTab();

      modalBox.querySelectorAll('.upload-tab').forEach(tabBtn => {
        tabBtn.addEventListener('click', () => {
          activeTab = tabBtn.dataset.tab;
          modalBox.querySelectorAll('.upload-tab').forEach(b => {
            const isActive = b === tabBtn;
            b.classList.toggle('active', isActive);
            b.setAttribute('aria-selected', String(isActive));
          });
          panelEl.innerHTML = UPLOAD_TAB_PANEL[activeTab]();
          bindActiveTab();
        });
      });

      document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
      document.getElementById('modalSubmitBtn').addEventListener('click', () => {
        let files;
        if (activeTab === 'upload') {
          // At least one file is required on this tab (2026-09-04, per
          // Martin) — no more falling back to a synthesized filename when
          // nothing was chosen. Blocks the submit and surfaces the error
          // inline instead of closing the modal.
          if (!pickedFiles.length) {
            document.getElementById('uploadPicker').classList.add('error');
            document.getElementById('uploadRequiredNote').hidden = false;
            document.getElementById('chooseFileBtn').focus();
            return;
          }
          // Every file picked this session (2026-09-04, per Martin: "let
          // people upload multiple files") goes into this one turn-in --
          // see filesOf()/submissionHistoryHTML()/openSubmissionPreview
          // for how a multi-file entry renders.
          files = pickedFiles.map(f => ({ name: f.name, ext: (f.name.split('.').pop() || 'pdf').toLowerCase() }));
        } else {
          // activeTab === 'create'. Typed content isn't required to submit
          // -- this tab has no file requirement (only the Upload tab does,
          // per Martin) -- the filename just always reflects that this
          // attempt was a typed answer, not an uploaded document.
          files = [{ name: `${item.title.replace(/\s+/g, '_')}_Answer.txt`, ext: 'txt' }];
        }
        const comment = (commentEl.value || '').trim();
        const entry = { files, timestamp: 'Just now' };
        if (comment) entry.comment = comment;
        submissionHistory.push(entry);
        currentStatus = 'submitted';
        closeModal();
        renderSubmissionsPanel();
      });
    }

    renderSubmissionsPanel();

    // ------------------------------------------------------------------
    // Drafts (2026-10-04, per Martin): Edit in Canva sends the file over to
    // Drafts, above Submissions, with Submit and Delete. Canva isn't
    // connected yet, so this only runs in the preview; signed in, Edit in
    // Canva keeps its Coming soon menu. Real flow: POST /canva/edit opens
    // Canva, Canva's return brings the student back here, and the drafts
    // list comes from the API instead of this in-memory array.
    // ------------------------------------------------------------------
    const drafts = [];
    let draftSeq = 0;
    const draftsSec = document.getElementById('draftsSec');
    const draftsList = document.getElementById('draftsList');
    const TRASH_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
    const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DRAFT_APP = { canva: 'Canva', gdrive: 'Google Drive', onedrive: 'OneDrive', course: 'Course file' };
    const DRAFT_EXT_COLOR = Object.assign({ doc: '#3b6fd1', xlsx: '#2f7d54', xls: '#2f7d54', ppt: '#d1852f' }, EXT_COLOR);
    function draftBadgeHTML(d) {
      if (d.app === 'gdrive') return `<span class="draft-badge drive" aria-hidden="true" style="background:${(DRIVE_KIND[d.ext] || DRIVE_KIND.docx)[1]}">${(DRIVE_KIND[d.ext] || DRIVE_KIND.docx)[0]}</span>`;
      if (d.app === 'canva') return '<span class="draft-badge" aria-hidden="true"><span class="canva-mark"></span></span>';
      const ext = String(d.ext || 'file').toLowerCase();
      return `<span class="draft-badge drive" aria-hidden="true" style="background:${escapeHtml(DRAFT_EXT_COLOR[ext] || '#83849a')}">${escapeHtml(ext.toUpperCase().slice(0, 4))}</span>`;
    }
    function draftRowHTML(d) {
      const nm = escapeHtml(d.name);
      const tip = (label, inner) => `<span class="tipwrap">${inner}<span class="tip" role="tooltip">${label}</span></span>`;
      const testItem = item.type === 'assessment';
      if (d.live) {
        // Signed in (2026-10-05): a real Canva design. Turning it in from
        // Averages.io isn't built yet (it needs a PDF export from Canva), so
        // Submit stays greyed out and says so.
        const submitLive = `<button class="draft-submit" type="button" data-draft-action="submit" disabled aria-label="Submit ${nm}">Submit</button>`;
        return `
        <div class="material-row file-bar draft-row" data-draft="${escapeHtml(d.id)}">
          ${draftBadgeHTML(d)}
          <span class="draft-text">
            <span class="material-name">${nm}</span>
            <span class="draft-meta">Canva draft · Edited ${escapeHtml(d.edited)}</span>
          </span>
          <div class="material-actions">
            <button class="canva-btn" type="button" data-draft-action="open" aria-label="Open ${nm} in Canva"><span class="canva-mark" aria-hidden="true"></span><span>Open in Canva</span></button>
            ${tip(testItem ? 'Tests are turned in on Schoology' : 'Turning in from Averages.io is coming soon', submitLive)}
            ${tip('Delete draft', `<button class="material-icon-btn" type="button" data-draft-action="delete" aria-label="Delete draft ${nm}">${TRASH_ICON}</button>`)}
          </div>
        </div>`;
      }
      const submit = `<button class="draft-submit" type="button" data-draft-action="submit"${testItem ? ' disabled' : ''} aria-label="Submit ${nm}">Submit</button>`;
      return `
        <div class="material-row file-bar draft-row" data-draft="${escapeHtml(d.id)}">
          ${draftBadgeHTML(d)}
          <span class="draft-text">
            <span class="material-name">${nm}</span>
            <span class="draft-meta">${d.attached ? `${DRAFT_APP[d.app] || 'File'} · Added from Files` : `${DRAFT_APP[d.app] || 'Canva'} draft · Edited ${escapeHtml(d.edited)}`}</span>
          </span>
          <div class="material-actions">
            ${testItem ? tip('Tests are turned in on Schoology', submit) : submit}
            ${tip('Delete draft', `<button class="material-icon-btn" type="button" data-draft-action="delete" aria-label="Delete draft ${nm}">${TRASH_ICON}</button>`)}
          </div>
        </div>`;
    }
    function renderDrafts() {
      draftsSec.hidden = drafts.length === 0 && draftsNote.hidden;
      draftsList.innerHTML = drafts.map(draftRowHTML).join('');
    }
    // Signed in (2026-10-05): drafts are the student's real Canva designs, kept by the API.
    const draftsNote = document.createElement('p');
    draftsNote.className = 'drafts-note';
    draftsNote.setAttribute('role', 'status');
    draftsNote.hidden = true;
    draftsList.parentNode.insertBefore(draftsNote, draftsList);
    function editedLabel(ms) {
      const t = Number(ms) || 0;
      if (!t) return 'recently';
      const mins = Math.round((Date.now() - t) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
      return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function liveDraft(api) {
      return { id: 'c-' + api.designId, designId: String(api.designId), name: String(api.title || api.sourceName || 'Canva design'), app: 'canva', edited: editedLabel(api.updatedAt), live: true };
    }
    function upsertLiveDraft(api) {
      if (!api || !api.designId) return;
      const d = liveDraft(api);
      const i = drafts.findIndex(x => x.id === d.id);
      if (i === -1) drafts.unshift(d); else drafts[i] = d;
    }
    async function loadLiveDrafts(cameBack) {
      try {
        const res = await fetch(`${averagesApiBase()}/canva/drafts?section=${encodeURIComponent(item.courseId)}&assignment=${encodeURIComponent(item.id)}`, { credentials: 'include' });
        if (!res.ok) return;
        const j = await res.json();
        // Newest first, as the API sends them.
        drafts.splice(0, drafts.length, ...(Array.isArray(j.drafts) ? j.drafts : []).filter(x => x && x.designId).map(liveDraft));
        renderDrafts();
        if (cameBack && drafts.length) pulse(draftsList.querySelector('.draft-row'));
      } catch {
        /* Drafts are extra: the rest of the page works without them */
      }
    }
    async function openLiveDraft(d, btn) {
      if (btn.getAttribute('aria-busy') === 'true') return;
      const label = btn.querySelector('span:last-child');
      btn.setAttribute('aria-busy', 'true');
      if (label) label.textContent = 'Opening…';
      const done = () => { btn.removeAttribute('aria-busy'); if (label) label.textContent = 'Open in Canva'; };
      try {
        const res = await fetch(`${averagesApiBase()}/canva/designs/${encodeURIComponent(d.designId)}/open`, {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ returnTo: currentAppPath() }),
        });
        const j = await res.json().catch(() => ({}));
        if (res.ok && typeof j.editUrl === 'string' && CANVA_EDIT_URL.test(j.editUrl)) { window.location.assign(j.editUrl); return; }
        done();
        if (j.error === 'canva_design_gone') removeDraftRow(d.id);
        showCanvaProblem(j.error);
      } catch {
        done();
        showCanvaProblem('network');
      }
    }
    function pulse(el) {
      if (!el || reduceMotion() || !el.animate) return;
      el.animate([{ boxShadow: '0 0 0 2px var(--accent-ring)' }, { boxShadow: '0 0 0 0 transparent' }], { duration: 900, easing: 'ease-out' });
    }
    function editInCanvaPreview(btn) {
      const source = btn.dataset.fileName || 'File';
      const base = source.replace(/\.[^.]+$/, '');
      const app = btn.dataset.fileAction === 'gdrive' ? 'gdrive' : 'canva';
      const existing = drafts.find(d => d.source === source && d.app === app);
      if (existing) {   // already a draft: same design, just edited again
        existing.edited = 'just now';
        renderDrafts();
        const row = draftsList.querySelector(`[data-draft="${existing.id}"]`);
        if (row) { row.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' }); pulse(row); }
        return;
      }
      const fromEl = btn.closest('.file-bar');
      const from = fromEl.getBoundingClientRect();
      const d = { id: 'd' + (++draftSeq), source, name: base, edited: 'just now', app, ext: String(btn.dataset.fileExt || 'docx').toLowerCase() };
      drafts.unshift(d);
      renderDrafts();
      const target = draftsList.querySelector(`[data-draft="${d.id}"]`);
      const done = () => {
        const r = target.getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) target.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
        pulse(target);
      };
      if (reduceMotion() || !target.animate) { done(); return; }
      // Slide: a copy of the file bar flies from Attached Materials into its
      // new spot in Drafts, then the real draft row takes its place.
      const to = target.getBoundingClientRect();
      // The flying card holds both rows, each at its own width, so nothing
      // squishes: the old buttons fade out first, the file bar fades out,
      // then the draft row fades in, and Submit/Delete fade in last.
      const layer = (el, w) => {
        const c = el.cloneNode(true);
        c.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
        Object.assign(c.style, { position: 'absolute', left: '0', top: '0', width: w + 'px', margin: '0', visibility: 'visible' });
        return c;
      };
      const ghost = document.createElement('div');
      ghost.className = 'draft-ghost';
      ghost.setAttribute('aria-hidden', 'true');
      const oldRow = layer(fromEl, from.width), newRow = layer(target, to.width);
      ghost.append(oldRow, newRow);
      Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
      document.body.appendChild(ghost);
      target.style.visibility = 'hidden';
      const D = 640;
      const fade = (el, frames) => el && el.animate(frames, { duration: D, fill: 'both' });
      fade(oldRow.querySelector('.material-actions'), [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.94)', offset: 0.22 }, { opacity: 0, transform: 'scale(0.94)' }]);
      fade(oldRow, [{ opacity: 1 }, { opacity: 1, offset: 0.22 }, { opacity: 0, offset: 0.44, easing: 'ease-in' }, { opacity: 0 }]);
      fade(newRow, [{ opacity: 0 }, { opacity: 0, offset: 0.46 }, { opacity: 1, offset: 0.72 }, { opacity: 1 }]);   // starts once the old row is gone: no two names on top of each other
      fade(newRow.querySelector('.material-actions'), [{ opacity: 0, transform: 'scale(0.94)' }, { opacity: 0, transform: 'scale(0.94)', offset: 0.72 }, { opacity: 1, transform: 'scale(1)' }]);
      const anim = ghost.animate([
        { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' },
        { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' },
      ], { duration: D, easing: 'cubic-bezier(.2,.8,.2,1)' });
      anim.onfinish = anim.oncancel = () => { ghost.remove(); target.style.visibility = ''; done(); };
    }
    function removeDraftRow(id, then) {
      const row = draftsList.querySelector(`[data-draft="${id}"]`);
      const finish = () => { const i = drafts.findIndex(x => x.id === id); if (i !== -1) drafts.splice(i, 1); renderDrafts(); if (then) then(); };
      if (!row || reduceMotion() || !row.animate) { finish(); return; }
      row.classList.add('leaving');
      const h = row.offsetHeight;
      const a = row.animate([
        { opacity: 1, height: h + 'px', marginTop: getComputedStyle(row).marginTop },
        { opacity: 0, height: '0px', marginTop: '0px', paddingTop: '0px', paddingBottom: '0px' },
      ], { duration: 220, easing: 'ease' });
      a.onfinish = a.oncancel = finish;
    }
    // Are you sure? (2026-10-04, per Martin). Cancel is focused first, so a
    // stray Enter doesn't delete anything; Escape also cancels.
    function confirmDeleteDraft(d, fromBtn) {
      openModal(`
        <h3>Delete this draft?</h3>
        <p>"${escapeHtml(d.name)}" will be removed from Drafts. This can't be undone. ${({ canva: 'Your design stays in your Canva account.', gdrive: 'The file stays in your Google Drive.', onedrive: 'The file stays in your OneDrive.', course: 'The file stays in Files.' })[d.app] || ''}</p>
        <div class="modal-actions">
          <button class="modal-btn secondary" type="button" id="draftDelCancel">Cancel</button>
          <button class="modal-btn danger" type="button" id="draftDelOk">Delete</button>
        </div>`);
      modalBox.setAttribute('role', 'alertdialog'); modalBox.setAttribute('aria-modal', 'true');
      const back = () => { if (fromBtn && document.body.contains(fromBtn)) fromBtn.focus(); };
      document.getElementById('draftDelCancel').addEventListener('click', () => { closeModal(); back(); });
      document.getElementById('draftDelOk').addEventListener('click', async () => {
        closeModal();
        if (!d.live) { removeDraftRow(d.id); return; }
        // Signed in: forget it on the API first (the design stays in Canva).
        try {
          const res = await fetch(`${averagesApiBase()}/canva/drafts/${encodeURIComponent(d.designId)}`, { method: 'DELETE', credentials: 'include' });
          if (!res.ok) throw new Error('status ' + res.status);
          removeDraftRow(d.id);
        } catch {
          draftsNote.textContent = 'Couldn’t delete that draft. Try again.';
          draftsNote.hidden = false;
          draftsSec.hidden = false;
        }
      });
      document.getElementById('draftDelCancel').focus();
    }
    draftsList.addEventListener('click', e => {
      const btn = e.target.closest('[data-draft-action]');
      if (!btn || btn.disabled) return;
      const id = btn.closest('[data-draft]').dataset.draft;
      const d = drafts.find(x => x.id === id);
      if (!d) return;
      if (btn.dataset.draftAction === 'delete') { confirmDeleteDraft(d, btn); return; }
      if (btn.dataset.draftAction === 'open') { if (d.live) openLiveDraft(d, btn); return; }
      // Submit: the Canva design goes in as a PDF, like any other turn-in.
      removeDraftRow(id, () => {
        // Canva designs go in as a PDF; a Google Drive file in its own format.
        // Files attached from the Files page go in as they are.
        const outExt = d.app === 'canva' ? 'pdf' : (d.ext || 'docx');
        submissionHistory.push({ files: [{ name: `${d.name}.${outExt}`, ext: outExt }], timestamp: 'Just now', fromCanva: d.app === 'canva', fromDrive: d.app === 'gdrive' });
        currentStatus = 'submitted';
        renderSubmissionsPanel();
      });
    });

    // Signed in: load this assignment's drafts, and say so when Canva's
    // Return button brought the student back (?canva=saved).
    if (LIVE_DETAIL && !CANVA_PREVIEW) {
      const back = params.get('canva');
      if (back === 'saved') {
        draftsNote.textContent = 'Back from Canva. Your draft is saved here in Drafts.';
        draftsNote.hidden = false;
        draftsSec.hidden = false;
      }
      if (back) {
        try {
          const u = new URL(window.location.href);
          u.searchParams.delete('canva');
          window.history.replaceState(window.history.state, '', u.pathname + u.search + u.hash);
        } catch (e) {}
      }
      loadLiveDrafts(back === 'saved');
    }

    // Attach from Files (2026-10-05, per Martin): Files' "Attach to an
    // assignment" opens this page with ?attach=<file name>&src=course|gdrive|
    // onedrive|canva&ext=, and the file lands in Drafts, ready to Submit or
    // Delete. Preview only (no Files API yet). The three params are dropped
    // from the address afterwards so a reload doesn't add it again.
    (function attachFromFiles() {
      const name = params.get('attach');
      if (!name) return;
      try {
        const u = new URL(location.href);
        ['attach', 'src', 'ext'].forEach(k => u.searchParams.delete(k));
        window.history.replaceState(window.history.state, '', u.pathname + u.search + u.hash);
      } catch (e) {}
      if (!CANVA_PREVIEW) return;
      const src = params.get('src');
      const app = ['course', 'gdrive', 'onedrive', 'canva'].includes(src) ? src : 'course';
      const ext = String(params.get('ext') || (name.match(/\.([a-z0-9]+)$/i) || [0, 'pdf'])[1]).toLowerCase();
      if (drafts.some(d => d.source === name && d.app === app)) return;
      const d = { id: 'd' + (++draftSeq), source: name, name: name.replace(/\.[a-z0-9]+$/i, ''), edited: 'just now', app, ext, attached: true };
      drafts.unshift(d);
      renderDrafts();
      const row = draftsList.querySelector(`[data-draft="${d.id}"]`);
      if (row) { row.scrollIntoView({ block: 'center' }); pulse(row); }
    })();

    // Nav — Home/Courses/Assignments are real links between real pages;
    // the rest stay visual-only placeholders until those pages exist.
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile) return;
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || 'M';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'assignment.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Assignment';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
</html>
