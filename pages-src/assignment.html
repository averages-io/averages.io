<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Assignment</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from the other
     pages so this reads as the same app. See architecture-decisions.md
     re: promoting this to an actual shared stylesheet once there's a
     build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    /* A fifth lifecycle color for the "Returned" status — a teacher
       sends the submission back with a comment, usually asking for a
       revision, without necessarily finalizing a grade. Distinct from
       every existing use (red/amber/green already carry Missing/
       Submitted/Graded meanings, and violet isn't used anywhere else
       in this app), so a returned item can't be visually confused with
       an ordinary graded one. */
    --returned: #6a4fae;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- both cards grow
      to their natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar — same .back-link convention as course-home.html/
     course-materials.html's "‹ Back" breadcrumb. ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 14px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 8px;
    gap: 12px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }

  /* ---------- Sub-line — "Class Name (Linked)" + "Gradebook (linked)"
     from the draft, laid out as a subtitle row. Both are now real links
     (Gradebook became one 2026-08-31 once gradebook.html existed to
     point at — previously styled visibly muted/inert, same convention
     as every other unbuilt nav destination in this app; that treatment
     is gone now that there's a real destination). ---------- */
  .assign-sub { display: flex; align-items: center; gap: 8px; margin: 4px 0 18px 2px; flex-wrap: wrap; }
  .assign-sub-link {
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.92);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
  }
  .assign-sub-link:hover { color: #fff; }
  .assign-sub-link:focus-visible { outline: none; text-decoration-thickness: 2px; }
  .assign-sub-dot { color: rgba(255,255,255,0.5); font-size: 0.8rem; }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- Two-panel layout — Description+Materials / Submissions,
     matching the draft's two equal-width white boxes side by side.
     This grid is capped to the space .page has left (flex: 1;
     min-height: 0) instead of .page growing to fit both cards' full
     height, which is what used to let their rounded corners scroll off
     screen. Fixed again 2026-09-04 (per Martin, "round corners on
     scroll on all pages"): the grid itself no longer scrolls — that
     just moved the same bug down one level, scrolling both cards as a
     single unit and cutting off THEIR rounded corners instead (found by
     scrolling .assign-detail-grid directly and screenshotting — the top
     of both cards went flat/square mid-scroll). align-items: stretch
     (not start) so each card fills the grid row's full height, and each
     .card is its own independently-windowed frame — fixed size, only
     .card-inner scrolls inside it — same pattern as every single-card
     page (calendar.html, home.html, etc.), just one level deeper. ---------- */
  .assign-detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);   /* minmax(0,…): a long file name can't push a card past the page edge (2026-10-04) */
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .assign-detail-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
  }
  .card-inner {
    padding: 22px 24px 24px;
  }
  .card-inner h2 {
    font-size: 0.92rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0 0 8px;
  }
  .card-inner h2.second { margin-top: 20px; }

  /* Points in the Submissions box's top right (2026-10-15, per Martin):
     "18/20" with the letter (A-) beside it once graded, "–/20" before.
     Hidden when the points aren't known. */
  .subs-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .subs-head h2 { min-width: 0; }
  .points-chip {
    flex: none;
    margin-top: -2px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-inner);
    color: var(--text-muted);
    font-size: 0.74rem;
    font-weight: 800;
    line-height: 1.2;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .points-chip b { font-weight: 900; color: var(--text-dark); }
  .points-chip { display: inline-flex; align-items: center; gap: 7px; }
  .points-chip[hidden] { display: none; }
  .pts-letter { font-weight: 900; font-size: 0.78rem; }
  .pts-letter.good { color: var(--grade-good); }
  .pts-letter.mid { color: var(--grade-mid); }
  .pts-letter.bad { color: var(--grade-bad); }

  .assign-desc-text { font-size: 0.86rem; line-height: 1.55; color: var(--text-muted); margin: 0; white-space: pre-line; overflow-wrap: anywhere; }

  /* ---------- Attached / submitted file rows — same red/blue/orange
     PDF/DOCX/PPTX badge colors course-materials.html already uses, so
     a file reads consistently wherever it shows up in the app. ---------- */
  .material-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .material-row:last-child { border-bottom: none; }
  .material-badge {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .material-name { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 600; color: var(--text-dark); }
  .assign-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 4px 0; }

  /* ---------- View/Download buttons on an Attached Materials row
     (2026-08-29, per Martin's request) — no real file content exists in
     this mock (same as course-materials.html), so both open a small
     info modal rather than actually opening or downloading anything. ---------- */
  .material-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .material-icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--text-faint);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .material-icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .material-icon-btn:hover { background: var(--border); color: var(--text-dark); }

  /* ---------- Attached Materials file bars (2026-10-04, per Martin) — the
     landing page's Connections card: Edit in Canva, Save to cloud, Download.
     Canva's rules for the button: their icon inside it, always with text. ---------- */
  .material-row.file-bar { background: var(--panel-inner); border-radius: var(--window-radius-sm); padding: 8px 8px 8px 12px; margin-top: 8px; border-bottom: none; flex-wrap: wrap; row-gap: 8px; }
  .file-bar .material-name { flex: 1 1 0; min-width: 110px; font-weight: 700; overflow-wrap: anywhere; }   /* buttons drop to their own line only when the name would get squeezed */

  /* Canva's guidelines: 8px around their icon inside a button. 40px tall, same as every other file-bar button. */
  .canva-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; box-sizing: border-box; padding: 8px 16px 8px 8px; border: 2px solid var(--border); border-radius: 999px; background: var(--panel-bg); color: var(--text-dark); font-family: inherit; font-size: 0.74rem; font-weight: 800; white-space: nowrap; cursor: pointer; transition: border-color 0.14s ease, transform 0.14s ease; }
  .canva-btn:hover { border-color: var(--text-dark); transform: translateY(-1px); }
  .canva-btn.drive-btn { padding: 8px 16px; }   /* text only, same 40px height */
  .draft-badge.drive { color: #fff; font-size: 0.5rem; font-weight: 900; letter-spacing: 0.02em; }
  .canva-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .file-bar .material-icon-btn { width: 40px; height: 40px; background: var(--panel-bg); color: var(--text-muted); }
  .file-bar .material-icon-btn:hover { background: var(--border); color: var(--text-dark); }
  .file-bar .material-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Drafts (2026-10-04): Canva edits waiting to be turned in ---------- */

  .ti-t { display: inline-flex; align-items: center; gap: 7px; }
  .ti-pick svg, .ti-hint svg, .ti-opt svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ti-pick .ti-t svg { width: 16px; height: 16px; }
  .ti-pick .ti-ud { width: 12px; height: 12px; color: var(--text-faint); }
  .ti-grp .draft-submit { min-height: 36px; padding: 6px 18px; }

  .ti-menu.ti-tmenu { width: auto; }
  .draft-submit.ti-main { overflow: hidden; }
  .ti-x:focus-visible, .ti-pick:focus-visible, .ti-opt:focus-visible, .ti-hint:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .ti-below { flex: 0 0 100%; min-width: 0; display: grid; gap: 8px; padding: 2px 0 2px; }
  .ti-hint { display: flex; align-items: center; gap: 9px; margin: 0; padding: 8px 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 0.78rem; font-weight: 700; color: var(--text-dark); text-align: left; line-height: 1.4; }
  .ti-hint svg { width: 18px; height: 18px; color: var(--text-muted); }
  button.ti-hint { width: 100%; cursor: pointer; }
  button.ti-hint:hover:not(:disabled) { background: var(--panel-bg); }
  .ti-hint .ti-chev { margin-left: auto; width: 14px; height: 14px; color: var(--text-faint); transition: transform .15s ease; }
  button.ti-hint[aria-expanded="true"] .ti-chev { transform: rotate(90deg); }
  .ti-access { background: var(--panel-bg); border-radius: 12px; padding: 4px; }
  .ti-opt { display: grid; grid-template-columns: 16px 22px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; border: none; background: none; border-radius: 10px; padding: 10px 10px; font: inherit; color: var(--text-dark); cursor: pointer; }

  .ti-menu { position: absolute; z-index: 30; width: min(320px, calc(100% - 16px)); background: var(--panel-bg); border-radius: 16px; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28); padding: 6px; }
  .ti-paste input { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-bg); font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); }

  .ti-head small { font-size: 0.7rem; font-weight: 700; color: var(--text-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ti-segs { display: flex; gap: 4px; }
  .ti-seg { min-width: 84px; display: grid; gap: 7px; }

  .ti-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
  .ti-seg.now .ti-fill.ind { width: 100%; background: linear-gradient(90deg, rgb(from var(--accent) r g b / 0.25) 0%, var(--accent) 50%, rgb(from var(--accent) r g b / 0.25) 100%); background-size: 200% 100%; animation: ti-sweep 1.1s linear infinite; }
  .ti-seg.done .ti-fill { width: 100%; }
  .ti-seg.fail .ti-fill { width: 100%; background: #c0392b; }
  .ti-seg.ok .ti-fill { background: #2f9e64; }
  @keyframes ti-sweep { from { background-position: 200% 0; } to { background-position: 0 0; } }
  .ti-lab { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; font-weight: 800; color: var(--text-faint); min-width: 0; }
  .ti-lab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti-lab svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ti-seg.now .ti-lab, .ti-seg.done .ti-lab { color: var(--text-dark); }

  .ti-err a { color: inherit; }
  .ti-err button { margin-left: auto; flex: none; border: none; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 800; font-size: 0.72rem; padding: 7px 14px; cursor: pointer; }

  .material-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Shared small modal — Add Submission and the file-action
     (View/Download) info both use this one component. ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 60;
  }
  /* Same [hidden]-vs-display:flex specificity tie already caught
     elsewhere in this app (.edit-fab[hidden] on home.html,
     .view-toggle[hidden] on course-materials.html) — without this,
     the later `display: flex` rule above wins and the overlay stays
     visible (and intercepts clicks) even with `hidden` set. */
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  /* Wider variant for the Add Submission modal only (2026-09-04, per
     Martin: "make the assignment submission popup bigger") -- it now
     carries tabs, a multi-file list, and the Create tab's rich-text
     toolbar, so the default 380px (sized for the smaller file-info/
     submission-preview popups) felt cramped. Added/removed by
     openAddSubmissionModal()/closeModal() rather than changing
     .modal-box itself, so every other popup in this app stays the same
     size it's always been. Still just width:100% under 560px, so it
     shrinks to fit a narrow viewport the same as .modal-box normally does. */
  .modal-box.modal-box-lg { max-width: 560px; }
  /* Wraps the per-file rows in the Submission Preview popup (2026-09-04)
     -- just spacing, .material-row/.material-badge do the rest. */
  .modal-file-list { margin-top: 8px; }
  .modal-box h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 800; font-style: italic; color: var(--text-dark); }
  .modal-box p { margin: 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
  .modal-file-input {
    width: 100%;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  /* Add Submission — Upload/Create tabs, mirroring the real Schoology
     upload dialog Martin shared a screenshot of (2026-08-29). */
  .upload-tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    border-bottom: 1px solid var(--border);
  }
  .upload-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: inherit;
    font-weight: 800;

    padding: 6px 10px 9px;
    cursor: pointer;

  .upload-tab-panel { padding-top: 12px; }
  .upload-tab-desc { font-size: 0.76rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.45; }
  .modal-field-label {
    display: block;
    margin-top: 16px;
    font-size: 0.68rem;
    font-weight: 800;

    letter-spacing: 0.03em;

  .modal-textarea {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: var(--window-radius-sm);

  .modal-textarea.answer-textarea { min-height: 78px; }
  /* Upload tab's file picker — the bare native <input type="file"> read
     ugly (browser-default button + "no file chosen" text with no styling
     control), so it's now a hidden input triggered by a real styled button,
     matching every other pill/rounded control in this modal (2026-08-29,
     per Martin's request). */
  .upload-picker { display: flex; align-items: center; gap: 10px; margin-top: 4px; min-width: 0; }
  .upload-picker-btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.76rem;
    color: var(--text-dark);
    cursor: pointer;
    flex-shrink: 0;
  }
  .upload-picker-btn:hover { background: var(--border); }
  .upload-picker-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .upload-picker-filename {
    flex: 1;
    min-width: 0;
    font-size: 0.78rem;
    color: var(--text-dark);
    font-weight: 600;

    text-overflow: ellipsis;
    white-space: nowrap;

  .upload-picker-filename.empty { color: var(--text-faint); font-weight: 600; font-style: italic; }
  /* Required-file validation (2026-09-04, per Martin: "make sure that the
     user uploads at min 1 file in the upload tab") -- Submit is blocked
     on the Upload tab until a file is chosen; this note + the picker's
     red border only appear after that first failed attempt, not before
     the user has had a chance to pick a file. Same red as
     .profile-menu-item.signout elsewhere in the app. */
  .upload-picker.error .upload-picker-btn { border-color: #b6432f; }
  .upload-required-note { font-size: 0.74rem; font-weight: 700; color: #b6432f; margin: 6px 0 0; }
  .upload-required-note[hidden] { display: none; }
  /* List of files picked so far on the Upload tab (2026-09-04, per
     Martin: "let people upload multiple files") -- the native file input
     is `multiple` and re-opening the OS picker only ADDS to this list
     rather than replacing it (each dialog's selection is appended to
     `pickedFiles` in bindUploadTab, since the browser itself resets
     input.files to just the newest selection every time). Reuses
     .material-row's badge look (same file-type colors as everywhere else
     in this app) plus a remove button per row. */
  .upload-picked-list { margin-top: 4px; max-height: 168px; overflow-y: auto; }

  .upload-picked-row:last-child { border-bottom: none; }
  .upload-picked-name { flex: 1; min-width: 0; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Create tab's rich-text toolbar (2026-08-30, per Martin's request — "the
     create section is just one textbox that has formatting options like
     google docs"). A lightweight execCommand-based editor: a block-style
     picker (Normal text / Heading 1-3) plus Bold/Italic/Underline/list/link
     buttons sit above a contenteditable answer area, replacing the old
     plain <textarea>. Front-end only, same as everywhere else in this
     mockup — nothing is actually saved as rich text on submit. */
  .rte-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--window-radius-sm) var(--window-radius-sm) 0 0;
    background: var(--panel-inner);
  }
  .rte-select {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-dark);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .rte-select:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .rte-divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
  .rte-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;

  .submission-row { cursor: pointer; border-radius: var(--window-radius-sm); border-bottom: none; padding: 10px 8px; }

  /* ---------- Add Submission button + submission history — an

  /* ---------- Submissions panel ---------- */

  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }

  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has

  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }

  .app-nav.more-open { z-index: 1000; }
  .nav-more {

  .nav-more .label svg { display: block; fill: currentColor; }

  .nav-more:hover .label, .nav-more[aria-expanded="true"] .label { color: var(--text-dark); }

  .nav-more-menu {
    position: absolute;

  .nav-more-item {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;

  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  /* Labels sit centered in the bar; the active page is underlined in the
     accent color instead of marked with a dot (2026-10-01, per Martin). */
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {

    .nav-more::before { top: 10px; bottom: 10px; }

    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }

  /* Emoji icons (2026-10-01, per Martin): icons that show a thing are emoji;

  /* Each emoji is an inline SVG sized by font-size (1em box), so it is

  .emo { display: inline-block; width: 1em; height: 1em; line-height: 0; flex-shrink: 0; vertical-align: middle; }

<body>

  <script>
    // ---- Links by id (2026-10-07, Martin) ----
    // A real class (Schoology/Classroom ids are digits) links as
    // assignment?id=<id> and course-home?id=<section id>; the sample classes
    // (word ids like "apchem") keep ?course=&title=. Pages read both.
    function avgIsId(v) { return /^\d{1,24}$/.test(String(v == null ? '' : v)); }
    function avgCourseQ(course) { return (avgIsId(course) ? 'id=' : 'course=') + encodeURIComponent(course == null ? '' : course); }
    function avgAssignHref(course, title, id, extra) {
      extra = extra || '';
      if (avgIsId(id) && avgIsId(course)) return `assignment.html?id=${id}${extra}`;
      return `assignment.html?course=${encodeURIComponent(course == null ? '' : course)}&title=${encodeURIComponent(title || '')}${avgIsId(id) ? `&id=${id}` : ''}${extra}`;
    }

    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>

        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }

    /** Asks for the token inside the click (it may open a sign-in window). */

    // Preview + teacher comments popup for one submission-history row

    const submissionBodyEl = document.getElementById('submissionBody');

    // ------------------------------------------------------------------
    // Submission History, signed in with Schoology (2026-10-06). Every

    const fmtSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
    function revWhen(r) {

      const when = revWhen(r);

          <div class="material-row submission-row" tabindex="0" role="button" data-rev-index="${idx}" aria-label="${escapeHtml(`${label}, ${r.draft === true ? 'saved' : 'turned in'} ${when}${r.late === true ? ', late' : ''}`)}">

    function liveHistoryHTML() {

      if (liveHistory.state === 'error') return '<p class="assign-empty">Couldn’t load your submissions.<button class="assign-retry" type="button" data-history-retry>Try again</button></p>';

    function openRevisionPreview(idx) {

      const text = typeof r.text === 'string' ? r.text.trim() : '';

      openModal(`
        <h3>${escapeHtml(title)}</h3>
        <p>${r.draft === true ? 'Saved as a draft' : 'Turned in'} ${escapeHtml(revWhen(r))}${r.late === true ? ' · Late' : ''}</p>

          <div class="material-row">
            ${fileIcon(f.ext, `<span class="material-badge" style="background:${EXT_COLOR[f.ext] || '#83849a'}">${escapeHtml((f.ext || 'file').toUpperCase().slice(0, 4))}</span>`)}
            <span class="material-name">${escapeHtml(f.name)}</span>
            ${f.size ? `<span class="rev-size">${escapeHtml(fmtSize(f.size))}</span>` : ''}

    }
    async function loadLiveHistory() {
      const seq = ++liveHistory.seq;

        if (seq === liveHistory.seq && liveHistory.state === 'loading') { liveHistory.state = 'error'; renderSubmissionsPanel(); }
        return;

      try {
        const revs = await S.history({ section: String(item.courseId), assignment: String(item.id) });

    const CHECK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    /** Same scale as the API's letterFromPct. */

        .replace(/([?&](?:section|assignment|file|document|design|parent|continuation)=)[^&#\s]+/g, (m, k) => k + HIDE)

        .replace(/(^|[/=!])[A-Za-z0-9_-]*\d[A-Za-z0-9_-]*[A-Za-z][A-Za-z0-9_-]*(?=$|[/?&#!])/g, (m, pre) => (m.length - pre.length >= 12 ? pre + HIDE : m))
        .replace(/(^|[/=!])[A-Za-z0-9_-]*[A-Za-z][A-Za-z0-9_-]*\d[A-Za-z0-9_-]*(?=$|[/?&#!])/g, (m, pre) => (m.length - pre.length >= 12 ? pre + HIDE : m));

        if (!p.up || st.phase === 'done') return '';

        const early = { file_too_large: 'This file is too big to turn in. Files can be up to 95 MB.', empty_file: 'This file is empty. Pick another one.' };
        if (p.up.state === 'failed') return `<div class="as-stat bad">${escapeHtml(early[p.up.err && p.up.err.code] || submitMessage(p.up.err || { code: 'failed' }))}${p.up.err && p.up.err.code !== 'file_too_large' && p.up.err.code !== 'empty_file' ? ` <button class="as-linkbtn" type="button" data-as-retry-up="${p.key}">Try again</button>` : ''}</div>`;
        if (p.up.state === 'done') return '';
        const pct = Math.round((p.up.frac || 0) * 100);
        const text = p.up.state === 'waiting' ? 'Waiting to upload' : p.up.state === 'hashing' ? `Getting ready ${pct}%` : `Uploading · ${asMb(p.size * p.up.frac)} of ${asMb(p.size)}`;
        return `<div class="as-fprog"><i style="width:${p.up.state === 'uploading' ? pct : 0}%"></i></div><div class="as-stat" data-as-upstat>${text}</div>`;
      }
      const optHTML = (kind, val, on, icon, title, sub, key, off) => `<button class="as-opt" type="button" role="${kind === 'mode' ? 'menuitemradio' : 'radio'}" aria-checked="${on}" data-as-opt="${kind}" data-val="${val}" data-key="${key}"${off ? ' disabled' : ''}>${AS_I.ck}${AS_I[icon]}<span><b>${title}</b><small>${sub}</small></span></button>`;
      function rowHTML(p) {
        const ext = pickExt(p);
        const icon = fileIcon(p.src === 'canva' && p.mode === 'link' ? 'canva' : ext, `<span class="material-badge" style="background:${escapeHtml(EXT_COLOR[ext] || '#83849a')}">${escapeHtml((ext || '?').toUpperCase().slice(0, 4))}</span>`, 40);
        const locked = !!st.phase;
        const share = !locked && canShareAs(p);
        let pill = '', below = '', menu = '';
        if (share) {
          const isLink = p.mode === 'link';
          pill = `<button class="as-pill" type="button" data-as-pick="${p.key}" aria-haspopup="menu" aria-expanded="${p.menu}" aria-label="${isLink ? 'Share as a Link' : 'Send as a Copy'}: change"><span class="t">${isLink ? AS_I.link : AS_I.copy}<span><span class="long">${isLink ? 'Share as a ' : 'Send as a '}</span>${isLink ? 'Link' : 'Copy'}</span></span>${AS_I.ud}</button>`;
          if (isLink) {
            if (p.src === 'canva') {
              const v = p.url ? (CANVA_LINK_OK(p.url) ? '<small class="ok">Looks right</small>' : '<small class="bad">Not a Canva link</small>') : '<small>In Canva: Share, then Copy view link</small>';
              below = `<p class="as-hint">${AS_I.globe}Canva can’t share for us yet, so paste the design’s view link.</p><div class="as-curl"><input type="url" inputmode="url" placeholder="https://www.canva.com/design/…/view" value="${escapeHtml(p.url)}" data-as-url="${p.key}" aria-label="Canva view link for ${escapeHtml(p.name)}">${v}</div>`;
            } else if (p.src === 'onedrive') {
              below = linkNeeds(p) === 'onedrive_allow'
                ? `<p class="as-hint">${AS_I.globe}OneDrive needs one more permission to share links. You’ll come back to this page. <button class="as-linkbtn" type="button" data-as-allow="${p.key}">Allow</button></p>`
                : `<p class="as-hint">${AS_I.globe}Anyone with the link can view.</p>`;
            } else {
              below = `<button class="as-hint as-hint-btn" type="button" data-as-access="${p.key}" aria-expanded="${p.access}">${AS_I.globe}Anyone with the link can ${p.role === 'commenter' ? 'comment' : 'view'}.${AS_I.side}</button>`;
              if (p.access) below += `<div class="as-access" role="radiogroup" aria-label="People with the link can">
                  ${optHTML('role', 'reader', p.role !== 'commenter', 'eye', 'Can view', 'Anyone with the link can look, nothing else.', p.key)}
                  ${optHTML('role', 'commenter', p.role === 'commenter', 'bubble', 'Can comment', 'Your teacher can leave comments on it.', p.key)}
                  ${optHTML('role', 'writer', false, 'pen', 'Can edit', 'Not offered: nobody else should change your work.', p.key, true)}
                </div>`;
            }
          }
          if (p.menu) {
            const copyWhat = p.src === 'canva' || (p.src === 'gdrive' && driveTypes(p.mimeType).length) ? 'Turn in a file of it as it is now.' : 'Turn in the file as it is now.';
            const linkWhat = p.src === 'onedrive' ? 'Your teacher opens the live file with a view link.' : 'Your teacher opens the live file with a link.';
            menu = `<div class="as-menu" role="menu">
                ${optHTML('mode', 'link', p.mode === 'link', 'link', 'Share as a Link', linkWhat, p.key)}
                ${optHTML('mode', 'copy', p.mode !== 'link', 'copy', 'Send as a Copy', copyWhat, p.key)}
              </div>`;
          }
        }
        // The type pill, right after Send as a Copy, when there's more than one type to pick from.
        const types = share ? typesFor(p) : [];
        if (types.length > 1) {
          const tt = turnType(p.type);
          pill = `<span class="as-pills">${pill}<button class="as-pill as-type" type="button" data-as-type="${p.key}" aria-haspopup="menu" aria-expanded="${p.tmenu}" aria-label="Turn in as ${escapeHtml(tt.name)}: change">${fileIcon(p.type, '', 22)}<span class="long">${escapeHtml(tt.name)}</span>${AS_I.ud}</button></span>`;
          if (p.tmenu) menu = `<div class="as-menu as-tmenu" role="menu" aria-label="Turn in as">${typeTilesHTML(types, p.type, `data-key="${p.key}" data-as-tile`)}</div>`;
        }
        const status = st.phase && p.status ? `<div class="as-stat${p.statusBad ? ' bad' : ''}">${escapeHtml(p.status)}</div>` : '';
        return `<div class="as-row avfi-host${share ? ' cloud' : ''}${p.up && p.up.state === 'failed' ? ' failed' : ''}" data-pick="${p.key}">
            ${icon}
            <div class="as-row-text"><div class="as-name">${escapeHtml(p.name)}</div><div class="as-meta">${escapeHtml(metaFor(p))}</div>${upLineHTML(p)}${status}</div>
            ${pill}
            ${locked ? '' : `<button class="as-rm" type="button" data-as-rm="${p.key}" aria-label="Remove ${escapeHtml(p.name)}">${AS_I.x}</button>`}
            <div class="as-below">${below}</div>
            ${menu}
          </div>`;
      }
      function turnInLabel() {
        if (uploading()) return 'Uploading…';
        const n = st.picks.length;
        return n > 1 ? `Turn in ${n} ${anyLink() ? 'items' : 'files'}` : 'Turn in';
      }
      function footHTML() {
        if (st.phase === 'done') return '<div class="as-foot"><span class="as-note">Your teacher sees it on Schoology</span><button class="as-btn primary" type="button" data-as-done>Done</button></div>';
        if (st.phase === 'turning') return `<div class="as-foot"><span class="as-note">Your teacher sees it on Schoology</span><button class="as-btn" type="button" disabled title="Can’t cancel while it’s being turned in">Cancel</button><button class="as-btn primary" type="button" disabled>Turning in…</button></div>`;
        if (st.phase === 'failed') return '<div class="as-foot"><button class="as-btn" type="button" data-as-edit>Change files</button><span class="as-note"></span><button class="as-btn" type="button" data-as-close>Cancel</button><button class="as-btn primary" type="button" data-as-send>Try again</button></div>';
        const note = st.picks.length ? 'Your teacher sees it on Schoology' : 'Add at least one file';
        return `<div class="as-foot"><span class="as-note">${note}</span><button class="as-btn" type="button" data-as-close id="modalCancelBtn">Cancel</button><button class="as-btn primary" type="button" data-as-send id="modalSubmitBtn"${ready() ? '' : ' disabled'}>${turnInLabel()}</button></div>`;
      }
      function filesHTML() {
        const n = st.picks.length;
        const list = n ? `<div class="as-list-h"><span>${st.phase === 'done' ? 'Turned in' : 'Turning in'} (${n})</span><span>${n > 1 && st.phase !== 'done' ? 'One turn-in, all together' : ''}</span></div><div class="as-list" id="uploadPickedList">${st.picks.map(rowHTML).join('')}</div>` : '';
        const sources = st.phase ? '' : `${uploadSourcesRowHTML()}<p class="as-source-note" id="uploadSourceNote" role="status" hidden></p><div class="canva-pick" id="canvaPick" hidden></div><div class="canva-pick drive-pick" id="drivePick" hidden></div>`;
        const write = st.phase ? '' : '<p class="as-alt">No file? <button type="button" data-as-write="1">Write your answer instead</button></p>';
        return `${headHTML(st.phase === 'turning')}${dropHTML()}${sources}${list}${write}${st.phase === 'failed' ? '' : ''}${footHTML()}`;
      }

      // Written answer: the rich-text box (2026-08-30) with its step bar in the footer.
      function writeHTML() {
        const busy = st.wph === 'turning', fin = st.wph === 'done', lock = st.wph === 'turning' || st.wph === 'done';
        const dis = lock ? ' disabled' : '';
        const toolbar = `<div class="rte-toolbar" role="toolbar" aria-label="Text formatting">
            <select class="rte-select" id="rteBlockSelect" aria-label="Text style"${dis}>
              <option value="p">Normal text</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option>
            </select>
            <span class="rte-divider" aria-hidden="true"></span>
            <button class="rte-btn" type="button" data-cmd="bold" aria-label="Bold" title="Bold"${dis}><b>B</b></button>
            <button class="rte-btn" type="button" data-cmd="italic" aria-label="Italic" title="Italic"${dis}><i>I</i></button>
            <button class="rte-btn" type="button" data-cmd="underline" aria-label="Underline" title="Underline"${dis}><u>U</u></button>
            <span class="rte-divider" aria-hidden="true"></span>
            <button class="rte-btn" type="button" data-cmd="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list"${dis}><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/><path d="M9 6h11M9 12h11M9 18h11"/></svg></button>
            <button class="rte-btn" type="button" data-cmd="insertOrderedList" aria-label="Numbered list" title="Numbered list"${dis}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><text x="1" y="8" font-size="7">1</text><text x="1" y="14" font-size="7">2</text><text x="1" y="20" font-size="7">3</text></svg></button>
            <span class="rte-divider" aria-hidden="true"></span>
            <button class="rte-btn" type="button" data-cmd="createLink" aria-label="Insert link" title="Insert link"${dis}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6"/><path d="M10 6l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M14 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg></button>
          </div>`;
        const editor = `<div class="modal-textarea answer-textarea rte-editor as-editor${lock ? ' locked' : ''}" id="submissionAnswerText" contenteditable="${lock ? 'false' : 'true'}" role="textbox" aria-multiline="true" aria-label="Your answer" aria-disabled="${lock}" data-placeholder="Write your answer here…">${st.html}</div>`;
        const back = fin ? '' : `<button class="as-btn as-back" type="button" data-as-write="0"${busy ? ' disabled' : ''}>${AS_I.back}Back</button>`;
        const mid = st.wph ? `<div class="as-wbar">${wprogHTML()}</div>` : '<span class="as-note as-note-right">Turned in on Schoology as a written answer</span>';
        const right = fin ? '<button class="as-btn primary" type="button" data-as-done>Done</button>'
          : `<button class="as-btn primary" type="button" data-as-wsend id="modalSubmitBtn"${busy || !hasText() ? ' disabled' : ''}>${busy ? 'Turning in…' : st.wph === 'failed' ? 'Try again' : 'Turn in'}</button>`;
        return `${headHTML(busy)}${toolbar}${editor}<div class="as-foot${st.wph ? ' as-wfoot' : ''}">${back}${mid}${right}</div>`;
      }
      const textOf = html => { const d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/ /g, ' ').trim(); };
      const hasText = () => !!textOf(st.html);

      function render(focusSel) {
        modalBox.innerHTML = st.write ? writeHTML() : filesHTML();
        modalBox.dataset.lock = st.phase === 'turning' || st.wph === 'turning' ? '1' : '';
        if (st.write) bindEditor();
        else bindFiles();
        const log = document.getElementById('asLog');
        if (log) log.scrollTop = log.scrollHeight;
        placeAsMenu();
        if (focusSel) { const el = modalBox.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
        st.xBack = false;
      }
      /**
       * An open row menu (Send as a Copy / Share as a Link, or the type icons)
       * sits right under the pill that opened it, above everything (2026-10-15):
       * inside the scrolling file list it used to be cut off at the list's edge.
       */
      function placeAsMenu() {
        const menu = modalBox.querySelector('.as-menu');
        if (!menu) return;
        const row = menu.closest('.as-row');
        const key = row ? row.dataset.pick : '';
        const opener = modalBox.querySelector(menu.classList.contains('as-tmenu') ? `[data-as-type="${key}"]` : `[data-as-pick="${key}"]`);
        if (!opener) return;
        Object.assign(menu.style, { position: 'fixed', right: 'auto', left: '0px', top: '0px', zIndex: '40' });
        const o = opener.getBoundingClientRect(), m = menu.getBoundingClientRect();
        // Where (0, 0) actually landed: not the corner of the window if the popup is transformed.
        const offX = m.left, offY = m.top;
        const left = Math.max(8, Math.min(o.right - m.width, window.innerWidth - m.width - 8));
        let top = o.bottom + 6;
        if (top + m.height > window.innerHeight - 8) top = Math.max(8, o.top - 6 - m.height);
        menu.style.left = (left - offX) + 'px';
        menu.style.top = (top - offY) + 'px';
      }

      // ---------- step bars ----------
      function segHTML(stp, state) {
        const ic = state.includes('fail') ? 'fail' : state.includes('done') ? 'check' : state === 'now' ? 'spin' : stp.icon;
        const fill = state === 'now' && stp.mb ? `<i class="as-fill-bar" data-as-fill style="width:${Math.round((stp.frac || 0) * 100)}%"></i>` : `<i class="as-fill-bar${state === 'now' ? ' ind' : ''}"></i>`;
        return `<div class="as-seg ${state}" style="flex:${Math.max(stp.ms, 900)} 1 0" title="${escapeHtml(stp.label)}"><span class="as-track">${fill}</span><span class="as-lab">${asStepIcon(ic)}<span>${escapeHtml(stp.short)}</span></span></div>`;
      }
      function barHTML(P, phase, doneRight) {
        const fin = phase === 'done', failed = phase === 'failed';
        const segs = P.steps.map((stp, i) => segHTML(stp, fin ? 'done ok' : failed && i === P.i ? 'fail' : i < P.i ? 'done' : i === P.i ? 'now' : 'next')).join('');
        const cur = P.steps[Math.min(P.i, P.steps.length - 1)];
        const head = fin ? `<span class="as-h">${asStepIcon('check')}Turned in</span>` : failed ? '<span class="as-h bad">Couldn’t turn it in</span>' : `<span class="as-h">${escapeHtml(cur.label)}…</span>`;
        const right = fin ? doneRight : failed ? '' : cur.mb ? `${asMb(cur.frac * cur.mb)} of ${asMb(cur.mb)}` : `Step ${P.i + 1} of ${P.steps.length}`;
        const err = failed && st.err ? `<p class="as-err" role="alert">${submitErrorHTML(st.err, false)}</p>` : '';
        return `<div class="as-prog" role="status" aria-live="polite"><div class="as-prog-head">${head}<small data-as-right>${right}</small></div><div class="as-segs">${segs}</div>${err}</div>`;
      }
      const progHTML = () => (st.prog ? barHTML(st.prog, st.phase, `${st.picks.length} item${st.picks.length > 1 ? 's' : ''} sent to Schoology`) : '');
      const wprogHTML = () => (st.wprog ? barHTML(st.wprog, st.wph, 'Written answer sent to Schoology') : '');
      function paintProg() {
        const drop = document.getElementById('asDrop');
        if (!drop || !st.prog) return;
        const old = drop.querySelector('.as-prog');
        const tmp = document.createElement('div');
        tmp.innerHTML = progHTML();
        if (old) old.replaceWith(tmp.firstElementChild);
      }
      function paintFill() {
        const P = st.prog, cur = P && P.steps[P.i];
        if (!cur || !cur.mb) return;
        const fill = modalBox.querySelector('[data-as-fill]');
        if (fill) fill.style.width = Math.round(cur.frac * 100) + '%';
        const r = modalBox.querySelector('[data-as-right]');
        if (r) r.textContent = `${asMb(cur.frac * cur.mb)} of ${asMb(cur.mb)}`;
      }
      function setStatus(p, text, bad) {
        p.status = text;
        p.statusBad = !!bad;
        const row = modalBox.querySelector(`.as-row[data-pick="${p.key}"]`);
        if (!row) return;
        let el = row.querySelector('.as-stat');
        if (!el) { row.querySelector('.as-meta').insertAdjacentHTML('afterend', '<div class="as-stat"></div>'); el = row.querySelector('.as-stat'); }
        el.textContent = text;
        el.classList.toggle('bad', !!bad);
      }
      function addLog(e) {
        const line = typeof e === 'string' ? e : logLine(e);
        if (!line) return;
        st.log.push(line);
        if (st.log.length > 400) st.log.splice(0, st.log.length - 400);
        const log = document.getElementById('asLog');
        if (!log) return;
        const last = log.querySelector('.cur');
        if (last) last.classList.remove('cur');
        log.insertAdjacentHTML('beforeend', `<span class="as-log-ln cur">${line}</span>`);
        log.scrollTop = log.scrollHeight;
      }
      const note = text => addLog({ kind: 'note', text });

      // ---------- uploading as soon as a file is added ----------
      function paintUploads() {
        const drop = document.getElementById('asDrop');
        if (!drop || st.phase) return;
        const flying = uploading();
        const t = document.getElementById('asDropTitle'), s = document.getElementById('asDropSub');
        if (flying) {
          if (!drop.classList.contains('sending')) drop.classList.add('sending');
          if (t) t.textContent = upTitle();
          if (s) s.textContent = upSub();
        }
        st.picks.forEach(p => {
          if (!p.up || (p.up.state !== 'hashing' && p.up.state !== 'uploading')) return;
          const row = modalBox.querySelector(`.as-row[data-pick="${p.key}"]`);
          if (!row) return;
          const bar = row.querySelector('.as-fprog i'), stat = row.querySelector('[data-as-upstat]');
          const pct = Math.round((p.up.frac || 0) * 100);
          if (bar) bar.style.width = (p.up.state === 'uploading' ? pct : 0) + '%';
          if (stat) stat.textContent = p.up.state === 'hashing' ? `Getting ready ${pct}%` : `Uploading · ${asMb(p.size * p.up.frac)} of ${asMb(p.size)}`;
        });
        const btn = modalBox.querySelector('[data-as-send]');
        if (btn) { btn.disabled = !ready(); btn.textContent = turnInLabel(); }
      }
      /** The arrow finishes its trip and settles, then the list redraws without the bars. */
      function landArrow() {
        const arrow = modalBox.querySelector('#asDrop .as-upa');
        const settle = () => { if (!st.phase && !st.write) render(); };
        if (!arrow || !arrow.getAnimations || !arrow.getAnimations().length) { settle(); return; }
        const s = document.getElementById('asDropSub');
        if (s) s.textContent = 'All uploaded';
        let done = false;
        const finish = () => { if (done) return; done = true; arrow.style.animation = 'none'; settle(); };
        arrow.addEventListener('animationiteration', finish, { once: true });
        setTimeout(finish, 1200);   // in case the animation never reports (hidden tab)
      }
      async function runUploads() {
        if (uploads.running) return;
        uploads.running = true;
        if (!uploads.ctl || uploads.ctl.signal.aborted) uploads.ctl = new AbortController();
        const signal = uploads.ctl.signal;
        activeSubmitAbort = () => uploads.ctl.abort();
        let S = null;
        if (!preview) {
          try { S = await loadSubmitScript(); } catch { S = null; }
        }
        let p;
        while (!signal.aborted && (p = st.picks.find(x => x.up && x.up.state === 'waiting'))) {
          p.up.state = 'hashing';
          p.up.frac = 0;
          paintUploads();
          // Its own stop switch: removing the file stops its upload.
          const pc = new AbortController();
          p.ctl = pc;
          signal.addEventListener('abort', () => pc.abort(), { once: true });
          try {
            if (preview) {
              p.up.state = 'uploading';
              const ms = Math.max(1500, Math.min(6000, p.size / (1.5 * 1048576) * 1000));
              const t0 = performance.now();
              while (p.up.frac < 1 && !pc.signal.aborted) {
                await new Promise(r => setTimeout(r, 60));
                p.up.frac = Math.min(1, (performance.now() - t0) / ms);
                paintUploads();
              }
              if (pc.signal.aborted) continue;
              p.up.fileId = 'preview';
            } else {
              if (!S) throw { code: 'network' };
              const r = await S.uploadFile({
                section: sec, assignment: asg, blob: p.file, name: p.name, signal: pc.signal,
                onProgress: x => { p.up.state = x.phase === 'hashing' ? 'hashing' : 'uploading'; p.up.frac = x.fraction || 0; paintUploads(); },
              });
              p.up.fileId = r.fileId;
            }
            if (!st.picks.includes(p)) continue;
            p.up.state = 'done';
            p.up.frac = 1;
            p.up.at = Date.now();
          } catch (e) {
            if (signal.aborted) break;
            if (!st.picks.includes(p)) continue;
            p.up.state = 'failed';
            p.up.err = e && typeof e === 'object' ? e : { code: String(e) };
          }
          if (!st.phase && !st.write) {
            // Finished files drop their bar; the rest keep theirs.
            const row = modalBox.querySelector(`.as-row[data-pick="${p.key}"]`);
            if (row) { const tmp = document.createElement('div'); tmp.innerHTML = rowHTML(p); row.replaceWith(tmp.firstElementChild); }
          }
        }
        uploads.running = false;
        if (!uploading()) {
          st.picks.forEach(x => { if (x.up) x.up.batchOpen = false; });
          if (activeSubmitAbort && st.phase !== 'turning') activeSubmitAbort = null;
          if (!signal.aborted) landArrow();
        }
      }
      function addDeviceFiles(files) {
        if (st.phase) return;
        const flying = uploading();
        let added = 0;
        Array.from(files || []).forEach(f => {
          if (addPick({ src: 'device', name: f.name, file: f, size: f.size })) {
            added++;
            const p = st.picks[st.picks.length - 1];
            p.up.batchOpen = true;
          }
        });
        if (!added) return;
        if (!flying) st.picks.forEach(x => { if (x.up && x.up.state === 'done') x.up.batchOpen = false; });
        render();
        runUploads();
      }

      // ---------- Turn in ----------
      const STEP_W = { pdf: 1600, get: 900, link: 900, send: 900, files: 400 };
      function stepsFor(list) {
        const canvaCopies = list.filter(p => p.src === 'canva' && p.mode !== 'link' && !p.fileId);
        const getCopies = list.filter(p => (p.src === 'gdrive' || p.src === 'onedrive' || p.src === 'course') && p.mode !== 'link' && !p.fileId);
        const links = list.filter(p => p.mode === 'link' && !p.fileId);
        const reup = list.filter(p => p.src === 'device' && (!p.up.fileId || p.stale));
        const steps = [];
        if (canvaCopies.length) {
          // Named for the type picked: "Making a PowerPoint in Canva", "Canva Word"; mixed types read as files.
          const kinds = [...new Set(canvaCopies.map(p => p.type || 'pdf'))];
          const one = kinds.length === 1 ? turnType(kinds[0]) : null;
          const label = canvaCopies.length > 1
            ? `Making ${canvaCopies.length} ${one && kinds[0] === 'pdf' ? 'PDFs' : 'files'} in Canva`
            : kinds[0] === 'docx' ? 'Making a Word document from Canva' : `Making ${one.a} in Canva`;
          const words = canvaCopies.filter(p => p.type === 'docx').length;
          steps.push({ k: 'pdf', icon: 'pdf', short: one ? `Canva ${one.name}` : 'Canva', label, items: canvaCopies, ms: STEP_W.pdf * canvaCopies.length + 2400 * words });
        }
        if (getCopies.length) {
          const apps = [...new Set(getCopies.map(p => (p.src === 'course' ? 'your class' : SOURCE_NAME[p.src])))];
          const short = apps.length > 1 ? 'Get files' : getCopies[0].src === 'onedrive' ? 'OneDrive' : getCopies[0].src === 'course' ? 'Class' : 'Drive';
          steps.push({ k: 'get', icon: 'get', short, label: `Getting ${getCopies.length > 1 ? getCopies.length + ' files' : 'it'} from ${andList(apps)}`, items: getCopies, ms: STEP_W.get * getCopies.length });
        }
        if (links.length) steps.push({ k: 'link', icon: 'link', short: links.length > 1 ? 'Links' : 'Link', label: links.length > 1 ? `Making ${links.length} share links` : links[0].src === 'canva' ? 'Checking your Canva link' : 'Making the view link', items: links, ms: STEP_W.link * links.length });
        const toUpload = canvaCopies.concat(getCopies, links, reup);
        if (toUpload.length) steps.push({ k: 'up', icon: 'up', short: 'Upload', label: 'Uploading', items: toUpload, mb: 0, frac: 0, ms: 1800 });
        if (!steps.length) steps.push({ k: 'files', icon: 'files', short: 'Check', label: 'Checking your uploads', items: [], ms: STEP_W.files });
        steps.push({ k: 'send', icon: 'school', short: 'Turn in', label: 'Turning in', items: [], ms: STEP_W.send });
        return steps;
      }
      // Sign-in windows have to open inside the click, so tokens are asked for before anything is awaited.
      function tokensForClick() {
        const c = C(), tokens = {};
        if (preview || !c) return tokens;
        if (st.picks.some(p => p.src === 'gdrive' && !p.fileId)) tokens.gdrive = driveReadToken(c);
        const od = st.picks.filter(p => p.src === 'onedrive' && !p.fileId);
        if (od.some(p => p.mode === 'link')) tokens.onedriveWrite = c.oneDriveToken({ interactive: true, write: true });
        if (od.some(p => p.mode !== 'link')) {
          const needsRead = typeof c.oneDrivePicked !== 'function' || od.some(p => c.oneDrivePicked(p.id));
          tokens.onedrive = needsRead ? oneDriveReadToken(c) : (typeof c.oneDriveToken === 'function' ? c.oneDriveToken({ interactive: true }) : Promise.reject({ code: 'not_configured' }));
        }
        Object.values(tokens).forEach(t => t.catch(() => {}));
        return tokens;
      }
      const wait = ms => new Promise(r => setTimeout(r, ms));
      async function turnIn() {
        if (st.phase === 'turning' || (!ready() && st.phase !== 'failed')) return;
        const tokens = tokensForClick();
        const drop = document.getElementById('asDrop');
        if (!st.phase) st.boxH = drop ? drop.offsetHeight : 240;
        // Retrying after the turn-in call itself failed: Schoology may have let go of the uploads, so they go up again.
        if (st.err && st.err.atSend) st.picks.forEach(p => { p.fileId = ''; p.fileIds = null; if (p.up) p.stale = true; });
        st.picks.forEach(p => { p.menu = false; p.access = false; p.tmenu = false; p.status = ''; p.statusBad = false; });
        // Uploaded long ago: Schoology may have let go of it. Up again.
        st.picks.forEach(p => { if (p.up && p.up.at && Date.now() - p.up.at > 45 * 60 * 1000) p.stale = true; });
        st.err = null;
        st.prog = { steps: stepsFor(st.picks), i: 0 };
        st.phase = 'turning';
        render();
        const ctl = new AbortController();
        const signal = ctl.signal;
        activeSubmitAbort = () => ctl.abort();
        const P = st.prog;
        let S = null;
        try {
          if (!preview) S = await loadSubmitScript();
          const blobs = new Map();   // pick key -> { blob, name }
          for (P.i = 0; P.i < P.steps.length; P.i++) {
            const stp = P.steps[P.i];
            paintProg();
            if (stp.k === 'files') {
              note('every file is already on Schoology');
              await wait(350);
            } else if (stp.k === 'pdf' || stp.k === 'get') {
              for (const p of stp.items) {
                try {
                  const tt = turnType(p.type);
                  if (preview) {
                    setStatus(p, stp.k === 'pdf' ? `Making ${tt.a}…` : `Getting it from ${p.src === 'course' ? 'your class' : SOURCE_NAME[p.src]}…`);
                    await wait(p.type === 'docx' ? 1800 : 900);
                    const pages = p.src === 'canva' && p.type === 'png' ? 3 : 1;
                    const parts = Array.from({ length: pages }, (_, i) => ({ blob: new Blob([new Uint8Array(Math.max(1, p.size || 200000))]), name: pages > 1 ? `${p.base} (page ${i + 1} of ${pages}).png` : p.name }));
                    blobs.set(p.key, pages > 1 ? parts : parts[0]);
                  } else if (p.src === 'canva') {
                    setStatus(p, p.type === 'docx' ? 'Making a Word document (PDF first, then Word)…' : `Making ${tt.a}…`);
                    const files = await S.exportCanvaFiles(p.designId, { title: p.title, signal, format: p.type || 'pdf' });
                    blobs.set(p.key, files.length > 1 ? files : files[0]);
                  } else if (p.src === 'course') {
                    setStatus(p, 'Getting it from your class…');
                    const blob = await S.courseFile({ section: p.course, [p.kind === 'document' ? 'document' : 'assignment']: p.parent, fileId: p.id, name: p.name }, signal);
                    blobs.set(p.key, { blob, name: p.name });
                  } else {
                    setStatus(p, `Getting it from ${SOURCE_NAME[p.src]}…`);
                    const c = C();
                    const download = c && (p.src === 'gdrive' ? c.googleDownload : c.oneDriveDownload);
                    if (typeof download !== 'function') throw { code: 'not_configured' };
                    const r = await download.call(c, await tokens[p.src], p.id, p.src === 'gdrive' ? { as: p.type || 'pdf' } : undefined);
                    if (!r || !r.blob) throw { code: 'download_failed' };
                    blobs.set(p.key, { blob: r.blob, name: String(r.name || p.name) });
                  }
                  const got = blobs.get(p.key);
                  setStatus(p, Array.isArray(got) ? `${got.length} images ready` : stp.k === 'pdf' ? `${tt.name} ready` : 'Got it');
                } catch (e) {
                  setStatus(p, submitMessage(e), true);
                  throw e;
                }
                if (signal.aborted) throw { code: 'aborted' };
              }
            } else if (stp.k === 'link') {
              for (const p of stp.items) {
                try {
                  let url;
                  if (p.src === 'canva') {
                    setStatus(p, 'Checking the link…');
                    note('checking the pasted Canva link');
                    if (!CANVA_LINK_OK(p.url)) throw { code: 'canva_link_needed' };
                    url = p.url.trim();
                    await wait(200);
                  } else if (preview) {
                    setStatus(p, 'Making the view link…');
                    await wait(900);
                    url = 'https://example.com/preview-link';
                  } else if (p.src === 'gdrive') {
                    setStatus(p, 'Making the view link…');
                    url = (await C().googleShareLink(await tokens.gdrive, p.id, p.role === 'commenter' ? 'commenter' : 'reader')).url;
                  } else {
                    setStatus(p, 'Making the view link…');
                    const r = await C().oneDriveShareLink(await tokens.onedriveWrite, p.id);
                    url = r.url;
                    if (r.scope === 'organization') note('your school only allows links for people in your school');
                  }
                  blobs.set(p.key, preview ? { blob: new Blob(['link']), name: p.name.replace(/\.[a-z0-9]{1,5}$/i, '') + ' (link).html' } : S.linkFile(p.title || p.name, url, SOURCE_NAME[p.src]));
                  setStatus(p, `Link ready · Can ${p.role === 'commenter' ? 'comment' : 'view'}`);
                } catch (e) {
                  setStatus(p, submitMessage(e), true);
                  throw e;
                }
                if (signal.aborted) throw { code: 'aborted' };
              }
            } else if (stp.k === 'up') {
              // A pick can be several files (a Canva design as PNG pages): each one goes up.
              const items = stp.items.map(p => {
                const got = p.src === 'device' ? { blob: p.file, name: p.name } : blobs.get(p.key);
                return { p, fs: got ? [].concat(got) : [] };
              });
              const already = st.picks.filter(p => !stp.items.includes(p)).reduce((a, p) => a + (p.fileIds && p.fileIds.length ? p.fileIds.length : 1), 0);
              if (already + items.reduce((a, x) => a + x.fs.length, 0) > SUBMIT_MAX_FILES) throw { code: 'too_many_files' };
              stp.mb = items.reduce((a, x) => a + x.fs.reduce((b, f) => b + f.blob.size, 0), 0) || 1;
              stp.frac = 0;
              paintProg();
              let before = 0;
              for (const { p, fs } of items) {
                if (!fs.length) throw { code: 'failed' };
                const ids = [];
                let sent = 0;
                for (const f of fs) {
                  setStatus(p, fs.length > 1 ? `Uploading ${ids.length + 1} of ${fs.length}…` : 'Uploading…');
                  try {
                    if (preview) {
                      const t0 = performance.now(), ms = Math.max(600, f.blob.size / (2 * 1048576) * 1000);
                      let fr = 0;
                      while (fr < 1) { await wait(60); fr = Math.min(1, (performance.now() - t0) / ms); stp.frac = (before + fr * f.blob.size) / stp.mb; paintFill(); }
                      ids.push('preview');
                    } else {
                      const r = await S.uploadFile({ section: sec, assignment: asg, blob: f.blob, name: f.name, signal, onProgress: x => { if (x.phase === 'uploading') { stp.frac = (before + (x.fraction || 0) * f.blob.size) / stp.mb; paintFill(); } } });
                      ids.push(r.fileId);
                    }
                  } catch (e) {
                    setStatus(p, submitMessage(e), true);
                    throw e;
                  }
                  before += f.blob.size;
                  sent += f.blob.size;
                }
                p.fileId = ids[0];
                p.fileIds = ids;
                if (p.src === 'device') { p.up.fileId = p.fileId; p.up.at = Date.now(); p.stale = false; }
                p.sentSize = sent;
                setStatus(p, 'Uploaded');
              }
            } else if (stp.k === 'send') {
              const ids = st.picks.flatMap(p => (p.src === 'device' ? [p.up.fileId] : p.fileIds && p.fileIds.length ? p.fileIds : [p.fileId]));
              if (preview) {
                note('preview: nothing is sent to Schoology');
                await wait(900);
                st.revision = null;
              } else {
                try {
                  st.revision = (await S.turnInFiles({ section: sec, assignment: asg, fileIds: ids, signal })).revision;
                } catch (e) {
                  throw Object.assign(e && typeof e === 'object' ? e : { code: String(e) }, { atSend: true });
                }
              }
              note('turned in');
            }
            if (signal.aborted) throw { code: 'aborted' };
          }
          activeSubmitAbort = null;
          stopLogging();   // the history reload after this isn't part of the turn-in
          st.phase = 'done';
          st.xBack = true;
          render('[data-as-done]');
          if (preview) {
            submissionHistory.push({ files: st.picks.map(p => ({ name: p.mode === 'link' ? p.name.replace(/\.[a-z0-9]{1,5}$/i, '') + ' (link).html' : p.name, ext: p.mode === 'link' ? 'html' : (pickExt(p) || 'pdf') })), timestamp: 'Just now' });   // (PNG pages show as one entry in the preview)
            currentStatus = 'submitted';
          } else afterTurnIn(st.revision);
        } catch (e) {
          if (signal.aborted || (e && e.code === 'aborted')) return;
          activeSubmitAbort = null;
          if (e && e.code === 'popup_closed') { st.phase = null; st.prog = null; render(); return; }
          st.err = e && typeof e === 'object' ? e : { code: String(e) };
          st.phase = 'failed';
          note('stopped: nothing was turned in');
          render();
        }
      }

      // Written answer.

      const DRIVE_KIND = { 'application/vnd.google-apps.document': 'Google Doc', 'application/vnd.google-apps.spreadsheet': 'Google Sheet', 'application/vnd.google-apps.presentation': 'Google Slides', 'application/vnd.google-apps.drawing': 'Google Drawing', 'application/vnd.google-apps.form': 'Google Form' };

      // ---------- wiring ----------
      function bindFiles() {

        isDriveDraft(d) ? { icon: 'chain', label: 'Making the view link', w: 1 } : { icon: 'chain', label: 'Checking your Canva link', w: 1 },
        { icon: 'school', label: 'Sending it to your school', w: 2 },
      ];
      const tt = turnType(t.type);
      return [
        isDriveDraft(d) ? { icon: 'get', label: draftTypes(d, t).length ? `Getting ${tt.a} from Google Drive` : 'Getting it from Google Drive', w: 2 }
          : isCanvaDraft(d) ? { icon: 'pdf', label: t.type === 'docx' ? 'Making a Word document from Canva' : `Making ${tt.a} in Canva`, w: t.type === 'docx' ? 5 : 3 }
          : { icon: 'get', label: 'Getting the file', w: 1 },
        { icon: 'up', label: 'Uploading', w: 2, bytes: true },
        { icon: 'school', label: 'Turning in', w: 1 },
      ];
    }
    function tiProgHTML(d, t) {
      const P = t.prog;
      const segs = P.steps.map((st, i) => {
        const state = P.failedAt === i ? 'fail' : (i < P.i || P.finished) ? 'done' : i === P.i ? 'now' : 'next';
        const ic = state === 'done' ? 'done' : state === 'fail' ? 'fail' : state === 'now' ? 'spin' : st.icon;
        const fill = state === 'now' && st.bytes && P.frac != null
          ? `<i class="ti-fill" data-ti-fill style="width:${Math.round(P.frac * 100)}%"></i>`
          : `<i class="ti-fill${state === 'now' ? ' ind' : ''}"></i>`;
        return `<span class="ti-seg ${state}${P.finished ? ' ok' : ''}" style="flex:${st.w} 1 0"><span class="ti-track">${fill}</span><span class="ti-lab"><svg class="${ic === 'spin' ? 'ti-spin' : ''}" viewBox="0 0 24 24" aria-hidden="true">${TI_ICON[ic]}</svg><span>${st.label}</span></span></span>`;
      }).join('');
      const cur = P.steps[Math.min(P.i, P.steps.length - 1)];
      const head = P.finished ? 'Turned in' : P.failedAt != null ? 'Couldn’t turn it in' : `${P.note || cur.label}…`;
      const mb = n => (n / (1024 * 1024)).toFixed(1);
      const right = P.finished ? 'Done' : P.failedAt != null ? '' : cur.bytes && P.size && P.frac != null ? `${mb(P.frac * P.size)} of ${mb(P.size)} MB` : `Step ${P.i + 1} of ${P.steps.length}`;
      const err = P.failedAt != null ? `<p class="ti-err" role="alert"><span>${t.err || 'Nothing was turned in.'}</span><button type="button" data-draft-action="ti-submit">Try again</button></p>` : '';

    // ---- motion (none with reduced motion / Potato mode) ----
    const tiStill = () => reduceMotion() || !!(document.body && document.body.classList.contains('potato-mode'));
    const TI_EASE = 'cubic-bezier(.2,.8,.2,1)';
    const tiRow = id => draftsList.querySelector(`[data-draft="${CSS.escape(id)}"]`);
    const tiQ = (id, sel) => { const r = tiRow(id); return r ? r.querySelector(sel) : null; };
    const tiW = el => (el ? el.getBoundingClientRect().width : 0);
    /** Pops an icon (it just changed); with `letters`, its type letters show for a moment too. */
    function popIcon(el, letters) {
      if (!el || tiStill()) return;

      void el.offsetWidth;
      el.classList.add('type-pop');

    /** The type menu's icons show their letters one after another, like the mockup. */
    function revealTiles(menu) {
      if (!menu) return;

      const row = tiRow(id);

      const to = row.offsetHeight;
