    /** Redraws one draft row (keeps the rest of the list as it is), with an optional motion. */
    function tiDraw(id, motion, focusSel) {
      const old = tiRow(id);
      if (!old) { renderDrafts(); return; }
      const before = { main: tiW(old.querySelector('.ti-main')), pick: tiW(old.querySelector('.ti-pick')), type: tiW(old.querySelector('.ti-type')), h: old.offsetHeight };
      const d = drafts.find(x => x.id === id);

      const tmp = document.createElement('div');

        tiRoll(tiQ(id, '.ti-main'));
        tiAnim(tiQ(id, '.ti-pick'), [{ opacity: 0, transform: 'translateX(40px) scale(.9)' }, { opacity: 1, transform: 'none' }], 320, 40);
        tiAnim(tiQ(id, '.ti-x'), [{ opacity: 0, transform: 'scale(.4) rotate(-90deg)' }, { opacity: 1, transform: 'none' }], 280, 90);
        // The file's icon turns into what the teacher gets (a PDF to start).
        const row = tiRow(id);
        popIcon(row && row.querySelector('.draft-row > .avfi'), true);
        tiAnim(tiQ(id, '.ti-below'), [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], 260, 140);
      } else if (motion === 'mode') {
        tiMorph(tiQ(id, '.ti-pick'), before.pick, 260);
        tiRoll(tiQ(id, '.ti-pick'));
        tiAnim(tiQ(id, '.ti-hint'), [{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], 240, 40);

        const row = tiRow(id);
        popIcon(row && row.querySelector('.draft-row > .avfi'), true);
      } else if (motion === 'menu') {

        tiAnim(tiQ(id, '.ti-type .ti-tn'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], 240, 60);
        tiMorph(tiQ(id, '.ti-type'), before.type, 260);
        tiAnim(tiQ(id, '.ti-hint'), [{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], 240, 40);
      } else if (motion === 'busy') {
        tiAnim(tiQ(id, '.ti-prog'), [{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], 220);
      } else if (motion === 'back') {

        tiRoll(tiQ(id, '.ti-main'));
        tiAnim(tiQ(id, '.canva-btn'), [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], 300, 60);
        tiAnim(tiQ(id, '.draft-meta'), [{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], 260, 80);

    }
    function tiPlaceMenu(id) {
      const t = TI.get(id);

        if (!el || !box0 || tiStill()) return null;

          { width: m0.width + 'px', height: m0.height + 'px', transform: `translate(${m0.right - r1.right}px, ${(m0.top + m0.height / 2) - (r1.top + r1.height / 2)}px)` },

    // ---- running a turn-in ----
    function tiSubmit(d) {
      const t = TI.get(d.id);
      if (!t || t.busy) return;
      t.menu = false; t.access = false; t.tmenu = false;
      if (t.mode === 'link' && !isDriveDraft(d) && !CANVA_VIEW_LINK(t.url)) {
        t.err = escapeHtml(submitMessage({ code: 'canva_link_needed' }));

      const token = d.live && isDriveDraft(d) ? driveReadToken(C) : null;
      if (token) token.catch(() => {});
      t.busy = true; t.err = '';
      t.prog = { steps: tiSteps(d, t), i: 0, frac: null, size: 0, failedAt: null, finished: false, note: '' };

      const P = t.prog;

        const box = tiQ(d.id, '.ti-prog');

        const tmp = document.createElement('div');

      };
      const step = (i, note) => { P.i = i; P.frac = null; P.note = note || ''; paint(); };
      const onUpload = p => {
        if (p.phase === 'hashing') { if (P.i !== 1 || P.note !== 'Getting ready') step(1, 'Getting ready'); return; }
        if (p.phase === 'uploading') {
          if (P.i !== 1 || P.note) { P.i = 1; P.note = ''; P.frac = p.fraction || 0; paint(); return; }
          P.frac = p.fraction || 0;
          const fill = tiQ(d.id, '[data-ti-fill]'), right = tiQ(d.id, '[data-ti-right]');
          if (fill) fill.style.width = Math.round(P.frac * 100) + '%'; else paint();
          if (right && P.size) right.textContent = `${(P.frac * P.size / 1048576).toFixed(1)} of ${(P.size / 1048576).toFixed(1)} MB`;
          return;

        if (isDriveDraft(d)) {
          if (!C || typeof C.googleDownload !== 'function') throw { code: 'not_configured' };
          const r = await C.googleDownload(await token, d.driveId, { as: t.type || 'pdf' });
          if (!r || !r.blob) throw { code: 'download_failed' };
          files = [{ blob: r.blob, name: String(r.name || d.name + '.' + (t.type || 'pdf')) }];

          // The type picked (PNG is a file per page; Word goes through our converter).

    function draftRowHTML(d) {

      const testItem = item.type === 'assessment';

      let can = !testItem, why = testItem ? 'Tests are turned in on Schoology' : '';
      if (d.live && d.drive && !(SUBMIT_LIVE && driveDownloadReady())) { can = false; why = why || 'Turning in from Averages.io is coming soon'; }
      if (d.live && !d.drive && !SUBMIT_LIVE) { can = false; why = why || 'Turning in from Averages.io is coming soon'; }

    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      // No name saved on this device (new device, or signed out with Sync
      // off): the account's own name from the sign-in, never a sample name
      // (2026-10-14; this used to fall back to "Martin" / "M").
      if (!profile || !profile.name || !String(profile.name).trim()) profile = Object.assign({}, profile, { name: window.__AVERAGES_NAME__ || '' });
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || '';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
  <script>
    // Back link (2026-10-01, per Martin: "where it returns to ... is always
    // wrong"). Every page records itself in a short per-tab trail; a page's
    // back link then says and goes to the page before it ("Back to AP
    // Chemistry Hub", "Back to Grades"...). With no trail (the page was
    // opened directly) the page's own default back link is left alone.
    (function () {
      const SELF = 'assignment.html';
      const KEY = 'averages_nav_trail';
      const here = SELF + location.search;
      const label = (document.title || '').replace(/^Averages\s*[—-]\s*/, '') || 'Assignment';
      let trail = [];
      try { trail = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch {}
      if (!Array.isArray(trail)) trail = [];
      const last = trail[trail.length - 1];
      if (last && last.href === here) last.label = label;                 // reload
      else if (trail.length > 1 && trail[trail.length - 2].href === here) { trail.pop(); trail[trail.length - 1].label = label; } // went back
      else trail.push({ href: here, label });
      trail = trail.slice(-20);
      try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch {}

      const btn = document.querySelector('.back-link');
      const prev = trail[trail.length - 2];
      if (!btn || !prev) return;
      const fresh = btn.cloneNode(false);          // same button, minus old click handlers
      fresh.removeAttribute('onclick');
      const icon = btn.querySelector('svg');
      if (icon) fresh.appendChild(icon.cloneNode(true));
      const text = document.createElement('span');
      text.textContent = 'Back to ' + prev.label;
      fresh.appendChild(text);
      fresh.addEventListener('click', () => { window.location.href = prev.href; });
      btn.replaceWith(fresh);
    })();
  </script>
</body>
</html>
