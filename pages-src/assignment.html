<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Averages — Assignment</title>
<link rel="stylesheet" href="https://use.typekit.net/gsk6off.css">
<style>
  /* ---------- Shared design system — copied verbatim from the other
     pages so this reads as the same app. See architecture-decisions.md
     re: promoting this to an actual shared stylesheet once there's a
     build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    /* A fifth lifecycle color for the "Returned" status — a teacher
       sends the submission back with a comment, usually asking for a
       revision, without necessarily finalizing a grade. Distinct from
       every existing use (red/amber/green already carry Missing/
       Submitted/Graded meanings, and violet isn't used anywhere else
       in this app), so a returned item can't be visually confused with
       an ordinary graded one. */
    --returned: #6a4fae;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* Declared so the browser themes ITS OWN chrome — scrollbars, the

     overscroll gutter, form controls — against this page rather than

     guessing. Without it Firefox drew a light-theme scrollbar over the

     dark canvas and tinted it (Martin saw it as pink on a blue

     background). LegacyPage's applyStoredTheme() updates both of these

     to match whatever background the user actually saved. */

  html {

    color-scheme: dark;

    background-color: #0c0c0e;

  }


  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh; /* fixed, not min -- body itself no longer scrolls */
    overflow: hidden; /* scrolling now happens inside .page (see below), so
      the scrollbar sits at the edge of the app's own window/card instead of
      out at the browser's outer edge, over the wallpaper margin */
    /* Neutral black instead of a baked-in accent gradient here —
       2026-09-11, per Martin. This is only ever visible for a split
       second on reload/navigation, before applyStoredTheme() (or this
       page's own appearance-reading script) sets the user's actual
       saved background over it. The old default was the sample
       red-orange gradient baked into this file, which read as a real
       glitch flashing in between pages; a neutral black reads as
       "still loading" instead, and matches the app's own Black
       preset (#0c0c0e) so it's not a color that appears nowhere else
       in the app. */
    background-color: #0c0c0e;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 40px 24px 100px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- both cards grow
      to their natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar — same .back-link convention as course-home.html/
     course-materials.html's "‹ Back" breadcrumb. ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 14px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 8px;
    gap: 12px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }

  /* ---------- Sub-line — "Class Name (Linked)" + "Gradebook (linked)"
     from the draft, laid out as a subtitle row. Both are now real links
     (Gradebook became one 2026-08-31 once gradebook.html existed to
     point at — previously styled visibly muted/inert, same convention
     as every other unbuilt nav destination in this app; that treatment
     is gone now that there's a real destination). ---------- */
  .assign-sub { display: flex; align-items: center; gap: 8px; margin: 4px 0 18px 2px; flex-wrap: wrap; }
  .assign-sub-link {
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.92);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
  }
  .assign-sub-link:hover { color: #fff; }
  .assign-sub-link:focus-visible { outline: none; text-decoration-thickness: 2px; }
  .assign-sub-dot { color: rgba(255,255,255,0.5); font-size: 0.8rem; }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- Two-panel layout — Description+Materials / Submissions,
     matching the draft's two equal-width white boxes side by side.
     This grid is capped to the space .page has left (flex: 1;
     min-height: 0) instead of .page growing to fit both cards' full
     height, which is what used to let their rounded corners scroll off
     screen. Fixed again 2026-09-04 (per Martin, "round corners on
     scroll on all pages"): the grid itself no longer scrolls — that
     just moved the same bug down one level, scrolling both cards as a
     single unit and cutting off THEIR rounded corners instead (found by
     scrolling .assign-detail-grid directly and screenshotting — the top
     of both cards went flat/square mid-scroll). align-items: stretch
     (not start) so each card fills the grid row's full height, and each
     .card is its own independently-windowed frame — fixed size, only
     .card-inner scrolls inside it — same pattern as every single-card
     page (calendar.html, home.html, etc.), just one level deeper. ---------- */
  .assign-detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);   /* minmax(0,…): a long file name can't push a card past the page edge (2026-10-04) */
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .assign-detail-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    padding: 6px;
  }
  .card-inner {
    padding: 22px 24px 24px;
  }
  .card-inner h2 {
    font-size: 0.92rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0 0 8px;
  }
  .card-inner h2.second { margin-top: 20px; }

  .assign-desc-text { font-size: 0.86rem; line-height: 1.55; color: var(--text-muted); margin: 0; }

  /* ---------- Attached / submitted file rows — same red/blue/orange
     PDF/DOCX/PPTX badge colors course-materials.html already uses, so
     a file reads consistently wherever it shows up in the app. ---------- */
  .material-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .material-row:last-child { border-bottom: none; }
  .material-badge {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .material-name { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 600; color: var(--text-dark); }
  .assign-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 4px 0; }

  /* ---------- View/Download buttons on an Attached Materials row
     (2026-08-29, per Martin's request) — no real file content exists in
     this mock (same as course-materials.html), so both open a small
     info modal rather than actually opening or downloading anything. ---------- */
  .material-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .material-icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--text-faint);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .material-icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .material-icon-btn:hover { background: var(--border); color: var(--text-dark); }

  /* ---------- Attached Materials file bars (2026-10-04, per Martin) — the
     landing page's Connections card: Edit in Canva, Save to cloud, Download.
     Canva's rules for the button: their icon inside it, always with text. ---------- */
  .material-row.file-bar { background: var(--panel-inner); border-radius: var(--window-radius-sm); padding: 8px 8px 8px 12px; margin-top: 8px; border-bottom: none; flex-wrap: wrap; row-gap: 8px; }
  .file-bar .material-name { flex: 1 1 0; min-width: 110px; font-weight: 700; overflow-wrap: anywhere; }   /* buttons drop to their own line only when the name would get squeezed */
  .file-bar .material-actions { margin-left: auto; align-items: center; gap: 4px; }

  /* Canva's guidelines: 8px around their icon inside a button. 40px tall, same as every other file-bar button. */
  .canva-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; box-sizing: border-box; padding: 8px 16px 8px 8px; border: 2px solid var(--border); border-radius: 999px; background: var(--panel-bg); color: var(--text-dark); font-family: inherit; font-size: 0.74rem; font-weight: 800; white-space: nowrap; cursor: pointer; transition: border-color 0.14s ease, transform 0.14s ease; }
  .canva-btn:hover { border-color: var(--text-dark); transform: translateY(-1px); }
  .canva-btn.drive-btn { padding: 8px 16px; }   /* text only, same 40px height */
  .draft-badge.drive { color: #fff; font-size: 0.5rem; font-weight: 900; letter-spacing: 0.02em; }
  .canva-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .file-bar .material-icon-btn { width: 40px; height: 40px; background: var(--panel-bg); color: var(--text-muted); }
  .file-bar .material-icon-btn:hover { background: var(--border); color: var(--text-dark); }
  .file-bar .material-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .tipwrap { position: relative; display: inline-flex; }
  .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 5; background: var(--text-dark); color: var(--panel-bg); border-radius: 7px; padding: 4px 8px; font-size: 0.68rem; font-weight: 800; white-space: nowrap; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 0.14s ease, visibility 0.14s; }
  .tip::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--text-dark); }
  .tipwrap:hover .tip, .tipwrap:focus-within .tip { opacity: 1; visibility: visible; }
  .file-menu { position: fixed; z-index: 300; min-width: 224px; max-width: calc(100vw - 16px); background: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 20px 50px -12px rgba(0,0,0,0.55); padding: 6px; }
  .file-menu[hidden] { display: none; }
  .file-menu-label { padding: 4px 10px 8px; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); overflow-wrap: anywhere; }
  .file-menu-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 10px; border: none; background: none; border-radius: 6px; font-family: inherit; font-size: 0.8rem; font-weight: 700; color: var(--text-dark); text-align: left; }
  .file-menu-item:disabled { color: var(--text-faint); cursor: default; }
  .soon { font-size: 0.66rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; }
  /* Add Submission: other places to add a file from */
  .upload-sources { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .upload-sources-label { font-size: 0.74rem; font-weight: 700; color: var(--text-muted); margin-right: 2px; }
  .upload-source { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-inner); font-family: inherit; font-size: 0.74rem; font-weight: 800; color: var(--text-faint); cursor: default; }
  .upload-source .canva-mark { width: 16px; height: 16px; opacity: 0.6; }
  @media (prefers-reduced-motion: reduce) { .canva-btn, .tip { transition: none; } .canva-btn:hover { transform: none; } }

  /* ---------- Drafts (2026-10-04): Canva edits waiting to be turned in ---------- */
  .drafts { margin-bottom: 22px; }
  /* Signed in (2026-10-05) */
  .drafts-note { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel-inner); font-size: 0.8rem; font-weight: 700; color: var(--text-dark); }
  .drafts-note[hidden] { display: none; }
  .material-link { color: var(--text-dark); text-decoration: underline; text-underline-offset: 2px; }
  .material-link:hover { color: var(--accent-dark); }
  .canva-btn[aria-busy="true"] { opacity: 0.7; cursor: progress; }
  .assign-retry { margin-left: 6px; border: none; background: none; padding: 0; font: inherit; font-style: normal; font-weight: 800; color: var(--accent-dark); text-decoration: underline; cursor: pointer; }
  .drafts[hidden] { display: none; }
  .drafts .material-row.file-bar:first-child { margin-top: 0; }
  .draft-badge { width: 36px; height: 36px; flex-shrink: 0; border-radius: 7px; background: var(--panel-bg); display: grid; place-items: center; }
  .draft-text { flex: 1 1 0; min-width: 110px; display: flex; flex-direction: column; gap: 1px; }
  .draft-text .material-name { flex: none; min-width: 0; }
  .draft-meta { font-size: 0.68rem; font-weight: 700; color: var(--text-faint); }
  .draft-submit { border: none; border-radius: 999px; background: var(--accent); color: #fff; font-family: inherit; font-size: 0.74rem; font-weight: 800; min-height: 40px; padding: 8px 18px; cursor: pointer; white-space: nowrap; }
  .draft-submit:hover { filter: brightness(1.08); }
  .draft-submit:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .draft-submit:disabled { background: var(--border); color: var(--text-faint); cursor: default; filter: none; }
  .draft-ghost { position: fixed; z-index: 400; margin: 0; pointer-events: none; box-shadow: 0 18px 40px -14px rgba(0,0,0,0.5); overflow: hidden; background: var(--panel-inner); border-radius: var(--window-radius-sm); }
  .draft-ghost .material-actions { transform-origin: right center; }
  .draft-row.leaving { overflow: hidden; }
  .material-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Shared small modal — Add Submission and the file-action
     (View/Download) info both use this one component. ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 60;
  }
  /* Same [hidden]-vs-display:flex specificity tie already caught
     elsewhere in this app (.edit-fab[hidden] on home.html,
     .view-toggle[hidden] on course-materials.html) — without this,
     the later `display: flex` rule above wins and the overlay stays
     visible (and intercepts clicks) even with `hidden` set. */
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  /* Wider variant for the Add Submission modal only (2026-09-04, per
     Martin: "make the assignment submission popup bigger") -- it now
     carries tabs, a multi-file list, and the Create tab's rich-text
     toolbar, so the default 380px (sized for the smaller file-info/
     submission-preview popups) felt cramped. Added/removed by
     openAddSubmissionModal()/closeModal() rather than changing
     .modal-box itself, so every other popup in this app stays the same
     size it's always been. Still just width:100% under 560px, so it
     shrinks to fit a narrow viewport the same as .modal-box normally does. */
  .modal-box.modal-box-lg { max-width: 560px; }
  /* Wraps the per-file rows in the Submission Preview popup (2026-09-04)
     -- just spacing, .material-row/.material-badge do the rest. */
  .modal-file-list { margin-top: 8px; }
  .modal-box h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 800; font-style: italic; color: var(--text-dark); }
  .modal-box p { margin: 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
  .modal-file-input {
    width: 100%;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  /* Add Submission — Upload/Create tabs, mirroring the real Schoology
     upload dialog Martin shared a screenshot of (2026-08-29). */
  .upload-tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    border-bottom: 1px solid var(--border);
  }
  .upload-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.76rem;
    color: var(--text-muted);
    padding: 6px 10px 9px;
    cursor: pointer;
  }
  .upload-tab:hover { color: var(--text-dark); }
  .upload-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .upload-tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 4px; }
  .upload-tab-panel { padding-top: 12px; }
  .upload-tab-desc { font-size: 0.76rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.45; }
  .modal-field-label {
    display: block;
    margin-top: 16px;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
  }
  .modal-textarea {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: var(--window-radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-inner);
    color: var(--text-dark);
    font-family: inherit;
    font-size: 0.78rem;
    line-height: 1.4;
    resize: vertical;
    min-height: 52px;
    box-sizing: border-box;
  }
  .modal-textarea:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .modal-textarea.answer-textarea { min-height: 78px; }
  /* Upload tab's file picker — the bare native <input type="file"> read
     ugly (browser-default button + "no file chosen" text with no styling
     control), so it's now a hidden input triggered by a real styled button,
     matching every other pill/rounded control in this modal (2026-08-29,
     per Martin's request). */
  .upload-picker { display: flex; align-items: center; gap: 10px; margin-top: 4px; min-width: 0; }
  .upload-picker-btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.76rem;
    color: var(--text-dark);
    cursor: pointer;
    flex-shrink: 0;
  }
  .upload-picker-btn:hover { background: var(--border); }
  .upload-picker-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .upload-picker-filename {
    flex: 1;
    min-width: 0;
    font-size: 0.78rem;
    color: var(--text-dark);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-picker-filename.empty { color: var(--text-faint); font-weight: 600; font-style: italic; }
  /* Required-file validation (2026-09-04, per Martin: "make sure that the
     user uploads at min 1 file in the upload tab") -- Submit is blocked
     on the Upload tab until a file is chosen; this note + the picker's
     red border only appear after that first failed attempt, not before
     the user has had a chance to pick a file. Same red as
     .profile-menu-item.signout elsewhere in the app. */
  .upload-picker.error .upload-picker-btn { border-color: #b6432f; }
  .upload-required-note { font-size: 0.74rem; font-weight: 700; color: #b6432f; margin: 6px 0 0; }
  .upload-required-note[hidden] { display: none; }
  /* List of files picked so far on the Upload tab (2026-09-04, per
     Martin: "let people upload multiple files") -- the native file input
     is `multiple` and re-opening the OS picker only ADDS to this list
     rather than replacing it (each dialog's selection is appended to
     `pickedFiles` in bindUploadTab, since the browser itself resets
     input.files to just the newest selection every time). Reuses
     .material-row's badge look (same file-type colors as everywhere else
     in this app) plus a remove button per row. */
  .upload-picked-list { margin-top: 4px; max-height: 168px; overflow-y: auto; }
  .upload-picked-list:empty { margin-top: 0; }
  .upload-picked-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .upload-picked-row:last-child { border-bottom: none; }
  .upload-picked-name { flex: 1; min-width: 0; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Create tab's rich-text toolbar (2026-08-30, per Martin's request — "the
     create section is just one textbox that has formatting options like
     google docs"). A lightweight execCommand-based editor: a block-style
     picker (Normal text / Heading 1-3) plus Bold/Italic/Underline/list/link
     buttons sit above a contenteditable answer area, replacing the old
     plain <textarea>. Front-end only, same as everywhere else in this
     mockup — nothing is actually saved as rich text on submit. */
  .rte-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--window-radius-sm) var(--window-radius-sm) 0 0;
    background: var(--panel-inner);
  }
  .rte-select {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-dark);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .rte-select:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .rte-divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
  .rte-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dark);
    font-family: inherit;
    font-size: 0.78rem;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .rte-btn b, .rte-btn i, .rte-btn u { pointer-events: none; }
  .rte-btn:hover { background: var(--border); }
  .rte-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .rte-btn.active { background: var(--accent); color: #fff; }
  .rte-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .rte-btn svg text { fill: currentColor; stroke: none; font-weight: 700; pointer-events: none; }
  .rte-editor {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    min-height: 110px;
    overflow-y: auto;
  }
  .rte-editor:empty::before { content: attr(data-placeholder); color: var(--text-faint); }
  .rte-editor h1 { font-size: 1.15rem; margin: 4px 0; }
  .rte-editor h2 { font-size: 1.02rem; margin: 4px 0; }
  .rte-editor h3 { font-size: 0.92rem; margin: 4px 0; }
  .rte-editor ul, .rte-editor ol { margin: 4px 0 4px 18px; padding: 0; }
  .rte-editor a { color: var(--accent); }
  .submission-comment {
    font-size: 0.76rem;
    color: var(--text-muted);
    font-style: italic;
    margin: 2px 0 0 34px;
  }
  /* Submission-history rows are clickable (2026-08-31, per Martin's
     request) — a row is a specific turn-in, so clicking it opens a
     small preview + that turn-in's own teacher comments, rather than
     showing feedback as one static block for the whole assignment. */
  .submission-row { cursor: pointer; border-radius: var(--window-radius-sm); border-bottom: none; padding: 10px 8px; }
  .submission-row:hover { background: var(--panel-inner); }
  .submission-row:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent-ring);
  }
  .submission-comment-icon {
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    color: var(--text-faint);
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* The student's own comment on a submission, shown inside the preview
     popup — same italic quote treatment as .submission-comment used to
     have inline, just without the row-indent margin since it now sits
     inside a modal instead of under a list row. */
  .own-comment-box {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.5;
    margin: 12px 0 0;
  }
  .own-comment-box .label {
    display: block;
    font-size: 0.66rem;
    font-weight: 800;
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal-btn {
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .modal-btn.secondary { background: var(--panel-inner); color: var(--text-dark); }
  .modal-btn.secondary:hover { background: var(--border); }
  .modal-btn.primary { background: var(--accent); color: #fff; }
  .modal-btn.primary:hover { background: var(--accent-dark); }
  .modal-btn.danger { background: #b6432f; color: #fff; }   /* same red as Sign out */
  .modal-btn.danger:hover { filter: brightness(1.08); }
  .modal-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Add Submission button + submission history — an
     assignment can be submitted more than once (2026-08-29, per
     Martin's request), so Submissions now shows a small history list
     (newest first) instead of a single fixed file, with this button
     always available to add another attempt regardless of status. ---------- */
  .add-submission-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 14px 8px 12px;
    font-weight: 800;
    font-size: 0.76rem;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-submission-btn:hover { background: var(--accent-dark); }
  .add-submission-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .submission-latest-tag {
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin-left: 8px;
  }

  /* ---------- Submissions panel ---------- */
  .submission-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--window-radius-md);
    margin-bottom: 16px;
  }
  .submission-banner .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .submission-banner-text { min-width: 0; }
  .submission-banner-label { font-weight: 800; font-size: 0.86rem; margin: 0; }
  .submission-banner-meta { font-weight: 600; font-size: 0.74rem; margin: 2px 0 0; opacity: 0.85; }
  .submission-banner.overdue { background: rgba(182, 67, 47, 0.14); }
  .submission-banner.overdue .dot { background: var(--grade-bad); }
  .submission-banner.overdue .submission-banner-label { color: var(--grade-bad); }
  .submission-banner.upcoming { background: var(--panel-inner); }
  .submission-banner.upcoming .dot { background: var(--text-faint); }
  .submission-banner.upcoming .submission-banner-label { color: var(--text-muted); }
  .submission-banner.submitted { background: rgba(166, 122, 34, 0.14); }
  .submission-banner.submitted .dot {
    background: var(--grade-mid);
    /* Submitted = grade pending. Fade in/out to read as "waiting", distinct from the
       static dots on every other status. */
    animation: pending-fade 1.8s ease-in-out infinite;
  }
  .submission-banner.submitted .submission-banner-label { color: var(--grade-mid); }

  @keyframes pending-fade {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .submission-banner.submitted .dot { animation: none; }
  }
  .submission-banner.graded { background: rgba(47, 125, 84, 0.14); }
  .submission-banner.graded .dot { background: var(--grade-good); }
  .submission-banner.graded .submission-banner-label { color: var(--grade-good); }
  .submission-banner.returned { background: rgba(106, 79, 174, 0.14); }
  .submission-banner.returned .dot { background: var(--returned); }
  .submission-banner.returned .submission-banner-label { color: var(--returned); }

  .submit-dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--window-radius-md);
    padding: 26px 18px;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.5;
  }
  .submit-dropzone svg { width: 24px; height: 24px; stroke: var(--text-faint); fill: none; stroke-width: 1.8; margin-bottom: 6px; }
  /* Solid panel background instead of the dashed upload border — this
     notice isn't a drop target, it's a redirect, so it shouldn't read as
     one (2026-09-03, quiz redirect notice). Accent-colored icon for the
     same reason: it's pointing somewhere, not waiting for a file.
     `> svg` (direct child only) so this doesn't also recolor/resize the
     smaller icon inside the Open in Schoology button below. */
  .quiz-redirect-notice { border: none; background: var(--panel-inner); }
  .quiz-redirect-notice > svg { stroke: var(--accent); }
  /* Real clickable redirect (2026-09-03, per Martin: "keep them in but
     ... can you put a redirect to schoology") — a working external link,
     not another disabled/"not available in this preview" placeholder,
     since Schoology itself is a real site this can actually open.
     Same pill shape/weight as .add-submission-btn so it reads as the
     one other real action-button on this panel. */
  .quiz-redirect-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: 0.76rem;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    margin-top: 12px;
  }
  .quiz-redirect-btn:hover { background: var(--accent-dark); }
  .quiz-redirect-btn svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.4; margin-bottom: 0; }

  .feedback-box {
    background: var(--panel-inner);
    border-radius: var(--window-radius-md);
    padding: 12px 14px;
    margin-top: 16px;
  }
  .feedback-box p { margin: 0; font-size: 0.84rem; font-style: italic; color: var(--text-dark); line-height: 1.5; }
  .feedback-box .attrib { display: block; margin-top: 8px; font-size: 0.72rem; font-weight: 800; font-style: normal; color: var(--text-faint); }
  /* A comment on a Returned assignment reuses the same quote-box shape
     as graded Teacher Feedback, but with a violet accent border and a
     small label so it never reads as an actual final-grade comment. */
  .feedback-box.returned { border-left: 4px solid var(--returned); }
  .feedback-box-label {
    display: block;
    font-size: 0.66rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--returned);
    margin-bottom: 6px;
  }

  /* ---------- Bottom nav — verbatim from every other page ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  /* ---------- "More" overflow (2026-10-01, per Martin: "if the text has
     to get ... we should add a more button on the far right side with a
     list of the other options"). Labels never truncate: when they would,
     the rightmost pages move into the More menu instead. ---------- */
  .nav-link[hidden], .nav-more[hidden], .nav-more-menu[hidden] { display: none; }
  /* While the More menu is open the whole bar sits above everything else on
     the page (sticky headers, pop-ups, the edit button go up to z-index 90),
     so the menu is never drawn underneath them. */
  .app-nav.more-open { z-index: 1000; }
  .nav-more {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 0 0 auto;
    position: relative;

  .nav-more:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 20px;
    min-width: 168px;

    display: flex;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-more-item:hover, .nav-more-item:focus-visible { outline: none; color: var(--text-dark); box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  .nav-more-item.active { color: var(--text-dark); }
  .nav-more-item.active span { position: relative; display: inline-block; padding-bottom: 6px; margin-bottom: -6px; }
  .nav-more-item.active span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  /* Labels sit centered in the bar; the active page is underlined in the
     accent color instead of marked with a dot (2026-10-01, per Martin). */
  .app-nav-inner .nav-link, .app-nav-inner .nav-more { justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 10px; }
  .app-nav-inner .nav-link .dot, .app-nav-inner .nav-more .dot { display: none; }
  .app-nav-inner .nav-link .label, .app-nav-inner .nav-more .label { position: relative; padding: 6px 0; }
  .app-nav-inner .nav-link.active .label::after, .app-nav-inner .nav-more.has-active .label::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 999px; background: var(--accent); }
  @media (max-width: 520px) {
    .nav-more { padding: 10px 12px 8px; }
    .nav-more::before { top: 10px; bottom: 10px; }
    .app-nav-inner .nav-link, .app-nav-inner .nav-more { padding-top: 8px; padding-bottom: 8px; }
    .nav-more .label { font-size: 0.58rem; }
  }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
  /* Emoji icons (2026-10-01, per Martin): icons that show a thing are emoji;
     buttons and action icons stay line icons. */
  /* Each emoji is an inline SVG sized by font-size (1em box), so it is
     exactly as big as its box and sits dead center. The svg rule undoes
     the line-icon styles (stroke, fill:none, opacity) that the parent
     rows still set for their other icons. */
  .emo { display: inline-block; width: 1em; height: 1em; line-height: 0; flex-shrink: 0; vertical-align: middle; }
  .emo svg { display: block; width: 100%; height: 100%; fill: initial; stroke: none; opacity: 1; }

</style>

  <script>
    // Potato PC Mode on every page (2026-10-04, per Martin). The saved
    // setting turns off all CSS animations and transitions, makes animate()
    // calls and smooth scrolling instant, and drops the slanted page title.
    // Same code as app/lib/theme-boot.ts, which runs it before first paint in
    // the app; this copy covers the preview and pages theme-boot skips.
    (function () {
    var POTATO_CSS = "body.potato-mode,body.potato-mode *,body.potato-mode *::before,body.potato-mode *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;filter:none!important;text-shadow:none!important}html:has(body.potato-mode){scroll-behavior:auto!important}body.potato-mode,body.potato-mode *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif!important}body.potato-mode h1.title{font-style:normal!important;transform:none!important}body.potato-mode .trend.has-popup:focus-visible{outline:2px solid currentColor;outline-offset:2px}";
    function potatoOn() { return !!(document.body && document.body.classList.contains("potato-mode")); }
    function applyPotato() {
      var on = false;
      try { on = (JSON.parse(localStorage.getItem("schoolagy_settings_options") || "{}") || {}).potatoMode === true; } catch (e) {}
      if (document.body) document.body.classList.toggle("potato-mode", on);
      if (!document.getElementById("potatoStyle")) {
        var st = document.createElement("style");
        st.id = "potatoStyle";
        st.textContent = POTATO_CSS;
        (document.head || document.documentElement).appendChild(st);
      }
      var EP = window.Element && Element.prototype;
      if (EP && !EP.__potatoPatched) {
        EP.__potatoPatched = true;
        var anim = EP.animate;
        if (anim) EP.animate = function (frames, opts) {
          if (potatoOn()) opts = (typeof opts === "number" || opts == null) ? { duration: 0 } : Object.assign({}, opts, { duration: 0, delay: 0, endDelay: 0, iterations: 1 });
          return anim.call(this, frames, opts);
        };
        var siv = EP.scrollIntoView;
        if (siv) EP.scrollIntoView = function (arg) {
          if (potatoOn() && arg && typeof arg === "object") arg = Object.assign({}, arg, { behavior: "auto" });
          return siv.call(this, arg);
        };
        ["scrollTo", "scrollBy"].forEach(function (name) {
          [EP, window].forEach(function (target) {
            var fn = target[name];
            if (!fn) return;
            target[name] = function (a, b) {
              if (potatoOn() && a && typeof a === "object") a = Object.assign({}, a, { behavior: "auto" });
              return b === undefined ? fn.call(this, a) : fn.call(this, a, b);
            };
          });
        });
      }
    }
      applyPotato();
      window.addEventListener('storage', function (e) { if (e.key === 'schoolagy_settings_options') applyPotato(); });
    })();

    // Bottom nav "More" overflow. Shows as many pages as fit without
    // cutting a label off ("Cour..."); the rest go in the More menu.
    // The current page always stays in the bar.
    (function () {
      const nav = document.querySelector('.app-nav');
      const inner = nav && nav.querySelector('.app-nav-inner');
      const more = document.getElementById('navMore');
      const menu = document.getElementById('navMoreMenu');
      if (!inner || !more || !menu) return;
      const links = Array.from(inner.querySelectorAll('.nav-link'));

      const cut = () =>
        inner.scrollWidth > inner.clientWidth + 1 ||
        links.some(l => !l.hidden && l.querySelector('.label').scrollWidth > l.querySelector('.label').clientWidth + 1);

      function fit() {
        closeMenu();
        links.forEach(l => { l.hidden = false; });
        more.hidden = true;
        if (!cut()) return;
        more.hidden = false;
        // Hide from the right, but never the current page.
        for (let i = links.length - 1; i >= 1 && cut(); i--) {
          if (!links[i].classList.contains('active')) links[i].hidden = true;
        }
        const hidden = links.filter(l => l.hidden);
        more.classList.toggle('has-active', hidden.some(l => l.classList.contains('active')));
        menu.textContent = '';
        hidden.forEach(l => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'nav-more-item' + (l.classList.contains('active') ? ' active' : '');
          item.setAttribute('role', 'menuitem');
          const text = document.createElement('span'); text.textContent = l.querySelector('.label').textContent; item.appendChild(text);
          item.addEventListener('click', () => { closeMenu(); l.click(); });
          menu.appendChild(item);
        });
      }

      function openMenu() {
        const navBox = nav.getBoundingClientRect();
        const innerBox = inner.getBoundingClientRect();
        menu.style.right = Math.max(0, navBox.right - innerBox.right) + 'px';
        menu.hidden = false;
        nav.classList.add('more-open');
        more.setAttribute('aria-expanded', 'true');
        const first = menu.querySelector('.nav-more-item');
        if (first) first.focus();
      }
      function closeMenu() {
        if (menu.hidden) return;
        menu.hidden = true;
        nav.classList.remove('more-open');
        more.setAttribute('aria-expanded', 'false');
      }

      more.addEventListener('click', e => {
        e.stopPropagation();
        menu.hidden ? openMenu() : closeMenu();
      });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) { closeMenu(); more.focus(); }
        if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(menu.querySelectorAll('.nav-more-item'));
          const i = items.indexOf(document.activeElement);
          const next = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
          if (next) { e.preventDefault(); next.focus(); }
        }
      });

      fit();
      if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
      else window.addEventListener('resize', fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    })();
  </script>


  <div class="modal-overlay" id="modalOverlay" hidden>

  <script>
    // ------------------------------------------------------------------
    // Shared appearance (accent + background) — 2026-09-08, per Martin:
    // "wallpapers + accent colors don't save across pages." Settings'
    // Appearance section (and onboarding's Theme step) are the only
    // writers of schoolagy_appearance; every other real app page,
    // including this one, applies whatever's saved there, read-only, on
    // its own load — same shared-localStorage-record pattern already
    // used for schoolagy_dark_mode/schoolagy_profile.
    // ------------------------------------------------------------------
    (function () {
      function darken(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, ((n >> 16) & 255) * (1 - amount));
        const g = Math.max(0, ((n >> 8) & 255) * (1 - amount));
        const b = Math.max(0, (n & 255) * (1 - amount));
        return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      }
      function applyAppearance() {
        let saved = null;
        try {
          const raw = localStorage.getItem('schoolagy_appearance');
          if (raw) saved = JSON.parse(raw);
        } catch {}
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.accent) {
          root.setProperty('--accent', saved.accent);
          root.setProperty('--accent-dark', saved.accentDark || darken(saved.accent, 0.22));
        }
        if (saved.background === 'white') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#f4f4f6';
        } else if (saved.background === 'black') {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#0c0c0e';
        } else if (saved.background) {
          document.body.style.backgroundImage = `url("${saved.background}")`;
          document.body.style.backgroundColor = '';
        }
      }
      applyAppearance();
      window.addEventListener('storage', e => {
        if (e.key === 'schoolagy_appearance') applyAppearance();
      });
    })();

    // ------------------------------------------------------------------
    // Sample data — same six courses/colors/teachers as courses.html,
    // and the same OVERDUE/UPCOMING/HISTORY/SUBMITTED values
    // assignments.html uses, so a given assignment's title/type/date/
    // score/status match no matter which page it's viewed from.
    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    // Course customization persistence — added 2026-09-08. Renaming,
    // recoloring, or reordering a course (in home.html's Customize editor
    // or courses.html's Reorder tool — the only places that WRITE these)
    // used to be invisible everywhere else, since every page just
    // re-generated its own hardcoded COURSES array from scratch on load.
    // schoolagy_course_custom holds per-course name/color overrides
    // (object keyed by course id, only actually-customized courses
    // present); schoolagy_course_order holds a full custom ordering of
    // course ids (array), written only once the user has actually
    // reordered. This page only READS both — applyCourseCustomizationsInPlace()
    // is called right after the raw array literal below, mutating COURSES
    // in place, so it's already the customized/reordered version before
    // anything on this page ever renders it. Same defensive
    // try/catch-per-key style as AVERAGES_DARK_MODE_KEY in settings.html.
    // ------------------------------------------------------------------
    const AVERAGES_COURSE_CUSTOM_KEY = 'schoolagy_course_custom';
    const AVERAGES_COURSE_ORDER_KEY = 'schoolagy_course_order';
    function loadCourseCustom() {
      try {
        const raw = localStorage.getItem(AVERAGES_COURSE_CUSTOM_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return {};
    }
    function loadCourseOrder() {
      try {
        const raw = localStorage.getItem(AVERAGES_COURSE_ORDER_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return null;
    }
    // Subject table (2026-10-01, per Martin): each course gets a color that
    // fits its subject, picked from its name. First match wins, so specific
    // subjects come before broad ones ("Computer Science" before "Science",
    // "Physical Education" before "Physics"). A color the student picked in
    // the course's info pop-up still wins over this. No match keeps the
    // course's own color. All colors pass 4.5:1 with white text.
    const COURSE_SUBJECTS = [
      [/\bchem/, '🧪', '#1b7f67'],
      [/\bbio|anatom|physiolog/, '🧬', '#387f33'],
      [/\bphysical ed|(^|[^a-z])p\.?e\.?($|[^a-z])|fitness|\bweight/, '🏃', '#c2562b'],
      [/\bhealth/, '🩺', '#c0404a'],
      [/\bphysics/, '⚛️', '#4a56b8'],
      [/astronom/, '🔭', '#3b3f8f'],
      [/environment|\bearth|geolog/, '🌍', '#2f7f63'],
      [/robotic/, '🤖', '#55697d'],
      [/computer|programming|coding|\bcs[ap]?\b|software/, '💻', '#2d6f8f'],
      [/engineer/, '⚙️', '#6a6478'],
      [/government|civics|politic/, '🏛️', '#2f4f8a'],
      [/econ/, '📈', '#2e7d4f'],
      [/psych/, '🧠', '#9a4583'],
      [/geograph/, '🗺️', '#4c7a5a'],
      [/histor/, '📜', '#9a5a2a'],
      [/statistic|\bstats?\b/, '📊', '#2f72a8'],
      [/geometr|\btrig/, '📐', '#3e64b0'],
      [/calc|algebra|\bmath/, '🧮', '#2f5fb3'],
      [/english|literature|\blit\b|writing|composition|language arts|reading/, '📖', '#a63a4f'],
      [/spanish|french|german|chinese|mandarin|japanese|korean|latin|italian|\basl\b|sign language|language/, '🗣️', '#7a4fae'],
      [/theat|drama/, '🎭', '#a3364b'],
      [/music|band|choir|orchestra|chorus/, '🎵', '#6b48a8'],
      [/photo/, '📷', '#4f5d6e'],
      [/culinary|cooking|\bfoods?\b|nutrition/, '🍳', '#b05a26'],
      [/\barts?\b|drawing|painting|ceramic|sculpt|design/, '🎨', '#b03f7a'],
      [/business|marketing|accounting|financ/, '💼', '#3d5f6e'],
      [/journalism|yearbook|newspaper/, '📰', '#5c5c6e'],
      [/science/, '🔬', '#2b7b8c'],
    ];
    function courseSubject(name) {
      const n = String(name || '').toLowerCase();
      return COURSE_SUBJECTS.find(([re]) => re.test(n)) || null;
    }

    function applyCourseCustomizationsInPlace(courses) {
      const custom = loadCourseCustom();
      // Mutates each course object's own fields in place (never clones,
      // never reassigns `courses` itself) so the `const COURSES = [...]`
      // literal a few lines below stays exactly that — a literal array —
      // for scripts/port-pages.mjs's data-overrides transform to match
      // and rewrite for live Schoology data. This function only edits
      // the array's contents/order after that binding already exists.
      courses.forEach(c => {
        const subject = courseSubject(c.name);
        if (subject) c.color = subject[2];
        Object.assign(c, custom[c.id] || {});
      });
      const order = loadCourseOrder();
      if (order && order.length) {
        const byId = new Map(courses.map(c => [c.id, c]));
        const ordered = order.filter(id => byId.has(id)).map(id => byId.get(id));
        // A course not present in the saved order (e.g. added to the demo
        // data after the order was saved) still shows up, just appended.
        courses.forEach(c => { if (!order.includes(c.id)) ordered.push(c); });
        courses.splice(0, courses.length, ...ordered);
      }
    }
    const COURSES = [
      { id: 'apchem', name: 'AP Chemistry', color: '#a67a22', teacher: 'Mr. Alvarez' },
      { id: 'algebra2', name: 'Algebra II', color: '#5b6ea3', teacher: 'Ms. Whitfield' },
      { id: 'english10', name: 'English 10', color: '#6b8f5e', teacher: 'Mr. Cho' },
      { id: 'ushistory', name: 'U.S. History', color: '#a15c4f', teacher: 'Mr. Bennett' },
      { id: 'spanish3', name: 'Spanish III', color: '#8a6ba1', teacher: 'Ms. Ortiz' },
      { id: 'pe', name: 'PE', color: '#4f8c8a', teacher: 'Coach Reyes' },
    ];
    applyCourseCustomizationsInPlace(COURSES);
    function findCourse(id) { return COURSES.find(c => c.id === id); }

    /* Assignment titles, teacher feedback/comments and attached or submitted
       FILE NAMES all arrive from Schoology (and the title can also come
       straight off this page's own ?title= query param), so interpolating any
       of them raw into innerHTML lets `<img src=x onerror=...>` run in this
       app's own origin — everything data-derived below goes through here
       first. String() rather than assuming a string, since scores arrive as
       numbers. Do NOT wrap values that are themselves markup: the *_ICON
       constants, materialRowHTML()/submissionHistoryHTML() output, and the
       feedbackHtml/ownCommentHtml fragments. Verified by verify/xss-test.mjs. */
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
      ));
    }

    const TYPE_LABEL = { assignment: 'Assignment', discussion: 'Discussion', assessment: 'Quiz' };

    const HISTORY = {
      apchem: { points: [72, 79, 84, 88, 90], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'], titles: [['Intro Lab Safety Quiz', 'assessment'], ['Stoichiometry Problem Set', 'assignment'], ['Molarity Discussion', 'discussion'], ['Gas Laws Test', 'assessment'], ['Lab Report #3', 'assignment']] },
