  .cmdk-in input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 17px; font-weight: 700; }
  .cmdk-in input::placeholder { color: var(--muted); }
  .cmdk-res { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .cmdk-res .lbl { padding: 8px 12px 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cmdk-res .mi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; text-align: left; color: var(--ink); font-weight: 700; }
  .cmdk-res .mi:hover, .cmdk-res .mi.sel { background: var(--panel); }
  .cmdk-res .mi .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cmdk-res .mi b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-res .mi small { color: var(--muted); font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-res .mi > svg.i { width: 20px; height: 20px; color: var(--ink-2); margin: 0 8px; }
  .cmdk-res mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .cmdk-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-weight: 700; }
  .cmdk-foot { display: flex; gap: 16px; padding: 8px 16px 12px; font-size: 12px; font-weight: 700; color: var(--muted); border-top: 2px solid var(--panel); flex: none; }
  .cmdk-foot kbd { font-size: 11px; line-height: 20px; padding: 0 4px; }
  @media (hover: none) { .cmdk-foot { display: none; } }

  @media (max-width: 680px) {
    .cmdk-scrim { padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
    .hub-h { flex-wrap: wrap; gap: 16px; }
    .hub-logo { width: 64px; height: 64px; border-radius: 16px; }
    .hub-logo svg { width: 38px; height: 38px; }
    .hub-acts { width: 100%; }
    .hub-acts .btn { flex: 1; }
    .hub-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
    .hub-tab { flex: none; }
    .pins { grid-template-columns: minmax(0, 1fr); }
    .fwrap { flex: 1 1 auto; }
    .fbtn { flex: 1; }
    .fmenu { left: 0; right: auto; }
    .mwrap.det { grid-template-columns: minmax(0, 1fr); }
    .mwrap.det .mdet { order: -1; position: static; }
    .vsw { width: 100%; }
    .hub-acts { flex-wrap: wrap; }
    .hub-acts .pill.sync { flex: 1 1 100%; justify-content: center; margin: 0; }
    .vbtn { flex: 1; justify-content: center; }
    .mrow { align-items: flex-start; }
  }

  /* ---------- Calendar page ---------- */
  @media (prefers-reduced-motion: no-preference) { body:not(.potato-mode) .hub-logo.cal-logo:hover { transform: scale(1.05); } }
  .cal-h .hub-meta { gap: 8px 20px; }
  .cal-h .hub-meta .gm { gap: 8px; }
  .cal-h .hub-meta .gm[data-skel] { color: color-mix(in srgb, var(--muted) 55%, transparent); }
  .cal-h .hub-meta b { color: var(--ink); font-weight: 900; font-variant-numeric: tabular-nums; }
  .cal-h .hub-meta .gm.bad, .cal-h .hub-meta .gm.bad b { color: var(--bad); }
  .cal-main, .cal-rail { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  @media (min-width: 1101px) { .wrap { grid-template-columns: minmax(0, 1fr) clamp(320px, 23vw, 400px); } }
  .cm-d { padding: 8px 4px; }
  .as-ddb em { display: inline-grid; place-items: center; box-sizing: border-box; height: 20px; min-width: 20px; padding: 0 8px; border-radius: 10px; background: var(--inner); color: var(--ink-2); } .as-ddb em canvas.ink { display: block; }
  .as-ddb:hover em, .as-ddb[aria-expanded="true"] em { background: var(--panel); }
  .as-ddb.on em { background: color-mix(in srgb, var(--c) 22%, var(--field)); color: var(--ink); }
  :is(.cal-bar, .cal-top) .mp-types { background: var(--field); }
  :is(.cal-bar, .cal-top) .mp-types .mp-pill { background: var(--ink); box-shadow: none; }
  :is(.cal-bar, .cal-top) .mp-types button[aria-pressed="true"] { color: #ffffff; }
  :is(.cal-bar, .cal-top) .mp-types:not(.ready) button[aria-pressed="true"] { background: var(--ink); }
  :is(.cal-bar, .cal-top) .mp-types button em { font-style: normal; margin-left: 8px; font-variant-numeric: tabular-nums; opacity: .7; }
  /* which class: one button that opens a short list, instead of a chip for every class */
  .as-dd { position: relative; flex: none; }
  .as-ddb { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 8px; border-radius: 12px; background: var(--field); font-size: 14px; font-weight: 800; color: var(--ink); white-space: nowrap; transition: background-color .15s ease; }
  .as-ddb.all { padding-left: 12px; }
  .as-ddb:hover, .as-ddb[aria-expanded="true"] { background: var(--inner); }
  .as-ddb.on { background: color-mix(in srgb, var(--c) 14%, var(--field)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
  .as-ddb.on:hover, .as-ddb.on[aria-expanded="true"] { background: color-mix(in srgb, var(--c) 22%, var(--field)); }
  .as-ddb .badge, .as-opt .badge { width: 28px; height: 28px; border-radius: 9px; }
  .as-ddb .badge svg, .as-opt .badge svg { width: 17px; height: 17px; }
  .as-ddb em, .as-opt em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .as-ddb > svg.i { width: 16px; height: 16px; color: var(--muted); transform: rotate(90deg); transition: transform .2s ease; }
  .as-ddb[aria-expanded="true"] > svg.i { transform: rotate(-90deg); }
  .as-menu { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: min(280px, calc(100vw - 32px)); padding: 8px; border-radius: 16px; background: var(--field); box-shadow: var(--pop-shadow); display: flex; flex-direction: column; gap: 2px; }
  .as-menu.in { animation: asMenuIn .16s cubic-bezier(.2, .8, .2, 1) backwards; }
  @keyframes asMenuIn { from { opacity: 0; transform: translateY(-4px); } }
  .as-opt { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px 0 8px; border-radius: 10px; text-align: left; font-size: 14px; font-weight: 800; color: var(--ink); }
  .as-opt:hover, .as-opt:focus-visible { background: var(--panel); outline: none; }
  .as-opt[aria-selected="true"] { background: color-mix(in srgb, var(--c, var(--ink)) 12%, var(--panel)); }
  .as-opt .badge { flex: none; }
  .as-opt > span:not(.badge):not(.as-all) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .as-opt .as-all { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--panel); color: var(--ink-2); flex: none; }
  .as-opt .as-all svg.i { width: 16px; height: 16px; }
  .as-opt > svg.i { width: 16px; height: 16px; color: var(--ink); flex: none; }
  .as-menu hr { margin: 4px 8px; border: 0; border-top: 2px solid var(--panel); }
  .potato-mode .as-menu.in, .potato-mode .as-ddb > svg.i { animation: none; transition: none; }
  @media (prefers-reduced-motion: reduce) { .as-menu.in { animation: none; } .as-ddb > svg.i { transition: none; } }

  /* toolbar: where you are, which view, then what to show */
  .cal-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  .cal-nav { display: flex; align-items: center; gap: 4px; }
  .cal-nav .ibtn { background: var(--field); }
  .cal-nav .ibtn:hover { background: var(--inner); }
  .cal-nav .ibtn svg.i { width: 18px; height: 18px; }
  .cal-nav .ibtn:disabled { color: var(--inner); cursor: default; } .cal-nav .ibtn:disabled:hover { background: var(--field); }
  .cal-lbl { margin: 0 8px; font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: -.01em; white-space: nowrap; min-width: 0; }
  .cal-lbl small { margin-left: 4px; font-size: 15px; font-weight: 800; font-style: normal; color: var(--muted); letter-spacing: 0; }
  .cal-today { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--field); font-size: 14px; font-weight: 800; color: var(--ink); }
  .cal-today:hover { background: var(--inner); }
  .cal-today[aria-disabled="true"] { color: var(--muted); }
  .cal-top .mp-types { margin-left: auto; background: var(--field); }
  .cal-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  .cal-bar .find { flex: 1 1 220px; }
  .cal-bar .find input { background: var(--field); padding-right: 44px; }
  .find .cal-x { position: absolute; right: 4px; top: 50%; width: 32px; height: 32px; margin-top: -16px; display: grid; place-items: center; border-radius: 9px; color: var(--ink-2); }
  .find .cal-x:hover { background: var(--inner); color: var(--ink); }
  .find .cal-x svg.i { position: static; transform: none; width: 16px; height: 16px; color: inherit; pointer-events: none; }
  .find .cal-x[hidden] { display: none; }
  .cal-body { position: relative; }

  /* an event: a small chip in the class's color, with its time first */
  /* an item on the calendar, like Apple's Calendar: work that's due is a line with a colored bar and its time on the
     right; an event (from a teacher or the school) is a filled pill with an icon, in its class's color */
  .ce { --c: #6e7088; display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--ink); text-align: left; white-space: nowrap; overflow: hidden; transition: background-color .15s ease; }
  .ce > span:not(.ce-ic) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ce > small { flex: none; font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ce.cdue:hover { background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
  .ce.cdue > i { flex: none; width: 4px; height: 14px; border-radius: 2px; background: var(--c); }
  .ce.cdue { background: transparent; }
  .ce.cdue.miss > span, .ce.cdue.miss > small { color: var(--bad); }
  .ce.cdue.done > span { color: var(--muted); }
  .ce.cdue.done > i { background: color-mix(in srgb, var(--c) 45%, var(--field)); }
  .ce.cpill { padding: 0 8px 0 4px; border-radius: 12px; background: color-mix(in srgb, var(--c) 20%, var(--field)); color: color-mix(in srgb, var(--c) 72%, var(--ink)); font-weight: 800; }
  .ce.cpill:hover { background: color-mix(in srgb, var(--c) 30%, var(--field)); }
  .ce.cpill > small { color: color-mix(in srgb, var(--c) 60%, var(--muted)); }
  .ce-ic { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #ffffff; }
  .ce .ce-ic svg.i { width: 11px; height: 11px; stroke-width: 2.25; }
  .ce .ce-ic svg.i.fill { fill: currentColor; stroke: none; }
  .ce.cdue[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 16%, var(--field)); box-shadow: inset 0 0 0 2px var(--c); }
  .ce.cpill[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 32%, var(--field)); box-shadow: inset 0 0 0 2px var(--c); }
  .ce-more { display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; flex: none; padding: 0 8px; border-radius: 7px; background: color-mix(in srgb, var(--inner) 55%, var(--field)); font-size: 12px; font-weight: 800; color: var(--ink-2); text-align: left; white-space: nowrap; overflow: hidden; transition: background-color .15s ease; }
  .ce-more .mk { display: flex; flex: none; }
  .ce-more .mk i { width: 8px; height: 8px; border-radius: 4px; background: var(--c); box-shadow: 0 0 0 1.5px var(--field); }
  .ce-more .mk i + i { margin-left: -4px; }
  .ce-more em { font-style: normal; color: var(--bad); }
  .ce-more:hover, .ce-more[aria-expanded="true"] { background: var(--inner); color: var(--ink); }

  /* month */
  .cm-wd { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 4px; }
  .cm-wd span { padding: 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cm { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cm-d { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 150px; padding: 8px; border-radius: 12px; background: var(--field); }
  .cm-d.we { background: color-mix(in srgb, var(--field) 55%, var(--panel)); }
  .cm-d.out { background: color-mix(in srgb, var(--field) 45%, transparent); }
  .cm-d.off { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--inner) 70%, var(--field)) 0 6px, var(--field) 6px 12px); }
  .cm-n { display: flex; align-items: center; justify-content: space-between; gap: 4px; height: 26px; padding: 0 0 0 2px; }
  .cm-n b { display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 13px; font-size: 13px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .cm-d.out .cm-n b { color: var(--muted); }
  .cm-d.today .cm-n b { background: var(--accent); color: #ffffff; }
  .cm-n small { font-size: 10px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cm-d.flash { animation: cmFlash 1.1s ease; }
  @keyframes cmFlash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
  .potato-mode .cm-d.flash { animation: none; }
  @media (prefers-reduced-motion: reduce) { .cm-d.flash { animation: none; } }
  .cm-dots { display: none; }
  .cm-d.out .ce { opacity: .8; }

  /* week: a column for each day, with everything on it */
  .cw { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .cw-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 420px; padding: 8px; border-radius: 14px; background: var(--field); }
  .cw-col.we { background: color-mix(in srgb, var(--field) 55%, var(--panel)); }
  .cw-col.off { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--inner) 70%, var(--field)) 0 6px, var(--field) 6px 12px); }
  .cw-h { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px 8px; }
  .cw-h small { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cw-h b { display: grid; place-items: center; min-width: 28px; height: 28px; padding: 0 4px; border-radius: 14px; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .cw-col.today .cw-h b { background: var(--accent); color: #ffffff; }
  /* week: the same two looks as the month. Events (pills) sit at the top of the day; what's due is a line under them */
  .cw-ev { --c: #6e7088; display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 8px 8px 8px 4px; border-radius: 10px; text-align: left; color: var(--ink); transition: background-color .15s ease; }
  .cw-ev .tx { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .cw-ev .tx > b { font-size: 13px; font-weight: 800; line-height: 1.3; overflow-wrap: break-word; hyphens: auto; }
  .cw-ev .tx > small { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cw-ev > small { flex: none; padding-top: 1px; font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cw-ev.cdue:hover { background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
  .cw-ev.cdue > i { flex: none; width: 4px; align-self: stretch; min-height: 16px; border-radius: 2px; background: var(--c); }
  .cw-ev.cdue.miss .tx > b, .cw-ev.cdue.miss .tx > small { color: var(--bad); }
  .cw-ev.cdue.done .tx > b { color: var(--muted); }
  .cw-ev.cdue.done > i { background: color-mix(in srgb, var(--c) 45%, var(--field)); }
  .cw-ev.cdue[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 16%, var(--field)); box-shadow: inset 0 0 0 2px var(--c); }
  .cw-ev.cpill { flex-direction: column; gap: 4px; padding: 8px 12px 8px 8px; border-radius: 14px; background: color-mix(in srgb, var(--c) 20%, var(--field)); }
  .cw-ev.cpill .cw-top { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; font-size: 11px; font-weight: 800; color: color-mix(in srgb, var(--c) 60%, var(--muted)); white-space: nowrap; }
  .cw-ev.cpill .tx { padding-left: 2px; width: 100%; }
  .cw-ev.cpill:hover { background: color-mix(in srgb, var(--c) 30%, var(--field)); }
  .cw-ev.cpill .tx > b { color: color-mix(in srgb, var(--c) 72%, var(--ink)); }
  .cw-ev.cpill .tx > small { color: color-mix(in srgb, var(--c) 55%, var(--muted)); }
  .cw-ev.cpill .ce-ic { width: 22px; height: 22px; }
  .cw-ev.cpill .ce-ic svg.i { width: 13px; height: 13px; stroke-width: 2.25; }
  .cw-ev.cpill[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 32%, var(--field)); box-shadow: inset 0 0 0 2px var(--c); }
  .cw-none { padding: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }

  /* year: twelve small months, a dot for each class with something that day */
  .cy { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .cy-m { padding: 12px 12px 12px; border-radius: 14px; background: var(--field); min-width: 0; }
  .cy-m.now { box-shadow: inset 0 0 0 2px var(--inner); }
  .cy-t { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%; padding: 4px 8px; margin: 0 0 4px; border-radius: 8px; text-align: left; color: var(--ink); }
  .cy-t:hover { background: var(--panel); }
  .cy-t b { font-size: 15px; font-weight: 900; font-style: italic; }
  .cy-t small { font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cy-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; }
  .cy-g > span.wd { height: 18px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: var(--muted); }
  .cy-d { position: relative; height: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 7px; font-size: 11px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  button.cy-d:hover { background: var(--panel); }
  .cy-d.off { color: var(--muted); }
  .cy-d.today { background: var(--accent); color: #ffffff; }
  .cy-d.today i { box-shadow: 0 0 0 1px #ffffff; }
  .cy-d .dots { display: flex; gap: 2px; height: 4px; }
  .cy-d i { width: 4px; height: 4px; border-radius: 2px; background: var(--c); }

  /* search: every match, by date */
  .cs-day { margin: 0 0 12px; }
  .cs-day h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px 4px; font-size: 14px; font-weight: 900; }
  .cs-day h3 small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .cs-box { display: flex; flex-direction: column; gap: 2px; padding: 4px; border-radius: 14px; background: var(--field); }
  .cs-row, .cu-row { --c: #6e7088; display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: 10px; text-align: left; color: var(--ink); transition: background-color .15s ease; min-width: 0; }
  .cs-row:hover, .cu-row:hover { background: var(--panel); }
  .cs-row[aria-pressed="true"], .cu-row[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
  .cs-row .tx, .cu-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .cs-row .tx > b, .cu-row .tx > b { font-size: 14px; font-weight: 800; }
  .cs-row .tx > small, .cu-row .tx > small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .cs-row .when, .cu-row .when { flex: none; font-size: 12px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
  .cs-row .when.bad, .cu-row .when.bad { color: var(--bad); }
  .cs-row mark { background: color-mix(in srgb, var(--accent) 20%, transparent); color: inherit; border-radius: 3px; }
  .cal-none { padding: 32px 16px; text-align: center; color: var(--muted); font-weight: 700; }
  .cal-none b { display: block; margin-bottom: 4px; font-size: 16px; color: var(--ink); }
  .ev-mk { width: 36px; height: 36px; border-radius: 11px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--field)); color: var(--c); }
  .ev-mk svg.i { width: 20px; height: 20px; }
  .ev-mk.school { background: var(--inner); color: var(--ink-2); }
  .cu-row .badge, .cs-row .badge { width: 36px; height: 36px; border-radius: 11px; }

  /* the day's list, from "+2 more" (and a day tapped on a phone) */
  .cal-pop { position: fixed; z-index: 60; width: 300px; max-width: calc(100vw - 32px); max-height: min(420px, calc(100vh - 32px)); overflow: auto; padding: 8px; border-radius: 16px; background: var(--field); box-shadow: var(--pop-shadow); }
  .cal-pop.in { animation: asMenuIn .16s cubic-bezier(.2, .8, .2, 1) backwards; }
  .cal-pop-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 8px 8px; }
  .cal-pop-h b { font-size: 15px; font-weight: 900; }
  .cal-pop-h small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
  .cal-pop .ce { height: 30px; font-size: 13px; margin: 0 0 4px; }
  .cal-pop-acts { display: flex; align-items: center; gap: 4px; flex: none; }
  .cal-pop-wk { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 800; color: var(--ink-2); transition: background-color .15s ease; }
  .cal-pop-wk:hover { background: var(--panel); color: var(--ink); }
  .cal-pop-wk svg.i { width: 16px; height: 16px; }
  .cal-det { width: 360px; padding: 16px 12px 12px; }
  .cal-pop.swap { animation: calSwap .16s ease backwards; }
  @keyframes calSwap { from { opacity: .4; } }
  .cal-back { display: inline-flex; align-items: center; gap: 4px; height: 30px; margin: -8px 0 8px -4px; padding: 0 12px 0 4px; border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--ink-2); transition: background-color .15s ease; }
  .cal-back:hover { background: var(--panel); color: var(--ink); }
  .cal-back svg.i { width: 16px; height: 16px; }
  .potato-mode .cal-pop.swap { animation: none; }
  @media (prefers-reduced-motion: reduce) { .cal-pop.swap { animation: none; } }
  .cal-det .cd { padding: 0 4px; }
  .cal-det .cd-top { align-items: flex-start; }
  .cal-det .cd-top .ibtn { margin: -8px -8px 0 0; }
  .cal-det .cd-fact { background: var(--panel); }
  .cal-det .cd-desc { background: var(--panel); }
  .potato-mode .cal-pop.in { animation: none; }
  @media (prefers-reduced-motion: reduce) { .cal-pop.in { animation: none; } }

  /* the rail: what you picked, what's coming up, days off */
  .cd { --c: #6e7088; padding: 0 4px 8px; }
  .cd-top { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  .cd-top .badge, .cd-top .ev-mk { width: 44px; height: 44px; border-radius: 13px; }
  .cd-top .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .cd-t { font-size: 18px; font-weight: 900; line-height: 1.25; }
  .cd-top small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .cd-facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .cd-fact { display: inline-flex; align-items: baseline; gap: 8px; height: 30px; padding: 0 12px; border-radius: 9px; background: var(--field); font-size: 13px; font-weight: 800; color: var(--ink); align-items: center; }
  .cd-fact small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .cd-fact.bad { color: var(--bad); } .cd-fact.ok { color: var(--good); }
  .cd-desc { margin: 0 0 12px; padding: 12px; border-radius: 12px; background: var(--field); color: var(--ink-2); font-weight: 600; line-height: 1.55; }
  .cd-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .cd-acts .btn { flex: 1 1 auto; }
  .cu-day { margin: 0 0 8px; }
  .cu-day > small { display: block; margin: 0 0 4px 12px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cu-day > small.today { color: var(--accent); }
  .cu-none { padding: 0 12px 8px; font-size: 13px; font-weight: 700; color: var(--muted); }

  .sync-wait .cm-d, .sync-wait .cw-col, .sync-wait .cy-m { background: var(--field); }

  /* Import a calendar: the school's PDF in, its days off and events out (the PDF itself isn't kept) */
  .cim-pop { width: min(600px, 100%); }
  .cim-top { display: flex; align-items: flex-start; gap: 12px; padding: 20px 16px 16px 24px; border-bottom: 2px solid var(--panel); flex: none; }
  .cim-top .tx { flex: 1; min-width: 0; }
  .cim-top h2 { margin: 0; font-size: 20px; font-weight: 900; font-style: italic; }
  .cim-top small { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.45; }
  .cim-body { overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .cim-drop { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 16px; border-radius: 16px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--inner); text-align: center; transition: background-color .15s ease, box-shadow .15s ease; }
  .cim-drop.over { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 50%, transparent); }
  .cim-drop .big { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--field)); color: var(--accent); }
  .cim-drop .big svg.i { width: 26px; height: 26px; }
  .cim-drop b { font-size: 16px; font-weight: 900; }
  .cim-drop > small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .cim-drop .btn { margin-top: 4px; }
  .cim-try { font-size: 13px; font-weight: 800; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .cim-how { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--panel); font-size: 13px; font-weight: 600; color: var(--ink-2); line-height: 1.5; }
  .cim-how svg.i { flex: none; width: 18px; height: 18px; color: var(--muted); margin-top: 1px; }
  .cim-file { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 14px; background: var(--panel); }
  .cim-file .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cim-file b { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cim-file small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .cim-steps { display: flex; flex-direction: column; gap: 8px; }
  .cim-step { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .cim-step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 2px var(--inner); }
  .cim-step .dot svg.i { width: 14px; height: 14px; }
  .cim-step.now { color: var(--ink); } .cim-step.now .dot { box-shadow: none; }
  .cim-step.done { color: var(--ink-2); } .cim-step.done .dot { background: var(--good); box-shadow: none; color: #ffffff; }
  .cim-spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--inner); border-top-color: var(--accent); animation: cimSpin .8s linear infinite; }
  @keyframes cimSpin { to { transform: rotate(360deg); } }
  .cim-sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 0 4px; }
  .cim-sum b { font-size: 16px; font-weight: 900; }
  .cim-sum small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .cim-grade { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .cim-grade .mp-types { background: var(--panel); }
  .cim-grade .mp-types button { height: 28px; font-size: 13px; padding: 0 12px; } .cim-grade .mp-pill { height: 28px; }
  .cim-mon { margin: 4px 0 2px 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cim-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: 12px; text-align: left; color: var(--ink); transition: background-color .15s ease; }
  .cim-row:hover:not([disabled]) { background: var(--panel); }
  .cim-row[disabled] { cursor: default; }
  .cim-ck { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 2px var(--inner); color: transparent; }
  .cim-ck svg.i { width: 14px; height: 14px; }
  .cim-row[aria-checked="true"] .cim-ck { background: var(--accent); box-shadow: none; color: #ffffff; }
  .cim-row[disabled] .cim-ck { background: var(--panel); box-shadow: none; color: var(--muted); }
  .cim-d { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 4px 0; border-radius: 10px; background: var(--panel); }
  .cim-d small { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .cim-d b { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .cim-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .cim-row .tx b { font-size: 14px; font-weight: 800; }
  .cim-row .tx small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .cim-row[disabled] .tx b { color: var(--muted); }
  .cim-tag { flex: none; height: 22px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; background: var(--panel); color: var(--ink-2); }
  .cim-tag.off { background: color-mix(in srgb, #6e7088 16%, var(--field)); }
  .cim-skip { padding: 8px 12px; border-radius: 12px; background: var(--panel); font-size: 13px; font-weight: 700; color: var(--muted); }
  .cim-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px 12px 20px; border-top: 2px solid var(--panel); flex: none; }
  .cim-foot .note { margin-right: auto; font-size: 13px; font-weight: 700; color: var(--muted); }
  .cim-foot .btn.primary:disabled { background: var(--inner); color: var(--muted); box-shadow: none; }
  .potato-mode .cim-spin { animation-duration: 2s; }
  @media (max-width: 560px) { .cim-foot .note { display: none; } .cim-foot .btn { flex: 1; } .hub-acts #cimOpen { flex: 1 1 100%; } }
  @media (max-width: 1280px) { .cy { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* phones: the month shows a dot for each class, and tapping a day lists it */
  @media (max-width: 760px) {
    .cal-top .mp-types { margin-left: 0; order: 3; }
    .cal-bar .mp-types { overflow-x: auto; max-width: 100%; scrollbar-width: none; } .cal-bar .mp-types button { padding: 0 12px; }
    .cal-lbl { font-size: 19px; margin: 0 4px; }
    .cm-wd span { padding: 0; text-align: center; letter-spacing: 0; }
    .cm, .cm-wd { gap: 2px; }
    .cm-d { min-height: 64px; padding: 4px 2px; align-items: center; cursor: pointer; border-radius: 10px; }
    .cm-d .ce, .cm-d .ce-more { display: none; }
    .cm-n { justify-content: center; padding: 0; }
    .cm-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; padding: 0 2px; }
    .cm-dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--c); }
    .cw { grid-template-columns: minmax(0, 1fr); }
    .cw-col { min-height: 0; }
    .cw-col:has(> .cw-none) { flex-direction: row; align-items: baseline; justify-content: space-between; padding: 8px 12px; } .cw-col:has(> .cw-none) .cw-h { padding: 2px 0; }
    .cm-d:active { background: var(--inner); }
    .cy { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  }
  @media (max-width: 480px) { .cy { grid-template-columns: minmax(0, 1fr); } .cal-bar .as-dd { flex: 1 1 auto; } .cal-bar .as-ddb { width: 100%; } }
  /* ===== Life layer for the course page ===== */
  /* the course header */
  .hub-h { position: relative; }
  .hub-logo { border-radius: 28px; box-shadow: 0 0 0 5px var(--field), 0 12px 24px -12px rgba(20, 21, 31, .45); transition: transform .35s var(--spring); }
  .hub-t h1 { font-size: 44px; }
  .hub-tab { border-radius: 12px; transition: background-color .15s ease, transform .25s var(--spring); }
  .hub-tab.on { background: var(--ink); box-shadow: 0 8px 16px -10px rgba(20, 21, 31, .8); }
  /* the Materials numbers each get a color */
  .mp-stat b { font-size: 24px; }
  .mp-box, .ag-box, .mp-det { border-radius: 24px; box-shadow: var(--card-shadow); }
  .ag-h h2 { font-size: 28px; }
  .nt-btn { border-radius: 14px; }
  /* the sync button matches the buttons beside it (they grew to 38px) */
  .hub-acts .pill.sync { height: 38px; border-radius: 12px; padding: 0 16px 0 12px; font-size: 15px; }
  .hub-acts .pill.sync svg { width: 20px; height: 20px; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.potato-mode) .hub-logo:hover { transform: scale(1.04); }
    body:not(.potato-mode) .hub-tab:active { transform: scale(.95); }
  }
  @media (max-width: 680px) { .hub-t h1 { font-size: 34px; } }
  /* ===== end Life layer for the course page ===== */
</style>
</head>

<script>
/* Copied from averages.io public/js/averages-file-icons.js (2026-10-09). Fredoka Bold (OFL, see THIRD-PARTY-NOTICES.md) is inlined so the labels render here. */
/*
 * File type icons (2026-10-09, Martin; design in the project doc claude/file-icons.md).
 *
 * A see-through page with a line in the type's color around it and a folded
 * corner. The label (PDF, DOC, ZIP…, Fredoka Bold, same color) runs across
 * the page and cuts through the outline; a small drawing for the type sits
 * above it, cut off by the fold along the crease's own curve.
 *   - At rest only the drawing shows; hovering the file's row or tile (or
 *     focusing it) slides the drawing up, opens the outline and fades the
 *     label in. Devices without hover always show the label.
 *   - The outline glows only in dark mode (body.dark-mode).
 *   - Below 34 px (list rows) there's no label: the drawing alone, outline whole.
 *
 * Loaded in <head> by app/layout.tsx. Pages call
 *   AveragesFileIcons.html(extOrName, { mime, size })  -> <span class="avfi">…</span>
 *   AveragesFileIcons.svg(extOrName, { mime, size, small }) -> <svg>…</svg> (fills its box when size is left out)
 *   AveragesFileIcons.key(extOrName, mime)            -> 'pdf' | 'doc' | … | 'file'
 *   AveragesFileIcons.color(extOrName, mime)          -> '#E5484D' …
 * Pages keep their old badge when this script isn't there, so nothing breaks.
 */

  'use strict';

  function svg(extOrName, opts) {
    setup();
    const o = opts || {};
    const k = T[o.key] ? o.key : key(extOrName, o.mime);
    const [label, c] = T[k];

  const courseSubject = name => COURSE_SUBJECTS.find(([re]) => re.test(String(name || '').toLowerCase())) || [null, '📚', '#55697d'];
  const CUTS = [[97, 'A+'], [93, 'A'], [90, 'A-'], [87, 'B+'], [83, 'B'], [80, 'B-'], [77, 'C+'], [73, 'C'], [70, 'C-'], [67, 'D+'], [63, 'D'], [60, 'D-'], [0, 'F']];
  const letter = p => CUTS.find(([c]) => p >= c)[1];
  const gcls = p => p >= 90 ? 'ga' : p >= 80 ? 'gb' : 'gc';

  // From Schoology: each section (title, teacher, period), the student's grade (and how it's moved on the days

  const CLASSES = FSD.CLASSES.map(c => Object.assign({}, c));   // the student's classes (averages-fs-data.js)

/* ===== Life layer script: New stickers land at their own angle, in one of a few set spots on their item =====
   The tilt, nudge and overlap come from the item's text, so a sticker lands the same way every time the list redraws.

    const h = seedOf(el), prev = el.previousElementSibling, next = el.nextElementSibling;
    const tilt = parseFloat(el.style.getPropertyValue('--tilt')) || 0, ov = 2 + (h >> 9) % 3; // covers 2 to 4px of the text

      }

  // ---------- where on the item a sticker lands ----------
  // A fixed set of spots: the end of the title (above), the corner of the item's icon, across the bottom of the icon,
  // the item's top right corner, or riding on the start of the title. The item's text picks where it starts looking;
  // a spot is skipped if it would hide text or a button, or get cut off by a box that clips, so it falls through to the next one.
  const SPOTS = ['end', 'icon', 'corner', 'over', 'iconb'];
  const HOST = '[data-mid], [data-mpid], [data-agopen], [data-gw], [data-rgw], [data-gdopen], [data-flgo], [role="row"], .upd, button, a, li, tr';

    else if (spot === 'iconb') { if (!I || !I.width) return null; left = I.left + (I.width - w) / 2; top = I.bottom - h * .55; }
    else if (spot === 'corner') { if (!T || !T.width) return null; left = T.right - w * .25; top = T.top - h * .7; } // hangs off the top right of the name itself, not the far edge of the row

    if (clipped(el, big)) return false;

      const tb = host.closest('table, [role="table"], [role="grid"], [role="treegrid"]');
      if (host.previousElementSibling) near.push(host.previousElementSibling.getBoundingClientRect());
      if (tb) tb.querySelectorAll('th, [role="columnheader"]').forEach(x => near.push(x.closest('tr, [role="row"]') ? x.closest('tr, [role="row"]').getBoundingClientRect() : x.getBoundingClientRect()));
    }
    const hits = near.some(q => { const x = Math.min(big.right, q.right) - Math.max(big.left, q.left), y = Math.min(big.bottom, q.bottom) - Math.max(big.top, q.top); return x > 3 && y > 4; });

    const before = [...lbox.querySelectorAll('.newtag[data-spot]')].filter(x => x !== el && (x.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING)).pop();
    if (before && SPOTS[start] === before.dataset.spot) start = (start + 1) % SPOTS.length;
