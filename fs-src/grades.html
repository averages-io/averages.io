<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grades Mock</title>
<style>
  /* Grades page (same frame as Home). Averages look, light only. Layout: top bar + hover-open icon rail around one rounded content sheet (the Windowed card, stretched to fill). */
  :root {
    color-scheme: light;
    --frame: #e4e4e9;      /* top bar + sidebar */
    --sheet: #f5f5f7;      /* the content window */
    --panel: #eaeaec;      /* cards: the app's --panel-bg */
    --inner: #dcdce0;      /* insets, hovers, dividers: the app's --panel-inner */
    --field: #ffffff;      /* inputs, popovers */
    --ink: #14151f;
    --ink-2: #44465a;
    --muted: #5a5c70;
    --accent: #b8352f;     /* Punch, darkened for AA text */
    --accent-hover: #9c2b26;
    --punch-a: #ff7a50; --punch-b: #e5484d;
    --today: #2f5fb3;
    --focus: #2f5fb3;
    --good: #2e7d4f;
    --warn: #8f6200;
    --bad: #b8352f;
    --series: #3e64b0;
    --series-soft: rgba(62,100,176,.14);
    --mark: rgba(229,72,77,.18);
    --pop-shadow: 0 16px 40px rgba(20,21,31,.16), 0 2px 6px rgba(20,21,31,.06);
    --scrim: rgba(20,21,31,.32);
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* the system font (SF Pro on a Mac), the one the chat preview showed while Puffin couldn't load */
    --rail: 64px;
    --side-open: 248px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--frame); }
  body {
    color: var(--ink);
    font-family: var(--display);
    font-weight: 500; font-size: 15px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  body.potato-mode, body.potato-mode *, body.potato-mode *::before, body.potato-mode *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; filter: none !important; text-shadow: none !important; }
  body.potato-mode, body.potato-mode * { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; }
  html:has(body.potato-mode) { scroll-behavior: auto !important; }
  body.potato-mode .italic, body.potato-mode h1 { font-style: normal !important; transform: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  * { scrollbar-width: thin; scrollbar-color: rgba(20,21,31,.28) transparent; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Twemoji subject icon on a tint of the subject color (same table as courses.html) */
  .badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 18%, #ffffff); }
  .badge svg { width: 17px; height: 17px; display: block; }
  .italic { font-style: italic; }

  /* ---------- frame ---------- */
  .app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: 64px minmax(0, 1fr); height: 100vh; }
  .app.pinned { grid-template-columns: var(--side-open) minmax(0, 1fr); }

  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 0; background: var(--frame); position: relative; z-index: 6; }
  .brand { height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 16px; flex: none; }
  .brand img { width: 30px; height: 30px; flex: none; }
  .brand b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
  .brand b span { color: var(--accent); }
  .ibtn.menu-btn { display: none; }
  .crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; padding-left: 16px; margin-left: 8px; white-space: nowrap; border-left: 2px solid var(--inner); height: 24px; }
  .crumb strong { color: var(--ink); font-weight: 800; }
  .top .grow { flex: 1; }
  .ibtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); position: relative; }
  .ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--inner); color: var(--ink); }
  .ibtn .dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--punch-b); box-shadow: 0 0 0 2px var(--frame); }
  .ibtn:hover .dot, .ibtn[aria-expanded="true"] .dot { box-shadow: 0 0 0 2px var(--inner); }
  .qbox { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 16px; background: var(--inner); }  /* even space on both ends, so the buttons sit centered in the bar */
  .qbox .ibtn:hover, .qbox .ibtn[aria-expanded="true"] { background: var(--field); }
  .qbox .ibtn .dot { box-shadow: 0 0 0 2px var(--inner); }
  .qbox .ibtn:hover .dot, .qbox .ibtn[aria-expanded="true"] .dot { box-shadow: 0 0 0 2px var(--field); }
  .qbox .me { margin-left: 4px; }
  .qbox .me .gear { box-shadow: 0 0 0 2px var(--inner); }
  .quick { display: flex; align-items: center; gap: 8px; }
  .quick-btns { display: flex; gap: 4px; }
  /* the preview buttons are icons; a quick tooltip under each says what it opens */
  .ibtn[data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 70; padding: 4px 8px; border-radius: 8px;
    background: var(--ink); color: #ffffff; font-size: 12px; font-weight: 800; line-height: 16px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
  .ibtn[data-tip]:hover::after, .ibtn[data-tip]:focus-visible::after { opacity: 1; transition-delay: .25s; }
  .ibtn[data-tip][aria-expanded="true"]::after { opacity: 0; transition: none; }
  @media (hover: none) { .ibtn[data-tip]::after { display: none; } }
  .quick-l { order: -1; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1; padding-right: 8px; border-right: 2px solid #c6c6cc; height: 24px; display: flex; align-items: center; }
  .top .me { width: 40px; height: 40px; border-radius: 50%; flex: none; margin-left: 8px; }
  .top .me { position: relative; }
  .top .me .gear { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--field); box-shadow: 0 0 0 2px var(--frame); display: grid; place-items: center; color: #66757f; }
  .top .me .gear svg.i { width: 12px; height: 12px; display: block; }
  .top .me:hover .gear, .me[aria-expanded="true"] .gear { color: var(--ink); }
  .top .me[aria-expanded="true"] .av { box-shadow: 0 0 0 2px var(--frame), 0 0 0 4px var(--ink-2); }

  /* avatar: photo when there is one, otherwise the first initial (same as the app's profile button) */
  .av { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background-color: var(--ink); background-size: cover; background-position: center; color: #ffffff; font-weight: 800; font-size: 16px; line-height: 1; user-select: none; }
  .av.photo { color: transparent; }

  /* ---------- sidebar: an icon rail that opens over the page on hover ---------- */
  .side {
    grid-column: 1; grid-row: 2; position: relative; z-index: 5;
    width: var(--rail); min-height: 0; background: var(--frame);
    display: flex; flex-direction: column; overflow: hidden auto; overflow-x: hidden;
    transition: width .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s ease, border-radius 0s linear .22s;
  }
  .side:hover, .side.hold, .side:has(:focus-visible) {
    width: var(--side-open); transition-delay: .1s, .1s, 0s; border-radius: 0 16px 16px 0;
    box-shadow: 12px 0 32px rgba(20,21,31,.14);
  }
  .app.pinned .side { width: var(--side-open); box-shadow: none; transition-delay: 0s; border-radius: 0; }
  /* labels fade in after the rail starts to widen, and out before it narrows */
  .side .fade { opacity: 0; transition: opacity .12s ease; white-space: nowrap; }
  .side:hover .fade, .side.hold .fade, .side:has(:focus-visible) .fade, .app.pinned .side .fade { opacity: 1; transition-delay: .18s; }

  .acct { display: flex; align-items: center; gap: 12px; padding: 12px 12px 16px; width: var(--side-open); }
  .acct .av-wrap { width: 40px; height: 40px; flex: none; border-radius: 50%; }
  .acct .av { font-size: 17px; }
  .acct .who { min-width: 0; flex: 1; }
  .acct .who b { display: block; font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .acct .who small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .nav { padding: 12px 8px 0; display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .nav a { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px 0 16px; border-radius: 12px; color: var(--ink-2); font-weight: 700; position: relative; overflow: hidden; }
  .nav a .pip { overflow: visible; }
  .nav a:hover, .nav a[aria-expanded="true"] { background: var(--inner); color: var(--ink); }
  .nav a.on { background: var(--sheet); color: var(--ink); font-weight: 800; }
  .nav a.on svg.i { color: var(--accent); }
  /* count badges: a circle for one digit, a pill only once the number needs it; the number sits dead center */
  .nav .count, .grp em { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px;
    font-style: normal; font-size: 12px; font-weight: 800; line-height: 1; letter-spacing: 0; color: #ffffff; }
  /* the number is nudged so its ink sits dead center (see centerInk), whatever font is showing */
  .nav .count canvas.ink, .grp em canvas.ink { display: block; flex: none; margin: 0 -4px; }
  .ink-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .nav .count { margin-left: auto; background: var(--accent); }
  .nav .side-kbd { margin-left: auto; font-size: 11px; line-height: 20px; padding: 0 4px; background: var(--inner); color: var(--muted); }
  .nav a:hover .side-kbd { background: var(--field); }
  /* Search turns into a search bar once the sidebar opens (an icon on the closed rail) */
  .nav #sideSearch { transition: background .12s ease, box-shadow .12s ease; }
  .side:is(:hover, .hold, :has(:focus-visible)) #sideSearch, .app.pinned .side #sideSearch { background: var(--field); box-shadow: inset 0 0 0 2px var(--inner); color: var(--muted); transition-delay: .12s; }
  .side:is(:hover, .hold, :has(:focus-visible)) #sideSearch:hover, .app.pinned .side #sideSearch:hover { background: color-mix(in srgb, var(--inner) 35%, var(--field)); color: var(--ink-2); }
  .side:is(:hover, .hold, :has(:focus-visible)) #sideSearch .side-kbd, .app.pinned .side #sideSearch .side-kbd { background: var(--panel); }
  @media (max-width: 680px) { .nav #sideSearch { background: var(--field); box-shadow: inset 0 0 0 2px var(--inner); color: var(--muted); } }
  .nav .count[hidden] { display: none; }
  /* on the closed rail, counts become a dot on the icon */
  .nav a .pip { position: absolute; left: 30px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--frame); transition: opacity .12s ease; }
  .side:hover .pip, .side.hold .pip, .side:has(:focus-visible) .pip, .app.pinned .side .pip { opacity: 0; }
  .divider { height: 2px; border-radius: 1px; background: var(--inner); margin: 12px 16px; }
  .side-h { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 8px 0 20px; color: var(--muted); font-size: 13px; font-weight: 800; width: 100%; overflow: hidden; white-space: nowrap; }
  .side-h .ibtn { width: 32px; height: 32px; }
  /* "Your classes" only takes room while the sidebar is open. Closed, the class icons sit right under the divider;
     opening, they slide down and a little right (a diagonal) to make room for the label, in time with the rail widening */
  .side > .side-h { height: 0; padding-left: 24px; transition: height .22s cubic-bezier(.2, .8, .2, 1); }
  .side:is(:hover, .hold, :has(:focus-visible)) > .side-h, .app.pinned .side > .side-h { height: 32px; transition-delay: .1s; }
  .side > .cls a { transition: padding-left .22s cubic-bezier(.2, .8, .2, 1); }
  .side:is(:hover, .hold, :has(:focus-visible)) > .cls a, .app.pinned .side > .cls a { padding-left: 12px; transition-delay: .1s; }
  .cls { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; width: 100%; }
  /* on a short screen the class list scrolls on its own, so the pages above and the pin below stay put */
  .side > .nav, .side > .divider, .side > .side-h, .side > .foot { flex: none; }
  .side > .cls > * { flex: none; }
  /* no scrollbar here: it would take width and push the class icons off center. The fade at the bottom shows there's more. */
  .side > .cls { flex: 1 1 0; min-height: 88px; overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: none; }
  .side > .cls::-webkit-scrollbar { display: none; }
  .side > .cls.cls-more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent); }
  @media (max-height: 780px) {
    .nav { gap: 2px; padding-top: 8px; }
    .nav a { height: 38px; }
    .divider { margin: 8px 16px; }
    .side .foot { padding: 8px 12px; }
  }
  .cls a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px 0 8px; border-radius: 12px; color: var(--ink-2); font-weight: 700; overflow: hidden; white-space: nowrap; }
  .cls a:hover, .cls a[aria-expanded="true"] { background: var(--inner); color: var(--ink); }
  .cls .g { margin-left: auto; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .cls .g small { color: var(--muted); font-size: 12px; font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .side .foot { margin-top: auto; padding: 12px; display: flex; align-items: center; gap: 8px; width: 100%; overflow: hidden; white-space: nowrap; }
  .side .foot .ibtn { width: 40px; flex: none; }
  .side .foot span { color: var(--muted); font-weight: 700; font-size: 13px; }
  .side .foot .pin-close, .app.pinned .side .foot .pin-open { display: none; }
  .app.pinned .side .foot .pin-close { display: block; }

  /* ---------- content sheet ---------- */
  .body { overflow: auto; min-height: 0; background: var(--sheet); grid-column: 2; grid-row: 2; }
  .app::before, .app::after { content: ""; grid-row: 2; align-self: start; width: 24px; height: 24px; pointer-events: none; z-index: 4; }
  .app::before { grid-column: 2; justify-self: start; background: radial-gradient(circle at 100% 100%, transparent 23.5px, var(--frame) 24px); }
  .app::after { display: none; }
  .wrap { max-width: 1720px; margin: 0 auto; padding: 40px 32px 64px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 26vw, 480px); gap: 24px; align-items: start; }
  .center { min-width: 0; }

  .hello { display: flex; align-items: flex-end; gap: 16px; margin: 0 0 24px; }
  .hello .tx { min-width: 0; }
  h1 { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 36px; letter-spacing: -.01em; margin: 0; line-height: 1.1; transform: skewX(-2deg); transform-origin: left bottom; text-wrap: balance; }
  #greet { font-size: 44px; } /* the same size as the Courses, Grades and Assignments titles */
  @media (max-width: 680px) { #greet { font-size: 34px; } }
  .date { margin: 4px 0 0 2px; color: var(--muted); font-weight: 700; font-style: italic; font-size: 15px; }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--panel); color: var(--ink-2); font-size: 13px; font-weight: 800; flex: none; margin-bottom: 4px; }
  .pill:hover, .pill[aria-expanded="true"] { background: var(--inner); }
  .pill .live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .pill.sync { height: 40px; padding: 0 16px 0 12px; border-radius: 12px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pill.sync svg { width: 20px; height: 20px; color: var(--ink); }
  .pill.sync.loading { color: var(--muted); cursor: progress; }

  /* big search */
  .bigsearch label { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px 0 16px; border-radius: 16px; background: var(--field); box-shadow: inset 0 0 0 2px var(--inner); cursor: text; transition: box-shadow .15s ease; }
  .bigsearch label:hover { box-shadow: inset 0 0 0 2px #c8c8ce; }
  .bigsearch label:focus-within { box-shadow: inset 0 0 0 2px var(--focus), 0 0 0 4px color-mix(in srgb, var(--focus) 16%, transparent); }
  .bigsearch label > svg.i { width: 20px; height: 20px; color: var(--muted); transition: color .15s ease; }
  .bigsearch label:focus-within > svg.i { color: var(--ink); }
  .bigsearch input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; font-weight: 700; min-width: 0; color: var(--ink); }
  .bigsearch input::placeholder { color: var(--muted); font-weight: 600; }
  .sclear { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .sclear svg.i { width: 16px; height: 16px; stroke-width: 1.97; }
  .sclear:hover { background: var(--panel); color: var(--ink); }
  .bigsearch label:focus-within .keys { display: none; }
  .keys { display: inline-flex; gap: 4px; flex: none; }
  kbd { font-family: inherit; font-size: 12px; font-weight: 800; color: var(--ink-2); border-radius: 6px; padding: 0 8px; line-height: 22px; background: var(--panel); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 32px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; background: var(--panel); font-weight: 800; color: var(--ink); }
  .chip:hover, .chip[aria-expanded="true"] { background: var(--inner); }
  .chip .badge { width: 24px; height: 24px; border-radius: 7px; margin-left: -4px; }
  .chip .badge svg { width: 16px; height: 16px; }
  .chip.chip-c { gap: 0; padding: 0 8px; color: color-mix(in srgb, var(--c) 70%, var(--ink)); background: color-mix(in srgb, var(--c) 20%, var(--sheet)); transition: background .2s ease; }
  .chip.chip-c:hover, .chip.chip-c:focus-visible { background: color-mix(in srgb, var(--c) 30%, var(--sheet)); }
  .chip.chip-c .emo { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
  .chip.chip-c .emo svg { width: 22px; height: 22px; }
  .chip.chip-c .lab { display: block; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; margin-left: 0;
    transition: max-width .36s cubic-bezier(.22, .61, .36, 1), margin-left .36s cubic-bezier(.22, .61, .36, 1), opacity .2s ease .06s; }
  .chip.chip-c:hover .lab, .chip.chip-c:focus-visible .lab { max-width: 200px; opacity: 1; margin-left: 8px; }
  /* potato mode: no reveal animation, so class shortcuts always show their name */
  .potato-mode .chip.chip-c .lab { transition: none; max-width: 200px; opacity: 1; margin-left: 8px; }
  .chip svg.i { color: var(--accent); }
  .chip .caret { width: 14px; height: 14px; color: var(--muted); margin-left: -4px; }

  /* panels: Averages' filled grey cards with an italic title and a red "see ..." link */
  .center { display: flex; flex-direction: column; gap: 24px; }
  .center > .chips { margin: -8px 0 0; flex-direction: column; align-items: center; }
  .chip-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip.edit { background: none; color: var(--ink-2); padding: 0 12px; box-shadow: inset 0 0 0 2px var(--panel); }
  .chip.edit:hover, .chip.edit[aria-expanded="true"] { background: var(--panel); color: var(--ink); }
  .chip-row.dense { gap: 4px; }
  .chip-row.dense .chip { height: 36px; padding: 0 12px; gap: 8px; font-size: 14px; border-radius: 11px; }
  .chip-row.dense .chip svg.i { width: 16px; height: 16px; }
  .chip-row.dense .chip.chip-c { padding: 0 8px; }
  .chip-row.dense .chip.edit { padding: 0 12px; font-size: 0; gap: 0; } /* a full row keeps just the icon; its name stays for screen readers */
  .chip-row.dense .chip.edit svg.i { width: 16px; height: 16px; }
  .center > .hello { margin: 0; }
  .ah { flex-wrap: wrap; }
  .ah h2 { white-space: nowrap; }
  .range { white-space: nowrap; }
  .center > #secGrades .ah { margin-top: 0; }
  .ph2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px 4px; min-height: 32px; }
  .ph2 h2 { margin: 0; font-size: 19px; font-weight: 900; font-style: italic; letter-spacing: -.01em; }
  .ph2-tools { display: flex; align-items: center; gap: 4px; }
  .hbtn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 10px; background: var(--field); font-weight: 800; font-size: 13px; color: var(--ink); white-space: nowrap; }
  .hbtn:hover, .hbtn[aria-expanded="true"] { background: var(--inner); }
  .hbtn svg.i { width: 15px; height: 15px; color: var(--accent); }
  .gt-head, .gt-row { display: grid; grid-template-columns: minmax(0, 1fr) 104px 120px 72px; align-items: center; gap: 12px; }
  .gt-head { padding: 4px 8px 8px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .gt-head span:not(:first-child), .gt-row > span:not(:first-child) { text-align: center; justify-self: center; }
  .gt-head span:last-child, .gt-row .gt-u { justify-self: end; text-align: right; }
  .gt-row { min-height: 56px; padding: 8px 8px; border-radius: 12px; position: relative; color: var(--ink); }

  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .tip { position: fixed; left: 0; top: 0; pointer-events: none; background: var(--field); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; box-shadow: var(--pop-shadow); opacity: 0; transition: opacity .1s; z-index: 95; }

  .dt { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 13px; font-variant-numeric: tabular-nums; }

  .btn { height: 34px; padding: 0 16px; border-radius: 10px; font-weight: 800; font-size: 14px; background: var(--panel); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

  .promo .art i { display: block; }

  .promo .cta button:hover, .promo .cta button[aria-expanded="true"] { background: var(--accent-hover); }
  .feed { background: var(--panel); border-radius: 20px; padding: 20px 20px 8px; }

  .tl li::before { content: ""; position: absolute; left: 0; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: #c2c2ca; box-shadow: 0 0 0 3px var(--panel); }

  .tl time { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
  .tl a { font-weight: 700; display: block; }
  .tl a.ub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; line-height: 1.35; margin: 2px 0; }
  .tl a:hover, .tl a[aria-expanded="true"] { color: var(--accent); }

  .trend { display: inline-flex; align-items: baseline; gap: 4px; padding: 0 8px; border-radius: 8px; cursor: help; font-weight: 900; font-size: 17px; }

  .trend .tp { font-size: 13px; font-weight: 700; color: var(--muted); }
  .trend .arrow { display: inline-flex; align-self: center; }
  .trend.flat .arrow { color: var(--muted); }
  /* every arrow draws at the same on-screen weight as an 18px icon at 1.75 (31.5 / size) */
  .trend .arrow svg.i, svg.i.ar, .delta svg.i { width: 14px; height: 14px; stroke-width: 2.25; }
  svg.i.ar { display: inline-block; vertical-align: -2px; margin: 0 2px; }
  .pop .sq svg.i, .mi .i.go { stroke-width: 1.97; }
  .gpop { position: fixed; z-index: 75; width: 296px; background: var(--field); border-radius: 16px; box-shadow: var(--pop-shadow), 0 0 0 1px var(--inner); padding: 16px 16px 12px; opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease, visibility .12s; pointer-events: none; }
  .gpop.show { opacity: 1; visibility: visible; transform: none; pointer-events: auto; }

  .gpop .gsub strong { color: var(--ink); font-weight: 800; }
  .gpop svg { display: block; overflow: visible; }
  .gpop .pbub { --series: var(--c, var(--sky)); margin: 12px 0 0; padding: 8px 12px 8px; border-radius: 14px; background: color-mix(in srgb, var(--series) 7%, var(--field)); border: 2px dashed color-mix(in srgb, var(--series) 40%, transparent); }
  .gpop .pbub-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--ink-2); margin-bottom: 2px; }
  .gpop .pbub-h svg.i { width: 14px; height: 14px; color: var(--series); }
  .gpop .gfoot { margin: 8px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; }

  .stat[data-details] { cursor: pointer; transition: background .15s ease; }
  .stat[data-details]:hover { background: color-mix(in srgb, var(--inner) 55%, var(--panel)); }
  .stat[data-details]:focus-visible { outline-offset: 2px; border-radius: 20px; }
  .modal-wrap { position: fixed; inset: 0; z-index: 90; background: var(--scrim); display: grid; place-items: center; padding: 24px; }
  .modal:focus { outline: none; }
  .modal { width: min(1080px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: var(--sheet); border-radius: 24px; box-shadow: var(--pop-shadow); overflow: hidden; }
  .modal-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 20px 16px 24px; }
  .modal-h h2 { margin: 0; font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: -.01em; }
  .modal-h p { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 14px; }
  .modal .sq { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
  .modal .sq:hover { background: var(--panel); color: var(--ink); }
  .modal-b { overflow: auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 16px; }
  .dpanel { background: var(--panel); border-radius: 20px; padding: 20px; min-width: 0; }
  .tk { display: flex; flex-direction: column; }
  .tk-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 16px 0; }
  .tk-row + .tk-row { border-top: 1px solid var(--inner); }
  .tk-row .badge { width: 32px; height: 32px; border-radius: 9px; }
  .tk-row .badge svg { width: 20px; height: 20px; }
  .tk-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
  .tk-top b { font-size: 16px; font-weight: 900; }
  .tk-goal { font-weight: 700; color: var(--muted); font-size: 14px; }
  .tk-chip { margin-left: auto; font-size: 12px; font-weight: 800; padding: 0 12px; line-height: 24px; border-radius: 12px; }
  .tk-chip.ok { color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
  .tk-chip.warn { color: var(--warn); background: color-mix(in srgb, #e9a400 22%, var(--panel)); }
  .tk-chip.muted { color: var(--muted); background: var(--inner); }
  .tk-steps { display: flex; align-items: stretch; flex-wrap: wrap; gap: 8px 4px; margin: 12px 0 0; }
  .tk-arw { display: grid; place-items: center; color: #a9a9b3; }
  .tk-arw svg { width: 18px; height: 18px; }
  .tk-step { display: flex; flex-direction: column; justify-content: center; min-width: 128px; padding: 8px 16px 12px; border-radius: 14px; background: var(--field); }
  .tk-step em { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); line-height: 14px; }
  .tk-step b { font-size: 22px; font-weight: 900; line-height: 1.2; }
  .tk-step small { font-size: 12px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tk-step.now { box-shadow: inset 0 0 0 2px var(--ink); }
  .tk-step.reach { background: color-mix(in srgb, var(--c) 13%, var(--field)); }

  .tk-step.proj { background: repeating-linear-gradient(135deg, var(--field) 0 6px, var(--inner) 6px 9px); }
  .tk-row p.tk-cap { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }
  .tk-row .tk-cap + p { margin-top: 8px; }
  .tk-bar { position: relative; height: 12px; border-radius: 6px; background: var(--inner); margin: 24px 8px 24px 0; }
  .tk-bar i { display: block; height: 100%; border-radius: 6px; }
  .tk-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; }
  .tk-mark em { position: absolute; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .tk-mark.now { background: var(--ink); }
  .tk-mark.now em { top: 22px; color: var(--ink-2); }
  .tk-mark.need { background: transparent; }
  .tk-mark.need em { bottom: 22px; color: var(--ink); }
  .tk-row p { margin: 8px 0 0; color: var(--ink-2); font-weight: 600; line-height: 1.5; max-width: 68ch; }
  .tk-row .tk-bar + p { margin-top: 0; }
  .tk-row p b { color: var(--ink); font-weight: 900; }
  .dnote { margin: 12px 0 0; color: var(--muted); font-weight: 600; font-size: 13px; }
  .dpanel h3 { margin: 0 0 12px; font-size: 16px; font-weight: 900; font-style: italic; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; font-weight: 700; color: var(--ink-2); font-size: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; }
  .legend b { color: var(--ink); font-weight: 900; font-variant-numeric: tabular-nums; }
  .bigchart { position: relative; height: 280px; }
  .bigchart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .bigchart .gl { stroke: var(--inner); stroke-width: 1; }
  .bigchart .ax { fill: var(--muted); font-size: 12px; font-weight: 700; font-family: inherit; }
  .tip { line-height: 1.6; }
  .tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .toprow { display: grid; grid-template-columns: 28px minmax(96px, 1fr) minmax(120px, 2fr) 96px; align-items: center; gap: 12px; padding: 8px 0; }
  .toprow + .toprow { border-top: 1px solid var(--inner); }
  .toprow .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toprow .track { height: 8px; border-radius: 4px; background: var(--inner); overflow: hidden; }
  .toprow .track i { display: block; height: 100%; border-radius: 4px; }
  .toprow > b { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .toprow > b .sub { color: var(--muted); font-weight: 700; font-size: 12px; }
  .share { display: flex; gap: 4px; height: 32px; border-radius: 10px; overflow: hidden; margin: 4px 0 12px; }
  .share span { display: grid; place-items: center; min-width: 4px; color: #ffffff; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; cursor: default; }
  .share span:hover { filter: brightness(1.08); }
  .modal-wrap [data-c] { transition: opacity .16s ease; }
  .modal-wrap.hl [data-c]:not(.on) { opacity: .22; }
  .bigchart .seg { cursor: default; }
  .sharerow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 40px 48px; align-items: center; gap: 12px; padding: 8px 0; }
  .sharerow + .sharerow { border-top: 1px solid var(--inner); }
  .sharerow .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sharerow b { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
  .sharerow .pc { text-align: right; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dt-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .dt-h h3 { margin: 0; }
  .tablewrap { overflow-x: auto; background: var(--field); border-radius: 14px; box-shadow: 0 0 0 1px var(--inner); }
  /* fixed layout: the label column gets a third, every number column gets an equal share, so values line up in tidy columns */
  .dt.big { width: max(100%, 560px); table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 14px; margin: 0; font-variant-numeric: tabular-nums; }
  .dt.big th, .dt.big td { padding: 12px 16px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dt.big th:first-child, .dt.big td:first-child { text-align: left; width: 32%; }
  .dt.big thead th { text-overflow: clip; position: sticky; top: 0; z-index: 1; background: var(--field); border-bottom: 2px solid var(--panel); font-size: 12px; font-weight: 800; color: var(--muted); }
  .dt.big thead th .badge { display: inline-grid; width: 24px; height: 24px; border-radius: 7px; vertical-align: middle; }
  .dt.big thead th .badge svg { width: 16px; height: 16px; }
  .dt.big td { font-weight: 700; color: var(--ink-2); }
  .dt.big tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel) 40%, var(--field)); }
  .dt.big tbody tr:hover td { background: var(--panel); }
  .dt.big td:first-child { color: var(--ink); font-weight: 800; }
  .dt.big td b { color: var(--ink); font-weight: 900; }
  .dt.big td b.ga { color: var(--good); }
  .dt.big tfoot td { border-top: 2px solid var(--panel); font-weight: 900; color: var(--ink); background: var(--field); }
  .dt .cn { display: inline-flex; align-items: center; gap: 12px; max-width: 100%; }
  .dt .cn .badge { width: 24px; height: 24px; border-radius: 7px; }
  .dt .cn .badge svg { width: 16px; height: 16px; }
  .chg { display: inline-block; min-width: 48px; text-align: center; padding: 0 8px; line-height: 22px; border-radius: 11px; font-size: 12px; font-weight: 800; }
  .chg.up { color: var(--good); background: color-mix(in srgb, var(--good) 13%, var(--field)); }
  .chg.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, var(--field)); }
  .dt .none { color: #a9a9b3; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 680px) {
    .modal-wrap { padding: 0; place-items: end stretch; }

    .bigchart { height: 220px; }
    .toprow { grid-template-columns: 28px minmax(0, 1fr) 72px; }
    .toprow .track { grid-column: 2 / -1; grid-row: 2; }
  }

  /* ---------- dropdowns and popovers ---------- */
  .pop { position: fixed; z-index: 60; top: 0; left: 0; width: 320px; max-width: calc(100vw - 32px); max-height: min(520px, calc(100vh - 32px)); overflow: auto; overscroll-behavior: contain; background: var(--field); color: var(--ink); border-radius: 16px; box-shadow: var(--pop-shadow); padding: 8px; }

  .pop.narrow { width: 216px; padding: 4px; border-radius: 12px; }
  .pop.narrow .mi { min-height: 34px; padding: 4px 12px; gap: 12px; border-radius: 8px; font-size: 14px; }
  .pop.narrow .mi svg.i { width: 16px; height: 16px; }

  .pop.sheet { top: auto !important; left: 8px !important; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto !important; max-width: none; max-height: 76vh; border-radius: 20px; }
  .scrim { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
  .pop-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 8px 12px; min-height: 40px; }
  .pop > .pop-h:first-child { position: sticky; top: -8px; z-index: 2; background: var(--field); margin-top: -8px; padding-top: 12px; }
  .pop-h .t { flex: 1; min-width: 0; }
  .pop-h .t b { display: block; font-weight: 900; font-style: italic; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop-h .t small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
  .pop-h .badge { width: 32px; height: 32px; border-radius: 9px; }
  .pop-h .badge svg { width: 20px; height: 20px; }
  .pop-h.has-back { padding-left: 4px; }
  .pop .sq { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .pop .sq:hover { background: var(--panel); color: var(--ink); }
  .pop .sq svg.i { width: 16px; height: 16px; }
  .mi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; text-align: left; color: var(--ink); font-weight: 700; }
  .mi:hover, .mi.sel { background: var(--panel); }
  /* the focus ring sits inside the row, so the dropdown's edge never clips it */
  .pop .mi:focus-visible { outline-offset: -2px; }
  .mi > svg.i { color: var(--muted); }
  .mi .tx { flex: 1; min-width: 0; }
  .mi .tx b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .tx small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .end { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 800; white-space: nowrap; }
  .mi .ck { color: var(--accent); width: 16px; height: 16px; stroke-width: 2.2; }
  .mi .ck.off { visibility: hidden; }
  .mi.dis { color: var(--muted); cursor: default; }
  .mi.dis:hover { background: none; }
  .mi.danger, .mi.danger > svg.i { color: var(--bad); }
  .mi .i.go { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .mi .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--punch-b); flex: none; }
  .mi .unread.off { background: transparent; }

  /* ---------- responsive ---------- */
  @media (max-width: 1280px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }

    .rail { display: block; columns: 2; column-gap: 16px; }
    .rail > * { break-inside: avoid; margin: 0 0 16px; }
    .rail > *:last-child { margin-bottom: 0; }

    /* the shortcut chips fill each row evenly once they wrap, instead of leaving one centered on its own */

  .nt-fct { position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; display: grid; place-items: center; background: var(--ink); color: #ffffff; font-size: 11px; font-weight: 900; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 10%, var(--panel)); }
  .nt-gmore { flex: none; display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 8px 0 12px; border-radius: 14px; background: var(--field); color: var(--ink-2); font-size: 12px; font-weight: 900; white-space: nowrap; }
  .nt-gmore svg.i { width: 14px; height: 14px; transform: rotate(90deg); }

  /* ===== end Notifications ===== */
  /* ===== Life layer: a bit of Canva energy on top of the Averages look =====
     Color stickers on every card, warm buttons, soft shapes behind the header, bouncier hovers and presses,
     sticker-style tags and doodles in empty states. Motion stays off in potato mode and with reduced motion. */
  :root {
    --sun: #ffc53d; --mint: #2fbf8f; --sky: #3e8ef7; --grape: #8b5cf6; --bubble: #ff6fa8;
    --warm-a: #d0452e; --warm-b: #b8352f; --warm-a-hover: #c03d28; --warm-b-hover: #a12e29;
    --card-shadow: 0 0 0 1px rgba(20, 21, 31, .03), 0 1px 3px rgba(20, 21, 31, .06), 0 8px 24px -6px rgba(20, 21, 31, .12); /* wraps the whole card evenly, so the sides fade out instead of stopping short */
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --life-doodle: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%2072%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%3Cpath%20d%3D%22M20%2044c8-10%2016%2010%2024%200s16%2010%2024%200%2016%2010%2024%200%22%20stroke%3D%22%23ffc53d%22%20stroke-width%3D%225%22/%3E%20%3Cpath%20d%3D%22M60%206l4.5%2010.5L75%2021l-10.5%204.5L60%2036l-4.5-10.5L45%2021l10.5-4.5z%22%20fill%3D%22%23ff7a50%22/%3E%20%3Cpath%20d%3D%22M100%2012l2.4%205.6%205.6%202.4-5.6%202.4L100%2028l-2.4-5.6L92%2020l5.6-2.4z%22%20fill%3D%22%232fbf8f%22/%3E%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2218%22%20r%3D%225%22%20fill%3D%22%233e8ef7%22/%3E%3Ccircle%20cx%3D%22104%22%20cy%3D%2258%22%20r%3D%224%22%20fill%3D%22%23e5484d%22/%3E%3C/svg%3E");
    --life-squiggle: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20160%2014%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M4%209c10-8%2020%206%2030%200s20-6%2030%200%2020%206%2030%200%2020-6%2030%200%2020%206%2030%200%22%20stroke%3D%22%23ff7a50%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E");
  }
  /* the page keeps room for its scrollbar, so opening something tall never nudges the page sideways */
  #scroller { scrollbar-gutter: stable; }
  /* chunkier cards: rounder, a soft shadow, bigger headings */
  .panel, .qcard { border-radius: 24px; box-shadow: var(--card-shadow); }
  .ph2 h2 { font-size: 21px; }
  /* buttons: a little taller and rounder, they lift on hover and squish when pressed */
  .btn { height: 38px; border-radius: 12px; font-size: 15px; transition: background-color .15s ease, transform .25s var(--spring), box-shadow .2s ease; }
  .btn.sm { height: 32px; border-radius: 10px; font-size: 13px; }
  .btn.primary { background: var(--accent); box-shadow: none; }
  .btn.primary:hover { background: var(--accent-hover); }
  .chip { height: 44px; border-radius: 14px; box-shadow: var(--card-shadow); transition: background-color .15s ease, transform .25s var(--spring); }
  /* the shortcut chips each get their own color */
  .chip svg.i { color: var(--chip-c, var(--ink-2)); }
  .chip:nth-child(5n + 1) { --chip-c: var(--warm-a); } .chip:nth-child(5n + 2) { --chip-c: var(--sky); } .chip:nth-child(5n + 3) { --chip-c: var(--mint); } .chip:nth-child(5n + 4) { --chip-c: var(--grape); } .chip:nth-child(5n + 5) { --chip-c: #c98a00; }
  /* New tags: a filled yellow label */
  .newtag { background: var(--sun) !important; color: var(--ink) !important; border-radius: 8px;  will-change: transform; backface-visibility: hidden; } /* always drawn on its own layer, so hovering a row never redraws the text thinner or bolder */
  .wrap { position: relative; isolation: isolate; }
  /* empty states get a doodle */
  :is(.nt-empty, .ag-none, .mp-none, .mdet-empty, .list-empty, .sv-empty)::before { content: ""; display: block; width: 120px; height: 72px; margin: 0 auto 12px; background: var(--life-doodle) center / contain no-repeat; }
  /* the toast bounces in */
  .toast { border-radius: 14px; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.potato-mode) .btn:not(:disabled):hover, body:not(.potato-mode) .chip:hover { transform: translateY(-1px); }
    body:not(.potato-mode) .btn:not(:disabled):active, body:not(.potato-mode) .chip:active, body:not(.potato-mode) .ibtn:active { transform: scale(.95); transition-duration: .08s; }
    body:not(.potato-mode) .ibtn { transition: background-color .15s ease, transform .25s var(--spring); }
    body:not(.potato-mode) .toast.show { animation: lifeToast .45s var(--spring); }
    /* icon tiles wiggle when you point at their row */
    body:not(.potato-mode) :is(.arow, .mrow, .mp-row, .ag-row, .nt-row, .pin, .gr-row, .crow, tr, .item, .mi):hover :is(.ktile, .nt-tile, .badge, .emo) { animation: lifeWiggle .5s var(--spring); }
    body:not(.potato-mode) .newtag { animation: lifeSticker .5s var(--spring) backwards; }
  }
  @keyframes lifeWiggle { 0% { transform: none; } 30% { transform: rotate(-9deg) scale(1.08); } 60% { transform: rotate(6deg) scale(1.08); } 100% { transform: none; } }
  @keyframes lifeSticker { from { transform: scale(.6); opacity: 0; } }
  @keyframes lifeToast { 0% { transform: translate(-50%, 16px) scale(.9); } 100% { transform: translate(-50%, 0) scale(1); } }
  /* ===== end Life layer ===== */
  /* ===== What-if grades: one popup for the whole app (Home, Grades, course hubs) ===== */
  .wi-scrim { position: fixed; inset: 0; z-index: 95; background: var(--scrim); display: flex; justify-content: center; align-items: center; padding: 24px 16px; }
  .wi-pop { width: min(560px, 100%); max-height: min(760px, calc(100vh - 48px)); overflow: auto; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 22px; background: var(--field); box-shadow: var(--pop-shadow); }
  .wi-top { display: flex; align-items: flex-start; gap: 12px; }
  .wi-top > div { flex: 1; min-width: 0; }
  .wi-top h2 { margin: 0; font-size: 22px; font-weight: 900; font-style: italic; }
  .wi-top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.4; }
  .wi-x { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
  .wi-x:hover { background: var(--panel); color: var(--ink); }
  .wi-l { margin: 0 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .wi-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wi-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px 4px 8px; border-radius: 12px; background: var(--panel); text-align: left; font-size: 14px; font-weight: 800; color: var(--ink-2); transition: background-color .15s ease, color .15s ease, box-shadow .15s ease; }
  .wi-chip:hover { background: var(--inner); color: var(--ink); }
  .wi-chip[aria-checked="true"] { background: color-mix(in srgb, var(--c, var(--sky)) 16%, var(--panel)); color: var(--ink); box-shadow: inset 0 0 0 2px var(--c, var(--ink)); }
  .wi-chip .badge { width: 28px; height: 28px; border-radius: 8px; flex: none; }
  .wi-chip .badge svg { width: 18px; height: 18px; }
  .wi-chip small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
  .wi-cat { padding: 8px 12px; }
  .wi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wi-row label { min-width: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 800; color: var(--ink-2); }
  .wi-row input { height: 48px; border: 0; border-radius: 14px; padding: 0 16px; background: var(--panel); font: inherit; font-size: 20px; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; outline: none; min-width: 0; width: 100%; box-sizing: border-box; -moz-appearance: textfield; appearance: textfield; }
  .wi-row input::-webkit-inner-spin-button, .wi-row input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .wi-row input:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
  .wi-pre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: -8px; }
  .wi-pre span { font-size: 12px; font-weight: 800; color: var(--muted); margin-right: 2px; }
  .wi-pre button { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--panel); font-size: 13px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .ti-up .ti-prog i::after { content: ""; position: absolute; right: -2px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 3px var(--accent), 0 0 10px 2px color-mix(in srgb, var(--accent) 60%, transparent); transform: scaleX(var(--inv, 1)); }
  .ti-up-t { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ti-pct { font-size: 13px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  /* the head stays round while the bar under it stretches */

  @keyframes tiFillW { from { width: 4%; } to { width: 100%; } }
  .ti-up .ti-prog i { transform: none; width: 4%; }
  /* written answer */

  .ti-alt button { color: var(--accent); font-weight: 900; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; border-radius: 4px; }

  .ti-rte:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }

  .ti-tb button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; color: var(--ink-2); }

  .ti-ans { font-size: 14px; font-weight: 500; line-height: 1.55; white-space: normal; }
  /* the step bar in the footer: one segment per step, sized by how long it usually takes */
  .ti-foot { gap: 12px; }
  .ti-foot .ti-stepnote { margin-right: 0; min-width: 0; flex: 0 1 200px; color: var(--ink); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tiIn2 .25s ease backwards; }
  .ti-steps { flex: 1 1 280px; min-width: 0; display: flex; gap: 4px; animation: tiIn2 .3s cubic-bezier(.2, .8, .2, 1) backwards; }
  .ti-step { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .ti-track { position: relative; height: 8px; border-radius: 4px; background: var(--inner); overflow: hidden; }
  .ti-track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--accent); }
  .ti-step.now .ti-track i { animation: tiSegFill var(--ms) cubic-bezier(.3, 0, .2, 1) forwards; }
  .ti-step.now .ti-track::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: tiSweep 1s linear infinite; }
  @keyframes tiSegFill { to { width: 100%; } }
  @keyframes tiSweep { from { background-position: -100% 0; } to { background-position: 200% 0; } }
  .ti-step.done .ti-track i { width: 100%; }
  .ti-step.ok .ti-track i { background: var(--good); transition: background .25s ease; }

  .ti-foot .btn:disabled:not(.primary) { opacity: 1; color: var(--muted); background: var(--panel); cursor: not-allowed; }

  .me-pop { width: 300px; }

  .me-cz-h small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }

  .hub-logo-w { position: relative; flex: none; display: grid; }

    background: #464856; color: #ffffff; font-size: 12px; font-weight: 800; line-height: 16px; white-space: nowrap;

  .cmdk-in { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; border-bottom: 2px solid var(--panel); flex: none; }
  .cmdk-in svg.i { color: var(--muted); }
  .cmdk-in input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 17px; font-weight: 700; }
  .cmdk-in input::placeholder { color: var(--muted); }
  .cmdk-res { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .cmdk-res .lbl { padding: 8px 12px 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cmdk-res .mi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; text-align: left; color: var(--ink); font-weight: 700; }
  .cmdk-res .mi:hover, .cmdk-res .mi.sel { background: var(--panel); }
  .cmdk-res .mi .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cmdk-res .mi b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-res .mi small { color: var(--muted); font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-res .mi > svg.i { width: 20px; height: 20px; color: var(--ink-2); margin: 0 8px; }
  .cmdk-res mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .cmdk-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-weight: 700; }
  .cmdk-foot { display: flex; gap: 16px; padding: 8px 16px 12px; font-size: 12px; font-weight: 700; color: var(--muted); border-top: 2px solid var(--panel); flex: none; }
  .cmdk-foot kbd { font-size: 11px; line-height: 20px; padding: 0 4px; }
  @media (hover: none) { .cmdk-foot { display: none; } }

  @media (max-width: 680px) {
    .cmdk-scrim { padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
    .hub-h { flex-wrap: wrap; gap: 16px; }
    .hub-logo { width: 64px; height: 64px; border-radius: 16px; }
    .hub-logo svg { width: 38px; height: 38px; }
    .hub-acts { width: 100%; }
    .hub-acts .btn { flex: 1; }
    .hub-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
    .hub-tab { flex: none; }
    .pins { grid-template-columns: minmax(0, 1fr); }
    .fwrap { flex: 1 1 auto; }
    .fbtn { flex: 1; }
    .fmenu { left: 0; right: auto; }
    .mwrap.det { grid-template-columns: minmax(0, 1fr); }
    .mwrap.det .mdet { order: -1; position: static; }
    .vsw { width: 100%; }
    .hub-acts { flex-wrap: wrap; }
    .hub-acts .pill.sync { flex: 1 1 100%; justify-content: center; margin: 0; }
    .vbtn { flex: 1; justify-content: center; }
    .mrow { align-items: flex-start; }
  }

  /* ---------- Grades page ---------- */
  .hub-logo.gr-logo { transform: rotate(-5deg); }
  @media (prefers-reduced-motion: no-preference) { body:not(.potato-mode) .hub-logo.gr-logo:hover { transform: rotate(4deg) scale(1.05); } }
  .gr-h .hub-meta { gap: 8px 20px; }
  .gr-h .hub-meta .gm { gap: 8px; }
  .gr-h .hub-meta .gm .t { display: inline; white-space: nowrap; }
  .gr-h .hub-meta .gm[data-skel] { color: color-mix(in srgb, var(--muted) 55%, transparent); }
  .gr-h .hub-meta b { color: var(--ink); font-weight: 900; font-variant-numeric: tabular-nums; }
  .gr-h .hub-meta .gm.bad, .gr-h .hub-meta .gm.bad b { color: var(--bad); }
  .gr-main, .gr-rail { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

  /* the quarter so far: the big grade, GPA, and the line of your overall grade week by week */
  .gs { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 16px 28px; align-items: start; padding: 16px 20px 16px; }
  .gs-big { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .gs-gr { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; } /* the letter, the % and "overall" share one line */
  .gs-big .l { font-family: var(--display); font-size: 64px; line-height: .9; font-weight: 900; font-style: italic; letter-spacing: -.02em; }
  .gs-big .p { display: inline-flex; align-items: baseline; gap: 8px; font-size: 22px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
  .gs-big .p small { font-size: 15px; font-weight: 800; color: var(--muted); }
  .gs-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 8px; }
  .gs-tile { background: var(--field); border-radius: 14px; padding: 12px 12px; }
  .gs-tile small { display: block; color: var(--muted); font-size: 12px; font-weight: 800; }
  .gs-tile b { display: block; margin-top: 2px; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .gs-chart { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .gs-ch { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .gs-ch b { font-size: 14px; font-weight: 800; color: var(--ink-2); flex: 1; }
  .gs-box { position: relative; }
  .gs-svg, .gs-skel { width: 100%; height: 210px; display: block; overflow: visible; }
  .gs-svg .band { stroke: var(--inner); stroke-width: 1.5; stroke-dasharray: 2 5; }
  .gs-svg .band-t { fill: var(--muted); font-size: 11px; font-weight: 800; }
  .gs-svg .x-t { fill: var(--muted); font-size: 11px; font-weight: 700; }
  .gs-svg .ov { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .gs-svg .ov-a { fill: var(--ink); opacity: .06; }
  .gs-svg.each .ov-a { display: none; }
  .gs-svg.enter .ov-a { animation: gsArea 520ms cubic-bezier(.22, .61, .36, 1) 560ms both; }
  @keyframes gsArea { from { opacity: 0; } to { opacity: .06; } }
  .potato-mode .gs-svg.enter .ov-a { animation: none; }
  @media (prefers-reduced-motion: reduce) { .gs-svg.enter .ov-a { animation: none; } }
  .gs-svg .cl { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; opacity: .85; transition: opacity .2s ease, stroke-width .2s ease; }
  .gs-svg.hl .cl { opacity: .14; }
  .gs-svg.hl .cl.on { opacity: 1; stroke-width: 3; }
  .gs-svg.hl .ov { opacity: .35; }
  .gs-svg.enter .cl { stroke-dasharray: 100 100; animation: chartDraw 900ms cubic-bezier(.37, 0, .63, 1) both; animation-delay: calc(var(--i) * 70ms); }
  .gs-svg .hit { fill: transparent; cursor: default; } /* the dashed line marks the week, so the pointer stays a normal arrow */
  .gs-svg .dot { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; transition: r .15s ease; }
  .gs-svg .dot.on, .gs-svg .dot.end { fill: var(--ink); stroke: var(--panel); }
  .gs-svg .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .gs-tip { position: absolute; z-index: 3; pointer-events: none; min-width: 150px; padding: 8px 12px; line-height: 15px; border-radius: 12px; background: var(--ink); color: #ffffff; font-size: 12px; font-weight: 800; white-space: nowrap; opacity: 0; transition: opacity .12s ease; display: flex; flex-direction: column; gap: 4px; }
  .gs-tip.left { transform: translateX(-100%); }
  .gs-tip.show { opacity: 1; }
  .gs-tip small { font-weight: 700; opacity: .7; }
  .gs-tip .r { display: flex; align-items: center; gap: 8px; }
  .gs-tip .r i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .gs-tip .r.ov i { background: #ffffff; }
  .gs-tip .r b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .gs-tip .r.ov + .r { border-top: 1px solid rgba(255, 255, 255, .18); padding-top: 4px; }
  .gs-each { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 800; color: var(--ink-2); background: var(--field); }
  .gs-each:hover { background: var(--inner); }
  .gs-each[aria-pressed="true"] { background: var(--ink); color: #ffffff; }
  .gs-leg { display: flex; flex-wrap: wrap; gap: 8px; }
  .gs-leg[hidden] { display: none; }
  .gs-leg > * { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12px; font-weight: 800; color: var(--ink-2); background: var(--field); }
  .gs-leg button:hover, .gs-leg button.on { background: color-mix(in srgb, var(--c) 16%, var(--field)); color: var(--ink); }
  .gs-leg i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .gs-leg .gs-ov i { background: var(--ink); height: 3px; border-radius: 2px; width: 14px; }
  @media (max-width: 900px) { .gs { grid-template-columns: 1fr; } .gs-big { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 16px; } .gs-tiles { width: 100%; } }

  /* toolbar */
  .gr-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .gr-bar .find { flex: 1 1 240px; }
  .gr-bar .find input { background: var(--field); }
  .gr-sort { position: relative; display: inline-flex; gap: 2px; padding: 2px; border-radius: 12px; background: var(--field); height: 40px; flex: none; }
  .gr-sort .gr-pill { position: absolute; top: 2px; left: 0; height: 36px; width: 0; border-radius: 10px; background: var(--ink); transition: transform .28s cubic-bezier(.3, 1.2, .5, 1), width .28s cubic-bezier(.3, 1.2, .5, 1); }
  .gr-sort:not(.ready) .gr-pill { opacity: 0; }
  .gr-sort button { position: relative; z-index: 1; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); transition: color .2s ease; }
  .gr-sort button:hover { color: var(--ink); background: var(--panel); }
  .gr-sort button[aria-pressed="true"], .gr-sort button[aria-pressed="true"]:hover { color: #ffffff; background: transparent; }
  .gr-sort:not(.ready) button[aria-pressed="true"] { background: var(--ink); }
  .potato-mode .gr-sort .gr-pill { transition: none; }
  .gr-all { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--field); font-size: 14px; font-weight: 800; color: var(--ink-2); flex: none; }
  .gr-all:hover { background: var(--inner); color: var(--ink); }

  /* one row per class; it opens to show how the grade is weighted and every graded assignment */
  .gc-list { display: flex; flex-direction: column; gap: 12px; }
  .gcls { border-radius: 18px; background: var(--field); overflow: hidden; }
  .gc-row { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) 120px 92px 110px 24px; align-items: center; gap: 12px; padding: 12px 16px; text-align: left; border-radius: 18px; }
  .gc-row:hover { background: color-mix(in srgb, var(--ink) 4%, var(--field)); }
  .gcls.open .gc-row { border-radius: 18px 18px 0 0; }
  .gr-ct { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .gr-ct b { font-size: 15px; font-weight: 900; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gr-ct small { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gc-row .gc-new { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 900; background: color-mix(in srgb, var(--sky) 16%, var(--panel)); color: #1f5fc0; margin-left: 8px; vertical-align: 2px; }
  .gc-g { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .gc-g b { font-size: 20px; font-weight: 900; }
  .gc-g span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .gr-d { display: inline-flex; align-items: center; justify-content: center; height: 24px; padding: 0 8px; border-radius: 12px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; justify-self: start; }
  .gr-d.up { color: var(--good); background: color-mix(in srgb, var(--good) 13%, var(--panel)); }
  .gr-d.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
  .gr-d.flat { color: var(--muted); background: var(--inner); }
  .gc-sp { width: 100%; height: 30px; overflow: visible; }
  .gc-chev { width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted); transition: transform .38s cubic-bezier(.22, 1, .36, 1), color .2s ease; }
  .gc-chev svg.i { width: 18px; height: 18px; }
  .gcls.open .gc-chev { transform: rotate(90deg); color: var(--ink); }
  .gcls.open.closing .gc-chev { transform: none; color: var(--muted); }
  .gcls.open.closing .gc-row { border-radius: 18px; }
  .gc-row { transition: border-radius .3s ease, background-color .15s ease; }
  .potato-mode .gc-chev, .potato-mode .gc-row { transition: none; }
  .gc-body { display: grid; grid-template-columns: minmax(220px, .8fr) minmax(0, 1.4fr); gap: 16px 24px; padding: 4px 16px 16px 68px; }
  .gcls:not(.open) .gc-body { display: none; }
  .gc-h { margin: 8px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .gcat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 8px 0; }
  .gcat + .gcat { border-top: 2px solid var(--panel); }
  .gcat b { font-size: 14px; font-weight: 800; }
  .gcat b small { color: var(--muted); font-weight: 700; margin-left: 4px; }
  .gcat > span { font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .gcat .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
  .gcat .bar i { display: block; height: 100%; border-radius: 4px; background: var(--c); transform-origin: left; }
  .gw { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px; gap: 2px 12px; align-items: center; padding: 8px 12px; margin: 0 -12px; border-radius: 10px; cursor: pointer; }
  .gw:hover { background: var(--panel); }
  .gw + .gw { box-shadow: 0 -2px 0 var(--panel); }
  .gw:hover + .gw, .gw:hover { box-shadow: none; }
  .gw-t { min-width: 0; display: flex; align-items: center; gap: 8px; }
  .gw-t b { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .gw .gw-sub { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .gw.miss .gw-sub { color: color-mix(in srgb, var(--bad) 80%, var(--muted)); }
  .gw .s { font-size: 13px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
  .gw .pc { font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }
  .gw.miss .pc, .gw.miss .s { color: var(--bad); }
  .gw .newtag { flex: none; }
  .gc-acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .gc-acts .btn { background: var(--panel); }
  .gc-acts .btn:hover { background: var(--inner); }
  .gc-none { color: var(--muted); font-weight: 700; padding: 24px 8px; text-align: center; }
  .gc-none b { display: block; color: var(--ink); font-weight: 900; margin-bottom: 4px; }
  @container (max-width: 760px) { .gc-row { grid-template-columns: 40px minmax(0, 1fr) 96px 24px; } .gc-row .gr-d, .gc-row .gc-sp { display: none; } .gc-body { grid-template-columns: 1fr; padding-left: 16px; } }
  .gr-classes { container-type: inline-size; }

  /* right-click menu: plain text, no animation */
  .gx-menu { position: fixed; z-index: 90; min-width: 220px; padding: 8px; border-radius: 14px; background: var(--field); box-shadow: 0 0 0 1px rgba(20, 21, 31, .06), 0 16px 32px -12px rgba(20, 21, 31, .3); display: flex; flex-direction: column; }
  .gx-menu button { text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .gx-menu button:hover, .gx-menu button:focus-visible { background: var(--inner); outline: none; }
  #grSumPanel[hidden] { display: none; }
  /* rail */
  .rg2 { display: flex; align-items: center; gap: 12px; padding: 8px; margin: 0 -8px; border-radius: 12px; cursor: pointer; }
  .rg2:hover { background: var(--inner); }
  .rg2 .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rg2 .tx b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rg2 .tx small { color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rg2 .sc { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-variant-numeric: tabular-nums; }
  .rg2 .sc b { font-weight: 900; }
  .rg2 .sc small { color: var(--muted); font-size: 12px; font-weight: 700; }
  .mv { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .mv + .mv { border-top: 2px solid var(--inner); }
  .mv .tx { flex: 1; min-width: 0; }
  .mv .tx b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mv .tx small { color: var(--muted); font-size: 13px; font-weight: 700; }
  /* ===== Life layer for the course page ===== */
  /* the course header */
  .hub-h { position: relative; }
  .hub-logo { border-radius: 28px; box-shadow: 0 0 0 5px var(--field), 0 12px 24px -12px rgba(20, 21, 31, .45); transition: transform .35s var(--spring); }
  .hub-t h1 { font-size: 44px; }
  .hub-tab { border-radius: 12px; transition: background-color .15s ease, transform .25s var(--spring); }
  .hub-tab.on { background: var(--ink); box-shadow: 0 8px 16px -10px rgba(20, 21, 31, .8); }
  /* the Materials numbers each get a color */
  .mp-stat b { font-size: 24px; }
  .mp-box, .ag-box, .mp-det { border-radius: 24px; box-shadow: var(--card-shadow); }
  .ag-h h2 { font-size: 28px; }
  .nt-btn { border-radius: 14px; }
  /* the sync button matches the buttons beside it (they grew to 38px) */
  .hub-acts .pill.sync { height: 38px; border-radius: 12px; padding: 0 16px 0 12px; font-size: 15px; }
  .hub-acts .pill.sync svg { width: 20px; height: 20px; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.potato-mode) .hub-logo:hover { transform: scale(1.04); }
    body:not(.potato-mode) .hub-tab:active { transform: scale(.95); }
  }
  @media (max-width: 680px) { .hub-t h1 { font-size: 34px; } }
  /* ===== end Life layer for the course page ===== */
</style>
</head>
<body>
<div class="app" id="app">

  const courseSubject = name => COURSE_SUBJECTS.find(([re]) => re.test(String(name || '').toLowerCase())) || [null, '📚', '#55697d'];
  const CUTS = [[97, 'A+'], [93, 'A'], [90, 'A-'], [87, 'B+'], [83, 'B'], [80, 'B-'], [77, 'C+'], [73, 'C'], [70, 'C-'], [67, 'D+'], [63, 'D'], [60, 'D-'], [0, 'F']];
  const letter = p => CUTS.find(([c]) => p >= c)[1];
  const gcls = p => p >= 90 ? 'ga' : p >= 80 ? 'gb' : 'gc';

  // From Schoology: each section (title, teacher, period), the student's grade (and how it's moved on the days

  const CLASSES = FSD.CLASSES.map(c => Object.assign({}, c));   // the student's classes (averages-fs-data.js)

/* ===== What-if grades script: one popup for the whole app =====
   Any button with data-whatif opens it (data-whatif="chem" picks the class). Pick a class and a category, type a score,
   and it shows what your grade would be. A new score only moves its own category; the class grade moves by that
   category's weight. Nothing here is saved to Schoology. */
// the student's classes and their real grading categories (averages-fs-data.js): name, weight %, your % so far
// (null when nothing in it is graded yet), points graded so far
const WI_CLASSES = FSD.CLASSES.map(c => ({ id: c.id, name: c.name, pct: c.pct }));
const WI_CATS = FSD.CATS;
const WI = { cls: (() => { try { const v = JSON.parse(localStorage.getItem('wi_class')); return WI_CATS[v] ? v : (WI_CLASSES[0] || {}).id; } catch (_) { return (WI_CLASSES[0] || {}).id; } })(), cat: 0, score: '45', out: '50' };
let wiEl = null, wiFrom = null;
const wiCuts = [[97, 'A+'], [93, 'A'], [90, 'A-'], [87, 'B+'], [83, 'B'], [80, 'B-'], [77, 'C+'], [73, 'C'], [70, 'C-'], [67, 'D+'], [63, 'D'], [60, 'D-'], [0, 'F']];
const wiLetter = p => wiCuts.find(([c]) => p >= c)[1];
const wiEsc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const wiIco = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const wiCalm = () => document.body.classList.contains('potato-mode') || matchMedia('(prefers-reduced-motion: reduce)').matches;
// a course hub can rename its class; the popup uses that name too
const wiName = c => (typeof ME !== 'undefined' && ME && ME.id === c.id && ME.name) ? ME.name : c.name;
function wiBadge(c) {
  const sub = typeof COURSE_SUBJECTS !== 'undefined' ? (COURSE_SUBJECTS.find(([re]) => re.test(c.name.toLowerCase())) || [null, '📚', '#55697d']) : [null, '📚', '#55697d'];
  const emo = (typeof ME !== 'undefined' && ME && ME.id === c.id && ME.emoji) ? ME.emoji : sub[1], svg = typeof EMOJI_SVG !== 'undefined' ? (EMOJI_SVG[emo] || EMOJI_SVG['📚'] || '') : '';
  return { html: `<span class="badge" style="--c:${sub[2]}" aria-hidden="true">${svg}</span>`, color: sub[2] };
}
function wiHTML() {
  const c = WI_CLASSES.find(x => x.id === WI.cls) || WI_CLASSES[0], cats = WI_CATS[c.id];
  return `<div class="wi-top"><div><h2 id="wiT">What-if grades</h2><p>Try a score before you get it back. Nothing here changes your real grade.</p></div><button type="button" class="wi-x" data-wix aria-label="Close">${wiIco('x')}</button></div>
    <div><div class="wi-l" id="wiCL">Class</div><div class="wi-chips" role="radiogroup" aria-labelledby="wiCL">${WI_CLASSES.map(x => { const b = wiBadge(x); return `<button type="button" class="wi-chip" role="radio" data-wicls="${x.id}" aria-checked="${x.id === c.id}" style="--c:${b.color}">${b.html}<span>${wiEsc(wiName(x))}<small>${wiLetter(x.pct)} · ${x.pct.toFixed(1)}%</small></span></button>`; }).join('')}</div></div>
    <div><div class="wi-l" id="wiKL">Category</div><div class="wi-chips" role="radiogroup" aria-labelledby="wiKL">${cats.map(([n, w, p], i) => `<button type="button" class="wi-chip wi-cat" role="radio" data-wicat="${i}" aria-checked="${i === WI.cat}" style="--c:${wiBadge(c).color}"><span>${wiEsc(n)}<small>${w}% of grade · ${p == null ? 'nothing graded yet' : 'now ' + p.toFixed(1) + '%'}</small></span></button>`).join('')}</div></div>
    <div class="wi-row"><label>If I score<input id="wiS" type="number" inputmode="decimal" min="0" step="any" value="${wiEsc(WI.score)}"></label><label>Out of<input id="wiO" type="number" inputmode="decimal" min="1" step="any" value="${wiEsc(WI.out)}"></label></div>
    <div class="wi-pre" role="group" aria-label="Quick scores"><span>Try</span>${[100, 90, 80, 70].map(p => `<button type="button" data-wipre="${p}">${p}%</button>`).join('')}</div>
    <div class="wi-res" id="wiRes" aria-live="polite"></div>
    <div class="wi-acts"><button type="button" class="btn" data-wireset>${wiIco('refresh')}Reset</button><span class="wi-note">Only on this screen. Schoology isn't changed.</span><button type="button" class="btn primary" data-wix>Done</button></div>`;
}
function wiCalc() {
  if (!wiEl || !WI_CLASSES.length) return;
  const c = WI_CLASSES.find(x => x.id === WI.cls) || WI_CLASSES[0], cats = WI_CATS[c.id], [cn, w, cp, cpts] = cats[WI.cat] || cats[0];
  const s = parseFloat(WI.score), o = parseFloat(WI.out), res = wiEl.querySelector('#wiRes');
  if (!(o > 0) || !(s >= 0)) { res.innerHTML = '<div class="wi-msg">Type a score and the points it is out of.</div>'; return; }
  const wg = cats.filter(x => x[2] != null).reduce((a, x) => a + x[1], 0), catNext = ((cp || 0) * cpts / 100 + s) / (cpts + o) * 100;
  const now = c.pct, next = cp == null ? (wg ? (now * wg + catNext * w) / (wg + w) : catNext) : now + (w / (wg || w)) * (catNext - cp), diff = next - now, k = Math.abs(diff) < .05 ? 'flat' : diff > 0 ? 'up' : 'down';
  const moved = wiLetter(next) !== wiLetter(now);
  res.innerHTML = `<div class="wi-g"><small>Now</small><b>${now.toFixed(1)}%<span>${wiLetter(now)}</span></b></div><span class="wi-arrow" aria-hidden="true">${wiIco('fwd')}</span>
    <div class="wi-g to"><small>Would be${moved ? `<span class="wi-new">${diff > 0 ? 'Up' : 'Down'} a letter</span>` : ''}</small><b>${next.toFixed(1)}%<span>${wiLetter(next)}</span></b></div>
    <div class="wi-foot2"><span>${wiEsc(cn)}: ${cp == null ? 'nothing yet' : cp.toFixed(1) + '%'} to ${catNext.toFixed(1)}%</span><span class="wi-d ${k}">${k === 'flat' ? 'No change' : (diff > 0 ? '+' : '-') + Math.abs(diff).toFixed(1) + ' points'}</span></div>`;
  if (moved && !wiCalm()) { const t = res.querySelector('.wi-new'); if (t && t.animate) t.animate([{ transform: 'rotate(-4deg) scale(.6)', opacity: 0 }, { transform: 'rotate(-4deg) scale(1.12)', opacity: 1, offset: .6 }, { transform: 'rotate(-4deg)' }], { duration: 380, easing: 'cubic-bezier(.34, 1.56, .64, 1)' }); }
}
function wiRender(focusSel) { wiEl.querySelector('.wi-pop').innerHTML = wiHTML(); wiWire(); wiCalc(); if (focusSel) { const f = wiEl.querySelector(focusSel); if (f) f.focus(); } }
function wiWire() {
  const s = wiEl.querySelector('#wiS'), o = wiEl.querySelector('#wiO');
  s.addEventListener('input', () => { WI.score = s.value; wiCalc(); });
  o.addEventListener('input', () => { WI.out = o.value; wiCalc(); });
}
function wiOpen(cid) {
  if (wiEl) return;
  if (!WI_CLASSES.length) { if (typeof toast === 'function') toast('No classes to try scores in yet.'); return; }
  if (cid && WI_CATS[cid]) { if (cid !== WI.cls) WI.cat = 0; WI.cls = cid; }
  wiFrom = document.activeElement;
  if (typeof cmdkClose === 'function') cmdkClose();
  if (typeof closePop === 'function') try { closePop(); } catch (_) {}
  if (typeof meClose === 'function') meClose();
  document.body.insertAdjacentHTML('beforeend', `<div class="wi-scrim"><div class="wi-pop" role="dialog" aria-modal="true" aria-labelledby="wiT"></div></div>`);
  wiEl = document.body.lastElementChild;
  wiRender('#wiS');
  wiEl.addEventListener('click', e => {
    if (e.target === wiEl || e.target.closest('[data-wix]')) { wiClose(); return; }
    const cl = e.target.closest('[data-wicls]'); if (cl) { if (cl.dataset.wicls !== WI.cls) { WI.cls = cl.dataset.wicls; WI.cat = 0; try { localStorage.setItem('wi_class', JSON.stringify(WI.cls)); } catch (_) {} wiRender(`[data-wicls="${WI.cls}"]`); } return; }
    const ca = e.target.closest('[data-wicat]'); if (ca) { WI.cat = +ca.dataset.wicat; wiEl.querySelectorAll('[data-wicat]').forEach(b => b.setAttribute('aria-checked', b === ca)); wiCalc(); return; }
    const pr = e.target.closest('[data-wipre]'); if (pr) { const o = parseFloat(WI.out) > 0 ? parseFloat(WI.out) : 100; WI.out = String(o); WI.score = String(Math.round(o * +pr.dataset.wipre) / 100); wiEl.querySelector('#wiS').value = WI.score; wiEl.querySelector('#wiO').value = WI.out; wiCalc(); return; }
    if (e.target.closest('[data-wireset]')) { WI.cat = 0; WI.score = '45'; WI.out = '50'; wiRender('#wiS'); }
  });
}
function wiClose() {
  if (!wiEl) return; const el = wiEl; wiEl = null;
  if (wiCalm() || !el.animate) el.remove();
  else { el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: 'ease', fill: 'forwards' }); el.querySelector('.wi-pop').animate([{ transform: 'none' }, { transform: 'translateY(8px) scale(.98)' }], { duration: 160, easing: 'cubic-bezier(.4, 0, 1, 1)', fill: 'forwards' }).onfinish = () => el.remove(); }
  if (wiFrom && wiFrom.focus) wiFrom.focus({ preventScroll: true });
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-whatif]'); if (!b || (wiEl && wiEl.contains(b))) return; e.preventDefault(); e.stopPropagation(); wiOpen(b.dataset.whatif || null); }, true);
document.addEventListener('keydown', e => {
  if (!wiEl) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); wiClose(); return; }
  const radio = e.target.closest && e.target.closest('[role="radio"]');
  if (radio && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) { e.preventDefault(); const g = [...radio.parentNode.querySelectorAll('[role="radio"]')], i = g.indexOf(radio), n = g[(i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + g.length) % g.length]; n.focus(); n.click(); return; }
  if (e.key === 'Tab') { const f = [...wiEl.querySelectorAll('button, input')]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
}, true);
/* ===== end What-if grades script ===== */
</script>
</body>
</html>
